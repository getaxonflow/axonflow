[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axonflow-google-adk-plugin"
version = "0.1.0"
description = "AxonFlow governance plugin for Google Agent Development Kit (ADK)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AxonFlow", email = "hello@getaxonflow.com"},
]
keywords = ["axonflow", "google-adk", "adk", "ai-governance", "llm", "policy", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0",
    # Requires the `create_hitl_request` + `HITLCreateInput` surface
    # that landed in axonflow Python SDK v8.2.0. Earlier 8.x releases
    # do not expose the explicit row-create endpoint and the plugin's
    # `_create_hitl_row` would ImportError on first `require_approval`.
    "axonflow>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://getaxonflow.com"
Documentation = "https://docs.getaxonflow.com/docs/integration/google-adk"
# Repository points at the public community mirror so external pip users
# can browse the source. The internal `axonflow-enterprise` repo is the
# canonical development tree but is private; `axonflow` is auto-synced
# from it via .github/workflows/sync-community-repo.yml.
Repository = "https://github.com/getaxonflow/axonflow/tree/main/examples/integrations/google-adk-plugin"
Issues = "https://github.com/getaxonflow/axonflow/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonflow_adk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
