# Multi-Agent Planning - Define workflow steps
# AxonFlow turns this into an executable governed workflow

# Generic domain - works with LLM-only steps (no external connectors needed)
# For travel/healthcare domains with connectors, see Enterprise edition

steps:
  - name: research
    type: llm-call
    description: "Research and gather information"
  - name: summarize
    type: llm-call
    description: "Summarize findings into a report"
  - name: recommend
    type: llm-call
    description: "Generate actionable recommendations"
