# Support Demo - Extends root AxonFlow docker-compose
#
# Usage:
#   1. Start AxonFlow platform from repo root:
#      cp .env.example .env  # Important: Sets COMPOSE_PROJECT_NAME=axonflow
#      docker compose up -d
#
#   2. Start support-demo:
#      cd examples/support-demo
#      docker compose up -d
#
#   3. (Optional) Setup demo policies for role-based LLM access:
#      ./setup-dynamic-policies.sh
#
# Demo Policies (setup via setup-dynamic-policies.sh):
#   - Agent role restricted from OpenAI (cost control)
#   - PII queries route to local model (privacy)
#   - EU users route to Ollama (data sovereignty)
#
# Network Configuration:
#   This demo expects the AxonFlow network to be named 'axonflow_axonflow-network'.
#   This requires COMPOSE_PROJECT_NAME=axonflow in your root .env file.
#   If you get "network not found" error, check your .env has this setting.

services:
  # PostgreSQL for demo-specific data (customers, tickets)
  # Separate from AxonFlow's database to keep demo data isolated
  postgres-demo:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: axonflow
      POSTGRES_PASSWORD: axonflow_demo
      POSTGRES_DB: support_demo
    ports:
      - "5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonflow -d support_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axonflow-network

  # Go Backend - Demo application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env  # Copy from .env.example and add your API keys
    environment:
      # Demo database (customers, tickets, local audit)
      - DATABASE_URL=postgres://axonflow:axonflow_demo@postgres-demo:5432/support_demo?sslmode=disable
      - JWT_SECRET=demo-secret-change-in-production
      - PORT=8080
      # Connect to AxonFlow platform services
      - AXONFLOW_ENDPOINT=http://axonflow-agent:8080
      - AXONFLOW_ORCHESTRATOR_URL=http://axonflow-orchestrator:8081
    ports:
      - "8082:8080"
    depends_on:
      postgres-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - axonflow-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - axonflow-network

volumes:
  postgres_demo_data:

networks:
  axonflow-network:
    name: axonflow_axonflow-network
    external: true
