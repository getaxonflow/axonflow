AWSTemplateFormatVersion: "2010-09-09"

Description: >
  GitHub Actions IAM roles for AxonFlow CI/CD. Two roles:
    GitHubActionsECRRole   — pushes Docker images to ECR (used by build.yml).
    GitHubActionsInfraRole — drives CloudFormation infra deploys (used by
                             deploy-infrastructure.yml).
  Both roles trust the GitHub OIDC provider for the axonflow + axonflow-
  enterprise repositories. ECR push permissions are scoped by region (so a
  region migration is a single parameter change to this template).

Parameters:
  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::686831565523:oidc-provider/token.actions.githubusercontent.com
    Description: ARN of the GitHub Actions OIDC provider in this account.

  EcrRegion:
    Type: String
    Default: us-east-1
    Description: >
      AWS region where AxonFlow ECR repositories live. ECR push is
      authorized only on repositories in this region matching axonflow-*.
      Updating this parameter is the one change required for a future
      region migration.

  AllowedRepoPrincipals:
    Type: CommaDelimitedList
    Default: "repo:getaxonflow/axonflow:*,repo:getaxonflow/axonflow-enterprise:*"
    Description: >
      GitHub OIDC sub-claim values allowed to assume these roles. Wildcard
      after the colon covers branches, tags, environments, and merge
      queues.

Resources:
  # ---------------------------------------------------------------------------
  # GitHubActionsECRRole — Docker image push (build.yml)
  # ---------------------------------------------------------------------------
  GitHubActionsECRRole:
    Type: AWS::IAM::Role
    # Retain on stack delete so an accidental teardown doesn't break CI;
    # required by CFN for resource import (initial CreateChangeSet IMPORT
    # rejects resources without DeletionPolicy / UpdateReplacePolicy).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: GitHubActionsECRRole
      Description: Role for GitHub Actions to push Docker images to ECR
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: AxonFlow
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Stack
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref AllowedRepoPrincipals
      Policies:
        - PolicyName: ECRPushAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                # Wildcard scoped to project + region. Granting axonflow-*
                # access is the project-level intent here; repo creation
                # is separately privileged and any future axonflow-* image
                # added to build.yml gets push access without a second IAM
                # update. Cross-region push is denied.
                Resource: !Sub "arn:aws:ecr:${EcrRegion}:${AWS::AccountId}:repository/axonflow-*"

  # ---------------------------------------------------------------------------
  # GitHubActionsInfraRole — CloudFormation deploys (deploy-infrastructure.yml)
  # ---------------------------------------------------------------------------
  GitHubActionsInfraRole:
    Type: AWS::IAM::Role
    # Retain on stack delete; see GitHubActionsECRRole comment above.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: GitHubActionsInfraRole
      Description: GitHub Actions role for infrastructure deployment (CloudFormation, ECR registry)
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: AxonFlow
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Stack
          Value: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref AllowedRepoPrincipals
      Policies:
        - PolicyName: InfrastructureDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationPermissions
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: ECRRegistryPermissions
                Effect: Allow
                Action:
                  - ecr:PutReplicationConfiguration
                  - ecr:DescribeRegistry
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ECRRepositoryReadOnly
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                Resource: !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/axonflow-*"

Outputs:
  ECRRoleArn:
    Description: ARN of the GitHub Actions ECR push role
    Value: !GetAtt GitHubActionsECRRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECRRoleArn"

  InfraRoleArn:
    Description: ARN of the GitHub Actions infrastructure deployment role
    Value: !GetAtt GitHubActionsInfraRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-InfraRoleArn"
