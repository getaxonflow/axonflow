version: '3.8'

services:
  # PostgreSQL for audit logging and metrics storage
  postgres:
    image: postgres:15-alpine
    container_name: axonflow-orchestrator-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=axonflow_orchestrator
      - POSTGRES_USER=axonflow
      - POSTGRES_PASSWORD=orchestrator123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # #3097: loopback-bound. This is a standalone developer stack (ENV=development
      # below); the orchestrator reaches this database as `postgres:5432` over the
      # compose network, and no consumer of THIS stack dials 5433 on a host
      # interface (nothing in the repo references that port at all outside this
      # file). NB the password on this instance is hardcoded a few lines up, so a
      # non-loopback publish put a credentialled database on the local network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonflow -d axonflow_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for distributed rate limiting and budget tracking
  redis:
    image: redis:7-alpine
    container_name: axonflow-orchestrator-redis
    restart: unless-stopped
    ports:
      # #3097: loopback-bound. Reached as `redis:6379` over the compose network
      # (REDIS_URL below); no consumer of THIS stack dials 6380 on a host
      # interface, and nothing in the repo references that port outside this file.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AxonFlow Orchestrator
  axonflow-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axonflow-orchestrator
    restart: unless-stopped
    environment:
      - AXONFLOW_INTERNAL_SERVICE_SECRET=${AXONFLOW_INTERNAL_SERVICE_SECRET:-localdev-internal-service-secret-change-me}
      # #3096: an UNSET DEPLOYMENT_MODE is no longer treated as Community, and
      # `ENV=development` below is a different variable that nothing in the
      # orchestrator reads as a posture. Without this line the orchestrator's
      # read-scope resolver stops granting {TenantWide, AdminAuthority} and this
      # single-service dev stack answers 403 / zero rows on audit, decisions,
      # cost and replay reads while still passing its health check.
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-community}
      - DATABASE_URL=postgres://axonflow:orchestrator123@postgres:5432/axonflow_orchestrator?sslmode=disable
      - PORT=8081
      - ENV=development
      - LOG_LEVEL=info
      # LLM Provider Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOCAL_LLM_ENDPOINT=http://localhost:11434
      # Policy Configuration
      - POLICY_CACHE_TTL=300
      - DYNAMIC_POLICY_ENABLED=true
      - PII_REDACTION_ENABLED=true
      # Audit Configuration
      - AUDIT_RETENTION_DAYS=90
      - AUDIT_BATCH_SIZE=100
      # Redis for distributed rate limiting and budget tracking
      - REDIS_URL=redis://redis:6379
    ports:
      # #3097 (deferred from #3068/#3073): loopback-bound. The orchestrator is
      # an INTERNAL service (ADR-026) and this is a developer stack; a developer
      # reaching it does so from the same host. The container healthcheck below
      # runs on the container's own loopback and is unaffected.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./logs:/app/logs

volumes:
  postgres-data:

networks:
  default:
    name: axonflow-orchestrator-network