<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxonFlow - Execution Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/ui/executions/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-6 py-3">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center gap-3">
                <a href="/ui/executions/" class="text-blue-600 hover:text-blue-800 text-sm">&larr; Back to list</a>
                <h1 class="text-lg font-semibold text-gray-900">Execution Detail</h1>
            </div>
            <button id="btn-export" class="bg-gray-100 border border-gray-300 px-3 py-1 rounded text-sm hover:bg-gray-200">
                Export JSON
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <!-- Summary Card -->
        <div id="summary-card" class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Execution ID</div>
                    <div id="summary-id" class="text-sm font-mono font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Workflow</div>
                    <div id="summary-workflow" class="text-sm font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Status</div>
                    <div id="summary-status"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Duration</div>
                    <div id="summary-duration" class="text-sm font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Steps</div>
                    <div id="summary-steps" class="text-sm font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Total Tokens</div>
                    <div id="summary-tokens" class="text-sm font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Cost</div>
                    <div id="summary-cost" class="text-sm font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 uppercase mb-1">Started</div>
                    <div id="summary-started" class="text-sm font-medium"></div>
                </div>
            </div>
            <div id="summary-error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded text-sm text-red-700"></div>
        </div>

        <!-- Steps Timeline -->
        <div class="bg-white rounded-lg border border-gray-200 p-6">
            <h2 class="text-base font-semibold text-gray-900 mb-4">Steps</h2>
            <div id="steps-list" class="space-y-3"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-12">
            <p class="text-gray-500">Loading execution...</p>
        </div>

        <!-- Error -->
        <div id="error-state" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mt-4">
            <p id="error-message" class="text-red-700 text-sm"></p>
        </div>
    </main>

    <script src="/ui/executions/app.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            App.loadExecution(id);
        } else {
            window.location.href = '/ui/executions/';
        }
    </script>
</body>
</html>
