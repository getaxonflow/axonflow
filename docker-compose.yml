# AxonFlow Local Development Environment (Community Edition)
# Fast feedback loop for testing changes locally before deploying to AWS
#
# Usage:
#   docker compose up -d                    # Start all Community services
#   docker compose logs -f axonflow-agent   # Follow agent logs
#   docker compose down -v                  # Stop and remove volumes
#
# For Enterprise features (Bedrock, Customer Portal, etc.):
#   See docker-compose.enterprise.yml
#
# Services:
#   - PostgreSQL: localhost:5432
#   - Redis: localhost:6379
#   - Agent: localhost:8080
#   - Orchestrator: localhost:8081
#   - Prometheus: localhost:9090
#   - Grafana: localhost:3000 (admin/grafana_localdev456)

services:
  # PostgreSQL Database - Core platform storage
  postgres:
    image: postgres:15-alpine
    container_name: axonflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axonflow
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: axonflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback (#3068): host-only, matching the shipped
      # axonflow-install bundle. Nothing here should be reachable from off-box.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonflow -d axonflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - axonflow-network

  # Redis - Rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: axonflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - axonflow-network

  # AxonFlow Agent - Runs migrations and handles MCP queries
  axonflow-agent:
    build:
      context: .
      dockerfile: platform/agent/Dockerfile
      args:
        EDITION: community
    container_name: axonflow-agent
    restart: unless-stopped
    environment:
      # Opt-in Enterprise add-on policy packs (PRD v11 §1.9), comma-separated; `fincrime` installs the FinCrime pack.
      # Empty installs none. An unknown name, or any value on a Community build, refuses boot.
      AXONFLOW_POLICY_PACKS: ${AXONFLOW_POLICY_PACKS:-}
      # ============================================================
      # CORE CONFIGURATION (most users only need to set these)
      # ============================================================

      # LLM Provider API Keys - set at least one to enable AI features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}

      # Azure OpenAI - use instead of/alongside OpenAI for Azure-hosted models
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}

      # Service ports and mode
      PORT: 8080
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-community}
      # Browser origins allowed to call this API cross-origin (#3096).
      # Unset/blank + a non-community DEPLOYMENT_MODE denies every cross-origin
      # request, so .env.example documents it and this line is what makes that
      # documentation true — an env var no deployment surface reads is not
      # configurable. Blank is identical to unset for the resolver.
      AXONFLOW_CORS_ALLOWED_ORIGINS: ${AXONFLOW_CORS_ALLOWED_ORIGINS:-}
      AXONFLOW_INTEGRATIONS: ${AXONFLOW_INTEGRATIONS:-}
      AXONFLOW_LICENSE_KEY: ${AXONFLOW_LICENSE_KEY:-}
      AXONFLOW_VERSION: "${AXONFLOW_VERSION:-11.0.0}"

      # Anonymous platform startup telemetry — inherit the operator's
      # opt-out lever. CI / dev shells should export AXONFLOW_TELEMETRY=off
      # so docker-compose passes it through to the container; production
      # deployments leave it unset so the binary emits one classification-
      # only ping per binary per 7 days.
      #
      # CI / GITHUB_ACTIONS propagation (2026-05-13) — defense in depth
      # for the platform binary's CI auto-suppress path (see
      # platform/agent/startup_telemetry.go). Even if AXONFLOW_TELEMETRY=off
      # propagation is ever missed, CI=true / GITHUB_ACTIONS=true triggers
      # the in-binary suppress. Pre-2026-05-13 the workflow env block at
      # the runner level didn't reach binaries inside docker compose; ~300
      # CI runs / week leaked into prod telemetry.
      AXONFLOW_TELEMETRY: ${AXONFLOW_TELEMETRY:-}
      AXONFLOW_TELEMETRY_STAMP_DIR: ${AXONFLOW_TELEMETRY_STAMP_DIR:-}
      CI: ${CI:-}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}

      # Media governance (v4.5.0+) - set to "true" to enable in Community mode
      MEDIA_GOVERNANCE_ENABLED: ${MEDIA_GOVERNANCE_ENABLED:-}

      # ============================================================
      # ADVANCED CONFIGURATION (defaults work for most use cases)
      # ============================================================

      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: localdev123
      DATABASE_SSLMODE: disable

      # Internal services (Orchestrator/Portal URLs auto-discovered via Docker service names)
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://axonflow:localdev123@postgres:5432/axonflow?sslmode=disable

      # v9 Brief 11.5 / Session 20: pin the app-role gate OFF for local dev.
      # The 'axonflow' Postgres user above IS the table owner here, not the
      # provisioned axonflow_app_role. OpenAppRoleConnection asserts the
      # connected role matches axonflow_app_role when this gate is on, so
      # without the explicit "false" pin local boot would fail under v9.0.0's
      # default-true. Override to "true" with a provisioned app-role DSN for
      # local soak-testing the production path.
      AXONFLOW_DB_USE_APP_ROLE: ${AXONFLOW_DB_USE_APP_ROLE:-false}
      # v9 Phase 8 / Issue #2391 production-posture passthrough. Empty by
      # default; setup-e2e-testing.sh production-posture populates these
      # in .env after invoking provision-app-role.sh.
      AXONFLOW_DB_APP_ROLE_URL: ${AXONFLOW_DB_APP_ROLE_URL:-}
      AXONFLOW_DB_PLATFORM_ADMIN_URL: ${AXONFLOW_DB_PLATFORM_ADMIN_URL:-}

      # Ollama (for local/air-gapped LLM deployments)
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}

      # LLM routing (multi-provider setups)
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      LLM_ROUTING_STRATEGY: ${LLM_ROUTING_STRATEGY:-weighted}
      PROVIDER_WEIGHTS: ${PROVIDER_WEIGHTS:-}

      # Security scanning (Issue #891)
      # Detection ACTIONS are not configured here (v11, #3961): the stored
      # policy action decides, and the only thing that may replace it is an
      # organization's recorded override (detection_action_overrides, written
      # through the audited detection-posture API).
      SQLI_SCANNER_MODE: ${SQLI_SCANNER_MODE:-basic}
      # Capability-scoped evaluation (#2801): text-document tools (Jira/
      # Confluence edits) skip execution-class detectors (SQLi, dangerous
      # commands). Set to "true" to restore pre-#2801 full evaluation.
      AXONFLOW_CAPABILITY_SCOPING_DISABLED: ${AXONFLOW_CAPABILITY_SCOPING_DISABLED:-}

      # Identity-header trust gate (#2896): set to the exact string "true" ONLY
      # when every hop that can reach the agent re-sets X-User-Email /
      # X-Session-Id from a validated source (desktop proxy, managed plugin
      # fleet, gateway jwtAuth). Default off: headers are ignored and audit
      # attribution uses the validated identity.
      AXONFLOW_TRUST_IDENTITY_HEADERS: ${AXONFLOW_TRUST_IDENTITY_HEADERS:-}

      # How long one organization's identity_org_settings row (its Shared
      # Signals opt-in; enterprise builds) is served before it is
      # re-read. Default 60s, clamped to [1s, 600s]. It bounds how long a
      # portal admin-API write takes to reach the authentication path; the
      # runtime suite lowers it to seconds. Community builds ignore it.
      AXONFLOW_IDENTITY_ORG_SETTINGS_TTL_SECONDS: ${AXONFLOW_IDENTITY_ORG_SETTINGS_TTL_SECONDS:-}
      # How long a resolved (org, user) governance-segment set is cached
      # (ADR-060). Default 60s, clamped to [5s, 600s]. Carried so the Shared
      # Signals runtime suite can pin it HIGH and prove a CAEP event beats it.
      AXONFLOW_SEGMENT_CACHE_TTL_SECONDS: ${AXONFLOW_SEGMENT_CACHE_TTL_SECONDS:-}
      # How long an organization's recorded detection-action overrides
      # (detection_action_overrides) are cached. Default 60s, clamped to
      # [5s, 600s]. Carried so a runtime suite that records or removes an
      # override after this process has served that org can pin it low and
      # wait it out instead of restarting the process.
      AXONFLOW_DETECTION_OVERRIDE_TTL_SECONDS: ${AXONFLOW_DETECTION_OVERRIDE_TTL_SECONDS:-}

      # Per-mode static policy evaluation switches. They enable, disable and
      # skip categories; none of them sets an action.
      # MCP mode
      MCP_STATIC_POLICIES_ENABLED: ${MCP_STATIC_POLICIES_ENABLED:-true}
      MCP_STATIC_POLICIES_SKIP_CATEGORIES: ${MCP_STATIC_POLICIES_SKIP_CATEGORIES:-}
      # Gateway mode
      GATEWAY_STATIC_POLICIES_ENABLED: ${GATEWAY_STATIC_POLICIES_ENABLED:-true}

      # Exfiltration detection (Issue #966)
      # MCP_MAX_ROWS_PER_QUERY: Maximum rows allowed per query (default: 10000)
      MCP_MAX_ROWS_PER_QUERY: ${MCP_MAX_ROWS_PER_QUERY:-10000}
      # MCP_MAX_BYTES_PER_QUERY: Maximum response size in bytes (default: 10MB)
      MCP_MAX_BYTES_PER_QUERY: ${MCP_MAX_BYTES_PER_QUERY:-10485760}

      # Authentication
      # JWT_SECRET: Secret for signing/validating user tokens
      # Generate tokens using: scripts/generate-jwt.sh
      JWT_SECRET: ${JWT_SECRET:-axonflow-local-dev-jwt-secret-do-not-use-in-production}

      # Internal service auth (orchestrator/portal-to-agent HMAC token signing).
      # In enterprise mode the agent REQUIRES this to authenticate internal
      # callers (e.g. the customer-portal's /static-policies/effective fetch);
      # an empty value hid every system policy in the unified-policies UI (#2689).
      # A local-dev default is provided so the stack works out-of-box; it MUST be
      # identical across agent, orchestrator, and customer-portal.
      # SECURITY: override for any shared/real deployment.
      AXONFLOW_INTERNAL_SERVICE_SECRET: ${AXONFLOW_INTERNAL_SERVICE_SECRET:-localdev-internal-service-secret-change-me}

      # Misc
      ORG_ID: ${ORG_ID:-local-dev-org}
      # DEPLOYMENT_KIND distinguishes dev-default from prod-forgot-ORG_ID for
      # migration 094's Pass-2 backfill precondition. Local docker-compose is
      # intentionally `dev` — operators deploying to real stacks MUST set
      # `production` (CFN templates already do). See #2320 + run.go's
      # setMigrationSessionVars + migrations/core/094_v9_org_id_backfill.sql.
      DEPLOYMENT_KIND: ${DEPLOYMENT_KIND:-dev}
      ENVIRONMENT: development
      LOG_LEVEL: debug
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
      GRAFANA_PASSWORD: grafana_localdev456
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
    ports:
      # Loopback-bound (#3068). The agent IS the authenticated entry point,
      # but the dev stack should not publish it to the network by default;
      # front it with a reverse proxy, or add a compose override, for remote
      # access. Matches axonflow-install/docker-compose.yml.
      - "127.0.0.1:8080:8080"
    volumes:
      # MCP connector configuration (enables postgres connector for demos)
      - ./config/axonflow.yaml:/app/config/axonflow.yaml:ro
      # THE AGENT'S DATA DIRECTORY, AND IT HAS TO SURVIVE A RECREATE (#3593).
      # The node identity the tier limit counts is AXONFLOW_NODE_ID if set,
      # else an id generated once and written to /var/lib/axonflow/node-id.
      # Without a volume that file dies with the container, so `docker compose
      # up` after a `down` presents a NEW node - and on Community, which is
      # single-node, the new container would then have to wait for the old
      # lease to expire before it could start. With the volume a recreate is
      # the same node renewing its own lease, which is what it actually is.
      # The audit fallback path (/var/lib/axonflow/audit) lives here too.
      - axonflow-agent-data:/var/lib/axonflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - axonflow-network

  # AxonFlow Orchestrator - LLM routing and policy enforcement
  axonflow-orchestrator:
    build:
      context: .
      dockerfile: platform/orchestrator/Dockerfile
      args:
        EDITION: community
    container_name: axonflow-orchestrator
    restart: unless-stopped
    environment:
      # ============================================================
      # CORE CONFIGURATION (most users only need to set these)
      # ============================================================

      # LLM Provider API Keys - set at least one to enable AI features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}

      # Azure OpenAI - use instead of/alongside OpenAI for Azure-hosted models
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}

      # Service ports and mode
      PORT: 8081
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-community}
      # Same origin policy as the agent — see that service for the rationale.
      # The two resolve it independently, so both must carry it.
      AXONFLOW_CORS_ALLOWED_ORIGINS: ${AXONFLOW_CORS_ALLOWED_ORIGINS:-}
      # How long a resolved (org, user) governance-segment set is cached
      # (ADR-060). Default 60s, clamped to [5s, 600s]. Carried so the Shared
      # Signals runtime suite can pin it HIGH and prove a CAEP event beats it.
      AXONFLOW_SEGMENT_CACHE_TTL_SECONDS: ${AXONFLOW_SEGMENT_CACHE_TTL_SECONDS:-}
      # How long an organization's recorded detection-action overrides
      # (detection_action_overrides) are cached. Default 60s, clamped to
      # [5s, 600s]. Carried so a runtime suite that records or removes an
      # override after this process has served that org can pin it low and
      # wait it out instead of restarting the process.
      AXONFLOW_DETECTION_OVERRIDE_TTL_SECONDS: ${AXONFLOW_DETECTION_OVERRIDE_TTL_SECONDS:-}
      AXONFLOW_LICENSE_KEY: ${AXONFLOW_LICENSE_KEY:-}
      # The ADR-065 typed policy vocabulary, for the COMMUNITY write route
      # #3943 added to this binary. It reached the customer-portal service in
      # docker-compose.enterprise.yml and no compose file in this repository
      # ever passed it here, so the orchestrator route answered 503 on every
      # stack the repo can boot - which is why `Policy Path Alias E2E` reports
      # "no vocabulary configured on this stack" rather than exercising the
      # community publication legs it was written for. Unset by default: the
      # surface is opt-in, and an unset value makes it unavailable by name.
      # Recognised values since #3895: `deployment` (what a real installation
      # runs) and `conformance` (the ADR-065 fixture world, publishable against
      # and NEVER activatable).
      AXONFLOW_TYPED_AUTHORING_CATALOG: ${AXONFLOW_TYPED_AUTHORING_CATALOG:-deployment}
      AXONFLOW_VERSION: "${AXONFLOW_VERSION:-11.0.0}"

      # Anonymous platform startup telemetry — inherit the operator's
      # opt-out lever. See agent service above for the full rationale.
      # CI / GITHUB_ACTIONS propagation defense in depth — see agent.
      AXONFLOW_TELEMETRY: ${AXONFLOW_TELEMETRY:-}
      AXONFLOW_TELEMETRY_STAMP_DIR: ${AXONFLOW_TELEMETRY_STAMP_DIR:-}
      CI: ${CI:-}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}

      # HITL mode (Evaluation+) — set to "true" to enable the HITL workflow
      # engine backing WCP /steps/{step_id}/approve|reject, MAP plan-scoped
      # equivalents, and the /hitl/queue Enterprise surface.
      AXONFLOW_HITL_ENABLED: ${AXONFLOW_HITL_ENABLED:-false}

      # Media governance (v4.5.0+) - set to "true" to enable in Community mode
      MEDIA_GOVERNANCE_ENABLED: ${MEDIA_GOVERNANCE_ENABLED:-}

      # ============================================================
      # ADVANCED CONFIGURATION (defaults work for most use cases)
      # ============================================================

      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: localdev123
      DATABASE_SSLMODE: disable

      # Internal services
      AGENT_MCP_ENDPOINT: http://axonflow-agent:8080

      # v9 Brief 11.5 / Session 20 — see agent service above for full rationale.
      # Pin OFF for local dev (master role IS the app role here).
      AXONFLOW_DB_USE_APP_ROLE: ${AXONFLOW_DB_USE_APP_ROLE:-false}
      # v9 Phase 8 / Issue #2391 production-posture passthrough. See agent.
      AXONFLOW_DB_APP_ROLE_URL: ${AXONFLOW_DB_APP_ROLE_URL:-}
      AXONFLOW_DB_PLATFORM_ADMIN_URL: ${AXONFLOW_DB_PLATFORM_ADMIN_URL:-}

      # Internal service auth (orchestrator-to-agent HMAC token signing)
      # Must match the agent's AXONFLOW_INTERNAL_SERVICE_SECRET value.
      AXONFLOW_INTERNAL_SERVICE_SECRET: ${AXONFLOW_INTERNAL_SERVICE_SECRET:-localdev-internal-service-secret-change-me}

      # Model overrides (optional - providers use sensible defaults)
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}

      # Ollama (for local/air-gapped LLM deployments)
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-}

      # LLM routing (multi-provider setups)
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      LLM_ROUTING_STRATEGY: ${LLM_ROUTING_STRATEGY:-weighted}
      PROVIDER_WEIGHTS: ${PROVIDER_WEIGHTS:-}

      # Misc
      ORG_ID: ${ORG_ID:-local-dev-org}
      # DEPLOYMENT_KIND mirrored from the agent block — see #2320 rationale.
      DEPLOYMENT_KIND: ${DEPLOYMENT_KIND:-dev}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      # #3068: MUST stay loopback. The orchestrator is an INTERNAL service
      # (ADR-024): the agent reaches it over the compose network, never via
      # the host port. Publishing it host-wide put the governance control
      # plane — unauthenticated, tenant-selectable read AND write — on every
      # interface of the host. Mirrors axonflow-install/docker-compose.yml.
      - "127.0.0.1:8081:8081"
    depends_on:
      axonflow-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - axonflow-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: axonflow-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./config/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - axonflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - Metrics visualization
  # Login: admin / grafana_localdev456
  grafana:
    image: grafana/grafana:10.2.2
    container_name: axonflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_localdev456
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: grafana_localdev456
      GF_DATABASE_SSL_MODE: disable
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: ""
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      axonflow-agent:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - axonflow-network

  # MinIO (S3-compatible object storage for local development)
  # Bucket creation is handled via the entrypoint script below.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-18T16-25-55Z
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' &
      MINIO_PID=$$!;
      until mc ready local 2>/dev/null; do sleep 1; done;
      mc alias set local http://localhost:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/axonflow-test-bucket;
      wait $$MINIO_PID
      "
    container_name: axonflow-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - axonflow-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axonflow-agent-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  minio-data:
    driver: local

networks:
  axonflow-network:
    driver: bridge
