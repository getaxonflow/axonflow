                registry_enabled: true
                timestamp: "2025-12-09T14:25:00Z"
        '503':
          description: Registry not initialized

  # ==========================================================================
  # HITL - Human-in-the-Loop (EU AI Act Article 14)
  # ==========================================================================

  /api/v1/hitl/queue:
    post:
      tags:
        - HITL
      summary: Create HITL decision request
      description: |
        Route a high-risk AI decision for human review.
        EU AI Act Article 14 requires human oversight for high-risk AI systems.
      operationId: createHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLDecisionRequest'
      responses:
        '201':
          description: Decision request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - HITL
      summary: List pending HITL decisions
      description: Retrieve pending decisions awaiting human review
      operationId: listHITLDecisions
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: org_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/HITLDecision'
                  count:
                    type: integer

  /api/v1/hitl/queue/{id}:
    get:
      tags:
        - HITL
      summary: Get HITL decision
      operationId: getHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLDecision'
        '404':
          description: Decision not found

  /api/v1/hitl/queue/{id}/approve:
    post:
      tags:
        - HITL
      summary: Approve HITL decision
      description: Approve a pending decision to allow AI execution
      operationId: approveHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reviewer_id
              properties:
                reviewer_id:
                  type: string
                comments:
                  type: string
      responses:
        '200':
          description: Decision approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLDecision'
        '400':
          description: Invalid status transition
        '404':
          description: Decision not found

  /api/v1/hitl/queue/{id}/reject:
    post:
      tags:
        - HITL
      summary: Reject HITL decision
      description: Reject a pending decision to block AI execution
      operationId: rejectHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reviewer_id
                - reason
              properties:
                reviewer_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Decision rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLDecision'
        '400':
          description: Invalid status transition
        '404':
          description: Decision not found

