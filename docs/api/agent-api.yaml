  /mcp/resources/query:
    post:
      tags:
        - MCP Connectors
      summary: Execute MCP query (read-only)
      description: |
        Execute a read-only query via an MCP connector.

        This follows the MCP Resource pattern for data retrieval.
        For write operations, use `/mcp/tools/execute`.

        ## Audit Logging

        All MCP queries are automatically logged to the `mcp_query_audits` table with:
        - **Request phase**: SQLi detection results, PII blocking decisions
        - **Response phase**: PII redaction details, redacted field paths
        - **Exfiltration checks**: Row counts, volume limit violations
        - **Result**: Success/failure, error messages, duration

        Each audit entry includes `audit_id` for correlation with SDK `PolicyInfo`.
        Statement content is stored as SHA256 hash for privacy.
      operationId: mcpQuery
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPQueryRequest'
            examples:
              sqlQuery:
                summary: SQL query
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  connector: "postgres_main"
                  statement: "SELECT * FROM orders WHERE status = $1"
                  parameters:
                    "1": "completed"
                  limit: 100
                  timeout: "10s"
              amadeusSearch:
                summary: Flight search
                value:
                  client_id: "travel-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  connector: "amadeus"
                  operation: "search_flights"
                  parameters:
                    origin: "NYC"
                    destination: "LAX"
                    departure_date: "2025-01-20"
                  timeout: "15s"
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPQueryResponse'
              example:
                success: true
                connector: "amadeus"
                data:
                  - flight_number: "UA123"
                    departure: "2025-01-20T08:00:00Z"
                    arrival: "2025-01-20T11:00:00Z"
                    price: 299.99
                row_count: 5
                duration_ms: 450
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp/tools/execute:
    post:
      tags:
        - MCP Connectors
      summary: Execute MCP command (write)
      description: |
        Execute a write command via an MCP connector.

        This follows the MCP Tool pattern for data modification.
        For read operations, use `/mcp/resources/query`.

        ## Audit Logging

        All MCP execute operations are automatically logged to the `mcp_query_audits` table with:
        - **Request phase**: SQLi detection results, dangerous operation blocking
        - **Result**: Rows affected, success/failure, error messages, duration

        Each audit entry includes `audit_id` for correlation. Operation type (INSERT, UPDATE, DELETE)
        is stored in the `operation` field.
      operationId: mcpExecute
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPExecuteRequest'
            example:
              client_id: "order-service"
              user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              connector: "postgres_main"
              action: "UPDATE"
              statement: "UPDATE orders SET status = $1 WHERE id = $2"
              parameters:
                "1": "shipped"
                "2": "ord-12345"
              timeout: "5s"
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPExecuteResponse'
              example:
                success: true
                connector: "postgres_main"
                rows_affected: 1
                duration_ms: 15
                message: "Update successful"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp/check-input:
    post:
      tags:
        - MCP Connectors
      summary: Validate MCP input against policies
      description: |
        Validate an MCP request (query or command) against configured policies **without executing it**.

        This endpoint enables external orchestrators (LangGraph, CrewAI, custom pipelines) to use
        AxonFlow as a policy gate while managing MCP connector execution themselves.

        ## Policy Evaluation

        The following policies are evaluated in order:
        1. **Dynamic policies** (if enabled): Rate limits, budgets, time-access, role-access via Orchestrator
        2. **Static policies**: SQL injection detection, dangerous query blocking, PII detection

        If any policy blocks the request, the response returns `allowed: false` with a `block_reason`.

        ## When to Use

        Use `check-input` + `check-output` when your orchestrator manages MCP execution natively.
        Use `/mcp/resources/query` or `/mcp/tools/execute` when you want AxonFlow to handle both
        policy enforcement and connector execution.

        ## Audit Logging

        All check-input evaluations are logged to the `mcp_query_audits` table with
        `operation: "check-input"` for compliance tracking. Audit entries include
        `parameters_hash` (SHA-256) and `parameter_count` for forensic analysis.
      operationId: mcpCheckInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPCheckInputRequest'
            examples:
              cleanQuery:
                summary: Clean SQL query (passes all policies)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  statement: "SELECT name, email FROM users WHERE id = $1"
                  parameters:
                    "1": "usr-001"
                  operation: "query"
              sqliAttempt:
                summary: SQL injection attempt (blocked)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  statement: "SELECT * FROM users; DROP TABLE users--"
      responses:
        '200':
          description: Input passed all policy checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckInputResponse'
              example:
                allowed: true
                policies_evaluated: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Input blocked by policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckInputResponse'
              example:
                allowed: false
                block_reason: "SQL injection detected in statement"
                policies_evaluated: 3
                policy_info:
                  policies_evaluated: 3
                  blocked: true
                  block_reason: "SQL injection detected in statement"
        '503':
          description: Dynamic policy evaluator unavailable (only when graceful degradation is disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mcp/check-output:
    post:
      tags:
        - MCP Connectors
      summary: Validate MCP output against policies
      description: |
        Validate MCP response data against configured policies **without having executed the query
        through AxonFlow**.

        This endpoint enables external orchestrators to apply AxonFlow's output-side policy
        enforcement (PII redaction, exfiltration limits, SQLi response scanning) to data they
        fetched from MCP connectors independently.

        ## Policy Evaluation

        The following checks are applied in order:
        1. **SQLi response scanning**: Detects SQL injection artifacts in response data
        2. **Static response policies**: PII detection and redaction (SSN, credit card, Aadhaar, etc.)
        3. **Exfiltration limits** (query-style only): Row count and byte size limits

        If PII is detected, the response includes `redacted_data` with masked values.
        If exfiltration limits are exceeded, the response returns `allowed: false`.

        ## Query vs Execute Responses

        - **Query responses** (`response_data`): Full policy evaluation including exfiltration checks
        - **Execute responses** (`message`): SQLi scanning and PII checks only (no exfiltration limits)

        ## Audit Logging

        All check-output evaluations are logged to the `mcp_query_audits` table with
        `operation: "check-output"` for compliance tracking.
      operationId: mcpCheckOutput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPCheckOutputRequest'
            examples:
              cleanData:
                summary: Clean query response (passes all policies)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  response_data:
                    - id: 1
                      name: "Alice Johnson"
                      department: "Engineering"
                  row_count: 1
              piiData:
                summary: Response containing PII (redacted)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  response_data:
                    - id: 1
                      name: "Alice Johnson"
                      ssn: "123-45-6789"
                  row_count: 1
              executeResponse:
                summary: Execute-style response (message only)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  message: "3 rows updated"
                  metadata:
                    query: "UPDATE users SET status = 'active' WHERE region = 'us'"
      responses:
        '200':
          description: Output passed all policy checks (may include redacted data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckOutputResponse'
              examples:
                clean:
                  summary: No issues found
                  value:
                    allowed: true
                    policies_evaluated: 8
                redacted:
                  summary: PII detected and redacted
                  value:
                    allowed: true
                    redacted_data:
                      - id: 1
                        name: "Alice Johnson"
                        ssn: "XXX-XX-6789"
                    policies_evaluated: 8
                    policy_info:
                      policies_evaluated: 8
                      blocked: false
                      redactions_applied: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Output blocked by policy (exfiltration limit exceeded or SQLi detected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckOutputResponse'
              example:
                allowed: false
                block_reason: "Exfiltration limit exceeded: row_count 15000 > limit 10000"
                policies_evaluated: 3
                exfiltration_info:
                  exceeded: true
                  limit_type: rows
                  rows_returned: 15000
                  row_limit: 10000
                  bytes_returned: 5242880
                  byte_limit: 10485760

  /mcp/health:
    get:
      tags:
        - MCP Connectors
      summary: Overall MCP health
      description: Returns aggregate health status for all MCP connectors
