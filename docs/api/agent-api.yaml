        license_tier:
          type: string
          enum: [Community, starter, professional, enterprise]
          description: License tier
        license_expiry:
          type: string
          format: date-time
          description: When license expires

    MCPQueryRequest:
      type: object
      required:
        - client_id
        - connector
      properties:
        client_id:
          type: string
        license_key:
          type: string
          description: Can also be provided in X-License-Key header
        user_token:
          type: string
        connector:
          type: string
          description: Connector name
        operation:
          type: string
          description: Operation name (for API connectors like Amadeus)
        statement:
          type: string
          description: SQL/CQL statement (for database connectors)
        parameters:
          type: object
          additionalProperties: true
          description: Query parameters
        limit:
          type: integer
          description: Maximum rows to return
        timeout:
          type: string
          description: Timeout duration (e.g., "10s")

    MCPQueryResponse:
      type: object
      properties:
        success:
          type: boolean
        connector:
          type: string
        data:
          type: array
          items:
            type: object
          description: Query results
        row_count:
          type: integer
        duration_ms:
          type: integer
        redacted:
          type: boolean
          description: Whether any fields in the response were redacted by policy enforcement
        redacted_fields:
          type: array
          items:
            type: string
          description: JSON paths of fields that were redacted (e.g., "data.rows[0].ssn")
        policy_info:
          $ref: '#/components/schemas/PolicyInfo'

    PolicyInfo:
      type: object
      description: Policy evaluation information included in MCP responses
      properties:
        policies_evaluated:
          type: integer
          description: Number of policies evaluated during request/response processing
        blocked:
          type: boolean
          description: Whether the request was blocked by policy
        block_reason:
          type: string
          description: Reason if the request was blocked
        redactions_applied:
          type: integer
          description: Number of field redactions applied to the response
        processing_time_ms:
          type: integer
          description: Time spent on policy evaluation in milliseconds
        matched_policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyMatchInfo'
          description: Policies that matched during evaluation
        exfiltration_check:
          $ref: '#/components/schemas/ExfiltrationCheckInfo'
        dynamic_policy_info:
          $ref: '#/components/schemas/DynamicPolicyInfo'

    ExplainPolicy:
      type: object
      description: |
        Per-policy explainability record (ADR-043). Surfaced in
        MCPCheckInputResponse.policy_matches and MCPCheckOutputResponse.policy_matches
        when dynamic policy evaluation produces non-empty matches.
      properties:
        policy_id:
          type: string
          description: Unique policy identifier.
        policy_name:
          type: string
          description: Human-readable policy name.
        action:
          type: string
          description: Action taken for this policy match (e.g. "block", "redact", "warn").
        risk_level:
          type: string
          enum: [low, medium, high, critical]
          description: Risk level configured on this policy.
        allow_override:
          type: boolean
          description: Whether this policy permits a session override.
        policy_description:
          type: string
          description: Optional description text shown to operators.

    ExplainRule:
      type: object
      description: |
        Per-rule explainability record (ADR-043). Surfaced in
        DecisionExplanation.matched_rules to attribute a decision to the
        specific rule that fired.
      properties:
        policy_id:
          type: string
          description: Parent policy identifier.
        rule_id:
          type: string
          description: Unique rule identifier within the policy.
        rule_text:
          type: string
          description: The rule text or pattern that matched.
        matched_on:
          type: string
          description: The portion of the input/output that matched the rule.

    DecisionExplanation:
      type: object
      description: |
        Full explainability payload (ADR-043). Returned by the
        explain_decision MCP tool given a decision_id.
      properties:
        decision_id:
          type: string
          description: Unique audit correlator (matches MCPCheck*Response.decision_id).
        timestamp:
          type: string
          format: date-time
          description: When the decision was made.
        policy_matches:
          type: array
          items:
            $ref: '#/components/schemas/ExplainPolicy'
          description: All policies that matched in this decision.
        matched_rules:
          type: array
          items:
            $ref: '#/components/schemas/ExplainRule'
          description: All specific rules that fired (sub-policy level).
        decision:
          type: string
          enum: [allow, block, redact, warn]
          description: Final decision applied to the request.
        reason:
          type: string
          description: Human-readable explanation of the decision.
        risk_level:
          type: string
          enum: [low, medium, high, critical]
          description: Highest risk level across all matches.
        override_available:
          type: boolean
          description: Whether a session override is available for this decision.
        override_existing_id:
          type: string
          description: ID of an active override consumed by this decision (if any).
        historical_hit_count_session:
          type: integer
          description: |
            Number of times this decision-class has fired in the current
            session — useful for surfacing repeat-offender context.
        policy_source_link:
          type: string
          description: Optional URL pointing to the policy definition source.
        tool_signature:
          type: string
          description: Optional signature identifying the calling tool/connector.

    ExfiltrationCheckInfo:
      type: object
      description: Information about exfiltration limit checks (v3.2.0+)
      properties:
        exceeded:
          type: boolean
          description: Whether any exfiltration limit was exceeded
        limit_type:
          type: string
          enum: [rows, bytes, none]
          description: Type of limit that was exceeded (if any)
        rows_returned:
          type: integer
          description: Number of rows in the response
        row_limit:
          type: integer
          description: Configured row limit (MCP_MAX_ROWS_PER_QUERY)
        bytes_returned:
          type: integer
          description: Response size in bytes
        byte_limit:
          type: integer
          description: Configured byte limit (MCP_MAX_BYTES_PER_QUERY)

    DynamicPolicyInfo:
      type: object
      description: |
        Information about dynamic policy evaluation via Orchestrator (v3.2.0+).
        Source of truth: `platform/shared/policy/types.go` (`DynamicPolicyInfo`).
      properties:
        policies_evaluated:
          type: integer
          description: Number of dynamic policies evaluated
        matched_policies:
          type: array
          items:
            $ref: '#/components/schemas/DynamicPolicyMatch'
          description: Details of matched dynamic policies (omitted when empty)
        orchestrator_reachable:
          type: boolean
          description: Whether the Orchestrator was reachable for dynamic policy evaluation
        processing_time_ms:
          type: integer
          format: int64
          description: Time spent evaluating dynamic policies in milliseconds

    DynamicPolicyMatch:
      type: object
      description: Information about a matched dynamic policy
      properties:
        policy_id:
          type: string
          description: Unique identifier of the matched policy
        policy_name:
          type: string
          description: Human-readable policy name
        policy_type:
          type: string
          description: Type of policy (e.g., rate-limit, budget, time-based, role-based)
        action:
          type: string
          enum: [allow, deny, warn]
          description: Action taken by the policy
        message:
          type: string
          description: Optional message from the policy evaluation

    PolicyMatchInfo:
      type: object
      description: Information about a policy match during evaluation
      properties:
        policy_id:
          type: string
          description: Unique policy identifier
        policy_name:
          type: string
          description: Human-readable policy name
        category:
          type: string
          description: Policy category (e.g., "pii-us", "security-sqli")
        severity:
          type: string
          description: Match severity (low, medium, high, critical)
        action:
          type: string
          description: Action taken (block, redact, warn, log)

    MCPExecuteRequest:
      type: object
      required:
        - client_id
        - connector
        - action
      properties:
        client_id:
          type: string
        license_key:
          type: string
        user_token:
          type: string
        connector:
          type: string
        operation:
          type: string
        action:
          type: string
          enum: [INSERT, UPDATE, DELETE]
        statement:
          type: string
        parameters:
          type: object
          additionalProperties: true
        timeout:
          type: string

    MCPExecuteResponse:
      type: object
      properties:
        success:
          type: boolean
        connector:
          type: string
        rows_affected:
          type: integer
        duration_ms:
          type: integer
        message:
          type: string
        redacted:
          type: boolean
          description: Whether any fields in the response were redacted by policy
        redacted_fields:
          type: array
          items:
            type: string
          description: JSON paths of fields that were redacted
        policy_info:
          $ref: '#/components/schemas/PolicyInfo'

    MCPCheckInputRequest:
      type: object
      required:
        - connector_type
        - statement
      properties:
        client_id:
          type: string
          description: Client identifier (required in Enterprise mode)
        user_token:
          type: string
          description: JWT user token (required in Enterprise mode)
        tenant_id:
          type: string
          description: Tenant identifier (required in Enterprise mode, defaults to "default" in Community)
        user_id:
          type: string
          description: Optional user identifier for dynamic policy evaluation
        user_role:
          type: string
          description: Optional user role for role-based access policies (e.g., "admin", "analyst")
        connector_type:
          type: string
          description: MCP connector type (e.g., "postgres", "snowflake", "salesforce")
        statement:
          type: string
          description: The SQL query or command to validate against policies
        parameters:
          type: object
          additionalProperties: true
          description: |
            Optional query parameters. Values are individually scanned for SQLi,
            PII, and compliance violations by the static policy engine. String
            values are scanned directly; nested objects/arrays are JSON-serialized
            before scanning; numeric values are converted to strings for
            PII/compliance detection. Boolean values are skipped.
        operation:
          type: string
          enum: [query, execute]
          default: execute
          description: Operation type — affects dynamic policy evaluation (rate limits may differ)

    MCPCheckInputResponse:
      type: object
      properties:
        allowed:
          type: boolean
          description: Whether the input passed all policy checks
        block_reason:
          type: string
          description: Human-readable reason if blocked (omitted when allowed)
        policies_evaluated:
          type: integer
          description: Total number of policies evaluated
        policy_info:
          $ref: '#/components/schemas/PolicyInfo'
        # Plugin Batch 1 / ADR-042 / ADR-043 — richer governance context
        # surfaced when the platform is v7.1.0+. Source of truth:
        # platform/agent/mcp_server_handler.go, lines ~880-940.
        decision_id:
          type: string
          description: |
            Unique audit correlator for this policy decision. Links the gate
            response to its row in the audit log; surfaceable to end users
            for explainability ("decision: dec_abc123").
        risk_level:
          type: string
          enum: [low, medium, high, critical]
          description: |
            Highest risk level across all matched policies. Plugins use this
            to map the block reason to severity (warning vs hard error).
        policy_matches:
          type: array
          items:
            $ref: '#/components/schemas/ExplainPolicy'
          description: |
            Per-policy explainability records (ADR-043). Surfaced when
            dynamic policy evaluation produces non-empty matches.
        override_available:
          type: boolean
          description: |
            Whether at least one matched policy permits a session override.
            Used by plugins to render an "override via explain_decision"
            hint when the block is overrideable.
        override_existing_id:
          type: string
          description: |
            ID of an active override consumed by this decision (if any).
            Distinguishes "you already have an override" from "you can
            request one".
        # Request-phase redaction (ADR-056 / #2563, since 8.6.0). When an
        # allowed statement carries PII under a redact (not block) policy, the
        # engine returns the masked statement here so a PEP can forward
        # redacted content without hand-rolling its own patterns — symmetric
        # with how check-output exposes redacted_data. Additive + omitempty,
        # so the response is byte-for-byte identical for existing callers and
        # for any allowed statement with no PII.
        redacted:
          type: boolean
          description: |
            Whether the engine masked any PII in the request statement.
            Omitted (false) when nothing was redacted.
        redacted_statement:
          type: string
          description: |
            The request statement with PII fields masked. A PEP fulfilling a
            Decision Mode redact_pii obligation forwards THIS value instead of
            the original. Omitted when nothing was redacted. Source of truth:
            `platform/agent/mcp_handler.go` (MCPCheckInputResponse).
        redaction_evaluated:
          type: boolean
          description: |
            Whether the redaction detector actually ran (regardless of whether
            it masked anything). A PEP fulfilling a redact_pii obligation MUST
            fail closed when this is false — it means no detection config was
            enabled, so `redacted: false` is indistinguishable from "looked,
            found nothing" and the request must not be forwarded as clean.

    MCPCheckOutputRequest:
      type: object
      required:
        - connector_type
      anyOf:
        - required: [response_data]
        - required: [message]
      properties:
        client_id:
          type: string
          description: Client identifier (required in Enterprise mode)
        user_token:
          type: string
          description: JWT user token (required in Enterprise mode)
        tenant_id:
          type: string
          description: Tenant identifier (required in Enterprise mode, defaults to "default" in Community)
        user_id:
          type: string
          description: Optional user identifier
        connector_type:
          type: string
          description: MCP connector type (e.g., "postgres", "snowflake", "salesforce")
        response_data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Query-style response rows to validate
        message:
          type: string
          description: Execute-style response message (e.g., "5 rows affected")
        metadata:
          type: object
          additionalProperties: true
          description: Connector metadata for SQLi response scanning (e.g., query echo, database name)
        row_count:
          type: integer
          description: Total number of rows returned (used for exfiltration limit checks)

    MCPCheckOutputResponse:
      type: object
      properties:
        allowed:
          type: boolean
          description: Whether the output passed all policy checks
        block_reason:
          type: string
          description: Human-readable reason if blocked (omitted when allowed)
        redacted_data:
          description: |
            Tabular response data with PII fields masked (used when the
            connector returned rows; e.g. SQL/CSV results). Omitted if no
            redaction was needed or if the response was a text message.
        redacted_message:
          type: string
          description: |
            Text message with PII fields masked (used when the connector
            returned a string message rather than tabular rows; e.g.
            execute-style responses). Omitted if no redaction was needed
            or if the response was tabular. Source of truth:
            `platform/agent/mcp_server_handler.go:988`.
        policies_evaluated:
          type: integer
          description: Total number of policies evaluated
        exfiltration_info:
          $ref: '#/components/schemas/ExfiltrationCheckInfo'
        policy_info:
          $ref: '#/components/schemas/PolicyInfo'
        # Plugin Batch 1 / ADR-043 — explainability context (matches the
        # MCPCheckInputResponse fields on the same call site).
        decision_id:
          type: string
          description: Unique audit correlator for this policy decision.
        policy_matches:
          type: array
          items:
            $ref: '#/components/schemas/ExplainPolicy'
          description: Per-policy explainability records (ADR-043).

    ConnectorRefreshResponse:
      type: object
      description: Response from connector cache refresh operations
      properties:
        success:
          type: boolean
          description: Whether the refresh operation succeeded
        message:
          type: string
          description: Human-readable status message
        scope:
          type: string
          enum: [all, tenant, connector]
          description: Scope of the refresh operation
        tenant_id:
          type: string
          description: Tenant ID (when scope is tenant or connector)
        connector:
          type: string
          description: Connector name (when scope is connector)
        duration:
          type: string
          description: Duration of the refresh operation
          example: "12.345ms"
        stats:
          $ref: '#/components/schemas/ConnectorRefreshStats'
      required:
        - success
        - message
        - scope
        - duration

    ConnectorRefreshStats:
      type: object
      description: Cache statistics after refresh
      properties:
        cached_connectors:
          type: integer
          description: Number of connectors currently cached
        hits:
          type: integer
          description: Total cache hits
        misses:
          type: integer
          description: Total cache misses
        evictions:
          type: integer
          description: Total manual evictions
        hit_rate_percent:
          type: number
          format: float
          description: Cache hit rate percentage

    ConnectorCacheStats:
      type: object
      description: Full connector cache statistics
      properties:
        cached_connectors:
          type: integer
          description: Number of connectors currently cached
        hits:
          type: integer
          description: Total cache hits
        misses:
          type: integer
          description: Total cache misses
        evictions:
          type: integer
          description: Total manual evictions
        factory_creations:
          type: integer
          description: Successful connector factory creations
        factory_failures:
          type: integer
          description: Failed connector factory creations
        connection_errors:
          type: integer
          description: Connector initialization errors
        hit_rate_percent:
          type: number
          format: float
          description: Cache hit rate percentage
        last_eviction:
          type: string
          format: date-time
          description: Timestamp of last eviction
        last_factory_create:
          type: string
          format: date-time
          description: Timestamp of last factory creation
        registry_enabled:
          type: boolean
          description: Whether the registry is enabled
        timestamp:
          type: string
          format: date-time
          description: Current timestamp

    ConnectorListResponse:
      type: object
      properties:
        connectors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              version:
                type: string
              healthy:
                type: boolean
              latency_ms:
                type: integer
              capabilities:
                type: array
                items:
                  type: string
              error:
                type: string
        count:
          type: integer

    ConnectorHealthResponse:
      type: object
      properties:
        healthy:
          type: boolean
        latency_ms:
          type: integer
        last_check:
          type: string
          format: date-time
        error:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message

    # ==========================================================================
    # Decision Chain Tracing (EU AI Act Article 12)
    # ==========================================================================

    DecisionEntry:
      type: object
      description: |
        A single decision step in an AI decision chain.
        EU AI Act Article 12 requires automatic recording of AI system events.
      required:
        - chain_id
        - request_id
        - org_id
        - tenant_id
        - decision_type
        - decision_outcome
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this decision entry
        chain_id:
          type: string
          format: uuid
          description: |
            Links related decisions in a multi-step workflow.
            All decisions in the same workflow share this ID.
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the specific request
        parent_request_id:
          type: string
          format: uuid
          description: Previous request in the chain (null for first step)
        step_number:
          type: integer
          description: Order within the chain (starts at 1)
          minimum: 1
        org_id:
          type: string
          format: uuid
          description: Organization identifier
        tenant_id:
          type: string
          description: Tenant identifier
        client_id:
          type: string
          description: Client application identifier
        user_id:
          type: string
          description: User identifier
        decision_type:
          type: string
          enum:
            - policy_enforcement
            - llm_generation
            - data_retrieval
            - human_review
            - system_action
          description: |
            Type of AI decision:
            - policy_enforcement: Static policy evaluation
            - llm_generation: LLM model invocation
            - data_retrieval: Data source query
            - human_review: HITL decision
            - system_action: Automated action
        decision_outcome:
          type: string
          enum:
            - approved
            - blocked
            - modified
            - pending_review
            - error
          description: |
            Result of the decision:
            - approved: Request allowed
            - blocked: Denied by policy
            - modified: Content filtered
            - pending_review: Awaiting human review
            - error: Processing error
        system_id:
          type: string
          description: AI system identifier (e.g., "axonflow-agent/1.0.0")
        model_provider:
          type: string
          description: LLM provider (if applicable)
        model_id:
          type: string
          description: Specific model identifier
        policies_evaluated:
          type: array
          items:
            type: string
          description: List of policy IDs that were evaluated
        policy_triggered:
          type: string
          description: Policy that caused block/modify (if any)
        risk_level:
          type: string
          enum:
            - minimal
            - limited
            - high
            - unacceptable
          description: |
            EU AI Act risk classification:
            - minimal: No significant risk
            - limited: Transparency obligations
            - high: Conformity assessment required
            - unacceptable: Prohibited AI use
        requires_human_review:
          type: boolean
          description: Whether human review is required
        processing_time_ms:
          type: integer
          description: Processing time in milliseconds
        data_sources:
          type: array
          items:
            type: string
          description: Data sources queried
        audit_hash:
          type: string
          description: SHA-256 hash for tamper detection
        created_at:
          type: string
          format: date-time
          description: When the decision was recorded

    ChainSummary:
      type: object
      description: Aggregate statistics for a decision chain
      properties:
        chain_id:
          type: string
          format: uuid
        total_steps:
          type: integer
          description: Number of decisions in the chain
        total_processing_time_ms:
          type: integer
          description: Sum of all processing times
        has_blocked:
          type: boolean
          description: Whether any decision was blocked
        requires_review:
          type: boolean
          description: Whether human review is required
        highest_risk_level:
          type: string
          enum:
            - minimal
            - limited
            - high
            - unacceptable
          description: Highest risk level in the chain
        first_decision_at:
          type: string
          format: date-time
        last_decision_at:
          type: string
          format: date-time
        decision_types:
          type: array
          items:
            type: string
          description: Unique decision types in the chain
        total_policies_applied:
          type: integer
          description: Count of unique policies evaluated

    # ==========================================================================
    # HITL Schemas (EU AI Act Article 14)
    # ==========================================================================

    HITLDecisionRequest:
      type: object
      required:
        - org_id
        - request_id
        - decision_type
        - content
      properties:
        org_id:
          type: string
        request_id:
          type: string
          format: uuid
        decision_type:
          type: string
          enum: [policy_override, content_approval, high_risk_action, data_access]
        content:
          type: object
          description: Decision content requiring review
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        expires_in_minutes:
          type: integer
          default: 60
        metadata:
          type: object
          additionalProperties: true
        notify_url:
          type: string
          format: uri
          description: |
            Optional outbound webhook URL fired asynchronously after the request
            transitions to a terminal state (approved / rejected / overridden /
            expired). Must use `https://` or `http://`. The platform signs the
            envelope with HMAC-SHA256 over the body keyed by the deployment's
            `AXONFLOW_HITL_WEBHOOK_SIGNING_KEY`, sent as
            `X-AxonFlow-Signature: sha256=<hex>`. See the HITLWebhookEnvelope
            schema and `docs.getaxonflow.com/docs/governance/hitl` for the full
            shape + verification recipe.

    HITLWebhookEnvelope:
      type: object
      description: |
        JSON body POSTed to a HITL request's `notify_url` after a terminal-state
        transition. Verify the `X-AxonFlow-Signature` header (HMAC-SHA256, hex,
        constant-time compare) against the raw body before trusting fields.
      required:
        - approval_id
        - status
        - decided_at
        - original_query
        - request_type
        - severity
      properties:
        approval_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected, overridden, expired]
        decided_by:
          type: string
          description: Reviewer email when known; reviewer ID otherwise. Empty for `expired`.
        decided_at:
          type: string
          format: date-time
        original_query:
          type: string
        request_type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        decision_envelope:
          type: object
          additionalProperties: true
          description: Decision-context bag (org_id, tenant_id, client_id, triggered_policy_id, comment, justification).

    HITLDecision:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        request_id:
          type: string
          format: uuid
        decision_type:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        content:
          type: object
        priority:
          type: string
        reviewer_id:
          type: string
        reviewer_comments:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time

