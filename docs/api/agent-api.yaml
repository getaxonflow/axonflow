              input:
                type: string
                description: The input that was tested
              matched:
                type: boolean
                description: Whether the pattern matched
              matches:
                type: array
                items:
                  type: string
                description: Captured match groups
        error:
          type: string
          description: Error message if pattern is invalid

    EffectivePoliciesResponse:
