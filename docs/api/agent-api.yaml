        prompt_tokens:
          type: integer
          description: Tokens in the prompt
        completion_tokens:
          type: integer
          description: Tokens in the completion
        total_tokens:
          type: integer
          description: Total tokens used

    AuditLLMCallResponse:
      type: object
      properties:
        success:
          type: boolean
