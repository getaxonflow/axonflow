  /mcp/resources/query:
    post:
      tags:
        - MCP Connectors
      summary: Execute MCP query (read-only)
      description: |
        Execute a read-only query via an MCP connector.

        This follows the MCP Resource pattern for data retrieval.
        For write operations, use `/mcp/tools/execute`.

        ## Audit Logging

        All MCP queries are automatically logged to the `mcp_query_audits` table with:
        - **Request phase**: SQLi detection results, PII blocking decisions
        - **Response phase**: PII redaction details, redacted field paths
        - **Exfiltration checks**: Row counts, volume limit violations
        - **Result**: Success/failure, error messages, duration

        Each audit entry includes `audit_id` for correlation with SDK `PolicyInfo`.
        Statement content is stored as SHA256 hash for privacy.
      operationId: mcpQuery
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPQueryRequest'
            examples:
              sqlQuery:
                summary: SQL query
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  connector: "postgres_main"
                  statement: "SELECT * FROM orders WHERE status = $1"
                  parameters:
                    "1": "completed"
                  limit: 100
                  timeout: "10s"
              amadeusSearch:
                summary: Flight search
                value:
                  client_id: "travel-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  connector: "amadeus"
                  operation: "search_flights"
                  parameters:
                    origin: "NYC"
                    destination: "LAX"
                    departure_date: "2025-01-20"
                  timeout: "15s"
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPQueryResponse'
              example:
                success: true
                connector: "amadeus"
                data:
                  - flight_number: "UA123"
                    departure: "2025-01-20T08:00:00Z"
                    arrival: "2025-01-20T11:00:00Z"
                    price: 299.99
                row_count: 5
                duration_ms: 450
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp/tools/execute:
    post:
      tags:
        - MCP Connectors
      summary: Execute MCP command (write)
      description: |
        Execute a write command via an MCP connector.

        This follows the MCP Tool pattern for data modification.
        For read operations, use `/mcp/resources/query`.

        ## Audit Logging

        All MCP execute operations are automatically logged to the `mcp_query_audits` table with:
        - **Request phase**: SQLi detection results, dangerous operation blocking
        - **Result**: Rows affected, success/failure, error messages, duration

        Each audit entry includes `audit_id` for correlation. Operation type (INSERT, UPDATE, DELETE)
        is stored in the `operation` field.
      operationId: mcpExecute
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPExecuteRequest'
            example:
              client_id: "order-service"
              user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              connector: "postgres_main"
              action: "UPDATE"
              statement: "UPDATE orders SET status = $1 WHERE id = $2"
              parameters:
                "1": "shipped"
                "2": "ord-12345"
              timeout: "5s"
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPExecuteResponse'
              example:
                success: true
                connector: "postgres_main"
                rows_affected: 1
                duration_ms: 15
                message: "Update successful"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/mcp/check-input:
    post:
      tags:
        - MCP Connectors
      summary: Validate MCP input against policies
      description: |
        Validate an MCP request (query or command) against configured policies **without executing it**.

        This endpoint enables external orchestrators (LangGraph, CrewAI, custom pipelines) to use
        AxonFlow as a policy gate while managing MCP connector execution themselves.

        ## Policy Evaluation

        The following policies are evaluated in order:
        1. **Dynamic policies** (if enabled): Rate limits, budgets, time-access, role-access via Orchestrator
        2. **Static policies**: SQL injection detection, dangerous query blocking, PII detection

        If any policy blocks the request, the response returns `allowed: false` with a `block_reason`.

        ## When to Use

        Use `check-input` + `check-output` when your orchestrator manages MCP execution natively.
        Use `/mcp/resources/query` or `/mcp/tools/execute` when you want AxonFlow to handle both
        policy enforcement and connector execution.

        ## Audit Logging

        All check-input evaluations are logged to the `mcp_query_audits` table with
        `operation: "check-input"` for compliance tracking. Audit entries include
        `parameters_hash` (SHA-256) and `parameter_count` for forensic analysis.
      operationId: mcpCheckInput
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPCheckInputRequest'
            examples:
              cleanQuery:
                summary: Clean SQL query (passes all policies)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  statement: "SELECT name, email FROM users WHERE id = $1"
                  parameters:
                    "1": "usr-001"
                  operation: "query"
              sqliAttempt:
                summary: SQL injection attempt (blocked)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  statement: "SELECT * FROM users; DROP TABLE users--"
      responses:
        '200':
          description: Input passed all policy checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckInputResponse'
              example:
                allowed: true
                policies_evaluated: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Input blocked by policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckInputResponse'
              example:
                allowed: false
                block_reason: "SQL injection detected in statement"
                policies_evaluated: 3
                policy_info:
                  policies_evaluated: 3
                  blocked: true
                  block_reason: "SQL injection detected in statement"
        '415':
          description: |
            Unregistered `content_type` (ADR-056). The request named a
            content type that no registered detector handles. A canonical
            blocked audit row tagged `content_type_unsupported` is written
            before the error returns — the request is treated as blocked,
            not silently skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dynamic policy evaluator unavailable (only when graceful degradation is disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mcp/check-output:
    post:
      tags:
        - MCP Connectors
      summary: Validate MCP output against policies
      description: |
        Validate MCP response data against configured policies **without having executed the query
        through AxonFlow**.

        This endpoint enables external orchestrators to apply AxonFlow's output-side policy
        enforcement (PII redaction, exfiltration limits, SQLi response scanning) to data they
        fetched from MCP connectors independently.

        ## Policy Evaluation

        The following checks are applied in order:
        1. **SQLi response scanning**: Detects SQL injection artifacts in response data
        2. **Static response policies**: PII detection and redaction (SSN, credit card, Aadhaar, etc.)
        3. **Exfiltration limits** (query-style only): Row count and byte size limits

        If PII is detected, the response includes `redacted_data` with masked values.
        If exfiltration limits are exceeded, the response returns `allowed: false`.

        ## Query vs Execute Responses

        - **Query responses** (`response_data`): Full policy evaluation including exfiltration checks
        - **Execute responses** (`message`): SQLi scanning and PII checks only (no exfiltration limits)

        ## Audit Logging

        All check-output evaluations are logged to the `mcp_query_audits` table with
        `operation: "check-output"` for compliance tracking.
      operationId: mcpCheckOutput
      parameters:
        - $ref: '#/components/parameters/AxonflowClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPCheckOutputRequest'
            examples:
              cleanData:
                summary: Clean query response (passes all policies)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  response_data:
                    - id: 1
                      name: "Alice Johnson"
                      department: "Engineering"
                  row_count: 1
              piiData:
                summary: Response containing PII (redacted)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  response_data:
                    - id: 1
                      name: "Alice Johnson"
                      ssn: "123-45-6789"
                  row_count: 1
              executeResponse:
                summary: Execute-style response (message only)
                value:
                  client_id: "analytics-app"
                  user_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tenant_id: "tenant-123"
                  connector_type: "postgres"
                  message: "3 rows updated"
                  metadata:
                    query: "UPDATE users SET status = 'active' WHERE region = 'us'"
      responses:
        '200':
          description: Output passed all policy checks (may include redacted data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckOutputResponse'
              examples:
                clean:
                  summary: No issues found
                  value:
                    allowed: true
                    policies_evaluated: 8
                redacted:
                  summary: PII detected and redacted
                  value:
                    allowed: true
                    redacted_data:
                      - id: 1
                        name: "Alice Johnson"
                        ssn: "XXX-XX-6789"
                    policies_evaluated: 8
                    policy_info:
                      policies_evaluated: 8
                      blocked: false
                      redactions_applied: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Output blocked by policy (exfiltration limit exceeded or SQLi detected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCheckOutputResponse'
              example:
                allowed: false
                block_reason: "Exfiltration limit exceeded: row_count 15000 > limit 10000"
                policies_evaluated: 3
                exfiltration_info:
                  exceeded: true
                  limit_type: rows
                  rows_returned: 15000
                  row_limit: 10000
                  bytes_returned: 5242880
                  byte_limit: 10485760

  /mcp/health:
    get:
      tags:
        - MCP Connectors
      summary: Overall MCP health
      description: Returns aggregate health status for all MCP connectors
      operationId: getMCPHealth
      responses:
        '200':
          description: MCP system health
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    description: True if all connectors are healthy
                  total_connectors:
                    type: integer
                  healthy_count:
                    type: integer
                  unhealthy_count:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
              example:
                healthy: true
                total_connectors: 3
                healthy_count: 3
                unhealthy_count: 0
                timestamp: "2025-01-15T10:30:00Z"

  # ==========================================================================
  # MCP Server (Streamable HTTP, spec 2025-06-18)
  # ==========================================================================

  /api/v1/mcp-server:
    post:
      tags:
        - MCP Server
      summary: MCP JSON-RPC endpoint
      description: |
        Single Streamable-HTTP endpoint for the built-in MCP server. Accepts
        MCP JSON-RPC 2.0 messages (`initialize`, `tools/list`, `tools/call`,
        …) and returns JSON-RPC responses. Governance tools exposed:
        `check_policy`, `check_output`, `audit_tool_call`, `list_policies`,
        `get_policy_stats`, `explain_decision`, plus Pro-tier tools.

        Authentication: HTTP Basic `org:license-key` on every request.
        Tier rate limits (Community SaaS) are reported **inside** the
        JSON-RPC result (`result.content[0].text`), not as an HTTP 429.

        The JSON-RPC `check_output` tool result DOES include
        `redacted_message` — unlike the standalone REST
        `/api/v1/mcp/check-output` endpoint (#2870).
      operationId: mcpServerJSONRPC
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC 2.0 message
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  description: Request ID (absent for notifications)
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: JSON-RPC response (errors are carried in the JSON-RPC error member)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - MCP Server
      summary: Not supported (405)
      description: |
        The MCP server does not offer a server-initiated SSE stream; GET
        always returns 405 Method Not Allowed.
      operationId: mcpServerGet
      responses:
        '405':
          description: Method not allowed
    delete:
      tags:
        - MCP Server
      summary: Terminate MCP session
      description: Terminates the MCP session identified by the `Mcp-Session-Id` header.
      operationId: mcpServerDelete
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Session terminated
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # OTLP Ingest (Enterprise; community returns 501)
  # ==========================================================================

  /v1/metrics:
    post:
      tags:
        - OTLP Ingest
      summary: OTLP metrics ingest
      description: |
        OTLP/HTTP `ExportMetricsServiceRequest` ingest for Claude Code
        telemetry. Content types: `application/x-protobuf` (default when
        the header is empty), `application/protobuf`, or `application/json`;
        anything else returns **415**. Success returns 200 with an OTLP
        `ExportMetricsServiceResponse` in the request's content type.

        **Enterprise only** — community builds return **501** with
        `{"error": {"code", "message"}}`. Org/tenant comes from the
        authenticated license (Basic auth), never from OTLP resource
        attributes.
      operationId: otlpIngestMetrics
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OTLP export response (matching request content type)
        '400':
          description: Malformed OTLP payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: Unsupported Content-Type
        '501':
          description: Community build — OTLP ingest is an Enterprise feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'

  /v1/logs:
    post:
      tags:
        - OTLP Ingest
      summary: OTLP logs ingest
      description: |
        OTLP/HTTP `ExportLogsServiceRequest` ingest for Claude Code
        telemetry. Same content-type, auth, edition, and error semantics as
        `POST /v1/metrics`.
      operationId: otlpIngestLogs
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OTLP export response (matching request content type)
        '400':
          description: Malformed OTLP payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: Unsupported Content-Type
        '501':
          description: Community build — OTLP ingest is an Enterprise feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'

  # ==========================================================================
  # Connector Cache Management (ADR-007)
  # ==========================================================================

  /api/v1/connectors/refresh:
    post:
      tags:
        - MCP Connectors
      summary: Refresh all connector caches
      description: |
        Invalidates and refreshes all cached connector instances across all tenants.
        Use this after bulk configuration changes or deployments.

        **Performance Impact:** This operation clears all cached connectors.
        The next request for each connector will incur factory creation overhead.

        ⚠️ **Ops/internal endpoint — currently unauthenticated** (#2883):
        the connector refresh + cache-stats routes are registered without
        the auth middleware. Deploy them behind network-level controls
        until #2883 lands.
      operationId: refreshAllConnectors
      responses:
        '200':
          description: All connectors refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRefreshResponse'
              example:
                success: true
                message: "All connector caches refreshed"
                scope: "all"
                duration: "12.345ms"
                stats:
                  cached_connectors: 0
                  hits: 12345
                  misses: 234
                  evictions: 15
                  hit_rate_percent: 98.1
        '503':
          description: Registry not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "TenantConnectorRegistry not initialized"

  /api/v1/connectors/refresh/{tenant_id}:
    post:
      tags:
        - MCP Connectors
      summary: Refresh tenant connector caches
      description: |
        Invalidates and refreshes all cached connector instances for a specific tenant.
        Use this after updating a tenant's connector configuration.
      operationId: refreshTenantConnectors
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: The tenant ID whose connectors should be refreshed
          schema:
            type: string
          example: "tenant-123"
      responses:
        '200':
          description: Tenant connectors refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRefreshResponse'
              example:
                success: true
                message: "Tenant connector caches refreshed"
                scope: "tenant"
                tenant_id: "tenant-123"
                duration: "2.456ms"
                stats:
                  cached_connectors: 12
                  evictions: 3
        '400':
          description: Missing tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Registry not initialized

  /api/v1/connectors/refresh/{tenant_id}/{connector_name}:
    post:
      tags:
        - MCP Connectors
      summary: Refresh specific connector cache
      description: |
        Invalidates and refreshes a specific connector instance for a tenant.
        Use this after updating a single connector's credentials or configuration.
      operationId: refreshConnector
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: The tenant ID
          schema:
            type: string
          example: "tenant-123"
        - name: connector_name
          in: path
          required: true
          description: The connector name to refresh
          schema:
            type: string
          example: "customer-db"
      responses:
        '200':
          description: Connector refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRefreshResponse'
              example:
                success: true
                message: "Connector cache refreshed"
                scope: "connector"
                tenant_id: "tenant-123"
                connector: "customer-db"
                duration: "0.789ms"
        '400':
          description: Missing required parameters
        '503':
          description: Registry not initialized

  /api/v1/connectors/cache/stats:
    get:
      tags:
        - MCP Connectors
      summary: Get connector cache statistics
      description: |
        Returns cache performance statistics including hit rate, miss count,
        evictions, and factory operation counts. Useful for monitoring cache health.
      operationId: getConnectorCacheStats
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCacheStats'
              example:
                cached_connectors: 15
                hits: 12345
                misses: 234
                evictions: 12
                factory_creations: 246
                factory_failures: 0
                connection_errors: 2
                hit_rate_percent: 98.1
                last_eviction: "2025-12-09T10:30:00Z"
                last_factory_create: "2025-12-09T14:20:00Z"
                registry_enabled: true
                timestamp: "2025-12-09T14:25:00Z"
        '503':
          description: Registry not initialized

  # ==========================================================================
  # HITL - Human-in-the-Loop (EU AI Act Article 14)
  # ==========================================================================

  /api/v1/hitl/queue:
    post:
      tags:
        - HITL
      summary: Create HITL approval request
      description: |
        Route a high-risk AI decision for human review.
        EU AI Act Article 14 requires human oversight for high-risk AI systems.

        Requires both `X-Org-ID` and `X-Tenant-ID` headers (stamped by the
        auth middleware) — **400** when either is missing.

        **Enterprise only** — community builds expose only
        `GET /api/v1/hitl/status`.
      operationId: createHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLCreateRequest'
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/HITLApprovalRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            HITL approvals are disabled for the deployment's license tier
            (e.g. an Enterprise build running a Community-tier license).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Community SaaS pending-approvals cap reached for the tenant.
            Not returned on self-hosted or Enterprise deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - HITL
      summary: List HITL approval requests
      description: |
        Retrieve approval requests, filtered and paginated. Tenant scoping
        comes from the authenticated request context (RLS), not a query
        parameter.
      operationId: listHITLDecisions
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: status
          in: query
          description: Comma-separated status filter (e.g. `pending` or `pending,approved`)
          schema:
            type: string
            example: "pending"
        - name: severity
          in: query
          description: Comma-separated severity filter
          schema:
            type: string
            example: "high,critical"
        - name: policy_id
          in: query
          schema:
            type: string
        - name: client_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: order_by
          in: query
          schema:
            type: string
        - name: order_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of approval requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HITLApprovalRequest'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        format: int64
                      limit:
                        type: integer
                      offset:
                        type: integer

  /api/v1/hitl/queue/{id}:
    get:
      tags:
        - HITL
      summary: Get HITL approval request
      operationId: getHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          description: The request UUID (`request_id`)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approval request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/HITLApprovalRequest'
        '400':
          description: Invalid request ID (not a UUID)
        '404':
          description: Request not found

  /api/v1/hitl/queue/{id}/approve:
    post:
      tags:
        - HITL
      summary: Approve HITL request
      description: Approve a pending request to allow AI execution
      operationId: approveHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLReviewInput'
      responses:
        '200':
          description: Request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "approved"
        '400':
          description: Invalid request ID or JSON body
        '404':
          description: Request not found
        '409':
          description: Conflict — request is not pending (already reviewed or expired)

  /api/v1/hitl/queue/{id}/reject:
    post:
      tags:
        - HITL
      summary: Reject HITL request
      description: Reject a pending request to block AI execution
      operationId: rejectHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLReviewInput'
      responses:
        '200':
          description: Request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "rejected"
        '400':
          description: Invalid request ID or JSON body
        '404':
          description: Request not found
        '409':
          description: Conflict — request is not pending

  /api/v1/hitl/queue/{id}/override:
    post:
      tags:
        - HITL
      summary: Override HITL request
      description: |
        Record an authorized override of a pending request — the caller takes
        responsibility for letting the action proceed outside the normal
        approve/reject flow. Requires a justification for the audit trail.
      operationId: overrideHITLDecision
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                justification:
                  type: string
                  description: Required by the service — missing justification returns 400
                authorized_by_id:
                  type: string
                authorized_by_email:
                  type: string
                authorized_by_role:
                  type: string
      responses:
        '200':
          description: Request overridden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "overridden"
        '400':
          description: Invalid request ID/JSON, or missing justification
        '404':
          description: Request not found
        '409':
          description: Conflict — another reviewer decided this request first (lost race)

  /api/v1/hitl/queue/{id}/history:
    get:
      tags:
        - HITL
      summary: Get HITL request audit history
      description: Immutable audit-trail entries for a request (create/approve/reject/override/expire actions).
      operationId: getHITLDecisionHistory
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HITLHistoryEntry'
        '400':
          description: Invalid request ID

  /api/v1/hitl/stats:
    get:
      tags:
        - HITL
      summary: Pending-queue statistics
      description: |
        Dashboard summary of the pending queue for the caller's org.
        Requires the `X-Org-ID` header (400 when missing).
      operationId: getHITLStats
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      responses:
        '200':
          description: Pending statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      total_pending:
                        type: integer
                        format: int64
                      high_priority:
                        type: integer
                        format: int64
                      critical_priority:
                        type: integer
                        format: int64
                      oldest_pending_hours:
                        type: number
        '400':
          description: Missing X-Org-ID header

  /api/v1/hitl/status:
    get:
      tags:
        - HITL
      summary: HITL feature status
      description: |
        Reports whether HITL is enabled and which features are available.
        This is the **only** HITL endpoint present in community builds
        (returns `enabled: false`, `mode: "community"`); Enterprise builds
        return `enabled: true`, `mode: "enterprise"` plus a feature map
        (queue, approve_reject, override, expiration, audit_history,
        pending_summary, notify_url, idempotency_key).
      operationId: getHITLStatus
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      responses:
        '200':
          description: Feature status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  mode:
                    type: string
                    enum: [community, enterprise]
                  features:
                    type: object
                    additionalProperties:
                      type: boolean

  /api/v1/hitl/expire:
    post:
      tags:
        - HITL
      summary: Expire stale pending requests
      description: |
        Sweeps pending requests past their `expires_at` into the `expired`
        state and returns the count. Intended for schedulers/ops automation;
        the platform also expires lazily.
      operationId: expireHITLDecisions
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      expired_count:
                        type: integer

  # ==========================================================================
  # Circuit Breaker (EU AI Act Article 14)
  # ==========================================================================

  /api/v1/circuit-breaker/trip:
    post:
      tags:
        - Circuit Breaker
      summary: Trip circuit breaker (emergency stop)
      description: |
        Immediately halt matching AI operations for the organization
        (EU AI Act Article 14). Also exposed as the alias
        `POST /api/v1/emergency-stop`.

        Identity comes from headers stamped by the auth middleware:
        `X-Org-ID` (falls back to `X-Tenant-ID`) selects the org;
        `X-User-ID` is **required** for the Article 14 audit trail
        (400 when missing). `X-User-Email` is recorded when present.

        **Enterprise only** — community builds register no circuit-breaker
        routes (404).
      operationId: tripCircuitBreaker
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerTripRequest'
      responses:
        '201':
          description: Circuit tripped — matching requests are now blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      circuit_id:
                        type: string
                      state:
                        type: string
                      scope:
                        type: string
                      scope_id:
                        type: string
                      tripped_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                      message:
                        type: string
        '400':
          description: Missing X-Org-ID/X-User-ID header, invalid JSON, invalid scope, or missing scope_id for a non-global scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/circuit-breaker/reset:
    post:
      tags:
        - Circuit Breaker
      summary: Reset circuit breaker (release emergency stop)
      description: |
        Release an emergency stop and resume normal operations. Also exposed
        as the alias `POST /api/v1/emergency-stop/release`. Requires
        `X-Org-ID` (or `X-Tenant-ID`) and `X-User-ID` headers (400 when
        missing). **Enterprise only.**
      operationId: resetCircuitBreaker
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerResetRequest'
      responses:
        '200':
          description: Circuit reset — normal operations resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      scope:
                        type: string
                      scope_id:
                        type: string
                      state:
                        type: string
                        example: "closed"
                      message:
                        type: string
        '400':
          description: Missing X-Org-ID/X-User-ID header or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/circuit-breaker/check:
    post:
      tags:
        - Circuit Breaker
      summary: Check whether a request would be allowed
      description: |
        Evaluates the caller's scope hierarchy (global → tenant → client →
        policy) and reports whether an open circuit would block the request.
        Read-only; does not mutate circuit state. **Enterprise only.**
      operationId: checkCircuitBreaker
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                client_id:
                  type: string
                policy_id:
                  type: string
      responses:
        '200':
          description: Check result (allowed, or blocked with the tripping circuit's details)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                      circuit_id:
                        type: string
                        description: Present only when blocked
                      scope:
                        type: string
                      scope_id:
                        type: string
                      reason:
                        type: string
                      tripped_by:
                        type: string
                      tripped_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                      comment:
                        type: string
        '400':
          description: Missing X-Org-ID header or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/emergency-stop:
    post:
      tags:
        - Circuit Breaker
      summary: Emergency stop (alias of circuit-breaker trip)
      description: |
        Clearer Article 14 naming for `POST /api/v1/circuit-breaker/trip` —
        identical handler, request body, and responses. **Enterprise only.**
      operationId: emergencyStop
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerTripRequest'
      responses:
        '201':
          description: Emergency stop activated (see the trip endpoint for the body shape)
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/emergency-stop/release:
    post:
      tags:
        - Circuit Breaker
      summary: Release emergency stop (alias of circuit-breaker reset)
      description: |
        Clearer Article 14 naming for `POST /api/v1/circuit-breaker/reset` —
        identical handler, request body, and responses. **Enterprise only.**
      operationId: emergencyStopRelease
      parameters:
        - $ref: '#/components/parameters/LicenseKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerResetRequest'
      responses:
        '200':
          description: Emergency stop released (see the reset endpoint for the body shape)
        '400':
          $ref: '#/components/responses/BadRequest'

