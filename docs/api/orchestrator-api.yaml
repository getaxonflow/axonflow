  # ============================================
  # Workflow Control Plane Endpoints
  # ============================================

  /api/v1/workflows:
    post:
      tags:
        - Workflow Control Plane
      summary: Create a workflow
      description: |
        Register a new workflow from an external orchestrator (LangChain, LangGraph, CrewAI).
        Returns a workflow_id to use for subsequent step gate checks.
      operationId: createControlPlaneWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
            example:
              workflow_name: "code-review-pipeline"
              source: "langgraph"
              total_steps: 3
              metadata:
                environment: "production"
                team: "engineering"
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
              example:
                workflow_id: "wf_abc123"
                workflow_name: "code-review-pipeline"
                status: "in_progress"
                started_at: "2026-01-17T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - Workflow Control Plane
      summary: List workflows
      description: List workflows with optional filters
      operationId: listControlPlaneWorkflows
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [in_progress, completed, aborted, failed]
        - name: source
          in: query
          description: Filter by source
          schema:
            type: string
            enum: [langgraph, langchain, crewai, external]
        - name: limit
          in: query
          description: Maximum number of workflows to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of workflows to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'

  /api/v1/workflows/{workflow_id}:
    get:
      tags:
        - Workflow Control Plane
      summary: Get workflow status
      description: Get the current status of a workflow including all step decisions
      operationId: getControlPlaneWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: "wf_abc123"
      responses:
        '200':
          description: Workflow status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflow_id}/steps/{step_id}/gate:
    post:
      tags:
        - Workflow Control Plane
      summary: Check step gate
      description: |
        Check if a workflow step is allowed to proceed.
        Returns a decision (allow/block/require_approval) based on policy evaluation.

        Call this BEFORE executing each step in your external orchestrator.
      operationId: checkStepGate
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: "wf_abc123"
        - name: step_id
          in: path
          required: true
          description: Step ID (unique within workflow)
          schema:
            type: string
          example: "step-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepGateRequest'
            example:
              step_name: "Generate Code"
              step_type: "llm_call"
              model: "gpt-4"
              provider: "openai"
              step_input:
                prompt: "Write a function to sort a list"
      responses:
        '200':
          description: Gate decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepGateResponse'
              examples:
                allowed:
                  summary: Step allowed
                  value:
                    decision: "allow"
                    step_id: "step-1"
                    decision_id: "dec_xyz789"
                blocked:
                  summary: Step blocked
                  value:
                    decision: "block"
                    step_id: "step-1"
                    reason: "GPT-4 not allowed in production workflows"
                    policy_ids: ["policy_gpt4_block"]
                approval_required:
                  summary: Approval required
                  value:
                    decision: "require_approval"
                    step_id: "step-1"
                    reason: "Human approval required for deployment steps"
                    approval_url: "https://portal.axonflow.com/approvals/abc123"
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflow_id}/steps/{step_id}/complete:
    post:
      tags:
        - Workflow Control Plane
      summary: Mark step completed
      description: Mark a workflow step as completed after successful execution
      operationId: markStepCompleted
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
        - name: step_id
          in: path
          required: true
          description: Step ID
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkStepCompletedRequest'
            example:
              output:
                code: "def sort_list(items): return sorted(items)"
              tokens_in: 150
              tokens_out: 45
              cost_usd: 0.0023
      responses:
        '204':
          description: Step marked completed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflow_id}/complete:
    post:
      tags:
        - Workflow Control Plane
      summary: Complete workflow
      description: Mark the workflow as completed
      operationId: completeControlPlaneWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
      responses:
        '200':
          description: Workflow completed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflow_id}/abort:
    post:
      tags:
        - Workflow Control Plane
      summary: Abort workflow
      description: Abort the workflow with an optional reason
      operationId: abortControlPlaneWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for aborting
            example:
              reason: "Step blocked by policy"
      responses:
        '200':
          description: Workflow aborted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflow_id}/resume:
    post:
      tags:
        - Workflow Control Plane
      summary: Resume workflow
      description: Resume a workflow after approval (Enterprise feature)
      operationId: resumeControlPlaneWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
      responses:
        '200':
          description: Workflow resumed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflow-control/{workflowId}/steps/{stepId}/approve:
    post:
      tags:
        - Workflow Control Plane
      summary: Approve a pending workflow step
      description: |
        Approve a workflow step that is waiting for human approval.
        This allows the workflow to proceed past the approval gate.
      operationId: approveWorkflowStep
      parameters:
        - name: workflowId
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: "wf_abc123"
        - name: stepId
          in: path
          required: true
          description: Step ID awaiting approval
          schema:
            type: string
          example: "step-2"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  description: Optional approval comment
                approved_by:
                  type: string
                  description: User ID of the approver
            example:
              comment: "Approved after reviewing output"
              approved_by: "user-456"
      responses:
        '200':
          description: Step approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
              example:
                workflow_id: "wf_abc123"
                step_id: "step-2"
                decision: "approved"
                decided_by: "user-456"
                decided_at: "2026-01-17T10:05:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Step is not in a pending approval state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Step step-2 is not awaiting approval"

  /api/v1/workflow-control/{workflowId}/steps/{stepId}/reject:
    post:
      tags:
        - Workflow Control Plane
      summary: Reject a pending workflow step
      description: |
        Reject a workflow step that is waiting for human approval.
        This blocks the step and may abort the workflow depending on configuration.
      operationId: rejectWorkflowStep
      parameters:
        - name: workflowId
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: "wf_abc123"
        - name: stepId
          in: path
          required: true
          description: Step ID awaiting approval
          schema:
            type: string
          example: "step-2"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for rejection
                rejected_by:
                  type: string
                  description: User ID of the rejector
            example:
              reason: "Output contains PII that was not redacted"
              rejected_by: "user-456"
      responses:
        '200':
          description: Step rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
              example:
                workflow_id: "wf_abc123"
                step_id: "step-2"
                decision: "rejected"
                reason: "Output contains PII that was not redacted"
                decided_by: "user-456"
                decided_at: "2026-01-17T10:05:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Step is not in a pending approval state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Step step-2 is not awaiting approval"

  /api/v1/workflow-control/pending-approvals:
    get:
      tags:
        - Workflow Control Plane
      summary: List pending approvals
      description: |
        List all workflow steps that are currently awaiting human approval.
        Returns steps across all active workflows for the current tenant.
      operationId: listPendingApprovals
      parameters:
        - name: workflow_id
          in: query
          description: Filter by workflow ID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of pending approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApprovalsResponse'
              example:
                approvals:
                  - workflow_id: "wf_abc123"
                    workflow_name: "code-review-pipeline"
                    step_id: "step-2"
                    step_name: "Deploy to Production"
                    step_type: "action"
                    requested_at: "2026-01-17T10:00:00Z"
                    reason: "Human approval required for deployment steps"
                  - workflow_id: "wf_def456"
                    workflow_name: "data-processing"
                    step_id: "step-1"
                    step_name: "Export Customer Data"
                    step_type: "connector_call"
                    requested_at: "2026-01-17T09:45:00Z"
                    reason: "Customer data export requires approval"
                total: 2

