  # ============================================================================
  # Webhook Subscriptions
  # ============================================================================

  /api/v1/webhooks:
    post:
      tags:
        - Webhooks
      summary: Create webhook subscription
      description: |
        Create a new webhook subscription to receive real-time event notifications.
        Events are delivered as HTTP POST requests to the specified URL with HMAC-SHA256
        signatures when a secret is provided.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            example:
              url: "https://example.com/webhooks/axonflow"
              events:
                - "policy.violation"
                - "workflow.completed"
                - "budget.exceeded"
              secret: "whsec_abc123secretkey"
              active: true
      responses:
        '201':
          description: Webhook subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
              example:
                id: "wh_abc123"
                url: "https://example.com/webhooks/axonflow"
                events:
                  - "policy.violation"
                  - "workflow.completed"
                  - "budget.exceeded"
                active: true
                tenant_id: "tenant-1"
                org_id: "org-1"
                secret: "whsec_abc123secretkey"
                created_at: "2026-01-17T10:00:00Z"
                updated_at: "2026-01-17T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - Webhooks
      summary: List webhook subscriptions
      description: List all webhook subscriptions for the current tenant
      operationId: listWebhooks
      responses:
        '200':
          description: List of webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhookSubscriptionsResponse'
              example:
                subscriptions:
                  - id: "wh_abc123"
                    url: "https://example.com/webhooks/axonflow"
                    events:
                      - "policy.violation"
                      - "workflow.completed"
                    active: true
                    tenant_id: "tenant-1"
                    org_id: "org-1"
                    created_at: "2026-01-17T10:00:00Z"
                    updated_at: "2026-01-17T10:00:00Z"
                total: 1

  /api/v1/webhooks/{id}:
    get:
      tags:
        - Webhooks
      summary: Get webhook subscription
      description: Retrieve a specific webhook subscription by ID
      operationId: getWebhook
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook subscription ID
          schema:
            type: string
          example: "wh_abc123"
      responses:
        '200':
          description: Webhook subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Webhooks
      summary: Update webhook subscription
      description: Update an existing webhook subscription
      operationId: updateWebhook
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook subscription ID
          schema:
            type: string
          example: "wh_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
            example:
              url: "https://example.com/webhooks/axonflow-v2"
              events:
                - "policy.violation"
                - "workflow.completed"
                - "workflow.failed"
              active: true
      responses:
        '200':
          description: Webhook subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Webhooks
      summary: Delete webhook subscription
      description: Delete a webhook subscription. Events will no longer be delivered to this URL.
      operationId: deleteWebhook
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook subscription ID
          schema:
            type: string
          example: "wh_abc123"
      responses:
        '204':
          description: Webhook subscription deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Real-time Streaming (SSE)
  # ============================================================================

  /api/v1/unified/executions/{id}/stream:
    get:
      tags:
        - Unified Executions
      summary: Stream execution status via SSE
      description: |
        Server-Sent Events stream for real-time execution status updates.
        Streams events for both MAP plan executions and WCP workflow executions.
        Community: Limited to 5 concurrent connections per tenant.
        Enterprise: Unlimited concurrent connections.
      operationId: streamExecutionStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of execution events
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          description: Too many concurrent connections (Community edition limit)

  # ============================================================================
  # Media Governance (Enterprise)
  # ============================================================================

  /api/v1/media/analyzers:
    get:
      summary: List registered media analyzers
      description: Returns all registered media analyzers and their status. Enterprise only.
      operationId: listMediaAnalyzers
      tags:
        - Media Governance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of analyzers
          content:
            application/json:
              schema:
                type: object
                properties:
                  analyzers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAnalyzerInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/media/analyzers/{name}/health:
    get:
      summary: Check analyzer health
      description: Returns health status for a specific media analyzer. Enterprise only.
      operationId: checkMediaAnalyzerHealth
      tags:
        - Media Governance
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Analyzer name
      responses:
        '200':
          description: Analyzer health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  healthy:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Analyzer not found

  /api/v1/media/analyze:
    post:
      summary: Standalone media analysis
      description: |
        Analyze media content without routing to an LLM provider.
        Useful for pre-screening images before sending to LLM workflows.
        Enterprise only.
      operationId: analyzeMedia
      tags:
        - Media Governance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - media
              properties:
                media:
                  type: array
                  items:
                    $ref: '#/components/schemas/MediaContentRequest'
                  maxItems: 10
      responses:
        '200':
          description: Media analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAnalysisResponse'
        '400':
          description: Invalid media content
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # Media Governance Configuration
  # ============================================================================

  /api/v1/media-governance/config:
    get:
      tags: [Media Governance]
      summary: Get media governance configuration
      description: Returns the media governance configuration for the current tenant.
      operationId: getMediaGovernanceConfig
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Media governance configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Media Governance]
      summary: Update media governance configuration
      description: |
        Updates media governance configuration. Enterprise tier only.
        Community and Evaluation tiers receive a 403 TIER_RESTRICTED response.
        To toggle system media policies on/off (available to all tiers), use the
        Dynamic Policy API (/api/v1/dynamic-policies) instead.
      operationId: updateMediaGovernanceConfig
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaGovernanceConfigUpdate'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/media-governance/status:
    get:
      tags: [Media Governance]
      summary: Get media governance feature status
      description: Returns the media governance feature availability for the current license tier.
      operationId: getMediaGovernanceStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Media governance status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          properties:
            policy_engine:
              type: boolean
            llm_router:
              type: boolean
            response_processor:
              type: boolean
            audit_logger:
              type: boolean
            workflow_engine:
              type: boolean
            planning_engine:
              type: boolean
            result_aggregator:
              type: boolean
        features:
          type: object
          properties:
            multi_agent_planning:
              type: boolean

    PlanStatusResponse:
      type: object
      description: |
        Unified execution status for MAP plans. Provides step-level progress tracking,
        duration, and cost information. Compatible with the unified ExecutionStatus schema.
      required:
        - plan_id
        - status
        - query
        - domain
        - total_steps
      properties:
        plan_id:
          type: string
          description: Original plan identifier
          example: "plan_1705312200_abc123"
        execution_id:
          type: string
          description: Unified execution ID for cross-system tracking
          example: "plan_xyz789"
        status:
          type: string
          enum: [pending, executing, completed, failed, expired, cancelled, aborted, awaiting_approval]
          description: Current execution status
          example: "executing"
        query:
          type: string
          description: Original user query that created the plan
          example: "Research competitor pricing strategies"
        domain:
          type: string
          description: Domain classification of the plan
          example: "finance"
        total_steps:
          type: integer
          description: Total number of steps in the plan
          example: 3
        completed_steps:
          type: integer
          description: Number of completed steps
          example: 1
        progress_percent:
          type: number
          format: float
          description: Completion percentage (0-100)
          example: 33.33
        duration:
          type: string
          description: Human-readable elapsed duration
          example: "15s"
        estimated_cost_usd:
          type: number
          format: float
          description: Estimated total cost in USD
          example: 0.05
        actual_cost_usd:
          type: number
          format: float
          description: Actual cost incurred so far in USD
          example: 0.042
        created_at:
          type: string
          format: date-time
          description: When the plan was created
        started_at:
          type: string
          format: date-time
          description: When execution started
        completed_at:
          type: string
          format: date-time
          description: When execution completed (if terminal)
        expires_at:
          type: string
          format: date-time
          description: When the plan expires
        error:
          type: string
          description: Error message if status is failed
        steps:
          type: array
          description: Detailed status of each step
          items:
            $ref: '#/components/schemas/StepStatus'
        metadata:
          type: object
          description: Additional plan metadata
          additionalProperties: true

    StepStatus:
      type: object
      description: Status of an individual execution step
      required:
        - step_id
        - step_index
        - step_name
        - status
      properties:
        step_id:
          type: string
          description: Unique step identifier
          example: "step_0_analyze"
        step_index:
          type: integer
          description: Position in the execution sequence (0-based)
          example: 0
        step_name:
          type: string
          description: Human-readable step name
          example: "analyze"
        step_type:
          type: string
          enum: [llm_call, tool_call, connector_call, human_task, synthesis, action, gate]
          description: Type of step operation
          example: "llm_call"
        status:
          type: string
          enum: [pending, running, completed, failed, skipped, blocked, approval]
          description: Current step status
          example: "completed"
        duration:
          type: string
          description: Human-readable step duration
          example: "8s"
        started_at:
          type: string
          format: date-time
          description: When the step started
        ended_at:
          type: string
          format: date-time
          description: When the step ended
        model:
          type: string
          description: LLM model used (for llm_call steps)
          example: "gpt-4"
        provider:
          type: string
          description: LLM provider (for llm_call steps)
          example: "openai"
        cost_usd:
          type: number
          format: float
          description: Cost of this step in USD
          example: 0.04
        input_tokens:
          type: integer
          description: Number of input tokens (for LLM steps)
        output_tokens:
          type: integer
          description: Number of output tokens (for LLM steps)
        error:
          type: string
          description: Error message if step failed

    MetricsResponse:
      type: object
      properties:
        orchestrator_metrics:
          type: object
          properties:
            uptime_seconds:
              type: number
            total_requests:
              type: integer
            success_requests:
              type: integer
            failed_requests:
              type: integer
            blocked_requests:
              type: integer
            success_rate:
              type: number
            rps:
              type: number
            error_rate_per_sec:
              type: number
            dynamic_policy_eval_p50_ms:
              type: number
            dynamic_policy_eval_p95_ms:
              type: number
            dynamic_policy_eval_p99_ms:
              type: number
            llm_routing_p50_ms:
              type: number
            llm_routing_p95_ms:
              type: number
            llm_routing_p99_ms:
              type: number
        health:
          type: object
          properties:
            up:
              type: integer
            consecutive_errors:
              type: integer
        request_types:
          type: object
          additionalProperties:
            type: object
        providers:
          type: object
          additionalProperties:
            type: object
            properties:
              total_calls:
                type: integer
              success_calls:
                type: integer
              failed_calls:
                type: integer
              total_tokens:
                type: integer
              total_cost:
                type: number
              p99_ms:
                type: number
        timestamp:
          type: string
          format: date-time

    OrchestratorRequest:
      type: object
      required:
        - query
        - user
        - client
      properties:
        request_id:
          type: string
          description: Unique request identifier
        query:
          type: string
          description: Query to process
        request_type:
          type: string
          description: Type of request
        skip_llm:
          type: boolean
          default: false
          description: Skip LLM calls (for testing)
        user:
          $ref: '#/components/schemas/UserContext'
        client:
          $ref: '#/components/schemas/ClientContext'
        context:
          type: object
          description: |
            Free-form request metadata. Routing controls:
            - `provider` (string): preferred provider
            - `strict_provider` (boolean, optional): when true, hard-pins `provider` and disables fallback
              for this request. Default is false unless server env `LLM_STRICT_PROVIDER_DEFAULT=true`.
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaContentRequest'
          maxItems: 10
          description: Optional media content (images) for multimodal governance analysis

    UserContext:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        tenant_id:
          type: string

    ClientContext:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        org_id:
          type: string
        tenant_id:
          type: string

    OrchestratorResponse:
      type: object
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          description: Response data
        error:
          type: string
        redacted:
          type: boolean
        redacted_fields:
          type: array
          items:
            type: string
        policy_info:
          $ref: '#/components/schemas/PolicyEvaluationResult'
        provider_info:
          $ref: '#/components/schemas/ProviderInfo'
        processing_time:
          type: string
        media_analysis:
          $ref: '#/components/schemas/MediaAnalysisResponse'
          description: Media governance analysis results (present when media was submitted)

    PolicyEvaluationResult:
      type: object
      properties:
        allowed:
          type: boolean
        applied_policies:
          type: array
          items:
            type: string
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        required_actions:
          type: array
          items:
            type: string
        processing_time_ms:
          type: integer
        database_accessed:
          type: boolean

    PolicyMatch:
      type: object
      description: Details of a policy match during evaluation (Issue #1021)
      properties:
        policy_id:
          type: string
          description: Unique identifier for the policy
        policy_name:
          type: string
          description: Human-readable name of the policy
        action:
          type: string
          description: Action taken by this policy
          enum: [allow, block, require_approval, redact]
        reason:
          type: string
          description: Reason for the policy match

    ProviderInfo:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, azure-openai, anthropic, bedrock, ollama, gemini, mock]
        model:
          type: string
        response_time_ms:
          type: integer
        tokens_used:
          type: integer
        cost:
          type: number

    PlanRequest:
      type: object
      required:
        - query
        - user
      properties:
        query:
          type: string
          description: Natural language task description
        domain:
          type: string
          enum: [travel, healthcare, finance, generic]
          default: generic
          description: Task domain for specialized handling
        execution_mode:
          type: string
          enum: [auto, parallel, sequential, balanced, confirm, step]
          default: auto
          description: |
            How to execute sub-tasks.
            - `auto`: Automatically determines parallel/sequential (recommended)
            - `parallel`: Force parallel execution of all independent steps
            - `sequential`: Force sequential step-by-step execution
            - `balanced`: I/O-bound connector steps parallel, LLM steps sequential
            - `confirm`: Every step requires explicit approval before execution (Enterprise only)
            - `step`: First step auto-executes, subsequent steps require approval (Enterprise only)
        user:
          $ref: '#/components/schemas/UserContext'
        client:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true

    PlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        version:
          type: integer
          description: Plan version number (for optimistic locking)
          example: 1
        steps:
          type: array
          description: Generated plan steps
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
        workflow_execution_id:
          type: string
        result:
          description: Final aggregated result
        metadata:
          type: object
          properties:
            tasks_executed:
              type: integer
            execution_mode:
              type: string
            execution_time_ms:
              type: integer
            tasks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  time_ms:
                    type: integer
        error:
          type: string
        policy_info:
          description: Policy evaluation result for the plan execution (Issue #1020)
          $ref: '#/components/schemas/PolicyEvaluationResult'

    CancelPlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        status:
          type: string
          enum: [cancelled]

    UpdatePlanRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Expected current version (for optimistic locking)
          example: 1
        execution_mode:
          type: string
          enum: [auto, parallel, sequential, balanced, confirm, step]
          description: New execution mode
        domain:
          type: string
          description: New domain
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata to set

    UpdatePlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        version:
          type: integer
          description: New version number after update
        status:
          type: string

    PlanVersionEntry:
      type: object
      properties:
        version:
          type: integer
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
        change_type:
          type: string
          enum: [created, updated, rollback]
        change_summary:
          type: string

    PlanVersionsResponse:
      type: object
      properties:
        plan_id:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionEntry'

    ResumePlanResponse:
      type: object
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum: [awaiting_approval, completed, failed]
          description: Status after resuming
        result:
          description: Final result if plan completed

    RollbackPlanResponse:
      type: object
      description: Response after rolling back a plan to a previous version
      required:
        - plan_id
        - version
        - previous_version
        - status
      properties:
        plan_id:
          type: string
          description: Plan identifier
          example: "plan_1705312200_abc123"
        version:
          type: integer
          description: New version number after rollback
          example: 4
        previous_version:
          type: integer
          description: The version that was restored
          example: 2
        status:
          type: string
          description: Plan status after rollback
          enum: [pending, executing]
          example: "pending"

    ProviderStatusResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              available:
                type: boolean
              models:
                type: array
                items:
                  type: string
              weight:
                type: number
              avg_latency_ms:
                type: integer

    DynamicPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
                enum: ["==", "!=", ">", "<", ">=", "<=", "contains", "matches"]
              value:
                description: Comparison value
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [block, allow, rate_limit, redact, alert]
              reason:
                type: string
              limit:
                type: integer

    # Policy CRUD API schemas
    Policy:
      type: object
      description: A policy with full metadata
      properties:
        id:
          type: string
          format: uuid
        policy_id:
          type: string
          description: Human-readable identifier
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [static, dynamic]
        category:
          type: string
        tier:
          type: string
          enum: [system, organization, tenant]
        pattern:
          type: string
          description: Regex pattern (for static policies)
        action:
          type: string
          enum: [block, require_approval, redact, warn, log]
        severity:
          type: string
          enum: [critical, high, medium, low]
        priority:
          type: integer
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            type: object
          description: Conditions (for dynamic policies)
        actions:
          type: array
          items:
            type: object
          description: Actions (for dynamic policies)
        version:
          type: integer
        tenant_id:
          type: string
        organization_id:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time

    PoliciesListResponse:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        pagination:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total_items:
              type: integer
            total_pages:
              type: integer

    CreatePolicyRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [static, dynamic]
        category:
          type: string
        tier:
          type: string
          enum: [organization, tenant]
          default: tenant
        pattern:
          type: string
          description: Required for static policies
        action:
          type: string
          enum: [block, require_approval, redact, warn, log]
        severity:
          type: string
          enum: [critical, high, medium, low]
        priority:
          type: integer
          default: 100
        enabled:
          type: boolean
          default: true
        conditions:
          type: array
          items:
            type: object
          description: Required for dynamic policies
        actions:
          type: array
          items:
            type: object
          description: Required for dynamic policies

    UpdatePolicyRequest:
      type: object
      description: All fields optional for partial update
      properties:
        name:
          type: string
        description:
          type: string
        pattern:
          type: string
        action:
          type: string
          enum: [block, require_approval, redact, warn, log]
        severity:
          type: string
          enum: [critical, high, medium, low]
        priority:
          type: integer
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object

    AuditSearchRequest:
      type: object
      properties:
        user_email:
          type: string
        client_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        request_type:
          type: string
        limit:
          type: integer
          default: 100

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        user_email:
          type: string
        client_id:
          type: string
        tenant_id:
          type: string
        request_type:
          type: string
        query_summary:
          type: string
        success:
          type: boolean
        blocked:
          type: boolean
        risk_score:
          type: number
        provider:
          type: string
        tokens_used:
          type: integer
        latency_ms:
          type: integer

    WorkflowExecuteRequest:
      type: object
      required:
        - workflow
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        input:
          type: object
          additionalProperties: true
        user:
          $ref: '#/components/schemas/UserContext'

    Workflow:
      type: object
      required:
        - metadata
        - spec
      properties:
        metadata:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
        spec:
          type: object
          required:
            - steps
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowStep'

    WorkflowStep:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [mcp_query, llm, api_call, transform]
        connector:
          type: string
        query:
          type: string
        prompt:
          type: string
        dependencies:
          type: array
          items:
            type: string

    WorkflowExecution:
      type: object
      properties:
        id:
          type: string
        workflow_name:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        steps:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              process_time:
                type: string
        output:
          type: object
          additionalProperties: true

    # ============================================================================
    # Workflow Control Plane Schemas
    # ============================================================================

    CreateWorkflowRequest:
      type: object
      required:
        - workflow_name
      properties:
        workflow_name:
          type: string
          description: Human-readable name for the workflow
          example: "code-review-pipeline"
        source:
          type: string
          description: Source orchestrator
          enum: [langgraph, langchain, crewai, external]
          default: external
        total_steps:
          type: integer
          description: Total number of steps (if known)
          example: 3
        metadata:
          type: object
          description: Additional workflow metadata
          additionalProperties: true

    CreateWorkflowResponse:
      type: object
      properties:
        workflow_id:
          type: string
          description: Unique workflow identifier
          example: "wf_abc123"
        workflow_name:
          type: string
        status:
          type: string
          enum: [in_progress, completed, aborted, failed]
        started_at:
          type: string
          format: date-time

    WorkflowStatusResponse:
      type: object
      properties:
        workflow_id:
          type: string
        workflow_name:
          type: string
        source:
          type: string
          enum: [langgraph, langchain, crewai, external]
        status:
          type: string
          enum: [in_progress, completed, aborted, failed]
        current_step_index:
          type: integer
        total_steps:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepInfo'

    WorkflowStepInfo:
      type: object
      properties:
        step_id:
          type: string
        step_index:
          type: integer
        step_name:
          type: string
        step_type:
          type: string
          enum: [llm_call, tool_call, connector_call, human_task]
        decision:
          type: string
          enum: [allow, block, require_approval]
        reason:
          type: string
        policy_ids:
          type: array
          items:
            type: string
        approval_status:
          type: string
          enum: [pending, approved, rejected]
        gate_checked_at:
          type: string
          format: date-time
        step_completed_at:
          type: string
          format: date-time

    StepGateRequest:
      type: object
      required:
        - step_name
        - step_type
      properties:
        step_name:
          type: string
          description: Human-readable step name
          example: "Generate Code"
        step_type:
          type: string
          description: Type of step
          enum: [llm_call, tool_call, connector_call, human_task]
          example: "llm_call"
        step_input:
          type: object
          description: Input data for the step (for policy evaluation)
          additionalProperties: true
        model:
          type: string
          description: LLM model being used
          example: "gpt-4"
        provider:
          type: string
          description: LLM provider being used
          example: "openai"

    StepGateResponse:
      type: object
      properties:
        decision:
          type: string
          description: Gate decision
          enum: [allow, block, require_approval]
        step_id:
          type: string
          description: Step identifier
        decision_id:
          type: string
          description: Unique decision identifier for auditing
        reason:
          type: string
          description: Reason for block or approval requirement
        policy_ids:
          type: array
          description: IDs of policies that matched
          items:
            type: string
        approval_url:
          type: string
          description: URL for human approval (Enterprise)
          format: uri
        policies_evaluated:
          type: array
          description: All policies that were checked during evaluation (Issue #1021)
          items:
            $ref: '#/components/schemas/PolicyMatch'
        policies_matched:
          type: array
          description: Policies that matched and contributed to the decision (Issue #1021)
          items:
            $ref: '#/components/schemas/PolicyMatch'

    MarkStepCompletedRequest:
      type: object
      properties:
        output:
          type: object
          description: Output data from the step
          additionalProperties: true
        tokens_in:
          type: integer
          description: Actual input tokens consumed by the step (overrides gate-time estimate)
          example: 150
        tokens_out:
          type: integer
          description: Actual output tokens produced by the step (overrides gate-time estimate)
          example: 45
        cost_usd:
          type: number
          format: double
          description: Actual cost in USD for the step (overrides gate-time estimate)
          example: 0.0023

    ListWorkflowsResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatusResponse'
        total:
          type: integer
          description: Total number of workflows matching filters
        limit:
          type: integer
        offset:
          type: integer

    # WCP Approval Schemas
    ApprovalResponse:
      type: object
      description: Response after approving or rejecting a workflow step
      properties:
        workflow_id:
          type: string
          description: Workflow identifier
          example: "wf_abc123"
        step_id:
          type: string
          description: Step that was approved or rejected
          example: "step-2"
        decision:
          type: string
          enum: [approved, rejected]
          description: The approval decision
          example: "approved"
        reason:
          type: string
          description: Reason for the decision (primarily for rejections)
        decided_by:
          type: string
          description: User ID who made the decision
          example: "user-456"
        decided_at:
          type: string
          format: date-time
          description: When the decision was made

    PendingApproval:
      type: object
      description: A workflow step awaiting human approval
      properties:
        workflow_id:
          type: string
          description: Workflow identifier
          example: "wf_abc123"
        workflow_name:
          type: string
          description: Human-readable workflow name
          example: "code-review-pipeline"
        step_id:
          type: string
          description: Step awaiting approval
          example: "step-2"
        step_name:
          type: string
          description: Human-readable step name
          example: "Deploy to Production"
        step_type:
          type: string
          enum: [llm_call, tool_call, connector_call, human_task, synthesis, action, gate]
          description: Type of step operation
          example: "action"
        requested_at:
          type: string
          format: date-time
          description: When approval was requested
        reason:
          type: string
          description: Why approval is required
          example: "Human approval required for deployment steps"

    PendingApprovalsResponse:
      type: object
      description: List of pending approvals across workflows
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/PendingApproval'
        total:
          type: integer
          description: Total number of pending approvals

    # Webhook Schemas
    CreateWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: URL to receive webhook event payloads
          example: "https://example.com/webhooks/axonflow"
        events:
          type: array
          items:
            type: string
          description: |
            List of event types to subscribe to. Available events:
            - `policy.violation` — Policy violation detected
            - `policy.created` / `policy.updated` / `policy.deleted` — Policy lifecycle
            - `workflow.completed` / `workflow.failed` / `workflow.aborted` — Workflow lifecycle
            - `workflow.approval_required` — Step requires human approval
            - `budget.threshold_reached` / `budget.exceeded` / `budget.blocked` — Budget alerts
            - `plan.completed` / `plan.failed` — Plan lifecycle
          example:
            - "policy.violation"
            - "workflow.completed"
        secret:
          type: string
          description: Secret key for HMAC-SHA256 signature verification of webhook payloads
          example: "whsec_abc123secretkey"
        active:
          type: boolean
          default: true
          description: Whether the subscription is active

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Updated URL to receive webhook event payloads
        events:
          type: array
          items:
            type: string
          description: Updated list of event types to subscribe to
        active:
          type: boolean
          description: Whether the subscription is active

    WebhookSubscription:
      type: object
      description: A webhook subscription for receiving event notifications
      properties:
        id:
          type: string
          description: Unique subscription identifier
          example: "wh_abc123"
        url:
          type: string
          format: uri
          description: URL that receives webhook event payloads
          example: "https://example.com/webhooks/axonflow"
        events:
          type: array
          items:
            type: string
          description: Event types this subscription listens for
          example:
            - "policy.violation"
            - "workflow.completed"
        active:
          type: boolean
          description: Whether the subscription is currently active
          example: true
        tenant_id:
          type: string
          description: Tenant ID that owns this subscription
          example: "tenant-1"
        org_id:
          type: string
          description: Organization ID that owns this subscription
          example: "org-1"
        secret:
          type: string
          description: Secret key for HMAC-SHA256 signature verification
          example: "whsec_abc123secretkey"
        created_at:
          type: string
          format: date-time
          description: When the subscription was created
        updated_at:
          type: string
          format: date-time
          description: When the subscription was last updated

    ListWebhookSubscriptionsResponse:
      type: object
      description: List of webhook subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        total:
          type: integer
          description: Total number of subscriptions

    PolicyMatch:
      type: object
      description: Details of a policy that was evaluated or matched (Issue #1021)
      properties:
        policy_id:
          type: string
          description: Unique identifier of the policy
          example: pol-pii-detection-001
        policy_name:
          type: string
          description: Human-readable name of the policy
          example: PII Detection - Critical
        action:
          type: string
          description: The action configured for this policy
          enum: [allow, block, require_approval]
          example: block
        reason:
          type: string
          description: Explanation of why the policy matched or its effect
          example: Credit card number detected in step input

    ConnectorInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        installed:
          type: boolean
        healthy:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    # ============================================================================
    # Agent Management Schemas (MAP 0.8)
    # ============================================================================

    AgentResource:
      type: object
      properties:
        id:
          type: string
          description: Qualified ID (domain/name)
          example: "travel/flight-booking"
        name:
          type: string
          description: Agent name
          example: "flight-booking"
        domain:
          type: string
          description: Agent domain
          example: "travel"
        description:
          type: string
          description: Agent description
        version:
          type: integer
          description: Version number
        is_active:
          type: boolean
          description: Whether agent is active
        config:
          $ref: '#/components/schemas/AgentConfigSpec'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentConfigSpec:
      type: object
      description: Agent configuration specification
      properties:
        execution:
          type: object
          properties:
            default_mode:
              type: string
              enum: [auto, parallel, sequential]
            max_parallel_tasks:
              type: integer
            timeout_seconds:
              type: integer
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDefinition'
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'

    AgentDefinition:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [llm-call, connector-call]
        llm:
          type: object
          description: LLM config (required for llm-call type)
          properties:
            provider:
              type: string
            model:
              type: string
        connector:
          type: object
          description: Connector config (required for connector-call type)
          properties:
            name:
              type: string
            operation:
              type: string

    RoutingRule:
      type: object
      required:
        - pattern
        - agent
      properties:
        pattern:
          type: string
          description: Regex pattern to match
        agent:
          type: string
          description: Target agent name
        priority:
          type: integer
          description: Higher priority rules match first

    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResource'
        pagination:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    AgentResponse:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/AgentResource'

    CreateAgentRequest:
      type: object
      required:
        - name
        - config
      properties:
        name:
          type: string
          description: Agent name (lowercase, alphanumeric, hyphens, underscores)
        domain:
          type: string
          description: Agent domain
        description:
          type: string
        is_active:
          type: boolean
          default: true
        config:
          $ref: '#/components/schemas/AgentConfigSpec'

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        config:
          $ref: '#/components/schemas/AgentConfigSpec'

    ValidateAgentRequest:
      type: object
      required:
        - config
      properties:
        name:
          type: string
        domain:
          type: string
        config:
          $ref: '#/components/schemas/AgentConfigSpec'

    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string

    TestAgentRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Test query to execute
        context:
          type: object
          additionalProperties: true
          description: Additional context for the query

    TestAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          description: Test execution result
        execution_time_ms:
          type: integer
        tasks_executed:
          type: integer
        errors:
          type: array
          items:
            type: string

    AgentVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: integer
              change_type:
                type: string
                enum: [create, update, delete, activate, deactivate]
              changed_at:
                type: string
                format: date-time
              changed_by:
                type: string
                format: uuid
              change_summary:
                type: string

    # =========================================================================
    # SEBI Compliance Schemas (Enterprise)
    # =========================================================================

    SEBIComplianceFramework:
      type: string
      description: SEBI compliance framework identifier
      enum:
        - SEBI_AI_ML
        - DPDP_ACT_2023
        - SEBI_DPDP_COMBINED

    SEBIExportFormat:
      type: string
      description: Export output format
      enum:
        - json
        - csv
        - xml

    SEBIAuditDataType:
      type: string
      description: Type of audit data
      enum:
        - policy_violations
        - llm_calls
        - decision_chain
        - hitl_oversight
        - pii_redactions
        - all

    SEBIComplianceStatus:
      type: string
      description: Compliance status indicator
      enum:
        - COMPLIANT
        - NON_COMPLIANT
        - WARNING

    SEBIDashboard:
      type: object
      description: SEBI compliance dashboard data
      properties:
        framework:
          $ref: '#/components/schemas/SEBIComplianceFramework'
        overall_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall compliance score (0-100)
        overall_status:
          $ref: '#/components/schemas/SEBIComplianceStatus'
        last_audit_export:
          type: string
          format: date-time
          description: Timestamp of last audit export
        retention_status:
          $ref: '#/components/schemas/SEBIRetentionResponse'
        readiness:
          $ref: '#/components/schemas/SEBIComplianceReadiness'
        violations_summary:
          $ref: '#/components/schemas/SEBIViolationsSummary'
        pii_summary:
          $ref: '#/components/schemas/SEBIPIISummary'
        hitl_reviews_pending:
          type: integer
          description: Number of HITL reviews awaiting action
        last_updated:
          type: string
          format: date-time

    SEBIAuditExportRequest:
      type: object
      description: Request to export SEBI audit data
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date-time
          description: Start of export period (inclusive)
        end_date:
          type: string
          format: date-time
          description: End of export period (inclusive)
        data_types:
          type: array
          items:
            $ref: '#/components/schemas/SEBIAuditDataType'
          description: Types of audit data to export (defaults to all)
        format:
          $ref: '#/components/schemas/SEBIExportFormat'
        framework:
          $ref: '#/components/schemas/SEBIComplianceFramework'
        include_archived:
          type: boolean
          default: false
          description: Include records from cold storage
        redact_pii:
          type: boolean
          default: false
          description: Redact PII in export (for external auditors)
        filters:
          $ref: '#/components/schemas/SEBIAuditExportFilters'

    SEBIAuditExportFilters:
      type: object
      description: Optional filters for audit exports
      properties:
        agent_ids:
          type: array
          items:
            type: string
          description: Filter by agent IDs
        user_ids:
          type: array
          items:
            type: integer
          description: Filter by user IDs
        severity:
          type: string
          description: Minimum severity level
        policy_types:
          type: array
          items:
            type: string
          description: Filter by policy types
        violation_types:
          type: array
          items:
            type: string
          description: Filter by violation types
        include_model_info:
          type: boolean
          description: Include detailed model information

    SEBIAuditExportResponse:
      type: object
      description: Response for audit export requests
      properties:
        export_id:
          type: string
          description: Unique export identifier
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Export status
        exported_at:
          type: string
          format: date-time
          description: When the export was completed
        framework:
          $ref: '#/components/schemas/SEBIComplianceFramework'
        summary:
          $ref: '#/components/schemas/SEBIAuditExportSummary'
        download_url:
          type: string
          description: URL to download the export (for async exports)
        expires_at:
          type: string
          format: date-time
          description: When the download URL expires
        metadata:
          $ref: '#/components/schemas/SEBIExportMetadata'

    SEBIAuditExportSummary:
      type: object
      description: Statistics about the export
      properties:
        total_records:
          type: integer
          description: Total records exported
        records_by_type:
          type: object
          additionalProperties:
            type: integer
          description: Records by data type
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        violations_summary:
          $ref: '#/components/schemas/SEBIViolationsSummary'
        compliance_score:
          type: number
          format: float
          description: Compliance score for the period

    SEBIExportMetadata:
      type: object
      description: Export metadata for audit trail
      properties:
        export_version:
          type: string
          description: Schema version
        generated_by:
          type: string
          description: System that generated the export
        generated_at:
          type: string
          format: date-time
        org_id:
          type: integer
        org_name:
          type: string
        requested_by:
          type: string
          description: User who requested the export
        compliance_framework:
          $ref: '#/components/schemas/SEBIComplianceFramework'
        retention_days:
          type: integer
          description: Retention period (1825 days = 5 years)
        checksum:
          type: string
          description: SHA-256 checksum of export data
        signed_by:
          type: string
          description: Signing authority (for signed exports)

    SEBIRetentionResponse:
      type: object
      description: 5-year retention compliance status
      properties:
        org_id:
          type: integer
        framework:
          $ref: '#/components/schemas/SEBIComplianceFramework'
        compliance_status:
          $ref: '#/components/schemas/SEBIComplianceStatus'
        status:
          type: array
          items:
            $ref: '#/components/schemas/SEBIDataTypeRetentionStatus'
        next_cleanup:
          type: string
          format: date-time
          description: Next scheduled cleanup

    SEBIDataTypeRetentionStatus:
      type: object
      description: Retention status for a data type
      properties:
        data_type:
          $ref: '#/components/schemas/SEBIAuditDataType'
        retention_days:
          type: integer
          description: Configured retention period
        oldest_record:
          type: string
          format: date-time
        newest_record:
          type: string
          format: date-time
        total_records:
          type: integer
          format: int64
        archived_records:
          type: integer
          format: int64
        storage_bytes:
          type: integer
          format: int64
        compliance_status:
          $ref: '#/components/schemas/SEBIComplianceStatus'
        last_cleanup:
          type: string
          format: date-time

    SEBIComplianceReadiness:
      type: object
      description: SEBI audit readiness assessment
      properties:
        ready:
          type: boolean
          description: Organization is ready for audit
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Readiness score (0-100)
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SEBIComplianceCheck'
        recommendations:
          type: array
          items:
            type: string
          description: Improvement recommendations

    SEBIComplianceCheck:
