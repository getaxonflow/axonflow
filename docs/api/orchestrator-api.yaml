    # ==========================================================================
    # Audit report + session summary schemas
    # ==========================================================================

    AuditActionReport:
      type: object
      description: |
        Per-action aggregate for a window. by_action always carries the full
        canonical verdict set (allowed / blocked / redacted / needs_approval /
        error) — a verdict with no rows reports 0 rather than being absent.
      properties:
        tenant_id:
          type: string
        user_email:
          type: string
          description: Echoed filter; omitted when not filtered
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total:
          type: integer
          description: Governed decisions in the window (lifecycle events excluded)
        by_action:
          type: object
          additionalProperties:
            type: integer
          description: Counts folded onto the canonical verdicts
        avg_latency_ms:
          type: number
          format: double
        top_policies:
          type: array
          description: Top 10 policies by trigger count
          items:
            type: object
            properties:
              policy_name:
                type: string
              trigger_count:
                type: integer
              block_count:
                type: integer

    SessionSummaryResponse:
      type: object
      description: GET /api/v1/audit/session-summary payload (Enterprise)
      properties:
        tenant_id:
          type: string
        user_email:
          type: string
          description: Echoed filter; omitted when not filtered
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummaryBucket'
        bucket_limit:
          type: integer
          description: Effective bucket cap applied to this response
        truncated:
          type: boolean
          description: |
            True when the window held more buckets than bucket_limit —
            narrow the window or raise ?limit=

    SessionSummaryBucket:
      type: object
      description: |
        One session (or per-user-day fallback) bucket. Exactly one of
        session_id / day is set: session_id for a real session bucket, day
        (YYYY-MM-DD) for rows without a session id grouped by calendar day.
      properties:
        session_id:
          type: string
          description: Set when the bucket is a real session
        day:
          type: string
          description: Set only for a per-user-day fallback bucket (YYYY-MM-DD)
        user_email:
          type: string
        tenant_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total:
          type: integer
        by_action:
          type: object
          additionalProperties:
            type: integer
          description: Per-bucket counts folded onto the canonical verdicts
        tools:
          type: array
          description: Per-request_type usage within the bucket
          items:
            type: object
            properties:
              request_type:
                type: string
              count:
                type: integer
              tokens_used:
                type: integer
              cost:
                type: number
                format: double
              avg_latency_ms:
                type: number
                format: double
        tokens_used:
          type: integer
          description: Per-request token sum over governed audit rows (authoritative gateway view)
        cost:
          type: number
          format: double
        avg_latency_ms:
          type: number
          format: double
        usage_metrics:
          $ref: '#/components/schemas/SessionSummaryUsageMetrics'

    SessionSummaryUsageMetrics:
      type: object
      description: |
        Optional Claude-export enrichment (#2852), sourced from the OTLP
        metrics ingest. Absent when no metric rows match the bucket. These
        are the CLI's own aggregates (everything the tool did, governed or
        not) and are deliberately nested rather than merged with the
        bucket-level tokens_used/cost, which remain the governed-gateway
        sums. tokens_used here counts input/output only; cache tokens are
        kept separately in cache_tokens and never inflate the headline.
      properties:
        lines_of_code:
          type: integer
        active_time_seconds:
          type: number
          format: double
        commits:
          type: integer
        pull_requests:
          type: integer
        tool_permission_decisions:
          type: object
          properties:
            accept:
              type: integer
            reject:
              type: integer
        session_count:
          type: integer
        tokens_used:
          type: integer
        cache_tokens:
          type: integer
        cost_usd:
          type: number
          format: double

    # ==========================================================================
    # Policy override (ADR-044) + decision explainability (ADR-043) schemas
    # ==========================================================================

    CreateOverrideRequest:
      type: object
      required:
        - policy_id
        - policy_type
        - override_reason
      properties:
        policy_id:
          type: string
          description: Policy UUID, or the human-readable slug (static) / name (dynamic)
        policy_type:
          type: string
          enum: [static, dynamic]
        tool_signature:
          type: string
          description: Optional tool scope for the override
        override_reason:
          type: string
          maxLength: 500
          description: Mandatory justification (ADR-044)
        ttl_seconds:
          type: integer
          format: int64
          description: |
            Override lifetime in seconds. Omitted/0 defaults to 3600.
            Clamped server-side to [60, 86400]; the response reports any clamp.

    CreateOverrideResponse:
      type: object
      properties:
        id:
          type: string
        policy_id:
          type: string
          description: Echoes the value sent in the request (not resolved to a UUID)
        policy_type:
          type: string
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
          format: int64
          description: Effective TTL after clamping
        requested_ttl:
          type: integer
          format: int64
          description: Present when the requested TTL was clamped
        clamped:
          type: boolean
          description: Present (true) when the TTL was clamped
        clamped_reason:
          type: string
          description: exceeds_hard_cap or below_minimum; present when clamped
        created_at:
          type: string
          format: date-time

    OverrideSummary:
      type: object
      properties:
        id:
          type: string
        policy_id:
          type: string
        policy_type:
          type: string
        tenant_id:
          type: string
        override_reason:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Present only on revoked overrides
        created_at:
          type: string
          format: date-time

    OverrideDetail:
      type: object
      properties:
        id:
          type: string
        policy_id:
          type: string
        policy_type:
          type: string
        tenant_id:
          type: string
        organization_id:
          type: string
        tool_signature:
          type: string
        override_reason:
          type: string
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revoked_by:
          type: string

    DecisionListResponse:
      type: object
      properties:
        decisions:
          type: array
          description: Always an array (`[]` when empty)
          items:
            $ref: '#/components/schemas/DecisionListItem'

    DecisionListItem:
      type: object
      properties:
        decision_id:
          type: string
        timestamp:
          type: string
          format: date-time
        decision:
          type: string
          description: Canonical verdict
          enum: [allowed, blocked, redacted, needs_approval, error]
        policy_id:
          type: string
        tool_signature:
          type: string
        context:
          type: object
          additionalProperties:
            type: string
          description: Decision context, truncated to at most 5 keys (sorted)
        transfer_basis:
          type: string
          description: UU PDP Pasal 56 transfer basis; Enterprise cross-border rows only
        data_residency:
          type: string
          description: ISO 3166-1 alpha-2 destination country; Enterprise only

    DecisionListLimitEnvelope:
      type: object
      description: |
        Tier-limit envelope returned with 429 when the requested page size
        exceeds the tier cap. Same shape as the plugin rate-limit envelopes.
      properties:
        error:
          type: string
          example: "Free tier shows the last 5 decisions in 24h. Pro raises this to 100 decisions in the last 30 days."
        limit_type:
          type: string
          example: "decision_list_size"
        tier:
          type: string
          description: Effective tier the request was evaluated under
        limit:
          type: integer
          description: The tier's page cap
        remaining:
          type: integer
          example: 0
        upgrade:
          type: object
          properties:
            tier:
              type: string
              example: "Pro"
            wording:
              type: string
            compare_url:
              type: string
              example: "https://getaxonflow.com/pricing/"
            buy_url:
              type: string

    DecisionExplanation:
      type: object
      description: ADR-043 decision explanation
      properties:
        decision_id:
          type: string
        timestamp:
          type: string
          format: date-time
        policy_matches:
          type: array
          description: Always an array (`[]` when empty)
          items:
            type: object
            properties:
              policy_id:
                type: string
              policy_name:
                type: string
              action:
                type: string
              risk_level:
                type: string
              allow_override:
                type: boolean
              policy_description:
                type: string
        matched_rules:
          type: array
          description: Per-rule match detail; omitted when unavailable
          items:
            type: object
            properties:
              policy_id:
                type: string
              rule_id:
                type: string
              rule_text:
                type: string
              matched_on:
                type: string
        decision:
          type: string
          description: |
            Verdict echoed verbatim from the audit row's policy_decision
            column (not normalized), so historical spellings can appear
        reason:
          type: string
        risk_level:
          type: string
        override_available:
          type: boolean
          description: |
            True when at least one matched policy has allow_override=true
            and is not critical-risk
        override_existing_id:
          type: string
          description: Id of an already-active override covering this decision, when one exists
        historical_hit_count_session:
          type: integer
          description: Rolling-24h hit count for the first matched policy by this user
        policy_source_link:
          type: string
        tool_signature:
          type: string
        policy_version_at_decision:
          type: integer
          description: Policy version recorded at decision time; omitted when unknown
        latest_policy_version:
          type: integer
          description: Current head version of the first matched (static) policy
        context:
          type: object
          additionalProperties:
            type: string
        context_truncated:
          type: boolean

    # ==========================================================================
    # OJK Compliance schemas (Enterprise - Indonesia)
    # ==========================================================================

    OJKAPIError:
      type: object
      description: OJK module error envelope
      properties:
        code:
          type: string
          description: |
            Machine-readable error code (e.g. missing_tenant,
            invalid_request, validation_error, missing_export_id, not_found,
            invalid_transition, internal_error, method_not_allowed)
        message:
          type: string
        details:
          type: string
          description: Omitted when empty

    OJKAuditExportRequest:
      type: object
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
          description: Window start (YYYY-MM-DD)
        end_date:
          type: string
          format: date
          description: Window end (YYYY-MM-DD, not before start_date; range at most 5 years)
        format:
          type: string
          enum: [json, csv, xml]
          default: json
        framework:
          type: string
          enum: [OJK_AI_GOVERNANCE, UU_PDP, BI_PJP, OJK_BI_COMBINED]
          default: OJK_BI_COMBINED
        data_types:
          type: array
          description: Defaults to [all]
          items:
            type: string
            enum: [policy_violations, llm_calls, decision_chain, hitl_oversight, pii_redactions, cross_border_transfers, breach_notifications, all]
        filters:
          type: object
          properties:
            agent_ids:
              type: array
              items:
                type: string
            user_ids:
              type: array
              items:
                type: string
            severity:
              type: array
              items:
                type: string
            policy_types:
              type: array
              items:
                type: string
        include_pii:
          type: boolean
          default: false

    OJKAuditExportResponse:
      type: object
      properties:
        export_id:
          type: string
        status:
          type: string
          description: Always `completed` (the export runs synchronously)
        framework:
          type: string
          enum: [OJK_AI_GOVERNANCE, UU_PDP, BI_PJP, OJK_BI_COMBINED]
        format:
          type: string
          enum: [json, csv, xml]
        summary:
          type: object
          properties:
            total_records:
              type: integer
            records_by_type:
              type: object
              additionalProperties:
                type: integer
            date_range:
              type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            compliance_score:
              type: number
              format: double
        data:
          type: object
          description: |
            Inline export payload; each key is present only when its data
            type was requested and rows exist
          properties:
            policy_violations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  policy_id:
                    type: string
                  policy_name:
                    type: string
                  severity:
                    type: string
                  action:
                    type: string
                  description:
                    type: string
                  tenant_id:
                    type: string
            llm_calls:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  model_id:
                    type: string
                  provider:
                    type: string
                  input_tokens:
                    type: integer
                  output_tokens:
                    type: integer
                  cost:
                    type: number
                    format: double
                  latency_ms:
                    type: integer
                    format: int64
                  policy_decision:
                    type: string
            decision_chains:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  decision_id:
                    type: string
                  risk_level:
                    type: string
                  model_id:
                    type: string
                  requires_review:
                    type: boolean
            hitl_records:
              type: array
              description: |
                Declared on the wire type but NEVER populated — the export
                service has no hitl_oversight query implementation (field is
                omitempty, so it is absent from real responses).
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  trigger_reason:
                    type: string
                  reviewer_id:
                    type: string
                  decision:
                    type: string
                  review_time_ms:
                    type: integer
                    format: int64
            pii_redactions:
              type: array
              description: |
                Declared on the wire type but NEVER populated — the export
                service has no pii_redactions query implementation (field is
                omitempty, so it is absent from real responses).
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  pii_type:
                    type: string
                  redaction_method:
                    type: string
                  confidence:
                    type: number
                    format: double
            cross_border_transfers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  data_residency:
                    type: string
                  transfer_basis:
                    type: string
                    enum: [adequacy, safeguards, pasal_56b_dpa, consent]
                  destination_country:
                    type: string
                  data_categories:
                    type: array
                    items:
                      type: string
                  approval_status:
                    type: string
            breach_notifications:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  incident_timestamp:
                    type: string
                    format: date-time
                  discovery_time:
                    type: string
                    format: date-time
                  notification_deadline:
                    type: string
                    format: date-time
                  data_subjects_affected:
                    type: integer
                  data_types_involved:
                    type: array
                    items:
                      type: string
                  notified_authority:
                    type: string
                  status:
                    type: string
                    description: Effective status after deadline evaluation
                  stored_status:
                    type: string
                  submitted_at:
                    type: string
                    format: date-time
                  acknowledged_at:
                    type: string
                    format: date-time
                  within_deadline:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        download_url:
          type: string
          description: Omitted for inline exports
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        metadata:
          type: object
          properties:
            export_version:
              type: string
              example: "1.0.0"
            generated_by:
              type: string
              example: "axonflow-ojk-module"
            tenant_id:
              type: string
            checksum:
              type: string
              description: SHA-256 hex of the export data

    OJKRetentionStatusResponse:
      type: object
      properties:
        compliance_status:
          type: string
          enum: [compliant, non_compliant]
        framework:
          type: string
          example: "OJK_BI_COMBINED"
        retention_days:
          type: integer
        min_retention_days:
          type: integer
          example: 1825
        data_types:
          type: array
          description: |
            ⚠️ Always empty in the current implementation — per-type
            retention reporting is not implemented (`GetRetentionStatus`
            returns a fixed empty slice).
          items:
            type: object
            properties:
              data_type:
                type: string
              status:
                type: string
              oldest_record:
                type: string
                format: date-time
              newest_record:
                type: string
                format: date-time
              total_records:
                type: integer
                format: int64
        next_cleanup:
          type: string
          format: date-time
          description: Never set by the current implementation (omitted)

    OJKComplianceReadinessResponse:
      type: object
      properties:
        ready:
          type: boolean
          description: True at score 80+
        score:
          type: integer
          minimum: 0
          maximum: 100
        framework:
          type: string
          example: "OJK_BI_COMBINED"
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              status:
                type: string
                enum: [pass, fail, warning]
              details:
                type: string
        recommendations:
          type: array
          items:
            type: string

    OJKBreachNotification:
      type: object
      description: |
        UU PDP Art. 46 breach notification. On submission the server assigns
        id / created_at / submitted_at and computes notification_deadline
        (discovery_time + 72h) — client-supplied values for those fields
        are ignored. notified_authority defaults to MOCDA only when the
        client omits it; a supplied value is honored.
      required:
        - incident_timestamp
        - discovery_time
        - data_subjects_affected
        - data_types_involved
        - description
        - remediation_steps
      properties:
        id:
          type: string
          description: Server-assigned
        incident_timestamp:
          type: string
          format: date-time
        discovery_time:
          type: string
          format: date-time
        notification_deadline:
          type: string
          format: date-time
          description: Server-computed (discovery_time + 72h)
        data_subjects_affected:
          type: integer
          minimum: 1
        data_types_involved:
          type: array
          minItems: 1
          items:
            type: string
        description:
          type: string
        remediation_steps:
          type: array
          minItems: 1
          items:
            type: string
        notified_authority:
          type: string
          description: Defaults to MOCDA
        status:
          type: string
          enum: [draft, submitted, acknowledged, overdue, failed]
        submitted_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    OJKDashboardResponse:
      type: object
      properties:
        framework:
          type: string
          example: "OJK_BI_COMBINED"
        compliance_score:
          type: integer
        total_audit_records:
          type: integer
          format: int64
        active_policies:
          type: integer
        recent_violations:
          type: integer
        retention_status:
          type: string
        breach_notifications:
          type: integer
        overdue_breach_notifications:
          type: integer
        last_updated:
          type: string
          format: date-time

    # ==========================================================================
    # Unified execution tracking schemas
    # ==========================================================================

    UnifiedExecutionListResponse:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedExecutionStatus'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    UnifiedExecutionStatus:
      type: object
      description: |
        Unified status record covering both MAP plans and WCP workflows.
        Distinct from the replay Execution schema and from the MAP
        StepStatus schema.
      properties:
        execution_id:
          type: string
        execution_type:
          type: string
          enum: [map_plan, wcp_workflow]
        name:
          type: string
        source:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, aborted, expired]
        current_step_index:
          type: integer
        total_steps:
          type: integer
        progress_percent:
          type: number
          format: double
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration:
          type: string
        estimated_cost_usd:
          type: number
          format: double
        actual_cost_usd:
          type: number
          format: double
        steps:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedStepStatus'
        error:
          type: string
        tenant_id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        client_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UnifiedStepStatus:
      type: object
      properties:
        step_id:
          type: string
        step_index:
          type: integer
        step_name:
          type: string
        step_type:
          type: string
          enum: [llm_call, tool_call, connector_call, human_task, synthesis, action, gate]
        status:
          type: string
          enum: [pending, running, completed, failed, skipped, blocked, approval]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration:
          type: string
        decision:
          type: string
          enum: [allow, block, require_approval]
        decision_reason:
          type: string
        policies_matched:
          type: array
          items:
            type: string
        approval_status:
          type: string
          enum: [pending, approved, rejected, expired]
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        rejected_by:
          type: string
        rejected_at:
          type: string
          format: date-time
        model:
          type: string
        provider:
          type: string
        cost_usd:
          type: number
          format: double
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        input:
          description: Raw step input (JSON)
        output:
          description: Raw step output (JSON)
        result_summary:
          type: string
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Invalid request body"

    Unauthorized:
      description: Unauthorized - missing or invalid tenant ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LLMProviderAPIError'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "missing tenant ID"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Resource not found"

    Forbidden:
      description: Forbidden - insufficient permissions or enterprise license required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Enterprise license required"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Internal server error"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: OAuth2-style client credentials (clientId:clientSecret)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enterprise JWT token (see /scripts/generate-jwt.sh)
