          type: string
          format: date-time

    SEBIAuditExportRequest:
      type: object
      description: Request to export SEBI audit data
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date-time
          description: Start of export period (inclusive)
        end_date:
          type: string
          format: date-time
          description: End of export period (inclusive)
        data_types:
          type: array
