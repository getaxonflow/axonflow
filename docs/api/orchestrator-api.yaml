        email:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        tenant_id:
          type: string

    ClientContext:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        org_id:
          type: string
        tenant_id:
          type: string

    OrchestratorResponse:
      type: object
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          description: Response data
        error:
          type: string
        redacted:
          type: boolean
        redacted_fields:
          type: array
          items:
            type: string
        policy_info:
          $ref: '#/components/schemas/PolicyEvaluationResult'
        provider_info:
          $ref: '#/components/schemas/ProviderInfo'
        processing_time:
          type: string
        media_analysis:
          description: Media governance analysis results (present when media was submitted)
          allOf:
            - $ref: '#/components/schemas/MediaAnalysisResponse'

    PolicyEvaluationResult:
      type: object
      properties:
        allowed:
          type: boolean
        applied_policies:
          type: array
          items:
            type: string
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        required_actions:
          type: array
          items:
            type: string
        processing_time_ms:
          type: integer
        database_accessed:
          type: boolean

    PolicyMatch:
      type: object
      description: Details of a policy match during evaluation (Issue #1021)
      properties:
        policy_id:
          type: string
          description: Unique identifier for the policy
        policy_name:
          type: string
          description: Human-readable name of the policy
        action:
          type: string
          description: Action taken by this policy
          enum: [allow, block, require_approval, redact]
        reason:
          type: string
          description: Reason for the policy match

    ProviderInfo:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, azure-openai, anthropic, bedrock, ollama, gemini, mock]
        model:
          type: string
        response_time_ms:
          type: integer
        tokens_used:
          type: integer
        cost:
          type: number

    PlanRequest:
      type: object
      required:
        - query
        - user
      properties:
        query:
          type: string
          description: Natural language task description
        domain:
          type: string
          enum: [travel, healthcare, finance, generic]
          default: generic
          description: Task domain for specialized handling
        execution_mode:
          type: string
          enum: [auto, parallel, sequential, balanced, confirm, step]
          default: auto
          description: |
            How to execute sub-tasks.
            - `auto`: Automatically determines parallel/sequential (recommended)
            - `parallel`: Force parallel execution of all independent steps
            - `sequential`: Force sequential step-by-step execution
            - `balanced`: I/O-bound connector steps parallel, LLM steps sequential
            - `confirm`: Every step requires explicit approval before execution (Enterprise only)
            - `step`: First step auto-executes, subsequent steps require approval (Enterprise only)
        user:
          $ref: '#/components/schemas/UserContext'
        client:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true

    PlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        version:
          type: integer
          description: Plan version number (for optimistic locking)
          example: 1
        steps:
          type: array
          description: Generated plan steps
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
        workflow_execution_id:
          type: string
        result:
          description: Final aggregated result
        metadata:
          type: object
          properties:
            tasks_executed:
              type: integer
            execution_mode:
              type: string
            execution_time_ms:
              type: integer
            tasks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  time_ms:
                    type: integer
        error:
          type: string
        policy_info:
          description: Policy evaluation result for the plan execution (Issue #1020)
          allOf:
            - $ref: '#/components/schemas/PolicyEvaluationResult'
        complexity:
          type: string
          description: |
            Plan complexity hint inferred from query characteristics
            (e.g. simple/medium/complex). Surfaced from the planning
            engine so callers can apply complexity-aware UI hints.
          example: medium
        domain:
          type: string
          description: |
            Inferred query domain (e.g. travel, finance, healthcare).
            Echoes the request's `domain` field if provided, otherwise
            populated by the planning engine's domain classifier.
          example: travel
        parallel:
          type: boolean
          description: |
            True when the planning engine produced steps that can
            execute in parallel. Callers may choose to render
            parallel-step UIs differently from sequential ones.
        status:
          type: string
          description: |
            Plan lifecycle status (e.g. created, in_progress, completed,
            failed). Mirrors the WorkflowStatusResponse.status field for
            plans the orchestrator returns synchronously alongside the
            plan body.

    CancelPlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        status:
          type: string
          enum: [cancelled]
        message:
          type: string
          description: |
            Human-readable summary of the cancel outcome (e.g.
            "Plan cancelled — 3 of 5 steps had already executed and
            were rolled back"). Useful for end-user UI; programmatic
            callers should prefer `status`.

    UpdatePlanRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Expected current version (for optimistic locking)
          example: 1
        execution_mode:
          type: string
          enum: [auto, parallel, sequential, balanced, confirm, step]
          description: New execution mode
        domain:
          type: string
          description: New domain
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata to set

    UpdatePlanResponse:
      type: object
      properties:
        success:
          type: boolean
        plan_id:
          type: string
        version:
          type: integer
          description: New version number after update
        status:
          type: string

    PlanVersionEntry:
      type: object
      properties:
        version:
          type: integer
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
        change_type:
          type: string
          enum: [created, updated, rollback]
        change_summary:
          type: string

    PlanVersionsResponse:
      type: object
      properties:
        plan_id:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionEntry'

    ResumePlanResponse:
      type: object
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum: [awaiting_approval, completed, failed]
          description: Status after resuming
        result:
          description: Final result if plan completed
        approved:
          type: boolean
          description: |
            True when the resume was driven by an approval; false when
            the resume rejected the pending decision. Mirrors the
            decision the caller submitted on /resume.
        message:
          type: string
          description: |
            Human-readable summary of the resume outcome (e.g.
            "Step 3 approved; plan continuing to step 4").
        next_step:
          type: integer
          description: |
            1-based index of the next step the orchestrator will run
            after the resume completes. Absent when the plan is
            already terminal.
        next_step_name:
          type: string
          description: |
            Name of the step at `next_step` (mirrors PlanStep.name).
            Useful for callers rendering "Continuing to: …" UI.
        step_result:
          description: |
            Result of the step that was waiting on this approval.
            Shape depends on the step type; treat as opaque on the
            client unless the step type is known.
        total_steps:
          type: integer
          description: |
            Total number of steps in the plan, so callers can render
            "Step N of M" without a separate plan-status lookup.
        workflow_id:
          type: string
          description: |
            WCP workflow id this plan is bound to. Surfaced here so
            callers don't need a separate /plans/{id} round-trip after
            resume to learn the workflow id.

    RollbackPlanResponse:
      type: object
      description: Response after rolling back a plan to a previous version
      required:
        - plan_id
        - version
        - previous_version
        - status
      properties:
        plan_id:
          type: string
          description: Plan identifier
          example: "plan_1705312200_abc123"
        version:
          type: integer
          description: New version number after rollback
          example: 4
        previous_version:
          type: integer
          description: The version that was restored
          example: 2
        status:
          type: string
          description: Plan status after rollback
          enum: [pending, executing]
          example: "pending"

    ProviderStatusResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              available:
                type: boolean
              models:
                type: array
                items:
                  type: string
              weight:
                type: number
              avg_latency_ms:
                type: integer

    DynamicPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        type:
          type: string
          description: |
            Policy type — narrower-than-category dimension surfaced on
            list/CRUD responses (e.g. risk, content, user, cost).
          example: risk
        category:
          type: string
          description: |
            Policy category. Dynamic policies use a `dynamic-` prefix
            (dynamic-risk, dynamic-compliance, dynamic-security,
            dynamic-cost, dynamic-access).
          example: dynamic-risk
        tier:
          type: string
          enum: [system, organization, tenant]
          description: |
            Policy tier. Dynamic policies default to `tenant`;
            organization-tier policies require Enterprise.
        organization_id:
          type: string
          nullable: true
          description: |
            Organization id for organization-tier policies. Null for
            system and tenant tiers.
        priority:
          type: integer
          description: |
            Evaluation priority — lower values evaluate first. Useful
            when multiple dynamic policies match the same request.
          example: 0
        created_at:
          type: string
          format: date-time
          description: When the dynamic policy was first inserted.
        updated_at:
          type: string
          format: date-time
          description: When the dynamic policy was last modified.
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
                enum: ["==", "!=", ">", "<", ">=", "<=", "contains", "matches"]
              value:
                description: Comparison value
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [block, allow, rate_limit, redact, alert]
              reason:
                type: string
              limit:
                type: integer

    # Policy CRUD API schemas
