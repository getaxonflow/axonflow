        '400':
          description: Missing tenant headers (code `missing_tenant`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OJKAPIError'
        '500':
          description: Failed to evaluate breach deadlines (code `internal_error`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OJKAPIError'

