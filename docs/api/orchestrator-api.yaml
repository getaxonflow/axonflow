  # Execution Replay API
  /api/v1/executions:
    get:
      tags:
        - Decision & Execution Replay
      summary: List workflow executions
      description: |
        List all workflow executions with optional filtering and pagination.
        Supports filtering by status, workflow, tenant, time range.
      operationId: listExecutions
      parameters:
        - name: limit
          in: query
          description: Maximum number of results (default 50)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Pagination offset (default 0)
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by execution status
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: workflow_id
          in: query
          description: Filter by workflow name
          schema:
            type: string
        - name: start_time
          in: query
          description: Filter by start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter by end time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: X-Tenant-ID
          in: header
          description: Filter by tenant ID
          schema:
            type: string
        - name: X-Org-ID
          in: header
          description: Filter by organization ID
          schema:
            type: string
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'

  /api/v1/executions/{id}:
    get:
      tags:
        - Decision & Execution Replay
      summary: Get execution details
      description: Get full execution details including summary and all steps.
      operationId: getExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Decision & Execution Replay
      summary: Delete execution
      description: Delete an execution and all its step data.
      operationId: deleteExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
      responses:
        '204':
          description: Execution deleted
        '404':
          description: Execution not found

  /api/v1/executions/{id}/steps:
    get:
      tags:
        - Decision & Execution Replay
      summary: Get execution steps
      description: Get all steps for an execution.
      operationId: getExecutionSteps
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
      responses:
        '200':
          description: List of execution steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionSnapshot'
        '404':
          description: Execution not found

  /api/v1/executions/{id}/steps/{stepIndex}:
    get:
      tags:
        - Decision & Execution Replay
      summary: Get specific step
      description: Get a specific step by index.
      operationId: getExecutionStep
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
        - name: stepIndex
          in: path
          required: true
          description: Step index (0-based)
          schema:
            type: integer
      responses:
        '200':
          description: Step details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSnapshot'
        '404':
          description: Step not found

  /api/v1/executions/{id}/timeline:
    get:
      tags:
        - Decision & Execution Replay
      summary: Get execution timeline
      description: Get a timeline view of execution steps with status indicators.
      operationId: getExecutionTimeline
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
      responses:
        '200':
          description: Execution timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEntry'
        '404':
          description: Execution not found

  /api/v1/executions/{id}/export:
    get:
      tags:
        - Decision & Execution Replay
      summary: Export execution
      description: |
        Export full execution record for compliance and auditing.
        Returns a downloadable JSON file.
      operationId: exportExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution request ID
          schema:
            type: string
        - name: format
          in: query
          description: Export format (default json)
          schema:
            type: string
            default: json
        - name: include_input
          in: query
          description: Include step inputs (default true)
          schema:
            type: boolean
            default: true
        - name: include_output
          in: query
          description: Include step outputs (default true)
          schema:
            type: boolean
            default: true
        - name: include_policies
          in: query
          description: Include policy events (default true)
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Execution export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionExport'
        '404':
          description: Execution not found

  # Cost Controls API
  /api/v1/budgets:
    post:
      tags:
        - Cost Controls
      summary: Create a budget
      description: |
        Create a new budget with spending limits. Budgets can be scoped to
        organization, team, agent, workflow, or user level.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: createBudget
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
            example:
              id: "monthly-budget"
              name: "Monthly Production Budget"
              scope: "organization"
              limit_usd: 1000.00
              period: "monthly"
              on_exceed: "warn"
              alert_thresholds: [50, 80, 100]
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Invalid budget configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Budget with this ID already exists
    get:
      tags:
        - Cost Controls
      summary: List budgets
      description: |
        List all budgets for the organization.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: listBudgets
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          description: Organization ID
          schema:
            type: string
        - name: scope
          in: query
          description: Filter by budget scope
          schema:
            type: string
            enum: [organization, team, agent, workflow, user]
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of budgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetList'

  /api/v1/budgets/{id}:
    get:
      tags:
        - Cost Controls
      summary: Get a budget
      description: |
        Get a specific budget by ID.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: getBudget
      parameters:
        - name: id
          in: path
          required: true
          description: Budget ID
          schema:
            type: string
      responses:
        '200':
          description: Budget details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          description: Budget not found
    put:
      tags:
        - Cost Controls
      summary: Update a budget
      description: |
        Update an existing budget configuration.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: updateBudget
      parameters:
        - name: id
          in: path
          required: true
          description: Budget ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdate'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '404':
          description: Budget not found
        '400':
          description: Invalid budget configuration
    delete:
      tags:
        - Cost Controls
      summary: Delete a budget
      description: |
        Delete a budget by ID.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: deleteBudget
      parameters:
        - name: id
          in: path
          required: true
          description: Budget ID
          schema:
            type: string
      responses:
        '204':
          description: Budget deleted
        '404':
          description: Budget not found

  /api/v1/budgets/{id}/status:
    get:
      tags:
        - Cost Controls
      summary: Get budget status
      description: |
        Get real-time status of a budget including current usage,
        remaining amount, and whether the budget is exceeded.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: getBudgetStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Budget ID
          schema:
            type: string
      responses:
        '200':
          description: Budget status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatus'
              example:
                budget:
                  id: "monthly-budget"
                  name: "Monthly Production Budget"
                  limit_usd: 1000.00
                  period: "monthly"
                used_usd: 450.25
                remaining_usd: 549.75
                percentage: 45.025
                period_start: "2026-01-01T00:00:00Z"
                period_end: "2026-02-01T00:00:00Z"
                is_exceeded: false
                is_blocked: false
        '404':
          description: Budget not found

  /api/v1/budgets/{id}/alerts:
    get:
      tags:
        - Cost Controls
      summary: Get budget alerts
      description: |
        Get alerts triggered for a specific budget.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: getBudgetAlerts
      parameters:
        - name: id
          in: path
          required: true
          description: Budget ID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of alerts to return
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Budget alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAlertList'
        '404':
          description: Budget not found

  /api/v1/budgets/check:
    post:
      tags:
        - Cost Controls
      summary: Check budget before request
      description: |
        Check if a request should be allowed based on budget constraints.
        Returns whether the request is allowed and the applicable budget status.

        Enterprise only. Returns 403 Forbidden in Community edition.
      operationId: checkBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCheckRequest'
            example:
              org_id: "your-org-id"
              team_id: "engineering"
              agent_id: "support-bot"
      responses:
        '200':
          description: Budget check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCheckResponse'
              examples:
                allowed:
                  summary: Request allowed
                  value:
                    allowed: true
                blocked:
                  summary: Request blocked
                  value:
                    allowed: false
                    action: "block"
                    budget_id: "team-budget"
                    budget_name: "Engineering Team Budget"
                    used_usd: 520.00
                    limit_usd: 500.00
                    percentage: 104.0
                    message: "Budget 'Engineering Team Budget' exceeded - requests blocked"

  /api/v1/usage:
    get:
