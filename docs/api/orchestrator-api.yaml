  # Cost Controls API
  /api/v1/budgets:
    post:
      tags:
        - Cost Controls
      summary: Create a budget
      description: |
        Create a new budget with spending limits. Budgets can be scoped to
        organization, team, agent, workflow, or user level.

        Enterprise only. These routes are not registered in Community
        edition, which returns 404 Not Found.
      operationId: createBudget
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
            example:
              id: "monthly-budget"
              name: "Monthly Production Budget"
              scope: "organization"
              limit_usd: 1000.00
              period: "monthly"
              on_exceed: "warn"
              alert_thresholds: [50, 80, 100]
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Invalid budget configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Budget with this ID already exists
    get:
      tags:
        - Cost Controls
      summary: List budgets
      description: |
        List all budgets for the organization.

        Enterprise only. These routes are not registered in Community
        edition, which returns 404 Not Found.
      operationId: listBudgets
      parameters:
        - name: X-Org-ID
          in: header
          required: true
          description: Organization ID
          schema:
            type: string
        - name: scope
          in: query
          description: Filter by budget scope
          schema:
            type: string
            enum: [organization, team, agent, workflow, user]
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
