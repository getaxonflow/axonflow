          schema:
            type: string
        - name: X-Org-ID
          in: header
          required: false
          description: Fallback tenant identifier when X-Tenant-ID is absent
          schema:
            type: string
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                properties:
                  flipped_overdue:
                    type: integer
                    description: Number of notifications flipped to overdue
              example:
