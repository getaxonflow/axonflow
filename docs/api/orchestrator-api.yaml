  # ============================================================================
  # Unified Execution Tracking + Real-time Streaming (SSE)
  # ============================================================================

  /api/v1/unified/executions:
    get:
      tags:
        - Unified Executions
      summary: List executions (MAP plans + WCP workflows)
      description: |
        Lists unified executions across both MAP plans and WCP workflows,
        scoped to the tenant/org identified by the `X-Tenant-ID` and
        `X-Org-ID` headers. The page size is capped by the license tier's
        execution-history limit (at most 100 per page); out-of-range `limit`
        or `offset` values are silently ignored and the defaults used.
      operationId: listUnifiedExecutions
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
        - name: X-Org-ID
          in: header
          required: true
          description: Organization identifier for scoping results
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (default 20, max 100 or the tier history cap, whichever is lower)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of records to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: execution_type
          in: query
          required: false
          description: Filter by execution type
          schema:
            type: string
            enum: [map_plan, wcp_workflow]
        - name: status
          in: query
          required: false
          description: Filter by execution status
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled, aborted, expired]
      responses:
        '200':
          description: Execution list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedExecutionListResponse'
        '500':
          description: Failed to list executions

  /api/v1/unified/executions/{id}:
    get:
      tags:
        - Unified Executions
      summary: Get unified execution status
      description: |
        Returns the unified status record for a MAP plan or WCP workflow
        execution. The id is resolved across both subsystems (direct
        execution id, `plan_...` plan ids, `wf_`/`wcp_` workflow ids).
        Requires both `X-Tenant-ID` and `X-Org-ID`; a tenant/org mismatch
        returns 404 (not 403) to avoid a cross-tenant existence oracle.
      operationId: getUnifiedExecutionStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Execution id (or plan_/wf_/wcp_ prefixed subsystem id)
          schema:
            type: string
        - $ref: '#/components/parameters/TenantIDHeader'
        - name: X-Org-ID
          in: header
          required: true
          description: Organization identifier for scoping results
          schema:
            type: string
      responses:
        '200':
          description: Unified execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedExecutionStatus'
        '400':
          description: Missing execution id
        '401':
          description: Missing tenant or org identity headers
        '404':
          description: Execution not found (or belongs to another tenant/org)
        '500':
          description: Failed to resolve execution

  /api/v1/unified/executions/{id}/cancel:
    post:
      tags:
        - Unified Executions
      summary: Cancel a unified execution
      description: |
        Cancels a running MAP plan or WCP workflow through the unified API.
        The cancellation propagates to the owning subsystem (plan cancel or
        workflow abort). Cancelling an execution already in a terminal state
        returns 409.
      operationId: cancelUnifiedExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution id (or plan_/wf_/wcp_ prefixed subsystem id)
          schema:
            type: string
        - $ref: '#/components/parameters/TenantIDHeader'
        - name: X-Org-ID
          in: header
          required: true
          description: Organization identifier for scoping results
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Cancellation reason (defaults to "cancelled via unified API")
      responses:
        '200':
          description: |
            Execution cancelled; returns the refreshed unified status record
            (or a `{execution_id, status: "cancelled", message}` fallback if
            the post-cancel re-read fails).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedExecutionStatus'
        '400':
          description: Missing execution id or unknown execution type
        '401':
          description: Missing tenant or org identity headers
        '404':
          description: Execution not found (or belongs to another tenant/org)
        '409':
          description: Execution is already in a terminal state
        '500':
          description: Cancellation failed

  /api/v1/unified/executions/{id}/stream:
    get:
      tags:
        - Unified Executions
      summary: Stream execution status via SSE
      description: |
        Server-Sent Events stream for real-time execution status updates.
        Streams events for both MAP plan executions and WCP workflow executions.
        Community: Limited to 5 concurrent connections per tenant.
        Enterprise: Unlimited concurrent connections.
      operationId: streamExecutionStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
        - name: X-Org-ID
          in: header
          required: true
          description: |
            Organization identifier. Like X-Tenant-ID, required by the
            unified-execution tenant-ownership check; missing either header
            is a 401.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of execution events
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          description: Too many concurrent connections (Community edition limit)

  # ============================================================================
  # Media Governance Configuration
  # ============================================================================
  # NOTE: The former /api/v1/media/analyzers, /api/v1/media/analyzers/{name}/health
  # and POST /api/v1/media/analyze paths were removed from this spec — no such
  # routes exist in the orchestrator. Media governance runs inline on the LLM
  # request path (media content on /api/v1/process) and is configured via the
  # /api/v1/media-governance/* endpoints below.

  /api/v1/media-governance/config:
    get:
      tags: [Media Governance]
      summary: Get media governance configuration
      description: Returns the media governance configuration for the current tenant.
      operationId: getMediaGovernanceConfig
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Media governance configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Media Governance]
      summary: Update media governance configuration
      description: |
        Updates media governance configuration. Enterprise tier only.
        Community and Evaluation tiers receive a 403 TIER_RESTRICTED response.
        To toggle system media policies on/off (available to all tiers), use the
        Dynamic Policy API (/api/v1/dynamic-policies) instead.
      operationId: updateMediaGovernanceConfig
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaGovernanceConfigUpdate'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/media-governance/status:
    get:
      tags: [Media Governance]
      summary: Get media governance feature status
      description: Returns the media governance feature availability for the current license tier.
      operationId: getMediaGovernanceStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Media governance status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGovernanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/media-governance/audit/export:
    get:
      tags: [Media Governance]
      summary: Export media governance audit trail (Enterprise)
      description: |
        Exports the media governance audit trail (image analyses, policy
        actions, block decisions) for the tenant as JSON or CSV.

        **Enterprise only** — non-paid tiers receive 403
        (`ENTERPRISE_REQUIRED`). Tenant scope comes from the `X-Tenant-ID`
        header. The export is capped at 10,000 rows, newest first.
      operationId: exportMediaGovernanceAudit
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
        - name: from
          in: query
          required: false
          description: Window start (RFC3339). Defaults to 7 days ago.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Window end (RFC3339). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          required: false
          description: Export format
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: |
            Audit export. CSV columns: request_id, tenant_id, timestamp,
            media_type, blocked, policy_actions (JSON-encoded array).
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAuditRecord'
                  tenant_id:
                    type: string
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  count:
                    type: integer
            text/csv:
              schema:
                type: string
        '400':
          description: Missing X-Tenant-ID (MISSING_TENANT_ID) or invalid from/to/format
        '403':
          description: Requires Enterprise license (ENTERPRISE_REQUIRED)
        '500':
          description: Query failure (QUERY_ERROR)

  # Evaluation Tier Features

  /api/v1/policies/simulate:
    post:
      tags: [Policy Simulation]
      summary: Simulate all active policies (Evaluation+)
      description: |
        Runs all active policies against the provided input as a dry run.
        No audit writes or action application. Requires Evaluation or Enterprise license.
      operationId: simulatePolicies
      security:
        - BearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: The input text to simulate against all policies
                request_type:
                  type: string
                  description: Request type (defaults to "simulation")
                user:
                  $ref: '#/components/schemas/UserContext'
                client:
                  $ref: '#/components/schemas/ClientContext'
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Simulation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  applied_policies:
                    type: array
                    items:
                      type: string
                  risk_score:
                    type: number
                  required_actions:
                    type: array
                    items:
                      type: string
                  processing_time_ms:
                    type: integer
                  total_policies:
                    type: integer
                  dry_run:
                    type: boolean
                    enum: [true]
                  simulated_at:
                    type: string
                    format: date-time
                  tier:
                    type: string
                  daily_usage:
                    type: object
                    properties:
                      used:
                        type: integer
                      limit:
                        type: integer
        '403':
          description: Feature requires Evaluation or Enterprise license
        '429':
          description: Daily simulation limit exceeded

  /api/v1/policies/impact-report:
    post:
      tags: [Policy Simulation]
      summary: Generate impact report for a policy (Evaluation+)
      description: |
        Tests a single policy against multiple inputs and returns aggregate statistics.
        Requires Evaluation or Enterprise license.
      operationId: generateImpactReport
      security:
        - BearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, inputs]
              properties:
                policy_id:
                  type: string
                inputs:
                  type: array
                  items:
                    type: object
                    required: [query]
                    properties:
                      query:
                        type: string
                      request_type:
                        type: string
                      user:
                        type: object
                        additionalProperties: true
                      context:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          description: Impact report results
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy_id:
                    type: string
                  total_inputs:
                    type: integer
                  matched:
                    type: integer
                  blocked:
                    type: integer
                  match_rate:
                    type: number
                  block_rate:
                    type: number
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        input_index:
                          type: integer
                        matched:
                          type: boolean
                        blocked:
                          type: boolean
                        actions:
                          type: array
                          items:
                            type: string
                  processing_time_ms:
                    type: integer
                  generated_at:
                    type: string
                    format: date-time
                  tier:
                    type: string
        '400':
          description: Bad request (missing fields or input limit exceeded)
        '403':
          description: Feature requires Evaluation or Enterprise license

  /api/v1/policies/conflicts:
    post:
      tags: [Policy Simulation]
      summary: Detect policy conflicts (Evaluation+)
      description: |
        Analyzes active policies for contradictions, shadows, and redundancies.
        Optionally filter to conflicts involving a specific policy.
        Requires Evaluation or Enterprise license.
      operationId: detectPolicyConflicts
      security:
        - BearerAuth: []
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy_id:
                  type: string
                  description: Optional — filter to conflicts involving this policy
      responses:
        '200':
          description: Conflict analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        policy_a:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            type:
                              type: string
                        policy_b:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            type:
                              type: string
                        conflict_type:
                          type: string
                          enum: [contradictory_action, shadow, redundant]
                        description:
                          type: string
                        severity:
                          type: string
                          enum: [high, medium, low]
                        overlapping_field:
                          type: string
                  total_policies:
                    type: integer
                  conflict_count:
                    type: integer
                  checked_at:
                    type: string
                    format: date-time
                  tier:
                    type: string
        '403':
          description: Feature requires Evaluation or Enterprise license
        '429':
          description: Daily simulation limit exceeded

  /api/v1/evidence/export:
    post:
      tags: [Evidence Export]
      summary: Export evidence pack (Evaluation+)
      description: |
        Exports audit logs, workflow steps, and HITL approvals as a bundled JSON pack.
        Evaluation tier exports include a "NOT FOR REGULATORY SUBMISSION" watermark.
        Enterprise exports are clean (no watermark).
      operationId: exportEvidence
      security:
        - BearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date:
                  type: string
                  description: Start date (YYYY-MM-DD or RFC3339)
                end_date:
                  type: string
                  description: End date (defaults to now)
                types:
                  type: array
                  items:
                    type: string
                    enum: [audit_logs, workflow_steps, hitl_approvals]
                  description: Evidence types to include (defaults to all)
                limit:
                  type: integer
                  description: Maximum records (capped by tier limit)
      responses:
        '200':
          description: Evidence export bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                  tenant_id:
                    type: string
                  tier:
                    type: string
                  date_range:
                    type: object
                    properties:
                      start:
                        type: string
                        format: date-time
                      end:
                        type: string
                        format: date-time
                  disclaimer:
                    type: string
                    description: Watermark for Evaluation tier exports
                  record_count:
                    type: integer
                  audit_logs:
                    type: array
                    items:
                      type: object
                  workflow_steps:
                    type: array
                    items:
                      type: object
                  hitl_approvals:
                    type: array
                    items:
                      type: object
                  exported_at:
                    type: string
                    format: date-time
                  daily_usage:
                    type: object
                    properties:
                      used:
                        type: integer
                      limit:
                        type: integer
        '403':
          description: Feature requires Evaluation or Enterprise license
        '429':
          description: Daily export limit exceeded

  /api/v1/evidence/summary:
    get:
      tags: [Evidence Export]
      summary: Get evidence summary (Evaluation+)
      description: |
        Returns counts of evidence records by type within the tier's lookback window.
      operationId: getEvidenceSummary
      security:
        - BearerAuth: []
        - basicAuth: []
      responses:
        '200':
          description: Evidence summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  tier:
                    type: string
                  window_days:
                    type: integer
                  counts:
                    type: object
                    properties:
                      audit_logs:
                        type: integer
                      workflow_steps:
                        type: integer
                      hitl_approvals:
                        type: integer
                      total:
                        type: integer
                  generated_at:
                    type: string
                    format: date-time
                  disclaimer:
                    type: string
        '403':
          description: Feature requires Evaluation or Enterprise license

components:
  parameters:
    # Reusable header / query parameters referenced from path operations
    # via the standard OpenAPI components.parameters mechanism. Each
    # declaration mirrors the inline shape used in older endpoints (e.g.
    # the inline X-Org-ID at line ~2415) so behaviour is identical
    # whether a path uses the ref or repeats the definition inline.
    TenantIDHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: |
        Tenant identifier scoping the request. The AxonFlow Agent gateway
        sets this header after authentication; the orchestrator fails closed
        when it is absent (401 on audit/decision endpoints, 400 on others —
        see each operation). Clients cannot widen their scope through it:
        handlers force the tenant filter from this header, never from the
        request body.
      schema:
        type: string
      example: "travel-us"

    OrgIDHeader:
      name: X-Org-ID
      in: header
      required: false
      description: |
        Organization identifier. Falls back to authenticated org from
        the Basic auth client when omitted. Surface for callers that
        need to override (e.g. cross-org admin reads in Enterprise).
      schema:
        type: string
      example: "travel-us"

    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: |
        Caller identity. Defaults to the authenticated user resolved
        from the request token when omitted. Surface for service-mode
        callers that proxy on behalf of multiple users.
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of records to return. Defaults vary by
        endpoint; see per-endpoint description for the cap.
      schema:
        type: integer
        minimum: 1
        default: 100

    OffsetParam:
      name: offset
      in: query
      required: false
      description: |
        Number of records to skip from the start of the result set.
        Pair with `limit` to walk multi-page reads.
      schema:
        type: integer
        minimum: 0
        default: 0

    OrgIDQuery:
      name: org_id
      in: query
      required: false
      description: |
        Organization filter for list reads. Query-string form of the
        X-Org-ID header used elsewhere — handlers fall back to the
        authenticated org when omitted.
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      description: |
        Besides the component booleans, the health body always carries the
        platform capability list (`capabilities`), the per-language SDK
        version pins (`sdk_compatibility`) and the per-plugin version pins
        (`plugin_compatibility`). The pin maps are additionalProperties-style
        maps keyed by SDK language / canonical plugin id; the exact key sets
        evolve per release and are not enumerated here.
      properties:
        status:
          type: string
          enum: [healthy, starting, unhealthy]
        service:
          type: string
        version:
          type: string
          description: |
            Platform version, preferring the value baked into the binary at
            build time and falling back to AXONFLOW_VERSION for dev builds
          example: "9.8.0"
        timestamp:
          type: string
          format: date-time
        capabilities:
          type: array
          description: List of platform capabilities with the version that introduced them
          items:
            $ref: '#/components/schemas/PlatformCapability'
        sdk_compatibility:
          $ref: '#/components/schemas/SDKCompatInfo'
        plugin_compatibility:
          $ref: '#/components/schemas/PluginCompatInfo'
        components:
          type: object
          properties:
            policy_engine:
              type: boolean
            llm_router:
              type: boolean
            response_processor:
              type: boolean
            audit_logger:
              type: boolean
            workflow_engine:
              type: boolean
            planning_engine:
              type: boolean
            result_aggregator:
              type: boolean
        features:
          type: object
          properties:
            multi_agent_planning:
              type: boolean

    PlatformCapability:
      type: object
      properties:
        name:
          type: string
          description: Capability identifier
          example: "workflow_control"
        since:
          type: string
          description: Platform version that introduced this capability
          example: "4.3.0"
        description:
          type: string
          description: Human-readable description
          example: "WCP workflow lifecycle management"

    SDKCompatInfo:
      type: object
      properties:
        min_sdk_version:
          type: object
          description: |
            Minimum SDK version compatible with this platform, keyed by SDK
            language (e.g. go, python, typescript, java, rust)
          additionalProperties:
            type: string
          example:
            python: "8.0.0"
        recommended_sdk_version:
          type: object
          description: |
            Recommended SDK version for full feature coverage, keyed by SDK
            language
          additionalProperties:
            type: string
          example:
            python: "8.5.1"

    PluginCompatInfo:
      type: object
      description: |
        Plugin version pins, mirroring SDKCompatInfo. Keys are the canonical
        plugin ids (e.g. openclaw, claude-code, cursor, codex,
        claude-desktop). Versions below the minimum receive a
        downgrade-warning header on every governed call.
      properties:
        min_plugin_version:
          type: object
          additionalProperties:
            type: string
        recommended_plugin_version:
          type: object
          additionalProperties:
            type: string

    PlanStatusResponse:
      type: object
      description: |
        Unified execution status for MAP plans. Provides step-level progress tracking,
        duration, and cost information. Compatible with the unified ExecutionStatus schema.
      required:
        - plan_id
        - status
        - query
        - domain
        - total_steps
      properties:
        plan_id:
          type: string
          description: Original plan identifier
          example: "plan_1705312200_abc123"
        execution_id:
          type: string
          description: Unified execution ID for cross-system tracking
          example: "plan_xyz789"
        status:
          type: string
          enum: [pending, executing, completed, failed, expired, cancelled, aborted, awaiting_approval]
          description: Current execution status
          example: "executing"
        query:
          type: string
          description: Original user query that created the plan
          example: "Research competitor pricing strategies"
        domain:
          type: string
          description: Domain classification of the plan
          example: "finance"
        total_steps:
          type: integer
          description: Total number of steps in the plan
          example: 3
        completed_steps:
          type: integer
          description: Number of completed steps
          example: 1
        progress_percent:
          type: number
          format: float
          description: Completion percentage (0-100)
          example: 33.33
        duration:
          type: string
          description: Human-readable elapsed duration
          example: "15s"
        estimated_cost_usd:
          type: number
          format: float
          description: Estimated total cost in USD
          example: 0.05
        actual_cost_usd:
          type: number
          format: float
          description: Actual cost incurred so far in USD
          example: 0.042
        created_at:
          type: string
          format: date-time
          description: When the plan was created
        started_at:
          type: string
          format: date-time
          description: When execution started
        completed_at:
          type: string
          format: date-time
          description: When execution completed (if terminal)
        expires_at:
          type: string
          format: date-time
          description: When the plan expires
        error:
          type: string
          description: Error message if status is failed
        steps:
          type: array
          description: Detailed status of each step
          items:
            $ref: '#/components/schemas/StepStatus'
        metadata:
          type: object
          description: Additional plan metadata
          additionalProperties: true

    StepStatus:
      type: object
      description: Status of an individual execution step
      required:
        - step_id
        - step_index
        - step_name
        - status
      properties:
        step_id:
          type: string
          description: Unique step identifier
          example: "step_0_analyze"
        step_index:
          type: integer
          description: Position in the execution sequence (0-based)
          example: 0
        step_name:
          type: string
          description: Human-readable step name
          example: "analyze"
        step_type:
          type: string
          enum: [llm_call, tool_call, connector_call, human_task, synthesis, action, gate]
          description: Type of step operation
          example: "llm_call"
        status:
          type: string
          enum: [pending, running, completed, failed, skipped, blocked, approval]
          description: Current step status
          example: "completed"
        duration:
          type: string
          description: Human-readable step duration
          example: "8s"
        started_at:
          type: string
          format: date-time
          description: When the step started
        ended_at:
          type: string
          format: date-time
          description: When the step ended
        model:
          type: string
          description: LLM model used (for llm_call steps)
          example: "gpt-4"
        provider:
          type: string
          description: LLM provider (for llm_call steps)
          example: "openai"
        cost_usd:
          type: number
          format: float
          description: Cost of this step in USD
          example: 0.04
        input_tokens:
          type: integer
          description: Number of input tokens (for LLM steps)
        output_tokens:
          type: integer
          description: Number of output tokens (for LLM steps)
        error:
          type: string
          description: Error message if step failed

    MetricsResponse:
      type: object
      properties:
        orchestrator_metrics:
          type: object
          properties:
            uptime_seconds:
              type: number
            total_requests:
              type: integer
            success_requests:
              type: integer
            failed_requests:
              type: integer
            blocked_requests:
              type: integer
            success_rate:
              type: number
            rps:
              type: number
            error_rate_per_sec:
              type: number
            dynamic_policy_eval_p50_ms:
              type: number
            dynamic_policy_eval_p95_ms:
              type: number
            dynamic_policy_eval_p99_ms:
              type: number
            llm_routing_p50_ms:
              type: number
            llm_routing_p95_ms:
              type: number
            llm_routing_p99_ms:
              type: number
        health:
          type: object
          properties:
            up:
              type: integer
            consecutive_errors:
              type: integer
        request_types:
          type: object
          additionalProperties:
            type: object
        providers:
          type: object
          additionalProperties:
            type: object
            properties:
              total_calls:
                type: integer
              success_calls:
                type: integer
              failed_calls:
                type: integer
              total_tokens:
                type: integer
              total_cost:
                type: number
              p99_ms:
                type: number
        timestamp:
          type: string
          format: date-time

    OrchestratorRequest:
      type: object
      required:
        - query
        - user
        - client
      properties:
        request_id:
          type: string
          description: Unique request identifier
        query:
          type: string
          description: Query to process
        request_type:
          type: string
          description: Type of request
        skip_llm:
          type: boolean
          default: false
          description: Skip LLM calls (for testing)
        user:
          $ref: '#/components/schemas/UserContext'
        client:
          $ref: '#/components/schemas/ClientContext'
        context:
          type: object
          description: |
            Free-form request metadata. Routing controls:
            - `provider` (string): preferred provider
            - `strict_provider` (boolean, optional): when true, hard-pins `provider` and disables fallback
              for this request. Default is false unless server env `LLM_STRICT_PROVIDER_DEFAULT=true`.
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaContentRequest'
          maxItems: 10
          description: Optional media content (images) for multimodal governance analysis

    UserContext:
      type: object
      properties:
        id:
