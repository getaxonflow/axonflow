openapi: 3.0.3
info:
  title: AxonFlow MAS FEAT Compliance API
  description: |
    > **Enterprise only** — the MAS FEAT module is compiled only into Enterprise
    > builds (`//go:build enterprise`). Community builds register **no**
    > `/api/v1/masfeat/*` routes; every request below returns 404 on a
    > community deployment.

    REST API for MAS FEAT (Monetary Authority of Singapore) compliance module.

    This module implements the MAS AI Risk Management Guidelines 2025 and supports
    the FEAT (Fairness, Ethics, Accountability, Transparency) assessment framework
    for AI systems in Singapore's financial services industry.

    ## Key Features

    - **AI System Registry**: Register and manage AI systems with 3-dimensional risk ratings
    - **Materiality Classification**: Automatic calculation based on Impact × Complexity × Reliance
    - **FEAT Assessments**: Structured assessments covering 4 pillars (Fairness, Ethics, Accountability, Transparency)
    - **Kill Switch**: Emergency disable mechanism with auto-trigger thresholds
    - **Singapore PII Detection**: NRIC, FIN, UEN pattern detection with Enterprise checksum validation

    ## Access Path

    The single production entry point is the AxonFlow agent, which proxies every
    request under the `/api/v1/masfeat` path prefix to the orchestrator, where
    the module's routes are registered. Direct orchestrator access (port 8081)
    is internal-only.

    ## Authentication and Identity Headers

    - `X-Org-ID` — organization identifier (**required**; `X-Tenant-ID` is
      accepted as a fallback). Requests without either header are rejected with
      **HTTP 400**.
    - `X-User-ID` — acting user for audit attribution (`X-User-Email` is
      accepted as a fallback). Optional; when absent, actions are attributed to
      `"system"`.

    ## Risk Rating System

    The 3-dimensional risk rating system evaluates:
    - **Impact** (1-5): Potential impact on customers
    - **Complexity** (1-5): Technical complexity of the AI system
    - **Reliance** (1-5): Degree of human oversight vs automation

    ### Materiality Classification

    | Sum of Ratings | Classification |
    |----------------|----------------|
    | >= 12          | High           |
    | >= 8           | Medium         |
    | < 8            | Low            |

    ## Assessment Lifecycle

    ```
    pending → in_progress → completed → approved
                                     → rejected
    ```

    - Recording any pillar score on a `pending` assessment auto-transitions it
      to `in_progress`.
    - `submit` moves a `pending` or `in_progress` assessment to `completed`;
      all four pillar scores must be recorded first.
    - `approve` / `reject` are only valid on `completed` assessments.

    ## Pagination

    List endpoints accept `limit` and `offset`. The limit defaults to 50 and is
    capped server-side at 1000.

    ## Enterprise Features

    - Singapore PII checksum validation (NRIC, FIN)
    - Advanced audit logging with 7-year retention
    - Integration with Customer Portal UI

  version: 2.0.0
  contact:
    name: AxonFlow Support
    url: https://getaxonflow.com/support
  license:
    name: Business Source License 1.1
    url: https://github.com/getaxonflow/axonflow/blob/main/LICENSE

servers:
  - url: https://agent.getaxonflow.com
    description: Production (via AxonFlow agent proxy)
  - url: http://localhost:8080
    description: Local Development (agent proxy)
  - url: http://localhost:8081
    description: Local Development (orchestrator direct, internal only)

tags:
  - name: Registry
    description: AI System Registry management
  - name: Assessments
    description: FEAT Assessment lifecycle
  - name: Kill Switch
    description: Emergency system disable mechanism

paths:
  /api/v1/masfeat/registry:
    post:
      summary: Register AI System
      description: |
        Register a new AI system in the MAS FEAT registry.

        The system will be created with `draft` status and materiality
        will be automatically calculated based on risk ratings.
      operationId: registerSystem
      tags:
        - Registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistryRequest'
            example:
              system_id: "credit-scoring-ai-v1"
              system_name: "Credit Scoring AI"
              description: "AI system for automated credit scoring decisions"
              use_case: "credit_scoring"
              risk_rating_impact: 4
              risk_rating_complexity: 3
              risk_rating_reliance: 5
              owner_team: "Risk Management"
              owner_email: "risk-lead@example.com"
              data_sources:
                - "credit_bureau"
                - "transaction_history"
              model_type: "gradient_boosting"
              version: "1.0.0"
      responses:
        '201':
          description: System registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISystemRegistry'
        '400':
          description: Invalid request or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: System already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List AI Systems
      description: |
        List AI systems in the registry for the organization.

        The response wraps the results in an object with a `systems` array
        and a `count` of returned items.
      operationId: listSystems
      tags:
        - Registry
      parameters:
        - name: status
          in: query
          description: Filter by system status
          schema:
            type: string
            enum: [draft, active, suspended, retired]
        - name: limit
          in: query
          description: Maximum number of results (default 50, capped at 1000)
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of AI systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryListResponse'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/registry/summary:
    get:
      summary: Get Registry Summary
      description: Get summary statistics for the AI system registry.
      operationId: getRegistrySummary
      tags:
        - Registry
      responses:
        '200':
          description: Registry summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrySummary'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/registry/{id}:
    get:
      summary: Get AI System
      description: Get details of a specific AI system by its registry record ID.
      operationId: getSystem
      tags:
        - Registry
      parameters:
        - $ref: '#/components/parameters/RegistryID'
      responses:
        '200':
          description: AI system details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISystemRegistry'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: System not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update AI System
      description: |
        Update an AI system's details. Materiality will be recalculated
        if risk ratings are changed.

        Status transitions (for example `draft` → `active`, or `active` →
        `suspended`) are performed by setting the `status` field in this
        request; there is no separate activation endpoint.
      operationId: updateSystem
      tags:
        - Registry
      parameters:
        - $ref: '#/components/parameters/RegistryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistryRequest'
            example:
              status: "active"
              risk_rating_impact: 5
              owner_email: "new-owner@example.com"
      responses:
        '200':
          description: System updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISystemRegistry'
        '400':
          description: Invalid request or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: System not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Retire AI System
      description: |
        Retire an AI system. This sets the status to `retired` and
        preserves the record for audit purposes.
      operationId: retireSystem
      tags:
        - Registry
      parameters:
        - $ref: '#/components/parameters/RegistryID'
      responses:
        '200':
          description: System retired successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetireSystemResponse'
              example:
                message: "System retired successfully"
                id: "a3a5b3a0-8f1e-4a67-9a5e-2f4f4b1c2d3e"
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: System not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/assessments:
    post:
      summary: Create FEAT Assessment
      description: |
        Create a new FEAT assessment for an AI system.
        The system must exist in the registry.
      operationId: createAssessment
      tags:
        - Assessments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
            example:
              system_id: "credit-scoring-ai-v1"
              assessment_type: "initial"
              assessors:
                - "assessor1@example.com"
                - "assessor2@example.com"
      responses:
        '201':
          description: Assessment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Invalid request or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: System not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List FEAT Assessments
      description: |
        List FEAT assessments for the organization.

        The response wraps the results in an object with an `assessments`
        array and a `count` of returned items.
      operationId: listAssessments
      tags:
        - Assessments
      parameters:
        - name: system_id
          in: query
          description: Filter by system ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by assessment status
          schema:
            type: string
            enum: [pending, in_progress, completed, approved, rejected]
        - name: limit
          in: query
          description: Maximum number of results (default 50, capped at 1000)
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentListResponse'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/assessments/{id}:
    get:
      summary: Get FEAT Assessment
      description: Get details of a specific FEAT assessment.
      operationId: getAssessment
      tags:
        - Assessments
      parameters:
        - $ref: '#/components/parameters/AssessmentID'
      responses:
        '200':
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update FEAT Assessment
      description: |
        Update a FEAT assessment with pillar scores, structured pillar
        details, findings, and recommendations. Only `pending` and
        `in_progress` assessments can be updated.

        When scores are first recorded, the assessment auto-transitions
        from `pending` to `in_progress`. The overall score is automatically
        calculated when all four pillar scores are provided.
      operationId: updateAssessment
      tags:
        - Assessments
      parameters:
        - $ref: '#/components/parameters/AssessmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssessmentRequest'
            example:
              fairness_score: 85.0
              ethics_score: 90.0
              accountability_score: 80.0
              transparency_score: 75.0
              fairness_details:
                score: 85.0
                status: "compliant"
                notes: "Bias testing completed with 0.05% disparity"
              findings:
                - id: "finding-001"
                  pillar: "fairness"
                  severity: "minor"
                  category: "bias"
                  description: "Minor bias detected in age group 65+"
                  remediation: "Implement additional bias mitigation"
                  status: "open"
              recommendations:
                - "Implement additional bias mitigation"
      responses:
        '200':
          description: Assessment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Invalid request, assessment not editable, or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/assessments/{id}/submit:
    post:
      summary: Submit Assessment for Review
      description: |
        Submit a FEAT assessment for review, transitioning it to `completed`.
        The assessment must be in `pending` or `in_progress` status with all
        four pillar scores recorded. No request body is expected; the
        submitter is taken from the `X-User-ID` / `X-User-Email` header.
      operationId: submitAssessment
      tags:
        - Assessments
      parameters:
        - $ref: '#/components/parameters/AssessmentID'
      responses:
        '200':
          description: Assessment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Cannot submit assessment (invalid state or missing scores)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/assessments/{id}/approve:
    post:
      summary: Approve Assessment
      description: |
        Approve a completed FEAT assessment. No request body is expected;
        the approver identity is taken from the `X-User-ID` / `X-User-Email`
        header. Approval also stamps the registered system's
        `last_assessment_date` and computes `next_assessment_due` from its
        materiality (high: 6 months, medium: 1 year, low: 2 years).
      operationId: approveAssessment
      tags:
        - Assessments
      parameters:
        - $ref: '#/components/parameters/AssessmentID'
      responses:
        '200':
          description: Assessment approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Cannot approve assessment (invalid state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/assessments/{id}/reject:
    post:
      summary: Reject Assessment
      description: |
        Reject a completed FEAT assessment. The reviewer identity is taken
        from the `X-User-ID` / `X-User-Email` header; the body carries only
        the rejection reason.
      operationId: rejectAssessment
      tags:
        - Assessments
      parameters:
        - $ref: '#/components/parameters/AssessmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAssessmentRequest'
            example:
              reason: "Fairness evidence insufficient for high-materiality system"
      responses:
        '200':
          description: Assessment rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEATAssessment'
        '400':
          description: Cannot reject assessment (invalid state or missing reason)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/killswitch/{system_id}:
    get:
      summary: Get Kill Switch Status
      description: |
        Get the kill switch status for an AI system.
        Creates a new kill switch with default settings if one doesn't exist.
      operationId: getKillSwitch
      tags:
        - Kill Switch
      parameters:
        - $ref: '#/components/parameters/KillSwitchSystemID'
      responses:
        '200':
          description: Kill switch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/killswitch/{system_id}/configure:
    post:
      summary: Configure Kill Switch Thresholds
      description: |
        Configure auto-trigger thresholds for the kill switch.

        When enabled, the kill switch will automatically trigger if:
        - Accuracy falls below `accuracy_threshold`
        - Bias score exceeds `bias_threshold`
        - Error rate exceeds `error_rate_threshold`

        Threshold evaluation runs inside the platform's monitoring loop;
        there is no public endpoint for submitting metrics.
      operationId: configureKillSwitch
      tags:
        - Kill Switch
      parameters:
        - $ref: '#/components/parameters/KillSwitchSystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureKillSwitchRequest'
            example:
              auto_trigger_enabled: true
              accuracy_threshold: 0.85
              bias_threshold: 0.15
              error_rate_threshold: 0.05
      responses:
        '200':
          description: Kill switch configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
        '400':
          description: Invalid threshold values or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/killswitch/{system_id}/trigger:
    post:
      summary: Manually Trigger Kill Switch
      description: |
        Manually trigger the kill switch for an AI system. The person
        triggering is taken from the `X-User-ID` / `X-User-Email` header.
      operationId: triggerKillSwitch
      tags:
        - Kill Switch
      parameters:
        - $ref: '#/components/parameters/KillSwitchSystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerKillSwitchRequest'
            example:
              reason: "Model drift detected in production scoring"
      responses:
        '200':
          description: Kill switch triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitchActionResponse'
              example:
                message: "Kill switch triggered successfully"
                kill_switch:
                  system_id: "credit-scoring-ai-v1"
                  status: "triggered"
        '400':
          description: Invalid request or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kill switch already triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/killswitch/{system_id}/restore:
    post:
      summary: Restore Kill Switch
      description: |
        Restore a triggered kill switch back to enabled status. The person
        restoring is taken from the `X-User-ID` / `X-User-Email` header.
      operationId: restoreKillSwitch
      tags:
        - Kill Switch
      parameters:
        - $ref: '#/components/parameters/KillSwitchSystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreKillSwitchRequest'
            example:
              reason: "Model retrained and revalidated"
      responses:
        '200':
          description: Kill switch restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitchActionResponse'
              example:
                message: "Kill switch restored successfully"
                kill_switch:
                  system_id: "credit-scoring-ai-v1"
                  status: "enabled"
        '400':
          description: Kill switch not in triggered state or missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Kill switch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/masfeat/killswitch/{system_id}/history:
    get:
      summary: Get Kill Switch History
      description: |
        Get the state-change history for a kill switch.

        The response wraps the results in an object with a `history` array
        and a `count` of returned items.
      operationId: getKillSwitchHistory
      tags:
        - Kill Switch
      parameters:
        - $ref: '#/components/parameters/KillSwitchSystemID'
        - name: limit
          in: query
          description: Maximum number of results (default 50)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Kill switch state-change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitchHistoryResponse'
        '400':
          description: Missing X-Org-ID / X-Tenant-ID header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    RegistryID:
      name: id
      in: path
      required: true
      description: Registry record ID (UUID assigned at registration, not the caller-chosen `system_id`)
      schema:
        type: string
        format: uuid
    AssessmentID:
      name: id
      in: path
      required: true
      description: Assessment record ID (UUID)
      schema:
        type: string
        format: uuid
    KillSwitchSystemID:
      name: system_id
      in: path
      required: true
      description: Caller-chosen AI system identifier (the `system_id` used at registration)
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    CreateRegistryRequest:
      type: object
      required:
        - system_id
        - system_name
        - use_case
        - risk_rating_impact
        - risk_rating_complexity
        - risk_rating_reliance
        - owner_team
        - owner_email
      properties:
        system_id:
          type: string
          description: Unique identifier for the AI system
        system_name:
          type: string
          description: Human-readable name
        description:
          type: string
          description: Description of the AI system
        use_case:
          type: string
          enum: [credit_scoring, robo_advisory, insurance_underwriting, trading_algorithm, aml_cft, customer_service, fraud_detection, other]
          description: Primary use case category
        risk_rating_impact:
          type: integer
          minimum: 1
          maximum: 5
          description: Customer impact rating (1-5)
        risk_rating_complexity:
          type: integer
          minimum: 1
          maximum: 5
          description: Model complexity rating (1-5)
        risk_rating_reliance:
          type: integer
          minimum: 1
          maximum: 5
          description: Human reliance rating (1-5)
        owner_team:
          type: string
          description: Team responsible for the system
        owner_email:
          type: string
          description: Email of the system owner
        data_sources:
          type: array
          items:
            type: string
          description: Data sources consumed by the system
        model_type:
          type: string
          description: Model type (e.g. gradient_boosting, llm, rules_engine)
        version:
          type: string
          description: System/model version

    UpdateRegistryRequest:
      type: object
      properties:
        system_name:
          type: string
        description:
          type: string
        use_case:
          type: string
          enum: [credit_scoring, robo_advisory, insurance_underwriting, trading_algorithm, aml_cft, customer_service, fraud_detection, other]
        status:
          type: string
          enum: [draft, active, suspended, retired]
          description: |
            Target system status. Status transitions (e.g. activation) are
            performed via this field; there is no separate activation endpoint.
        risk_rating_impact:
          type: integer
          minimum: 1
          maximum: 5
        risk_rating_complexity:
          type: integer
          minimum: 1
          maximum: 5
        risk_rating_reliance:
          type: integer
          minimum: 1
          maximum: 5
        owner_team:
          type: string
        owner_email:
          type: string
        data_sources:
          type: array
          items:
            type: string
        model_type:
          type: string
        version:
          type: string

    AISystemRegistry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Registry record ID
        org_id:
          type: string
        system_id:
          type: string
          description: Caller-chosen AI system identifier
        system_name:
          type: string
        description:
          type: string
        use_case:
          type: string
          enum: [credit_scoring, robo_advisory, insurance_underwriting, trading_algorithm, aml_cft, customer_service, fraud_detection, other]
        status:
          type: string
          enum: [draft, active, suspended, retired]
        risk_rating_impact:
          type: integer
          minimum: 1
          maximum: 5
        risk_rating_complexity:
          type: integer
          minimum: 1
          maximum: 5
        risk_rating_reliance:
          type: integer
          minimum: 1
          maximum: 5
        materiality_classification:
          type: string
          enum: [high, medium, low]
          description: |
            Materiality classification computed from the 3-dimensional risk rating
            (impact, complexity, reliance) per MAS AI Risk Management Guidelines 2025.
        owner_team:
          type: string
        owner_email:
          type: string
        data_sources:
          type: array
          items:
            type: string
        model_type:
          type: string
        version:
          type: string
        deployment_date:
          type: string
          format: date-time
        last_assessment_date:
          type: string
          format: date-time
        next_assessment_due:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_by:
          type: string

    RegistryListResponse:
      type: object
      properties:
        systems:
          type: array
          items:
            $ref: '#/components/schemas/AISystemRegistry'
        count:
          type: integer
          description: Number of systems returned

    RetireSystemResponse:
      type: object
      properties:
        message:
          type: string
          example: "System retired successfully"
        id:
          type: string
          description: Registry record ID of the retired system

    RegistrySummary:
      type: object
      properties:
        org_id:
          type: string
        total_systems:
          type: integer
        active_systems:
          type: integer
        high_materiality:
          type: integer
        medium_materiality:
          type: integer
        low_materiality:
          type: integer
        assessments_due:
          type: integer
        kill_switches_triggered:
          type: integer

    CreateAssessmentRequest:
      type: object
      required:
        - system_id
      properties:
        system_id:
          type: string
          description: ID of the AI system to assess
        assessment_type:
          type: string
          enum: [initial, periodic, ad_hoc]
          default: periodic
          description: Type of assessment
        assessors:
          type: array
          items:
            type: string
          description: List of assessor emails

    UpdateAssessmentRequest:
      type: object
      properties:
        fairness_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Fairness pillar score (0-100)
        ethics_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Ethics pillar score (0-100)
        accountability_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Accountability pillar score (0-100)
        transparency_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Transparency pillar score (0-100)
        fairness_details:
          $ref: '#/components/schemas/PillarAssessment'
        ethics_details:
          $ref: '#/components/schemas/PillarAssessment'
        accountability_details:
          $ref: '#/components/schemas/PillarAssessment'
        transparency_details:
          $ref: '#/components/schemas/PillarAssessment'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        recommendations:
          type: array
          items:
            type: string
        assessors:
          type: array
          items:
            type: string

    RejectAssessmentRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Rejection reason

    FEATAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        system_id:
          type: string
        assessment_type:
          type: string
          enum: [initial, periodic, ad_hoc]
        status:
          type: string
          enum: [pending, in_progress, completed, approved, rejected]
        version:
          type: integer
          description: Assessment record version
        assessment_date:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        fairness_score:
          type: number
          format: double
        ethics_score:
          type: number
          format: double
        accountability_score:
          type: number
          format: double
        transparency_score:
          type: number
          format: double
        overall_score:
          type: number
          format: double
          description: Average of the four pillar scores; computed once all four are recorded
        fairness_details:
          $ref: '#/components/schemas/PillarAssessment'
        ethics_details:
          $ref: '#/components/schemas/PillarAssessment'
        accountability_details:
          $ref: '#/components/schemas/PillarAssessment'
        transparency_details:
          $ref: '#/components/schemas/PillarAssessment'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        recommendations:
          type: array
          items:
            type: string
        assessors:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        submitted_by:
          type: string
        approved_at:
          type: string
          format: date-time
        approved_by:
          type: string
        rejected_at:
          type: string
          format: date-time
        rejected_by:
          type: string
        rejection_reason:
          type: string

    AssessmentListResponse:
      type: object
      properties:
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/FEATAssessment'
        count:
          type: integer
          description: Number of assessments returned

    PillarAssessment:
      type: object
      description: Structured detail for a single FEAT pillar
      properties:
        score:
          type: number
          format: double
          description: Pillar score (0-100)
        status:
          type: string
          enum: [compliant, partial, non_compliant]
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionAssessment'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        notes:
          type: string

    CriterionAssessment:
      type: object
      description: Assessment of a specific FEAT criterion
      properties:
        criterion_id:
          type: string
        name:
          type: string
        description:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [met, partial, not_met, not_applicable]
        evidence:
          type: string
        notes:
          type: string

    EvidenceItem:
      type: object
      description: Evidence supporting FEAT assessment claims
      properties:
        id:
          type: string
        type:
          type: string
          enum: [document, test_result, audit_log, model_card]
        title:
          type: string
        description:
          type: string
        file_path:
          type: string
        url:
          type: string
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: string

    Finding:
      type: object
      description: A FEAT assessment finding
      properties:
        id:
          type: string
        pillar:
          type: string
          enum: [fairness, ethics, accountability, transparency]
        severity:
          type: string
          enum: [critical, major, minor, observation]
        category:
          type: string
        description:
          type: string
        remediation:
          type: string
        status:
          type: string
          enum: [open, resolved, accepted]
        due_date:
          type: string
          format: date-time

    ConfigureKillSwitchRequest:
      type: object
      properties:
        auto_trigger_enabled:
          type: boolean
          description: Enable automatic triggering on threshold breach
        accuracy_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Minimum accuracy threshold (0-1)
        bias_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Maximum bias threshold (0-1)
        error_rate_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Maximum error rate threshold (0-1)
        trigger_conditions:
          type: object
          additionalProperties: true
          description: Additional structured trigger conditions

    TriggerKillSwitchRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Reason for triggering

    RestoreKillSwitchRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Reason for restoration

    KillSwitch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        system_id:
          type: string
        status:
          type: string
          enum: [enabled, disabled, triggered]
        trigger_reason:
          type: string
          description: Reason recorded when the kill switch was triggered
        trigger_conditions:
          type: object
          additionalProperties: true
        auto_trigger_enabled:
          type: boolean
        accuracy_threshold:
          type: number
          format: double
        bias_threshold:
          type: number
          format: double
        error_rate_threshold:
          type: number
          format: double
        triggered_at:
          type: string
          format: date-time
        triggered_by:
          type: string
        restored_at:
          type: string
          format: date-time
        restored_by:
          type: string
        restore_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KillSwitchActionResponse:
      type: object
      properties:
        message:
          type: string
          description: Human-readable action result
        kill_switch:
          $ref: '#/components/schemas/KillSwitch'

    KillSwitchHistory:
      type: object
      description: A kill switch state-change event
      properties:
        id:
          type: string
          format: uuid
        kill_switch_id:
          type: string
        action:
          type: string
          enum: [triggered, restored, enabled, disabled]
        previous_status:
          type: string
        new_status:
          type: string
        reason:
          type: string
        performed_by:
          type: string
        performed_at:
          type: string
          format: date-time

    KillSwitchHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/KillSwitchHistory'
        count:
          type: integer
          description: Number of history entries returned

  securitySchemes:
    OrgHeader:
      type: apiKey
      in: header
      name: X-Org-ID
      description: |
        Organization ID (required). `X-Tenant-ID` is accepted as a fallback.
        Requests without either header are rejected with HTTP 400.
    UserHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        Acting user for audit attribution (optional). `X-User-Email` is
        accepted as a fallback; when absent, actions are attributed to
        `"system"`.

security:
  - OrgHeader: []
