# Grafana notification-policy provisioning for V1 SaaS Plugin Pro alerts.
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Routing logic:
#   - Default route → axonflow-ops-email (everything goes to dev@getaxonflow.com)
#   - Repeat interval 4h — long enough to avoid spam, short enough that
#     operator notices a sustained issue overnight
#   - Group by alertname so multi-firing alerts (e.g. multiple Premium v2
#     expiration cohorts) collapse into one notification per alert type
#
# Future: when the team grows, severity=critical can route to a paging
# service (PagerDuty / Opsgenie). Severity=info already routes to email
# under the same route as warning — segmenting noise from urgent will
# require subroutes.

apiVersion: 1

policies:
  - orgId: 1
    receiver: axonflow-ops-email
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    # 4h between repeats while still firing. On a single-operator setup
    # this is the right tradeoff: too short = email-fatigue → ignored;
    # too long = the issue persists past the operator's response window.
    repeat_interval: 4h
