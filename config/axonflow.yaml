# AxonFlow Runtime Configuration (Community Edition)
# This file configures MCP connectors for local development and demos.
#
# Environment Variables:
#   - References: ${VAR_NAME} or ${VAR_NAME:-default}
#   - The default values below work with docker-compose.yml settings
#
# For more connector examples, see: examples/config/axonflow.yaml.example

version: "1.0"

connectors:
  # PostgreSQL connector - connects to the docker-compose PostgreSQL instance
  # Used by examples/demo/ for MCP connector demonstrations
  postgres:
    type: postgres
    enabled: true
    display_name: "PostgreSQL Database"
    description: "Local PostgreSQL database for MCP connector demos"
    connection_url: "postgres://${DATABASE_USER:-axonflow}:${DATABASE_PASSWORD:-localdev123}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-axonflow}?sslmode=disable"
    options:
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: "5m"
    timeout_ms: 30000
    max_retries: 3
    tenant_id: "*"

  # Database alias - for SDK examples that use "database" as connector name
  database:
    type: postgres
    enabled: true
    display_name: "Database (Alias)"
    description: "Alias for PostgreSQL connector for SDK examples"
    connection_url: "postgres://${DATABASE_USER:-axonflow}:${DATABASE_PASSWORD:-localdev123}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-axonflow}?sslmode=disable"
    options:
      max_open_conns: 10
      max_idle_conns: 2
    timeout_ms: 30000
    max_retries: 3
    tenant_id: "*"

  # Analytics DB - read-only analytics connector (same PG instance for local dev)
  # Demonstrates that connector registration is unlimited across all tiers
  analytics-db:
    type: postgres
    enabled: true
    display_name: "Analytics Database"
    description: "Read-only analytics connector for reporting queries"
    connection_url: "postgres://${DATABASE_USER:-axonflow}:${DATABASE_PASSWORD:-localdev123}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-axonflow}?sslmode=disable"
    options:
      max_open_conns: 5
      max_idle_conns: 2
    timeout_ms: 30000
    max_retries: 3
    tenant_id: "*"

  # Audit store - connector for audit log queries (same PG instance for local dev)
  audit-store:
    type: postgres
    enabled: true
    display_name: "Audit Store"
    description: "Connector for querying audit logs and compliance data"
    connection_url: "postgres://${DATABASE_USER:-axonflow}:${DATABASE_PASSWORD:-localdev123}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-axonflow}?sslmode=disable"
    options:
      max_open_conns: 5
      max_idle_conns: 2
    timeout_ms: 30000
    max_retries: 3
    tenant_id: "*"

  # S3 connector - connects to MinIO (S3-compatible) from docker-compose
  # Demonstrates cloud storage connector in Community edition
  s3:
    type: s3
    enabled: true
    display_name: "S3 Storage (MinIO)"
    description: "S3-compatible object storage via MinIO for local development"
    credentials:
      access_key_id: "${MINIO_ROOT_USER:-minioadmin}"
      secret_access_key: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    options:
      endpoint: "http://${MINIO_HOST:-minio}:${MINIO_PORT:-9000}"
      region: "us-east-1"
      force_path_style: true
      default_bucket: "axonflow-test-bucket"
    timeout_ms: 30000
    max_retries: 3
    tenant_id: "*"

# LLM providers are configured via environment variables in docker-compose.yml
# (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
