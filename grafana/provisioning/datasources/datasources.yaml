apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"

  - name: PostgreSQL
    type: postgres
    uid: axonflow-postgres
    url: postgres:5432
    database: axonflow
    user: axonflow
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-localdev123}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: true
