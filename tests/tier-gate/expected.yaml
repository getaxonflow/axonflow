  # ---------------------------------------------------------------------------
  # Compliance modules — RBI / SEBI / EU AI Act / MAS FEAT
  #
  # These four modules are Enterprise-only by binary topology, not by handler
  # gate: the community-edition binary ships only the no-op stub
  # (platform/orchestrator/<module>/<module>_community.go, //go:build !enterprise)
  # whose RegisterRoutesWithMux is empty. The real handler implementations
  # (wire.go and friends) carry //go:build enterprise and are absent from the
  # community + evaluation binaries entirely.
  #
  # Net contract:
  #   community  → 404 (route never registered)
  #   evaluation → 404 (uses community-edition binary)
  #   enterprise → 200 (real handler registered)
  #
  # If a future PR drops a //go:build enterprise tag and ships a compliance
  # handler into the community binary — i.e. gives the feature away — these
