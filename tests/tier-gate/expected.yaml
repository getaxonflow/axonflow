      evaluation: {status: 503, reason: "gate bypassed; WCP service not bootstrapped"}
      enterprise: {status: 503, reason: "same"}

  - id: orchestrator-plan-approvals-pending
    method: GET
    port: 8081
    path: /api/v1/plans/approvals/pending
    expected:
      community:  {status: 403, reason: "map_hitl_adapter.go:461 same gate; #1680"}
      evaluation: {status: 200, reason: "gate bypassed; empty list returned"}
      enterprise: {status: 200, reason: "same"}

  # ---------------------------------------------------------------------------
