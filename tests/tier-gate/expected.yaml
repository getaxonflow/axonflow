    method: POST
    port: 8081
    path: /api/v1/plans/test-plan/steps/test-step/approve
    expected:
      community:  {status: 403, reason: "map_hitl_adapter.go:149 isCommunityMode + !IsHITLApprovalEnabled → 403"}
      evaluation: {status: 503, reason: "isCommunityMode=false bypasses gate; WCP services not bootstrapped (no LLM keys in CI) → StatusServiceUnavailable"}
      enterprise: {status: 503, reason: "same"}

