# Tier-Gate Contract Manifest
#
# Purpose: machine-readable contract of expected HTTP status per (endpoint × deployment tier).
#          The accompanying runner asserts actual handler enforcement matches this contract.
#
# Tier matrix:
#   community  — community-edition binary, no AXONFLOW_LICENSE_KEY,         DEPLOYMENT_MODE=community
#   evaluation — community-edition binary, Evaluation-tier signed license,  DEPLOYMENT_MODE=evaluation
#   enterprise — enterprise-edition binary, Enterprise-tier signed license, DEPLOYMENT_MODE=saas
#
#   The "enterprise" tier name refers to the BUILD EDITION and the licence, not
#   to the mode string. The stack boots DEPLOYMENT_MODE=saas because the mode
#   selects the SCHEMA: the eight RBI / SEBI / MAS-FEAT / EU-AI-Act rows below
#   expect 200 from handlers that read migrations/industry/ tables, and only
#   `saas` creates all three verticals. It used to boot `enterprise` and get them
#   by accident — `enterprise` was not a recognised mode and fell through the
#   selector's default arm to the SaaS set. #3167 makes `enterprise` an alias for
#   in-vpc-enterprise, which carries no vertical, so the job names `saas`
#   explicitly and tests exactly what it tested before. Runtime posture is
#   identical: isCommunityMode() is false for both and no agent or orchestrator
#   code branches on saas-vs-enterprise.
#
# Status code conventions used in expected.<tier>.status:
#   200 — request reaches handler, handler does not block on tier; success
#   201 — created
#   400 — request reaches handler, validates body, rejects (tier-allowed)
#   401 — auth required (tier-allowed; runner sends valid auth, so a 401 means handler is auth-only)
#   403 — handler tier-blocked (the gate fired; this is a tier-block signal)
#   404 — route not registered for this build/mode (tier-block via absence)
#   422 — validation failed (tier-allowed)
#   503 — service not yet bootstrapped (tier-allowed)
#
# Each row's reason field cites the handler/registration site that establishes the expected status.
# When code and reason disagree, the runner FAILS — surface as a real bug to file or fix.

version: 1
generated_by: tests/tier-gate/expected.yaml (hand-authored from handler audit, 2026-04-29)

# Default request shape applied when a row omits its own headers/body.
defaults:
  headers:
    X-Tenant-ID: tier-gate-test
    X-Org-ID:    tier-gate-test
    X-User-ID:   tier-gate-runner
    X-User-Email: tier-gate@test.local
    Content-Type: application/json
  # bearer_env: name of env var that holds a JWT to inject as Authorization: Bearer <token>.
  # Empty when not set — auth-required endpoints will respond 401 in that case.
  bearer_env: AXONFLOW_USER_TOKEN
  # body_default: JSON body sent on POST/PUT/PATCH when an endpoint omits its own body.
  body_default: "{}"

endpoints:
  # ---------------------------------------------------------------------------
  # Sanity / liveness — exposed in every tier
  # ---------------------------------------------------------------------------
  - id: agent-health
    method: GET
    port: 8080
    path: /health
    expected:
      community:  {status: 200, reason: "platform/agent/run.go:389 always-registered, no auth"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: agent-prometheus
    method: GET
    port: 8080
    path: /prometheus
    expected:
      community:  {status: 200, reason: "platform/agent/run.go:923 always-registered, no auth"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: orchestrator-health
    method: GET
    port: 8081
    path: /health
    expected:
      community:  {status: 200, reason: "platform/orchestrator/run.go health route, no auth"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: orchestrator-prometheus
    method: GET
    port: 8081
    path: /prometheus
    expected:
      community:  {status: 200, reason: "platform/orchestrator/run.go prometheus route, no auth"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  # ---------------------------------------------------------------------------
  # Core MCP gateway — RegisterMCPHandlers registers these routes
  # UNCONDITIONALLY. The community-mode gate is for individual query *license*
  # validation, not route registration.
  #
  # #3067: the connector inventory + per-connector health routes are now wrapped
  # in apiAuthMiddleware and scoped to the authenticated tenant. They previously
  # had NO middleware at all and served every tenant's connector name, type,
  # version, capabilities, health and raw driver error strings (which routinely
  # embed host/db/user) to an anonymous caller — and the /health variant opened
  # a live connection using the victim's decrypted credentials. The pair of rows
  # below pins BOTH halves of that contract: authenticated callers still get
  # 200, and an anonymous caller is refused in every tier that has credentials
  # to refuse (community auth is permissive by design, so it stays 200 there).
  # ---------------------------------------------------------------------------
  - id: agent-mcp-connectors-list
    method: GET
    port: 8080
    path: /mcp/connectors
    auth: basic
    expected:
      community:  {status: 200, reason: "RegisterMCPHandlers always registers; community auth is permissive → 200"}
      evaluation: {status: 200, reason: "Basic auth provided; handler returns the caller's connectors"}
      enterprise: {status: 200, reason: "same"}

  - id: agent-mcp-connectors-list-unauthenticated
    method: GET
    port: 8080
    path: /mcp/connectors
    auth: none
    expected:
      community:  {status: 200, reason: "community mode requires no credentials (Authenticate() short-circuits) — the route is still registered"}
      evaluation: {status: 401, reason: "#3067 S-5: apiAuthMiddleware refuses an anonymous caller rather than dumping every tenant's connector inventory"}
      enterprise: {status: 401, reason: "same"}

  - id: agent-mcp-connector-health-unauthenticated
    method: GET
    port: 8080
    path: /mcp/connectors/tier-gate-absent-3067/health
    auth: none
    expected:
      community:  {status: 404, reason: "community auth is permissive, so the request reaches the handler; no such connector → 404 (the sibling list row proves mcpRegistry is initialized, so this is not 503)"}
      evaluation: {status: 401, reason: "#3067 S-5: refused before any connection is opened with the named connector's credentials"}
      enterprise: {status: 401, reason: "same"}

  - id: agent-mcp-health
    method: GET
    port: 8080
    path: /mcp/health
    expected:
      community:  {status: 200, reason: "always registered, no tier check"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: agent-mcp-resources-query
    method: POST
    port: 8080
    path: /mcp/resources/query
    body: '{"connector":"postgres","query":"SELECT 1"}'
    expected:
      community:  {status: 200, reason: "always registered; community has no Basic-auth gate, query falls through and returns 200"}
      evaluation: {status: 401, reason: "apiAuthMiddleware requires Basic auth (clientId:clientSecret) once a license is present"}
      enterprise: {status: 401, reason: "same"}

  - id: agent-mcp-tools-execute
    method: POST
    port: 8080
    path: /mcp/tools/execute
    body: '{"tool":"echo","arguments":{}}'
    expected:
      community:  {status: 403, reason: "always registered; tools/execute carries an internal-service-secret gate that returns 403 in community mode"}
      evaluation: {status: 401, reason: "apiAuthMiddleware requires Basic auth in licensed builds"}
      enterprise: {status: 401, reason: "same"}

  # ---------------------------------------------------------------------------
  # MAP plan endpoints — always registered; the resume/rollback handlers gate on isCommunityMode()
  # ---------------------------------------------------------------------------
  - id: orchestrator-plan-resume
    method: POST
    port: 8081
    path: /api/v1/plan/test-plan-id/resume
    # #3068: this row's assertion IS the unauthenticated refusal, so it opts out
    # of the runner's proxy-auth token. With a token it would sail past both the
    # router gate and verifyAgentProxyAuth and 404 on the nonexistent plan,
    # silently retiring the coverage.
    proxy_auth: false
    expected:
      community:  {status: 403, reason: "#3068 requireInternalProxyAuth refuses the token-less request at the router, before any handler; previously isCommunityMode → 'requires Enterprise' produced the same status"}
      evaluation: {status: 403, reason: "#3068 requireInternalProxyAuth refuses a direct-to-orchestrator call with no X-Axonflow-Proxy-Auth at the router, before routing — the same refusal #2896 WS1c's verifyAgentProxyAuth made in the handler, now made earlier and for every route. Resume persists a checkpoint actor identity that keys an override apply, so it must arrive through the agent."}
      enterprise: {status: 403, reason: "same — #3068 router gate, with #2896 WS1c's handler check behind it"}

  - id: orchestrator-plan-rollback
    method: POST
    port: 8081
    path: /api/v1/plan/test-plan-id/rollback/1
    # #3068 + #3065: same shape as orchestrator-plan-resume above. #3065 made
    # rollback a plan MUTATION that runs verifyAgentProxyAuth BEFORE the plan
    # lookup, so its assertion IS the unauthenticated refusal. With the runner's
    # token it would sail past both the router gate and verifyAgentProxyAuth and
    # 404 on the nonexistent plan, silently retiring the coverage.
    proxy_auth: false
    expected:
      community:  {status: 403, reason: "run.go:4378 isCommunityMode → 'requires Enterprise'"}
      evaluation: {status: 403, reason: "#3065: rollback is a plan MUTATION and now runs the same verifyAgentProxyAuth gate its sibling resume already did — a direct-to-orchestrator caller is refused BEFORE the plan lookup. It previously reached the lookup and answered 404, which leaked that the gate was absent: the org the authorization keys on was whatever the caller typed into X-Org-ID, or nothing at all."}
      enterprise: {status: 403, reason: "same — #3065 agent-proxy requirement, matching orchestrator-plan-resume above"}

  - id: orchestrator-plan-step-approve
    method: POST
    port: 8081
    path: /api/v1/plans/test-plan/steps/test-step/approve
    expected:
      community:  {status: 403, reason: "map_hitl_adapter.go:149 isCommunityMode + !IsHITLApprovalEnabled → 403"}
      evaluation: {status: 503, reason: "isCommunityMode=false bypasses gate; WCP services not bootstrapped (no LLM keys in CI) → StatusServiceUnavailable"}
      enterprise: {status: 503, reason: "same"}

  - id: orchestrator-plan-step-reject
    method: POST
    port: 8081
    path: /api/v1/plans/test-plan/steps/test-step/reject
    expected:
      community:  {status: 403, reason: "map_hitl_adapter.go:334 same gate as approve"}
      evaluation: {status: 503, reason: "gate bypassed; WCP service not bootstrapped"}
      enterprise: {status: 503, reason: "same"}

  - id: orchestrator-plan-approvals-pending
    method: GET
    port: 8081
    path: /api/v1/plans/approvals/pending
    expected:
      community:  {status: 403, reason: "map_hitl_adapter.go:461 same gate; #1680"}
      evaluation: {status: 200, reason: "gate bypassed; empty list returned"}
      enterprise: {status: 200, reason: "same"}

  # ---------------------------------------------------------------------------
