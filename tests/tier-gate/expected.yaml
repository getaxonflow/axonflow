# Tier-Gate Contract Manifest
#
# Purpose: machine-readable contract of expected HTTP status per (endpoint × deployment tier).
#          The accompanying runner asserts actual handler enforcement matches this contract.
#
# Tier matrix:
#   community  — community-edition binary, no AXONFLOW_LICENSE_KEY,         DEPLOYMENT_MODE=community
#   evaluation — community-edition binary, Evaluation-tier signed license,  DEPLOYMENT_MODE=evaluation
#   enterprise — enterprise-edition binary, Enterprise-tier signed license, DEPLOYMENT_MODE=enterprise
#
# Status code conventions used in expected.<tier>.status:
#   200 — request reaches handler, handler does not block on tier; success
#   201 — created
#   400 — request reaches handler, validates body, rejects (tier-allowed)
#   401 — auth required (tier-allowed; runner sends valid auth, so a 401 means handler is auth-only)
#   403 — handler tier-blocked (the gate fired; this is a tier-block signal)
#   404 — route not registered for this build/mode (tier-block via absence)
#   422 — validation failed (tier-allowed)
#   503 — service not yet bootstrapped (tier-allowed)
#
# Each row's reason field cites the handler/registration site that establishes the expected status.
# When code and reason disagree, the runner FAILS — surface as a real bug to file or fix.

version: 1
generated_by: tests/tier-gate/expected.yaml (hand-authored from handler audit, 2026-04-29)

# Default request shape applied when a row omits its own headers/body.
defaults:
  headers:
    X-Tenant-ID: tier-gate-test
    X-Org-ID:    tier-gate-test
    X-User-ID:   tier-gate-runner
    X-User-Email: tier-gate@test.local
    Content-Type: application/json
  # bearer_env: name of env var that holds a JWT to inject as Authorization: Bearer <token>.
  # Empty when not set — auth-required endpoints will respond 401 in that case.
  bearer_env: AXONFLOW_USER_TOKEN
  # body_default: JSON body sent on POST/PUT/PATCH when an endpoint omits its own body.
  body_default: "{}"

endpoints:
