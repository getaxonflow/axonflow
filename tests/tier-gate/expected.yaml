    port: 8080
    path: /api/v1/register
    body: '{"email":"probe@test.local","org_name":"probe"}'
    expected:
      community:  {status: 404, reason: "community_saas_register.go:192 only registers when AXONFLOW_COMMUNITY_SAAS_MODE=true; not set in matrix"}
      evaluation: {status: 404, reason: "same"}
      enterprise: {status: 404, reason: "same"}

  # ---------------------------------------------------------------------------
  # Compliance modules — RBI / SEBI / EU AI Act / MAS FEAT
  #
  # These four modules are Enterprise-only by binary topology, not by handler
  # gate: the community-edition binary ships only the no-op stub
  # (platform/orchestrator/<module>/<module>_community.go, //go:build !enterprise)
  # whose RegisterRoutesWithMux is empty. The real handler implementations
  # (wire.go and friends) carry //go:build enterprise and are absent from the
  # community + evaluation binaries entirely.
  #
  # Net contract:
  #   community  → 404 (route never registered)
  #   evaluation → 404 (uses community-edition binary)
  #   enterprise → 200 (real handler registered)
  #
  # If a future PR drops a //go:build enterprise tag and ships a compliance
  # handler into the community binary — i.e. gives the feature away — these
  # rows trip and block the merge.
  # ---------------------------------------------------------------------------
  - id: orchestrator-rbi-ai-systems
    method: GET
    port: 8081
    path: /api/v1/rbi/ai-systems
    auth: basic
    expected:
      community:  {status: 404, reason: "rbi_community.go RegisterRoutesWithMux is no-op; route absent in community binary"}
      evaluation: {status: 404, reason: "evaluation uses community-edition binary; same stub"}
      enterprise: {status: 200, reason: "wire.go (//go:build enterprise) registers the real RBI registry handler"}

