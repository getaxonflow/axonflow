      enterprise: {status: 200, reason: "same"}

  - id: orchestrator-prometheus
    method: GET
    port: 8081
    path: /prometheus
    expected:
      community:  {status: 200, reason: "platform/orchestrator/run.go prometheus route, no auth"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  # ---------------------------------------------------------------------------
  # Core MCP gateway — RegisterMCPHandlers (mcp_handler.go:524) registers these
  # routes UNCONDITIONALLY. The community-mode gate (line 78) is for individual
  # query *license* validation, not route registration. apiAuthMiddleware is
  # only applied in licensed (eval/enterprise) builds — in community mode the
  # listing/health endpoints are open and queries fall back to permissive auth.
  # ---------------------------------------------------------------------------
  - id: agent-mcp-connectors-list
    method: GET
    port: 8080
    path: /mcp/connectors
    expected:
      community:  {status: 200, reason: "RegisterMCPHandlers always registers; listing is open across all tiers"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: agent-mcp-health
    method: GET
    port: 8080
    path: /mcp/health
    expected:
      community:  {status: 200, reason: "always registered, no tier check"}
      evaluation: {status: 200, reason: "same"}
      enterprise: {status: 200, reason: "same"}

  - id: agent-mcp-resources-query
    method: POST
    port: 8080
    path: /mcp/resources/query
    body: '{"connector":"postgres","query":"SELECT 1"}'
    expected:
      community:  {status: 200, reason: "always registered; community has no Basic-auth gate, query falls through and returns 200"}
      evaluation: {status: 401, reason: "apiAuthMiddleware requires Basic auth (clientId:clientSecret) once a license is present"}
      enterprise: {status: 401, reason: "same"}

  - id: agent-mcp-tools-execute
    method: POST
    port: 8080
    path: /mcp/tools/execute
    body: '{"tool":"echo","arguments":{}}'
    expected:
      community:  {status: 403, reason: "always registered; tools/execute carries an internal-service-secret gate that returns 403 in community mode"}
      evaluation: {status: 401, reason: "apiAuthMiddleware requires Basic auth in licensed builds"}
      enterprise: {status: 401, reason: "same"}

  # ---------------------------------------------------------------------------
  # MAP plan endpoints — always registered; the resume/rollback handlers gate on isCommunityMode()
  # ---------------------------------------------------------------------------
  - id: orchestrator-plan-resume
    method: POST
    port: 8081
    path: /api/v1/plan/test-plan-id/resume
    expected:
      community:  {status: 403, reason: "isCommunityMode → 'requires Enterprise' → StatusForbidden (licensing gate runs before proxy-auth)"}
      evaluation: {status: 403, reason: "#2896 WS1c: direct-to-orchestrator resume is rejected by verifyAgentProxyAuth (no X-Axonflow-Proxy-Auth) — 'must be routed through AxonFlow Agent'. Resume persists a checkpoint actor identity that keys an override apply, so it must arrive through the agent."}
      enterprise: {status: 403, reason: "same — #2896 WS1c agent-proxy requirement"}

  - id: orchestrator-plan-rollback
    method: POST
    port: 8081
    path: /api/v1/plan/test-plan-id/rollback/1
    expected:
      community:  {status: 403, reason: "run.go:4378 isCommunityMode → 'requires Enterprise'"}
      evaluation: {status: 404, reason: "isCommunityMode=false bypasses; plan lookup miss returns 404"}
      enterprise: {status: 404, reason: "same"}

