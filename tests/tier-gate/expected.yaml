  # ---------------------------------------------------------------------------
  # Negative-control: route that does not exist anywhere — 404 in all tiers.
  # Anchors the contract: a 404 here proves the router rejects unknown paths
  # uniformly across builds (helps debug a misclassified 404 elsewhere).
  # ---------------------------------------------------------------------------
  - id: nonexistent-route-control
    method: GET
    port: 8081
    path: /api/v1/__tier_gate_does_not_exist__
    expected:
      community:  {status: 404, reason: "negative control: gorilla/mux returns 404 for unknown path"}
      evaluation: {status: 404, reason: "same"}
      enterprise: {status: 404, reason: "same"}
