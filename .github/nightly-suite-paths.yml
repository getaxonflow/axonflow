# Nightly dispatch path filters, recovered 2026-09-04.
#
# WHY THIS FILE EXISTS. Each stack-booting suite used to carry its correctness
# inputs as a `pull_request: paths:` filter - "run me when any of these files
# change". Removing the PR trigger (per-push cost did not move under the
# 2026-09-03 label gate: 129 minutes before, 133 after) would have deleted that
# information with it, and nightly-e2e.yml would then dispatch every suite
# every night regardless of what changed. The lists below ARE those filters,
# copied verbatim from the last commit that carried them.
#
# THIS IS NOT A SECOND COPY. The filters no longer exist in the workflows -
# they were MOVED here, not duplicated - so there is one definition, and
# `no_pr_trigger_for_stack_booting_suites_test.sh` fails any workflow that
# grows a `pull_request:` block again (which is the only way a competing copy
# could reappear).
#
# WHAT KEEPS IT HONEST, AND WHAT DOES NOT. The guard checks PRESENCE, not
# accuracy: every suite in the nightly set must appear here, so a new suite
# cannot silently become unconditional. Nothing mechanically proves a list
# still names everything a suite's correctness depends on - and nothing did
# when the same list lived in the workflow either. A stale entry costs
# coverage in the nightly only: the merge queue runs every suite with no
# `paths:` filter at all, because `merge_group` does not take one. So the
# blast radius of a stale list is "the nightly missed a suite it should have
# re-run against main", never "an untested change merged".
#
# A suite with no entry here is dispatched unconditionally, which is the safe
# direction.
#
# Edit this file when you would have edited the suite's `paths:` filter.
#
# `unconditional:` lists suites that fire every night regardless of the diff.
# Ten of them share one real reason rather than ten invented ones: they ran on
# `merge_group` only, and `merge_group` takes no `paths:` filter, so no list
# has ever existed for them. Writing one now would be a guess presented as a
# recovered fact, so they stay unconditional at ~10 min each. The other three
# (sdk-smoke-tests, sync-community-repo, self-hosted-canary) have their own
# reasons inline. The guard requires every suite in the nightly set to appear
# in one list or the other, so nothing becomes unconditional by accident.
