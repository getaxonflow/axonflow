name: Bootstrap Secrets

# INTERNAL OPS TOOLING — for the AxonFlow team operating our own
# environments (production-us, community-saas, healthcare-us, etc.). NOT a
# customer-facing deployment pattern. AWS Marketplace customers continue to
# populate their own secrets via scripts/create-secrets.sh or the AWS console
# at the standard axonflow/{env}/{name} paths BEFORE deploying — that
# customer-required step is unchanged and the deploy pre-flight check
# correctly enforces it.
#
# What this workflow solves: when WE spin up a new internal environment
# (e.g., a new benchmark stack, a new region's staging), we end up
# repeatedly hand-copying secrets between OUR own envs. This automates
# that internal copy with audit + idempotency + masking. Standard
# naming format axonflow/{env}/{name} is honored — no internal-only
# location magic, just a copy of values between paths that already
# follow the public format.
#
# Three modes:
#   - status:    Read-only audit of axonflow/{env}/* at a target region. Reports
#                which CRITICAL secrets are missing so deploy pre-flight won't
#                block.
#   - copy:      Copy axonflow/{source}/* secrets from source_region to
#                axonflow/{target}/* in target_region. Idempotent (skips
#                existing target secrets unless overwrite=true). Closes the
#                "fail to copy from one place to another" gap that bites us
#                whenever we provision a new internal stack.
#   - create:    Create a single named secret at axonflow/{target}/{name} with
#                a value passed via the secret_value input (which the workflow
#                immediately ::add-mask::s). For one-off fills.
#
# Dry-run is the default for every destructive mode. Secret values are
# masked in logs throughout — only secret NAMES are logged, never values.
# Uses AWS_ACCESS_KEY_ID_INTERNAL / SECRET_ACCESS_KEY_INTERNAL — same
# internal credentials the rest of our deploy infra already uses.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        type: choice
        options:
          - status
          - copy
          - create
      source_environment:
        description: 'Source environment (mode=copy only). axonflow/{source_environment}/* secrets get read from source_region.'
        required: false
        type: choice
        options:
          - production
          - staging
          - community-saas
          - production-banking-india
          - production-healthcare-us
          - staging-healthcare-india
      source_region:
        description: 'Source AWS region (mode=copy only). Where to read secrets from.'
        required: false
        type: string
        default: 'us-east-1'
      target_environment:
        description: 'Target environment. axonflow/{target_environment}/* is the target prefix.'
        required: true
        type: choice
        options:
          - staging
          - production
          - community-saas
          - production-banking-india
          - production-healthcare-us
          - staging-healthcare-india
      target_region:
        description: 'Target AWS region. Where to write/read secrets.'
        required: true
        type: string
        default: 'us-east-1'
      secret_name_filter:
        description: 'Optional regex to filter which secret names to copy (e.g., grafana|database). Empty = all.'
        required: false
        type: string
        default: ''
      single_secret_name:
        description: 'Secret suffix name (mode=create only). Final path is axonflow/{target_environment}/{single_secret_name}.'
        required: false
        type: string
      single_secret_value:
        description: 'Secret value (mode=create only). Will be ::add-mask::ed immediately.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — log what would happen, do not apply. Default true. Set to false to actually apply.'
        required: false
        type: boolean
        default: true
      overwrite:
        description: 'Overwrite existing target secrets (mode=copy only). Default false (skip-if-exists).'
        required: false
        type: boolean
        default: false

env:
  AWS_ACCOUNT_ID: '686831565523'

permissions:
  contents: read
  id-token: write

jobs:
  status:
    name: Status — audit secrets at target path
    if: inputs.mode == 'status'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: ${{ inputs.target_region }}

      - name: Audit axonflow/${{ inputs.target_environment }}/* in ${{ inputs.target_region }}
        run: |
          set -euo pipefail
          PREFIX="axonflow/${{ inputs.target_environment }}/"
          echo "🔍 Auditing secrets at ${PREFIX}* in ${{ inputs.target_region }}..."
          echo ""

          # Audit by describe-secret per known name. The IAM role attached to
          # AWS_ACCESS_KEY_ID_INTERNAL has secretsmanager:DescribeSecret + GetSecretValue
          # but does NOT have secretsmanager:ListSecrets — verified today against
          # the staging path. Discovery-by-listing returns empty even when secrets
          # exist. Per-name describe-secret works fine and is the same call the
          # deploy-platform pre-flight uses, so the audit mirrors the deploy gate.
          KNOWN_SECRETS=(
            # CRITICAL (blocked by deploy-platform pre-flight if missing/empty)
            "database-password"
            "database-app-password"
            "grafana-password"
            # Common platform secrets (fall through to optional but commonly needed)
            "jwt-secret"
            "license-key"
            "license-hmac-secret"
            # LLM provider credentials (only required when EnabledLLMProviders names them)
            "openai-credentials"
            "anthropic-credentials"
            "azure-openai-credentials"
            "gemini-credentials"
            # MCP connector credentials (only required when EnabledConnectors names them)
            "amadeus-credentials"
            "salesforce-credentials"
            "slack-credentials"
            "snowflake-credentials"
            "client-openai-credentials"
            "client-anthropic-credentials"
            "checkpoint-credentials"
          )
          CRITICAL_NAMES=("database-password" "database-app-password" "grafana-password")

          PRESENT=()
          MISSING=()
          MARKED_FOR_DELETION=()
          EMPTY_VALUE=()

          for NAME in "${KNOWN_SECRETS[@]}"; do
            FULL="${PREFIX}${NAME}"
            DESCRIBE=$(aws secretsmanager describe-secret \
              --secret-id "$FULL" \
              --region "${{ inputs.target_region }}" \
              --query '{Name:Name,DeletedDate:DeletedDate}' \
              --output json 2>/dev/null) || DESCRIBE=""

            if [ -z "$DESCRIBE" ]; then
              MISSING+=("$NAME")
              continue
            fi

            DELETED_DATE=$(echo "$DESCRIBE" | jq -r '.DeletedDate // empty')
            if [ -n "$DELETED_DATE" ]; then
              MARKED_FOR_DELETION+=("$NAME (DeletedDate: $DELETED_DATE)")
              continue
            fi

            # Spot-check value is non-empty (matches deploy-platform pre-flight semantics).
            VALUE=$(aws secretsmanager get-secret-value \
              --secret-id "$FULL" \
              --region "${{ inputs.target_region }}" \
              --query 'SecretString' \
              --output text 2>/dev/null || echo "")
            if [ -z "$VALUE" ]; then
              EMPTY_VALUE+=("$NAME")
            else
              PRESENT+=("$NAME")
            fi
          done

          # Report
          echo "## Present (${#PRESENT[@]} of ${#KNOWN_SECRETS[@]} known names)"
          for N in "${PRESENT[@]}"; do echo "  ✅ ${PREFIX}${N}"; done
          [ ${#PRESENT[@]} -eq 0 ] && echo "  (none)"
          echo ""

          if [ ${#MARKED_FOR_DELETION[@]} -gt 0 ]; then
            echo "## Marked for deletion (must be restored before next deploy)"
            for N in "${MARKED_FOR_DELETION[@]}"; do echo "  ⚠️  ${PREFIX}${N}"; done
            echo ""
            echo "  Fix: aws secretsmanager restore-secret --secret-id ${PREFIX}<name> --region ${{ inputs.target_region }}"
            echo "       Then mode=copy from a healthy source environment, or mode=create with the value."
            echo ""
          fi

          if [ ${#EMPTY_VALUE[@]} -gt 0 ]; then
            echo "## Resource exists but value is empty"
            for N in "${EMPTY_VALUE[@]}"; do echo "  ⚠️  ${PREFIX}${N}"; done
            echo ""
          fi

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "## Missing (resource not found)"
            for N in "${MISSING[@]}"; do echo "  ⚪ ${PREFIX}${N}"; done
            echo ""
          fi

          # Critical-secret gate (the same gate deploy-platform pre-flight applies)
          echo "🎯 Critical secrets check (matches deploy-platform pre-flight):"
          CRITICAL_MISSING=0
          for NAME in "${CRITICAL_NAMES[@]}"; do
            STATE="✅"
            for M in "${MISSING[@]}"; do [ "$M" = "$NAME" ] && STATE="❌ MISSING"; done
            for M in "${MARKED_FOR_DELETION[@]}"; do [[ "$M" == "$NAME"* ]] && STATE="❌ MARKED-FOR-DELETION"; done
            for M in "${EMPTY_VALUE[@]}"; do [ "$M" = "$NAME" ] && STATE="❌ EMPTY-VALUE"; done
            echo "  $STATE  ${PREFIX}${NAME}"
            [[ "$STATE" == ❌* ]] && CRITICAL_MISSING=$((CRITICAL_MISSING + 1))
          done
          echo ""
          if [ "$CRITICAL_MISSING" -eq 0 ]; then
            echo "✅ All critical secrets present and populated — deploy pre-flight will pass on this dimension"
          else
            echo "❌ ${CRITICAL_MISSING} critical secret(s) need attention — re-run with mode=copy from production to fix"
          fi

  copy:
    name: Copy — duplicate secrets from source to target
    if: inputs.mode == 'copy'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.source_environment }}" ]; then
            echo "❌ source_environment is required for mode=copy"
            exit 1
          fi
          if [ "${{ inputs.source_environment }}" = "${{ inputs.target_environment }}" ] && \
             [ "${{ inputs.source_region }}" = "${{ inputs.target_region }}" ]; then
            echo "❌ Source and target must differ on environment OR region (got identical)"
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "ℹ️  DRY RUN MODE — operations will be logged but not applied"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (read source)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: ${{ inputs.source_region }}

      - name: Discover source secrets via known-name list
        id: list
        run: |
          set -euo pipefail
          SOURCE_PREFIX="axonflow/${{ inputs.source_environment }}/"
          FILTER="${{ inputs.secret_name_filter }}"

          echo "🔍 Discovering source secrets at ${SOURCE_PREFIX}* in ${{ inputs.source_region }}..."

          # Discovery via per-name describe-secret. The IAM role for AWS_ACCESS_KEY_ID_INTERNAL
          # has DescribeSecret + GetSecretValue but not ListSecrets — verified today against
          # the staging path. Discovery-by-listing returns empty even when secrets exist.
          # The known-name list mirrors what create-secrets.sh + deploy-platform pre-flight
          # cover, and adding a new entry here is the canonical way to add a new secret to
          # the bootstrap-copy surface.
          KNOWN_SECRETS=(
            "database-password"
            "database-app-password"
            "grafana-password"
            "jwt-secret"
            "license-key"
            "license-hmac-secret"
            "openai-credentials"
            "anthropic-credentials"
            "azure-openai-credentials"
            "gemini-credentials"
            "amadeus-credentials"
            "salesforce-credentials"
            "slack-credentials"
            "snowflake-credentials"
            "client-openai-credentials"
            "client-anthropic-credentials"
            "checkpoint-credentials"
          )

          : > /tmp/source-names.txt
          FOUND=0
          MISSING=0
          for NAME in "${KNOWN_SECRETS[@]}"; do
            FULL="${SOURCE_PREFIX}${NAME}"
            # Apply suffix-filter regex if provided
            if [ -n "$FILTER" ] && ! echo "$NAME" | grep -qE "$FILTER"; then
              continue
            fi
            if aws secretsmanager describe-secret \
                 --secret-id "$FULL" \
                 --region "${{ inputs.source_region }}" \
                 --query 'Name' --output text >/dev/null 2>&1; then
              echo "$FULL" >> /tmp/source-names.txt
              FOUND=$((FOUND + 1))
            else
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ No source secrets found at ${SOURCE_PREFIX}* (checked ${#KNOWN_SECRETS[@]} known names)"
            echo "   Verify: aws secretsmanager describe-secret --secret-id ${SOURCE_PREFIX}database-password --region ${{ inputs.source_region }}"
            exit 1
          fi

          if [ -n "$FILTER" ]; then
            echo "📋 After filter '${FILTER}': $FOUND secret(s) selected from ${#KNOWN_SECRETS[@]} known names"
          else
            echo "Found $FOUND of ${#KNOWN_SECRETS[@]} known names at source ($MISSING not present at source — that's fine, copy will skip them)"
          fi
          sed 's/^/  - /' /tmp/source-names.txt

      - name: Copy secrets to target
        env:
          SOURCE_REGION: ${{ inputs.source_region }}
          TARGET_REGION: ${{ inputs.target_region }}
          SOURCE_PREFIX: 'axonflow/${{ inputs.source_environment }}/'
          TARGET_PREFIX: 'axonflow/${{ inputs.target_environment }}/'
          DRY_RUN: ${{ inputs.dry_run }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          CREATED=0
          UPDATED=0
          SKIPPED=0
          FAILED=0

          while IFS= read -r SOURCE_NAME; do
            [ -z "$SOURCE_NAME" ] && continue
            SUFFIX="${SOURCE_NAME#${SOURCE_PREFIX}}"
            TARGET_NAME="${TARGET_PREFIX}${SUFFIX}"

            echo ""
            echo "→ ${SOURCE_NAME} → ${TARGET_NAME}"

            # Read source value (in source region)
            VALUE=$(aws secretsmanager get-secret-value \
              --secret-id "$SOURCE_NAME" \
              --region "$SOURCE_REGION" \
              --query 'SecretString' \
              --output text 2>/dev/null) || {
              echo "  ❌ Failed to read source"
              FAILED=$((FAILED + 1))
              continue
            }

            # Mask the value from any subsequent logging
            echo "::add-mask::$VALUE"

            # Check if target exists
            EXISTS="false"
            if aws secretsmanager describe-secret \
                 --secret-id "$TARGET_NAME" \
                 --region "$TARGET_REGION" \
                 --query 'Name' --output text >/dev/null 2>&1; then
              EXISTS="true"
            fi

            if [ "$EXISTS" = "true" ] && [ "$OVERWRITE" != "true" ]; then
              echo "  ⏭️  Target exists, OVERWRITE=false → skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              if [ "$EXISTS" = "true" ]; then
                echo "  [DRY] Would UPDATE existing target secret"
              else
                echo "  [DRY] Would CREATE new target secret"
              fi
              continue
            fi

            if [ "$EXISTS" = "true" ]; then
              # Update existing
              aws secretsmanager put-secret-value \
                --secret-id "$TARGET_NAME" \
                --secret-string "$VALUE" \
                --region "$TARGET_REGION" \
                --output text >/dev/null && {
                echo "  ✅ Updated"
                UPDATED=$((UPDATED + 1))
              } || {
                echo "  ❌ Update failed"
                FAILED=$((FAILED + 1))
              }
            else
              # Create new
              aws secretsmanager create-secret \
                --name "$TARGET_NAME" \
                --secret-string "$VALUE" \
                --region "$TARGET_REGION" \
                --description "Copied from ${SOURCE_NAME} in ${SOURCE_REGION} via bootstrap-secrets workflow" \
                --output text >/dev/null && {
                echo "  ✅ Created"
                CREATED=$((CREATED + 1))
              } || {
                echo "  ❌ Create failed"
                FAILED=$((FAILED + 1))
              }
            fi
          done < /tmp/source-names.txt

          echo ""
          echo "=========================================="
          echo "Summary"
          echo "=========================================="
          echo "  Created:  $CREATED"
          echo "  Updated:  $UPDATED"
          echo "  Skipped:  $SKIPPED (target existed and overwrite=false)"
          echo "  Failed:   $FAILED"
          echo ""

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Some operations failed — see logs above"
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "ℹ️  DRY RUN — no changes applied. Re-run with dry_run=false to apply."
          fi

  create:
    name: Create — single secret from input
    if: inputs.mode == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.single_secret_name }}" ]; then
            echo "❌ single_secret_name is required for mode=create"
            exit 1
          fi
          if [ -z "${{ inputs.single_secret_value }}" ]; then
            echo "❌ single_secret_value is required for mode=create"
            exit 1
          fi
          # Mask immediately
          echo "::add-mask::${{ inputs.single_secret_value }}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: ${{ inputs.target_region }}

      - name: Create secret
        env:
          TARGET_NAME: 'axonflow/${{ inputs.target_environment }}/${{ inputs.single_secret_name }}'
          SECRET_VALUE: ${{ inputs.single_secret_value }}
          TARGET_REGION: ${{ inputs.target_region }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SECRET_VALUE"
          echo "→ Target: $TARGET_NAME (region: $TARGET_REGION)"

          if [ "$DRY_RUN" = "true" ]; then
            echo "  [DRY] Would create secret"
            exit 0
          fi

          if aws secretsmanager describe-secret \
               --secret-id "$TARGET_NAME" \
               --region "$TARGET_REGION" \
               --query 'Name' --output text >/dev/null 2>&1; then
            echo "  ❌ Secret already exists. Use mode=copy with overwrite=true to update via copy, or rotate via aws-cli outside this workflow."
            exit 1
          fi

          aws secretsmanager create-secret \
            --name "$TARGET_NAME" \
            --secret-string "$SECRET_VALUE" \
            --region "$TARGET_REGION" \
            --description "Created via bootstrap-secrets workflow (mode=create)" \
            --output text >/dev/null

          echo "  ✅ Created"
