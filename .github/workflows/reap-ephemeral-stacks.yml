name: Reap Ephemeral Perf Stacks

# Safety-net reaper for the ephemeral perf/benchmark stacks
# (axonflow-in-vpc-enterprise-*, axonflow-saas-perf-testing-*).
#
# These stacks have a deploy → sweep → tear down lifecycle. Two teardown layers
# already exist — deploy-platform's failure-path delete (Phase 5) and the
# scheduled-performance-benchmark teardown job — but both only run as part of
# the run that created the stack. A cancelled workflow, a crashed runner, a
# dispatch bug (the 2026-07-20 stack ran 3+ days on exactly that), or a
# forgotten keep_stack=true leaves the stack burning ALB + RDS + ECS money
# with nothing watching. This is the independent third layer.
#
# Policy:
#   - Any stack matching an ephemeral prefix, older than MAX_AGE_HOURS, in a
#     live-ish status, is deleted via delete-stack.yml (which handles the
#     deletion-protected RDS).
#   - To intentionally keep a stack past the window, tag the CFN stack:
#       axonflow:keep = true
#     The reaper skips tagged stacks and lists them in the summary instead.
#   - The reaper FAILS LOUDLY if a delete dispatch fails, so a broken reaper
#     shows up as a red scheduled run, not as silence.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be reaped without deleting'
        required: false
        type: boolean
        default: false
      max_age_hours:
        description: 'Reap stacks older than this many hours'
        required: false
        type: string
        default: '12'
  schedule:
    # Daily 09:00 UTC — comfortably after the Monday 06:00 UTC benchmark's
    # own teardown (~08:00) so the reaper only ever sees genuine leftovers.
    - cron: '0 9 * * *'

env:
  AWS_REGION: us-east-1
  MAX_AGE_HOURS: ${{ inputs.max_age_hours || '12' }}

permissions:
  contents: read
  actions: write

jobs:
  reap:
    name: Reap orphaned ephemeral stacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find and reap orphaned stacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh needs explicit repo context
          # (the missing-GH_REPO class broke the benchmark teardown for weeks).
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "${MAX_AGE_HOURS} hours ago" +%FT%TZ)
          echo "::notice::Reaping ephemeral stacks created before $CUTOFF (dry_run=$DRY_RUN)"

          # Live-ish statuses only. DELETE_IN_PROGRESS is excluded (already
          # dying); DELETE_FAILED/ROLLBACK_FAILED are included — those are the
          # stacks that most need delete-stack.yml's RDS-protection handling.
          FOUND=$(aws cloudformation list-stacks --region "$AWS_REGION" \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE CREATE_FAILED ROLLBACK_COMPLETE ROLLBACK_FAILED DELETE_FAILED \
            --query "StackSummaries[?CreationTime < '${CUTOFF}'].StackName" \
            --output text | tr '\t' '\n' \
            | grep -E '^axonflow-(in-vpc-enterprise|saas-perf-testing)-[0-9]{8}-[0-9]{6}$' || true)

          if [ -z "$FOUND" ]; then
            echo "::notice::No orphaned ephemeral stacks. ✅"
            exit 0
          fi

          FAILED=0
          for STACK in $FOUND; do
            KEEP=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK" \
              --query "Stacks[0].Tags[?Key=='axonflow:keep'].Value | [0]" --output text 2>/dev/null || echo "None")
            if [ "$KEEP" = "true" ]; then
              echo "::warning::SKIP $STACK — tagged axonflow:keep=true (intentional keep; remove the tag to let the reaper collect it)"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::[dry-run] would reap: $STACK"
              continue
            fi
            echo "::warning::Reaping orphaned ephemeral stack: $STACK"
            if gh workflow run delete-stack.yml \
                -f stack_name="$STACK" \
                -f region="$AWS_REGION" \
                -f dry_run=false \
                -f confirm_delete=DELETE \
                -f disable_rds_protection=true; then
              echo "::notice::delete-stack.yml dispatched for $STACK"
            else
              echo "::error::delete-stack.yml dispatch FAILED for $STACK"
              FAILED=1
            fi
          done
          exit $FAILED

      # ------------------------------------------------------------------
      # Second pass: retained ARTIFACTS of already-deleted ephemeral stacks.
      #
      # delete-stack.yml removes the stack, but the marketplace template
      # carries DeletionPolicy: Snapshot on RDS and Retain on the ALB
      # access-log bucket + log groups — correct for real customers, pure
      # leak for the weekly benchmark's throwaway stacks. Every Monday run
      # left one 100GB snapshot, one bucket and several log groups; by
      # 2026-08-18 that was 31 snapshots / 27 buckets / 95 log groups
      # (swept manually that day). This pass keeps it at zero.
      #
      # ALL deletion decisions live in scripts/ci/reap-ephemeral-artifacts.sh
      # (pure name-in/name-out filter, no AWS calls), which is self-tested
      # against 25 decoy cases HERE, before every use — if the filter is
      # broken the run goes red instead of deleting on a broken rule. The
      # only artifacts it can ever approve embed a full
      # axonflow-(in-vpc-enterprise|saas-perf-testing)-<ts> stack name whose
      # stack no longer exists in ANY live CFN status (mid-teardown stacks
      # count as existing, so a just-dispatched delete above never races
      # its own artifacts — they wait for tomorrow's run).
      # ------------------------------------------------------------------
      - name: Checkout (for the artifact filter script)
        if: ${{ always() }}
        uses: actions/checkout@v6

      - name: Reap retained artifacts of deleted ephemeral stacks
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          FILTER=scripts/ci/reap-ephemeral-artifacts.sh

          # Fail CLOSED if the filter's own suite fails.
          bash "$FILTER" --self-test

          # Every stack in any non-DELETE_COMPLETE status counts as existing.
          aws cloudformation list-stacks --region "$AWS_REGION" \
            --query "StackSummaries[?StackStatus!='DELETE_COMPLETE'].StackName" \
            --output text | tr '\t' '\n' | sort -u > /tmp/existing-stacks.txt
          echo "::notice::$(wc -l < /tmp/existing-stacks.txt) existing stacks loaded"

          # Candidates: snapshots + buckets + log groups, typed for the filter.
          {
            aws rds describe-db-snapshots --region "$AWS_REGION" --snapshot-type manual \
              --query "DBSnapshots[?Status=='available'].DBSnapshotIdentifier" --output text \
              | tr '\t' '\n' | sed '/^$/d;s/^/snapshot:/'
            aws s3api list-buckets --query 'Buckets[].Name' --output text \
              | tr '\t' '\n' | sed '/^$/d;s/^/bucket:/'
            aws logs describe-log-groups --region "$AWS_REGION" \
              --query 'logGroups[].logGroupName' --output text \
              | tr '\t' '\n' | sed '/^$/d;s/^/loggroup:/'
          } > /tmp/candidates.txt

          bash "$FILTER" --filter /tmp/existing-stacks.txt < /tmp/candidates.txt > /tmp/approved.txt || true
          COUNT=$(grep -c . /tmp/approved.txt || true)
          echo "::notice::$COUNT retained artifact(s) approved for deletion"
          [ "$COUNT" = "0" ] && exit 0

          FAILED=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TYPE="${line%%:*}"; NAME="${line#*:}"
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::[dry-run] would delete $TYPE: $NAME"
              continue
            fi
            echo "::warning::Deleting retained $TYPE: $NAME"
            case "$TYPE" in
              snapshot)
                aws rds delete-db-snapshot --region "$AWS_REGION" \
                  --db-snapshot-identifier "$NAME" >/dev/null || { echo "::error::snapshot delete FAILED: $NAME"; FAILED=1; } ;;
              bucket)
                aws s3 rb "s3://$NAME" --force >/dev/null || { echo "::error::bucket delete FAILED: $NAME"; FAILED=1; } ;;
              loggroup)
                aws logs delete-log-group --region "$AWS_REGION" \
                  --log-group-name "$NAME" || { echo "::error::log group delete FAILED: $NAME"; FAILED=1; } ;;
            esac
          done < /tmp/approved.txt
          exit $FAILED
