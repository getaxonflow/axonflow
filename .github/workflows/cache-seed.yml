# Seeds the caches every PR restores from, now that verification workflows no
# longer re-run on push to main.
#
# WHY THIS EXISTS - the coupling is invisible until it is cut. GitHub Actions
# caches are BRANCH-SCOPED: a PR (or merge-queue) run can restore caches
# written on its own branch or on the default branch, and nothing else. While
# test.yml, lint.yml and the e2e suites re-ran on every push to main, their
# setup-go steps kept the main-branch Go module cache warm as a SIDE EFFECT.
# The 2026-08-27 CI-cost change removed those post-merge re-runs (the merge
# queue had just verified the identical tree), which also removed the only
# writers of the main-scoped cache - build.yml, the one builder kept on main,
# runs setup-go with `cache: false`.
#
# THE KEY MUST MATCH THE CONSUMER'S KEY EXACTLY, OR THE SEED IS A NO-OP.
# R3 proved the first version of this file useless by replicating setup-go's
# key derivation: the primary key ends in hashFiles(cache-dependency-path) and
# setup-go restores with NO restore-keys - exact match only. One seed job
# covering "all the go.sums" therefore wrote a key that none of the sixteen
# cache-restoring PR jobs ever looks up. Each matrix entry below mirrors ONE
# real consumer configuration VERBATIM - same go-version spelling, same
# cache-dependency-path list byte for byte, including test-customer-portal's
# reference to platform/shared/go.sum, a file that does not exist (hashFiles
# skips it, so it shapes the key only by its absence; changing the list here
# would change the key and break the match). If a workflow's setup-go block
# changes, its matrix entry here must change in the same PR.
#
# Consumers per entry (census 2026-08-27):
#   platform        -> test.yml x7, test-community.yml x4, migrations-gate.yml
#   decision        -> test.yml unit-tests-decision, test-community.yml unit-tests-decision
#   platform+decision -> test.yml community-mirror-simulation
#   platform+ee     -> test.yml unit-tests-enterprise, unit-tests-enterprise-realpg
#   ee              -> tier-gate-contract.yml x2 (merge queue)
#   portal          -> test-customer-portal-modes.yml test-backend
# and the bespoke job -> risk-scorer-tests.yml x2 (go-version-file, not go-version)
name: Cache Seed

on:
  push:
    branches: [main]
    paths:
      - 'platform/go.sum'
      - 'platform/decision/go.sum'
      - 'ee/go.sum'
      - 'ee/platform/customer-portal/go.sum'
      - '.github/workflows/cache-seed.yml'
  # Daily, for the golangci-lint seed below: lint.yml no longer runs on push
  # to main, and a cache saved on a PR branch is invisible to every other
  # branch, so main is the only place a shared lint cache can come from.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The ee/ tree does not exist on the community mirror: sync-community-repo.yml
  # strips it, so every ee-dependent seed resolved a dep-path that is not there
  # and failed on push to the mirror's main. The entries that need ee/ live in
  # seed-enterprise below, which is gated on the repository, exactly as
  # build-community.yml gates its community-only jobs. This job carries only
  # paths that exist in BOTH repositories.
  seed:
    # The daily schedule exists for seed-golangci only; the module seeds run
    # on go.sum changes and on dispatch (R3 L-b on #3683).
    if: github.event_name != 'schedule'
    name: Seed ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
            dep-path: platform/go.sum
            modules: platform
          # platform/decision is a SEPARATE module and takes the OPA Go SDK,
          # which the rest of the platform deliberately does not. Without a seed
          # its consumers download and compile OPA from cold on every pull
          # request, because a PR restores only caches written on its own branch
          # or on the default branch and nothing on main writes this one.
          - name: decision
            dep-path: platform/decision/go.sum
            modules: platform/decision
          # test.yml's community-mirror-simulation job replays the community
          # lanes over a staged copy spanning the platform module AND the
          # decision module, so its setup-go key hashes both go.sum files.
          - name: platform+decision
            dep-path: |
              platform/go.sum
              platform/decision/go.sum
            modules: platform platform/decision
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go (key mirrors one consumer exactly)
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.dep-path }}

      # setup-go SAVES the module directory at job end; it only has something
      # to save if the modules were actually downloaded.
      - name: Download modules
        run: |
          set -euo pipefail
          for d in ${{ matrix.modules }}; do
            echo "--- go mod download: $d"
            (cd "$d" && go mod download)
          done

  # The ee/ tree is stripped from the community mirror, so these three seeds
  # exist only where ee/ does. Gated on the repository the same way
  # build-community.yml gates its community-only jobs.
  seed-enterprise:
    name: Seed ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.repository != 'getaxonflow/axonflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform+ee
            dep-path: |
              platform/go.sum
              ee/go.sum
            modules: platform ee
          - name: ee
            dep-path: ee/go.sum
            modules: ee
          - name: portal
            dep-path: |
              ee/platform/customer-portal/go.sum
              platform/go.sum
            modules: ee/platform/customer-portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go (key mirrors one consumer exactly)
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.dep-path }}

      - name: Download modules
        run: |
          set -euo pipefail
          for d in ${{ matrix.modules }}; do
            echo "--- go mod download: $d"
            (cd "$d" && go mod download)
          done

  # risk-scorer-tests.yml pins Go via go-version-file, not go-version, and the
  # version spec is part of setup-go's cache key - so its key cannot come from
  # the matrix above and gets its own verbatim mirror.
  seed-risk-scorer:
    name: Seed risk-scorer (go-version-file)
    # Its cache key hashes ee/go.sum, which the community mirror does not carry.
    if: github.event_name != 'schedule' && github.repository != 'getaxonflow/axonflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: ee/go.sum

      - name: Download modules
        run: |
          set -euo pipefail
          (cd ee && go mod download)

  # golangci-lint cache seed (2026-09-03, CI-cost round 3). lint.yml restores
  # ~/.cache/golangci-lint + ~/.cache/go-build with restore-keys, but GitHub
  # only lets a run restore caches created on its own branch or on the default
  # branch, and lint.yml no longer runs on main (push-to-main tier retired,
  # #3537). Without this job every PR's first lint run is cold. This runs the
  # SAME five-module lint as lint.yml under the SAME key prefix, once a day
  # and whenever a go.sum changes on main, so a PR restores a cache at most a
  # day old from which only its changed packages re-lint.
  seed-golangci:
    name: Seed golangci-lint cache
    if: github.repository != 'getaxonflow/axonflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      # Key form mirrors lint.yml's cache step: prefix, OS, the go.sum +
      # .golangci.yml hash, then the SHA so this run always saves.
      - name: Restore the newest lint cache, save this run's
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
          key: golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-
            golangci-${{ runner.os }}-
      - name: Install golangci-lint (same pin as lint.yml)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
      - name: Lint the five modules to populate the cache
        run: |
          set -euo pipefail
          status=0
          for path in platform/agent platform/orchestrator platform/connectors platform/shared platform/decision; do
            echo "--- golangci-lint: $path"
            (cd "$path" && golangci-lint run --timeout=10m --config="${{ github.workspace }}/.golangci.yml") || status=1
          done
          # A lint failure on main is lint.yml's business, not the seed's: the
          # cache is populated either way, so report and exit 0.
          [ "$status" -eq 0 ] || echo "::warning::lint findings on main - cache populated regardless"
          du -sh ~/.cache/golangci-lint ~/.cache/go-build 2>/dev/null || true

