name: Version Alignment Check

on:
  pull_request:
    branches: [main, develop]
    # VERSION and the script itself were missing (#3089). The gate exists to
    # catch VERSION drifting from the latest CHANGELOG heading — and a PR that
    # edited ONLY VERSION, the single most likely way to introduce exactly that
    # drift, did not run it. A PR that gutted the script's VERSION check
    # likewise self-approved.
    paths:
      - 'CHANGELOG.md'
      - 'VERSION'
      # '**/' is load-bearing: an Actions path glob does NOT cross a '/', so a
      # bare 'docker-compose*.yml' matches root files ONLY. That is the same
      # blind spot the script itself carried (its `grep -r` ran against a
      # shell-expanded glob, so -r was inert), which let a nested example sit
      # pinned at 8.1.0 through every prep PR since v8.1.0. Fixing the script
      # without fixing this leaves the class half-closed: a PR touching only a
      # nested compose file would not trigger the gate at all.
      - '**/docker-compose*.yml'
      - '**/Dockerfile*'
      - '**/capabilities.go'
      - '.github/scripts/validate-version-alignment.sh'
      - '.github/workflows/validate-version-alignment.yml'
  merge_group:
    branches: [main, develop]

# Cancel superseded runs. Sessions on this repo push in rapid bursts, and a
# run for a push that is no longer the tip proves nothing while billing the
# same minutes as a real one. Two halves make non-PR runs safe, and BOTH are
# needed: cancel-in-progress only covers the RUNNING run, while GitHub's
# documented default also cancels a PENDING run in the same group the moment
# a third arrives - so with a shared per-branch group, three rapid pushes
# meant the middle push was never scanned at all. R3 found real windows: on
# 2026-08-25 three pushes landed inside one 42-second gitleaks run, and that
# scanner is delta-only, so the dropped run's commit range would have been
# scanned by NOTHING. Non-PR events therefore get a PER-COMMIT group (no
# sharing, nothing to displace), and only pull_request events cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-versions:
    name: Validate Version Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check version alignment
        run: ./.github/scripts/validate-version-alignment.sh
