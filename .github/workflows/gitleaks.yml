name: Gitleaks

# Secret-scanning guard, PUSH-TO-MAIN LEG. Runs the same gitleaks rules as the
# pre-commit hook (.pre-commit-config.yaml / .gitleaks.toml) in CI so a hardcoded
# key cannot land even if a contributor has not installed the hook. Complements
# GitHub's native push-protection / secret-scanning.
#
# The PULL-REQUEST leg is the `Scan for hardcoded secrets` step of
# .github/workflows/repository-gates.yml (W3-J, 2026-09-12): it ran here as its
# own one-minute hosted job on every push of every PR. Both legs call
# .github/scripts/gitleaks-delta-scan.sh, so the pinned version and the range
# rule live in one place. This leg stays its own workflow because it is the last
# secret scan before content can reach the public mirror
# (push_main_tier_retired_test.sh keeps it on push to main for that reason).

on:
  push:
    branches: [main]

# A push run gets a PER-COMMIT concurrency group: a later push can neither
# cancel it in progress nor displace it while pending. The scan is delta-only,
# so a displaced run's commit range would be scanned by nothing - R3 found three
# pushes inside one 42-second run on 2026-08-25.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: gitleaks only needs to read the checked-out tree.
permissions:
  contents: read
  issues: write

jobs:
  gitleaks:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the commit range below can be diffed.
          fetch-depth: 0

      - name: Run gitleaks (scan the push delta only)
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/gitleaks-delta-scan.sh
      - name: Report a red main to the tracker (#4041)
        if: always()
        uses: ./.github/actions/report-main-red
        with:
          status: ${{ job.status }}
          token: ${{ github.token }}
