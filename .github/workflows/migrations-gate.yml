name: Migrations

# =============================================================================
# "Migrations apply cleanly" — the required gate #3002 asks for.
# =============================================================================
#
# WHY THIS WORKFLOW EXISTS
#
# Migration core/148 merged in a state that ABORTS on apply ("Migration 148
# failed: N system role(s) not reconciled"), crash-looping the agent on any
# stack that runs the chain. main was broken until #2999.
#
# CI did catch it — `E2E Production-Posture (axonflow_app_role)` in
# sdk-smoke-tests.yml failed on that exact error — but that job is NOT in the
# required check set (required = Build/Test/Lint/Security Scan Summary,
# no-mocks, Runtime E2E), so the merge queue merged the PR while it was red.
# Nothing in the required set runs the migration chain: unit, lint and build
# jobs never touch a database, and the realpg tests that do are skipped without
# Docker.
#
# This job closes that gap and is deliberately CHEAP so it can be required: a
# Postgres container and the SQL chain only — no compose stack, no image build,
# no application boot. It runs in well under a minute against the ~9 minutes of
# the full E2E job.
#
# WHAT IT PROVES
#
#   * the full chain applies cleanly from a FRESH database in EVERY
#     DEPLOYMENT_MODE (each mode selects a different migration set, so a file
#     that aborts only under in-vpc-banking is just as catastrophic and just as
#     invisible),
#   * a second boot re-runs the chain as a no-op (schema_migrations bookkeeping
#     is intact — otherwise every restart re-executes the chain), and
#   * the migrations that DECLARE themselves idempotent really are re-runnable.
#
# It drives the REAL runner path (collectMigrations ordering,
# validateMigrationDependencies, the app.* session GUCs, substituteGrafanaPassword),
# not a hand-rolled `psql -f` loop — three migrations abort without the session
# variables alone, so a naive loop would not be a faithful gate.
#
# ---------------------------------------------------------------------------
# OPERATOR ACTION REQUIRED (#3002)
#
# Merging this workflow does NOT make it enforcing. Add
#
#     Migrations apply cleanly
#
# to the REQUIRED status checks for `main` in
# Settings → Branches → Branch protection rules (and to the merge queue's
# required checks). Until that is done a red run here still will not block a
# merge — which is precisely the failure mode #3002 was filed about.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches:
      - main
      - develop
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: migrations-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-apply-cleanly:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    # Generous relative to the ~1 min the suite takes; the margin absorbs a
    # slow postgres image pull on a cold runner.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: platform/go.sum

      # The tests use testcontainers (testutil.StartPostgres), which needs a
      # working Docker daemon. It is present by default on ubuntu-latest; fail
      # LOUDLY rather than let testutil.SkipIfNoDocker silently skip and turn
      # this required check green without having run anything.
      - name: Verify Docker is available (the suite skips without it)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is unavailable — testutil.SkipIfNoDocker would SKIP the migration tests and this required check would pass without applying a single migration."
            exit 1
          fi
          docker --version

      # A test can be added to the file and forgotten in the two hand-maintained
      # lists below, in which case it never runs and its regression is
      # unguarded. That happened: the pin for the #3003 anonymous-owner-conferral
      # fix sat in the file, unlisted, passing nowhere. Fail loudly instead.
      - name: Assert every migration-chain test is wired into this gate
        run: |
          missing=0
          # Scan every real-PG migration proof, not just the chain file. A proof
          # placed in its own file -- or in platform/orchestrator/ rather than
          # platform/agent/ -- was invisible to this check, which is how
          # migration 156's proof shipped unpinned while 155's was listed.
          for f in platform/agent/migration_chain_realpg_test.go \
                   platform/agent/migration_*_realpg_test.go \
                   platform/orchestrator/migration_*_realpg_test.go; do
            [ -f "$f" ] || continue
            for t in $(grep -o 'func Test[A-Za-z0-9_]*' "$f" | sed 's/func //'); do
              if ! grep -q "$t" .github/workflows/migrations-gate.yml; then
                echo "::error::$t is defined in $f but is not in this workflow's -run filter or its PASS-assertion list, so it never runs."
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] && echo "All migration-chain tests are wired into the gate."
          exit $missing

      - name: Apply the full migration chain (fresh DB, every mode + seeded legacy data)
        working-directory: platform
        run: |
          set -o pipefail
          go test ./agent/ \
            -run 'TestMigrationChainAppliesCleanly_RealPostgres|TestMigrationChainAppliesOnSeededLegacyData_RealPostgres|TestMigrationChainIsIdempotent_RealPostgres|TestOwnerMigrationsAreReRunnable_RealPostgres|TestMigration149RerunDoesNotStripGuard_RealPostgres|TestMigrationChainReplaysWithFunctionsPresent_RealPostgres|TestContactEmailDriftTriggerStaysDropped_RealPostgres|TestExpiredOwnerRowIsRevivedOnlyByIntentionalCallers_RealPostgres|TestMigration149ToleratesCollapsedOrgLoginQualifier_RealPostgres|TestMigration149StillCatchesGenuineEscalation_RealPostgres|TestMigration150CollapseTransfersProvenance_RealPostgres|TestMigration149RLSCanaryDiscriminates_RealPostgres|TestMigrationNoticesReachTheLog_RealPostgres|TestMigration149EmitsItsRLSCanary_RealPostgres|TestMigrationRunnerUsesTheNoticeHandlingOpener|TestMigration155NormalizesEmptyTenantPolicies_RealPostgres' \
            -count=1 -v -timeout 20m 2>&1 | tee /tmp/migrations.log

      # Migration 156's proof lives in platform/orchestrator/, which the
      # ./agent/ run above cannot reach. Separate leg, same PASS assertion.
      - name: Apply migration 156 (tenancy keys NOT NULL) — orchestrator package
        working-directory: platform
        run: |
          set -o pipefail
          # -tags enterprise is REQUIRED: the proof carries //go:build enterprise,
          # so without it the package builds with the test excluded and go test
          # reports "ok ... [no tests to run]" and exits 0. The PASS assertion
          # below is what turns that silent no-op into a failure.
          go test -tags enterprise ./orchestrator/ \
            -run 'TestMigration156_BackfillsOrphansAndConstrains_RealPostgres|TestMigration156_ToleratesAbsentTables_RealPostgres' \
            -count=1 -v -timeout 20m 2>&1 | tee /tmp/migrations-156.log

      - name: Assert the migration 156 tests actually ran (not skipped)
        if: always()
        run: |
          for want in \
            TestMigration156_BackfillsOrphansAndConstrains_RealPostgres \
            TestMigration156_ToleratesAbsentTables_RealPostgres
          do
            if ! grep -q "^--- PASS: ${want}" /tmp/migrations-156.log; then
              echo "::error::${want} did not PASS — it was skipped or never ran. Migration 156 constrains five tables; an unproven repair is how 150 boot-looped."
              exit 1
            fi
          done

      # A `go test` run in which every test SKIPPED still exits 0. That would
      # make this gate vacuously green — the same class of false assurance
      # #3002 is about — so assert the tests actually ran.
      - name: Assert the migration tests actually ran (not skipped)
        if: always()
        run: |
          # Both legs are asserted by name. The SEEDED leg especially: the
          # fresh-DB leg cannot catch a migration that aborts on a data shape a
          # PREVIOUS release created, and that is not hypothetical — migration
          # 150 shipped with a repair predicate narrower than its own
          # verification predicate, which boot-looped the agent while this
          # fresh-DB leg stayed green throughout.
          for want in \
            TestMigrationChainAppliesCleanly_RealPostgres \
            TestMigrationChainAppliesOnSeededLegacyData_RealPostgres \
            TestMigrationChainIsIdempotent_RealPostgres \
            TestOwnerMigrationsAreReRunnable_RealPostgres \
            TestMigration149RerunDoesNotStripGuard_RealPostgres \
            TestMigrationChainReplaysWithFunctionsPresent_RealPostgres \
            TestContactEmailDriftTriggerStaysDropped_RealPostgres \
            TestExpiredOwnerRowIsRevivedOnlyByIntentionalCallers_RealPostgres \
            TestMigration149ToleratesCollapsedOrgLoginQualifier_RealPostgres \
            TestMigration149StillCatchesGenuineEscalation_RealPostgres \
            TestMigration150CollapseTransfersProvenance_RealPostgres \
            TestMigration149RLSCanaryDiscriminates_RealPostgres \
            TestMigrationNoticesReachTheLog_RealPostgres \
            TestMigration149EmitsItsRLSCanary_RealPostgres \
            TestMigrationRunnerUsesTheNoticeHandlingOpener \
            TestMigration155NormalizesEmptyTenantPolicies_RealPostgres
          do
            if ! grep -q "^--- PASS: ${want}" /tmp/migrations.log; then
              echo "::error::${want} did not PASS — it was skipped or never ran. This gate is only meaningful if the chain is actually applied."
              exit 1
            fi
          done

          # The seeded leg is only worth anything if the seed actually produced
          # the divergent shape; a seed that silently no-ops would make the leg
          # pass vacuously.
          if ! grep -qE 'seeded [1-9][0-9]* non-canonically-keyed system owner grant' /tmp/migrations.log; then
            echo "::error::The seeded-data leg reported no non-canonically-keyed grants — the seed no-opped and the leg is vacuous."
            exit 1
          fi

          # The REPLAY leg needs its OWN marker, and this is why: on that leg the
          # whole chain has already run, so every row the shared seed helper
          # creates goes through migration 150's canonical-storing choke point
          # and lands already-canonical. The seed reports "seeded 0" there and
          # 150's collapse/re-key repairs nothing — the leg passed while
          # exercising none of the logic it exists to cover. The check above did
          # not catch it, because it greps the WHOLE log and the seeded leg's own
          # non-zero count satisfies it. Assert the replay leg's de-canonicalize
          # step separately.
          if ! grep -qE 'replay leg de-canonicalized [1-9][0-9]* owner grant' /tmp/migrations.log; then
            echo "::error::The replay leg de-canonicalized nothing — every row it replays over is already canonical, so migration 150's collapse and re-key have nothing to repair and the leg is VACUOUS."
            exit 1
          fi

          echo "Migration chain applied and verified:"
          grep -E 'applied [0-9]+ migration|seeded [0-9]+ non-canonically|replay leg de-canonicalized' /tmp/migrations.log || true
