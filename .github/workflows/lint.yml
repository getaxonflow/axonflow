name: Lint

on:
  # Pull requests: Run detect-changes and Lint Summary only
  # This ensures the required Lint Summary check is present for merge queue entry.
  # Actual linting is skipped on PRs - only run in merge queue.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
  # (Push to main no longer re-runs lint - the merge queue verified the
  # identical tree; 2026-08-27 CI-cost change.)
  # Merge queue: re-run lint against the merged code with path filtering
  merge_group:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

# Cancel orphaned PR runs when a new commit is pushed. Pushes to main / merge_group
# runs use the SHA so they never share a group and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Consolidated lint job to reduce CI costs
# Reduced from 6 parallel matrix jobs to 1 sequential job (~80% reduction in billable minutes)

jobs:
  # =============================================================================
  # Change Detection (pull_request and merge_group only)
  # =============================================================================
  detect-changes:
    name: Detect Changes
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    # Draft-PR cheap tier (2026-09-03): while a PR is a draft only the one-minute
    # gates run. Marking it ready (`ready_for_review` in pull_request.types)
    # starts this job; later pushes to a ready PR run it as before.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go-code: ${{ steps.filter.outputs.go-code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Go code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go-code:
              - '**.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.golangci.yml'
              - '.github/workflows/lint.yml'

  golangci-lint:
    name: Lint All Modules
    runs-on: [self-hosted, linux, x64, axonflow]
    timeout-minutes: 15
    needs: [detect-changes]
    # Run if: push/workflow_dispatch OR (PR/merge_group with Go changes)
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.go-code == 'true'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false  # golangci-lint has its own cache - restored below

      # golangci-lint's own cache (per-package, keyed by source hash) was never
      # persisted between runs, so every run linted five modules from cold:
      # 7.8 billable minutes on ~37 runs a day (2026-09-01 sample). Rolling
      # cache: the key carries the SHA so every run saves, and the restore key
      # falls back to the newest cache for the same go.sum set, from which
      # only the changed packages re-lint. The Go build cache is included
      # because golangci-lint type-checks through it. The size line in the log
      # is the number to watch: if it grows past ~1 GiB, scope the save to
      # merge_group and let PRs restore only.
      - name: Restore golangci-lint + Go build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
          key: golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-
            golangci-${{ runner.os }}-

      - name: Install golangci-lint
        # INSTALLED PER JOB, NOT INTO $(go env GOPATH)/bin (2026-09-05).
        # GOPATH is not in the fleet slots' .env - only GOCACHE and
        # GOMODCACHE are - so it defaults to $HOME/go, and all eight slots
        # share one /home/runner. Measured on the host: a single 41 MB
        # /home/runner/go/bin/golangci-lint, rewritten by whichever slot
        # linted last. Two concurrent runs of this job (two queue entries, or
        # a PR push beside an entry) leave one exec'ing a partially written
        # binary - exit 126, "cannot execute", which is exactly how the Trivy
        # scans ejected a merge-queue entry the same day.
        #
        # $RUNNER_TEMP is private per job on hosted AND self-hosted runners,
        # which is the isolation primitive to reach for here; the spectral
        # install in regression-test-required.yml uses the same shape. The
        # bare `golangci-lint` calls below resolve through $GITHUB_PATH.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v2.11.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/golangci-lint" --version

      - name: Lint All Modules (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Linting all modules in parallel..."
          GOLANGCI_CONFIG="${{ github.workspace }}/.golangci.yml"

          # Create temp directory for status and output tracking
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT

          # Define modules to lint with their paths
          declare -A MODULES=(
            ["agent"]="platform/agent"
            ["orchestrator"]="platform/orchestrator"
            ["connectors"]="platform/connectors"
            ["shared"]="platform/shared"
            ["decision"]="platform/decision"
          )

          # Run all lint jobs in parallel, capturing output
          for name in "${!MODULES[@]}"; do
            path="${MODULES[$name]}"
            (
              if [ ! -d "$path" ]; then
                echo "ERROR: Directory $path does not exist" > "$WORKDIR/${name}.out"
                echo "1" > "$WORKDIR/${name}.status"
              else
                cd "$path"
                if golangci-lint run --timeout=10m --config="$GOLANGCI_CONFIG" > "$WORKDIR/${name}.out" 2>&1; then
                  echo "0" > "$WORKDIR/${name}.status"
                else
                  echo "1" > "$WORKDIR/${name}.status"
                fi
              fi
            ) &
          done

          # Wait for all to complete
          wait

          # Check results and display output for failures
          FAILED=0
          for name in "${!MODULES[@]}"; do
            if [ "$(cat "$WORKDIR/${name}.status" 2>/dev/null || echo "1")" = "1" ]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "❌ $name lint FAILED (${MODULES[$name]})"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              cat "$WORKDIR/${name}.out" 2>/dev/null || echo "(no output captured)"
              echo ""
              FAILED=1
            else
              echo "✅ $name lint passed"
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "❌ One or more modules failed linting. See details above."
            exit 1
          fi

          echo ""
          echo "✅ All modules passed linting!"

      - name: Cache size (watch this; see the cache step above)
        if: always()
        run: du -sh ~/.cache/golangci-lint ~/.cache/go-build 2>/dev/null || true

      - name: Lint DEPLOYMENT_MODE pattern (Issue #1133)
        run: bash scripts/lint-deployment-mode.sh

      - name: Lint policy-table choke point (epic #3293 / #3296)
        run: bash scripts/lint-policy-table-choke-point.sh

  # =============================================================================
  # Second org-column guard (#3334)
  # =============================================================================
  #
  # DELIBERATELY A SEPARATE JOB, not another step in golangci-lint above.
  #
  # golangci-lint runs on a pull_request only when detect-changes reports
  # `go-code == 'true'`. This guard watches migrations/**/*.sql, and a PR that
  # reintroduces the column adds ONE .sql file and touches no Go at all - so as
  # a step up there it would be SKIPPED on precisely the pull request it exists
  # to catch, and every board would still be green. A guard that does not run is
  # a guard in name only.
  #
  # It carries no `if:` and no path filter for the same reason: the check is a
  # sub-second bash+awk scan, so gating it on paths buys nothing and can only
  # introduce a way for it not to run.
  #
  # Coverage: the workflow's pull_request trigger has no path filter, so this
  # runs on every PR to main/develop, and merge_group re-runs it against the
  # merged code. The repository ruleset ("Main Branch Protection") enforces
  # pull_request + merge_queue, so no change reaches main by any other route;
  # that is why lint.yml's push-event path filter is left alone rather than
  # widened to migrations/**, which would drag a full four-module golangci run
  # onto every migration-only push for no added coverage.
  org-column-guard:
    name: Lint - no second org column on the policy tables
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Runs first, and is the reason this job is trustworthy. It asserts BOTH
      # directions over fixtures the script builds itself: that every
      # reintroduction vector is rejected, and that every legitimate survivor
      # (customers.organization_id, policy_evaluations.organization_id, a
      # retype, a DROP, a comment, a *_down.sql) is accepted. Without it a
      # green tick below is equally consistent with "nothing was reintroduced"
      # and "the scanner silently matches nothing".
      - name: Self-test the guard (both directions)
        run: bash scripts/lint-no-second-org-column.sh --self-test

      - name: Lint no second org column (#3334)
        run: bash scripts/lint-no-second-org-column.sh

  # #3408 sibling: the HITL approval-queue single-writer invariant.
  #
  # Its own job with NO `if:`, deliberately. The obvious place - a step inside
  # golangci-lint - is gated on `needs.detect-changes.outputs.go-code == 'true'`,
  # and this guard's scan deliberately covers .sql / .sh / .ts / .py as well as
  # Go. A PR that adds a direct INSERT in a migration seed carries no Go change
  # and would have skipped the one job that could catch it.
  hitl-queue-choke-point:
    name: Lint - one writer for the HITL approval queue
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Runs first, and is the reason a green tick below means anything. It
      # asserts BOTH directions over fixtures it builds itself, INCLUDING that
      # the real repository scan actually finds the choke point rather than
      # matching nothing at all.
      - name: Self-test the guard (both directions)
        run: bash scripts/lint-hitl-queue-choke-point.sh --self-test

      - name: Lint one writer for hitl_approval_queue (#3408)
        run: bash scripts/lint-hitl-queue-choke-point.sh

  # Anonymous-volume leak ratchet.
  #
  # Same job shape and same reasoning as the guard above: no `if:`, because the
  # offending line is as likely to be in a `.sh` runtime-e2e suite or a
  # workflow file as in Go, and a Go-gated job would skip the PR class it
  # exists to catch.
  #
  # The bug it ratchets: `postgres` and friends declare a VOLUME, so
  # `docker rm -f` orphans an anonymous volume that nothing ever collects. It
  # was fixed once, at ONE call site, and 39 siblings kept leaking - which is
  # why this is a guard and not just a patch.
  docker-rm-volumes:
    name: Lint - docker rm must remove anonymous volumes
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Both directions, over fixtures it builds itself, plus an anti-vacuity
      # assertion that the walk actually sees the tree rather than passing
      # because it found no files.
      - name: Self-test the guard (both directions)
        run: bash scripts/lint-docker-rm-removes-volumes.sh --self-test

      - name: Lint docker rm removes anonymous volumes
        run: bash scripts/lint-docker-rm-removes-volumes.sh

  # #3715: a trap on INT/TERM whose handler does not exit returns to the script
  # body, which then runs against the state it just tore down.
  #
  # Same job shape and same reasoning as the two guards above: no `if:`. The
  # class lives entirely in shell - an operator provisioning script, an e2e
  # suite, a capture harness - and none of those PRs carry a Go change, so a
  # Go-gated job would skip exactly the PRs it exists to catch.
  trap-handlers-exit:
    name: Lint - a trap on INT/TERM must exit
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Both directions over fixtures it builds itself, including the three
      # already-correct sites as the positive control and an anti-vacuity
      # assertion that the walk really reaches the tree.
      - name: Self-test the guard (both directions)
        run: bash scripts/lint-trap-handlers-exit.sh --self-test

      - name: Lint trap handlers exit (#3715)
        run: bash scripts/lint-trap-handlers-exit.sh

  # #3649 - A PATH-FILTERED WORKFLOW CAN REPORT SUCCESS HAVING EXECUTED NOTHING.
  # At the v10.3.0 release head the community twin reported `success` with every
  # job `skipped`, and on the checks list that is indistinguishable from a green
  # run of the suite; the #3555 gate rerun had to discard it as evidence by hand.
  # The summary job above cannot carry this - it is a REQUIRED context and must
  # stay satisfiable on a docs-only change, so it accepts a skip. This job is
  # NOT required: it counts the jobs that executed, writes the count to the step
  # summary and goes RED when the count is zero, so "nothing ran" is a
  # first-class outcome a citer sees on the checks list rather than a detail
  # inside a green run. Red, not neutral: a skipped or neutral conclusion
  # satisfies a required check exactly as success does (#3755), and a census
  # that could be satisfied by not running would be the defect it counts.
  # `needs` mirrors the summary's so the two report on one set. Pinned by
  # tests/regression-test-required/zero_executed_jobs_are_visible_test.sh.
  tests-executed-census:
    name: Tests executed census
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, golangci-lint, org-column-guard, hitl-queue-choke-point, docker-rm-volumes, trap-handlers-exit]
    if: always()
    steps:
      - name: Count the jobs that executed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHANGE_DETECTOR: detect-changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          detector = os.environ["CHANGE_DETECTOR"]
          rows = sorted((job, (info or {}).get("result", "?")) for job, info in needs.items())
          substantive = [(j, r) for j, r in rows if j != detector]
          if not substantive:
              print("::error::the census needs no job besides the change detector; it is counting nothing")
              sys.exit(1)
          executed = [j for j, r in substantive if r in ("success", "failure", "cancelled")]
          skipped = [j for j, r in substantive if r == "skipped"]
          verdict = f"{len(executed)} of {len(substantive)} jobs executed"
          lines = [f"## Tests executed census: {verdict}", "", "| Job | Result |", "|---|---|"]
          lines += [f"| `{j}` | {r} |" for j, r in rows]
          if not executed:
              detector_result = dict(rows).get(detector, "absent")
              if detector_result == "success":
                  why = "the change detector ran and matched no relevant path"
              elif detector_result == "skipped":
                  why = "the change detector itself was skipped - a draft-tier run, or an event this workflow does not act on - so nothing was asked to run"
              else:
                  why = f"the change detector reported {detector_result}"
              lines += ["", f"**Nothing failed and nothing was tested.** Every job this workflow could run was skipped ({why}),",
                        "so this run is NOT evidence about the code. A green summary beside this red is a statement about",
                        "mergeability only (#3649). On a draft this red is expected and clears when the PR is marked ready."]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not executed:
              print(f"::error::{verdict}: nothing failed and nothing was tested. This run proves nothing about the code; do not cite it as evidence (#3649).")
              sys.exit(1)
          PY

  lint-summary:
    name: Lint Summary
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    needs: [detect-changes, golangci-lint, org-column-guard, hitl-queue-choke-point, docker-rm-volumes, trap-handlers-exit]
    if: always()

    steps:
      - name: Check lint results
        run: |
          echo "🔍 Lint Complete"
          echo ""
          echo "Results:"
          echo "  Detect Changes: ${{ needs.detect-changes.result }}"
          echo "  golangci-lint: ${{ needs.golangci-lint.result }}"
          echo "  org-column-guard: ${{ needs.org-column-guard.result }}"
          echo "  hitl-queue-choke-point: ${{ needs.hitl-queue-choke-point.result }}"
          echo "  docker-rm-volumes: ${{ needs.docker-rm-volumes.result }}"
          echo "  trap-handlers-exit: ${{ needs.trap-handlers-exit.result }}"

      - name: Fail if lint failed
        # Accept 'success' or 'skipped' (skipped = no Go code changes)
        # detect-changes is 'skipped' for push/workflow_dispatch events
        #
        # org-column-guard, hitl-queue-choke-point, docker-rm-volumes and
        # trap-handlers-exit are held to 'success'
        # ONLY - no 'skipped' tolerance.
        # 'Lint Summary' is the REQUIRED status check (repository ruleset
        # "Main Branch Protection"); the individual jobs are not. So a job
        # missing from this condition can be red while the required check is
        # green and the merge queue merges anyway - the exact failure #3002 was
        # filed about, and documented at the top of migrations-gate.yml. The
        # guard carries no `if:`, so anything other than 'success' means it did
        # not run, which is itself the thing worth failing on.
        if: |
          needs.detect-changes.result == 'failure' ||
          (needs.golangci-lint.result != 'success' && needs.golangci-lint.result != 'skipped') ||
          needs.org-column-guard.result != 'success' ||
          needs.hitl-queue-choke-point.result != 'success' ||
          needs.docker-rm-volumes.result != 'success' ||
          needs.trap-handlers-exit.result != 'success'
        run: |
          echo "❌ Linting failed - please fix issues before merging"
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ All linting checks passed!"
