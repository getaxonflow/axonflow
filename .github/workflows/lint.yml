name: Lint

on:
  # Pull requests: Run detect-changes and Lint Summary only
  # This ensures the required Lint Summary check is present for merge queue entry.
  # Actual linting is skipped on PRs - only run in merge queue.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
  # (Push to main no longer re-runs lint - the merge queue verified the
  # identical tree; 2026-08-27 CI-cost change.)
  # Merge queue: re-run lint against the merged code with path filtering
  merge_group:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

# Cancel orphaned PR runs when a new commit is pushed. Pushes to main / merge_group
# runs use the SHA so they never share a group and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Consolidated lint job to reduce CI costs
# Reduced from 6 parallel matrix jobs to 1 sequential job (~80% reduction in billable minutes)

jobs:
  # =============================================================================
  # Change Detection (pull_request and merge_group only)
  # =============================================================================
  detect-changes:
    name: Detect Changes
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    # Draft-PR cheap tier (2026-09-03): while a PR is a draft only the one-minute
    # gates run. Marking it ready (`ready_for_review` in pull_request.types)
    # starts this job; later pushes to a ready PR run it as before.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go-code: ${{ steps.filter.outputs.go-code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect Go code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go-code:
              - '**.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.golangci.yml'
              - '.github/workflows/lint.yml'

  golangci-lint:
    name: Lint All Modules
    # RUNNER SELECTED BY REPOSITORY, because this workflow is carried to the
    # community mirror verbatim. The fleet is registered on
    # getaxonflow/axonflow-enterprise ONLY; getaxonflow/axonflow has zero
    # runners, so a plain `[self-hosted, ...]` pin there does not fail - it
    # QUEUES FOREVER, and `Lint Summary` and `Test Summary` are required checks
    # on the mirror, so the community release blocks on a check that can never
    # report. Measured on mirror PR getaxonflow/axonflow#485: seven checks
    # queued twenty minutes with no runner able to accept them.
    runs-on: ${{ github.repository == 'getaxonflow/axonflow-enterprise' && fromJSON('["self-hosted","linux","x64","axonflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: [detect-changes]
    # Run if: push/workflow_dispatch OR (PR/merge_group with Go changes)
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.go-code == 'true'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false  # golangci-lint has its own cache - restored below

      # golangci-lint's own cache (per-package, keyed by source hash) was never
      # persisted between runs, so every run linted five modules from cold:
      # 7.8 billable minutes on ~37 runs a day (2026-09-01 sample). Rolling
      # cache: the key carries the SHA so every run saves, and the restore key
      # falls back to the newest cache for the same go.sum set, from which
      # only the changed packages re-lint. The Go build cache is included
      # because golangci-lint type-checks through it. The size line in the log
      # is the number to watch: if it grows past ~1 GiB, scope the save to
      # merge_group and let PRs restore only.
      - name: Restore golangci-lint + Go build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
          key: golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}-
            golangci-${{ runner.os }}-

      - name: Install golangci-lint
        # INSTALLED PER JOB, NOT INTO $(go env GOPATH)/bin (2026-09-05).
        # GOPATH is not in the fleet slots' .env - only GOCACHE and
        # GOMODCACHE are - so it defaults to $HOME/go, and all eight slots
        # share one /home/runner. Measured on the host: a single 41 MB
        # /home/runner/go/bin/golangci-lint, rewritten by whichever slot
        # linted last. Two concurrent runs of this job (two queue entries, or
        # a PR push beside an entry) leave one exec'ing a partially written
        # binary - exit 126, "cannot execute", which is exactly how the Trivy
        # scans ejected a merge-queue entry the same day.
        #
        # $RUNNER_TEMP is private per job on hosted AND self-hosted runners,
        # which is the isolation primitive to reach for here; the spectral
        # install in regression-test-required.yml uses the same shape. The
        # bare `golangci-lint` calls below resolve through $GITHUB_PATH.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v2.11.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/golangci-lint" --version

      - name: Lint All Modules (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Linting all modules in parallel..."
          GOLANGCI_CONFIG="${{ github.workspace }}/.golangci.yml"

          # Create temp directory for status and output tracking
          WORKDIR=$(mktemp -d)
          trap "rm -rf $WORKDIR" EXIT

          # Define modules to lint with their paths
          declare -A MODULES=(
            ["agent"]="platform/agent"
            ["orchestrator"]="platform/orchestrator"
            ["connectors"]="platform/connectors"
            ["shared"]="platform/shared"
            ["decision"]="platform/decision"
          )

          # Run all lint jobs in parallel, capturing output
          for name in "${!MODULES[@]}"; do
            path="${MODULES[$name]}"
            (
              if [ ! -d "$path" ]; then
                echo "ERROR: Directory $path does not exist" > "$WORKDIR/${name}.out"
                echo "1" > "$WORKDIR/${name}.status"
              else
                cd "$path"
                if golangci-lint run --timeout=10m --config="$GOLANGCI_CONFIG" > "$WORKDIR/${name}.out" 2>&1; then
                  echo "0" > "$WORKDIR/${name}.status"
                else
                  echo "1" > "$WORKDIR/${name}.status"
                fi
              fi
            ) &
          done

          # Wait for all to complete
          wait

          # Check results and display output for failures
          FAILED=0
          for name in "${!MODULES[@]}"; do
            if [ "$(cat "$WORKDIR/${name}.status" 2>/dev/null || echo "1")" = "1" ]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "❌ $name lint FAILED (${MODULES[$name]})"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              cat "$WORKDIR/${name}.out" 2>/dev/null || echo "(no output captured)"
              echo ""
              FAILED=1
            else
              echo "✅ $name lint passed"
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "❌ One or more modules failed linting. See details above."
            exit 1
          fi

          echo ""
          echo "✅ All modules passed linting!"

      - name: Cache size (watch this; see the cache step above)
        if: always()
        run: du -sh ~/.cache/golangci-lint ~/.cache/go-build 2>/dev/null || true

      - name: Lint DEPLOYMENT_MODE pattern (Issue #1133)
        run: bash scripts/lint-deployment-mode.sh

      - name: Lint policy-table choke point (epic #3293 / #3296)
        run: bash scripts/lint-policy-table-choke-point.sh

  # =============================================================================
  # Repository guards: ONE job, each guard its own step (W3-J, 2026-09-12)
  # =============================================================================
  #
  # These five guards ran as five jobs. Each is a sub-second bash / awk / python
  # scan over the tree, but GitHub bills every hosted JOB rounded UP to a whole
  # minute, so together they billed ~5.5 hosted minutes on every pull-request
  # push (541 runs over 2026-09-08..11) for a few seconds of work. One job bills
  # one or two.
  #
  # NOT A STEP IN golangci-lint, for the reason the first of them became its own
  # job (#3334): golangci-lint runs on a pull request only when detect-changes
  # reports go-code, and every guard here also scans .sql / .sh / workflow files.
  # A PR that reintroduces an org column adds ONE .sql file and touches no Go, so
  # inside a Go-gated job the guard would be SKIPPED on exactly the pull request
  # it exists to catch. This job carries no `if:` and no path filter: the checks
  # are sub-second, so gating them buys nothing and adds a way not to run.
  #
  # HOSTED, NOT THE FLEET. It feeds `Lint Summary`, a REQUIRED context, and on a
  # pull request that touches no Go it is the only thing Lint Summary waits for,
  # so the fleet's queue (p90 6.2 min on 2026-09-10) would land on the required
  # path - #3795's incident.
  #
  # EVERY STEP RUNS `if: always()`, so one guard's red cannot hide another's; the
  # default (a failed step skips the rest) would let the first finding mask every
  # later one, which five separate jobs never did. `always()` rather than
  # `!cancelled()` because the sync pre-flight REPLAYS this job on the staged
  # mirror copy (scripts/ci/run-community-job-in-mirror.sh), and the replay
  # evaluates no expression but success() and always(). Each self-test runs
  # before its lint and is the reason a green lint means anything: it asserts
  # BOTH directions over fixtures the script builds itself, so a green lint
  # cannot also mean "the scanner silently matched nothing".
  #
  # Lint Summary holds this job to 'success' with no 'skipped' tolerance. A red
  # step fails the job, and the step's name - each guard's old check name - says
  # which one.
  repository-guards:
    name: Lint - repository guards
    runs-on: ubuntu-latest
    # 10: the five together measured under a minute; their old caps were 5 and 10.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # #3334 - every reintroduction vector rejected; every legitimate survivor
      # (customers.organization_id, policy_evaluations.organization_id, a retype,
      # a DROP, a comment, a *_down.sql) accepted.
      - name: Lint - no second org column on the policy tables (self-test)
        if: always()
        run: bash scripts/lint-no-second-org-column.sh --self-test
      - name: Lint - no second org column on the policy tables
        if: always()
        run: bash scripts/lint-no-second-org-column.sh

      # #3408 - the HITL approval-queue single-writer invariant. The scan covers
      # .sql / .sh / .ts / .py as well as Go: a PR that adds a direct INSERT in a
      # migration seed carries no Go change.
      - name: Lint - one writer for the HITL approval queue (self-test)
        if: always()
        run: bash scripts/lint-hitl-queue-choke-point.sh --self-test
      - name: Lint - one writer for the HITL approval queue
        if: always()
        run: bash scripts/lint-hitl-queue-choke-point.sh

      # Anonymous-volume leak ratchet: `postgres` and friends declare a VOLUME,
      # so `docker rm -f` orphans an anonymous volume nothing ever collects. It
      # was fixed once, at ONE call site, and 39 siblings kept leaking.
      - name: Lint - docker rm must remove anonymous volumes (self-test)
        if: always()
        run: bash scripts/lint-docker-rm-removes-volumes.sh --self-test
      - name: Lint - docker rm must remove anonymous volumes
        if: always()
        run: bash scripts/lint-docker-rm-removes-volumes.sh

      # #3715 - a trap on INT/TERM whose handler does not exit returns to the
      # script body, which then runs against the state it just tore down.
      - name: Lint - a trap on INT/TERM must exit (self-test)
        if: always()
        run: bash scripts/lint-trap-handlers-exit.sh --self-test
      - name: Lint - a trap on INT/TERM must exit
        if: always()
        run: bash scripts/lint-trap-handlers-exit.sh

      # #4072 - a pipe into a reader that exits early, under pipefail, reports a
      # found match as missing: `printf ... | grep -q` SIGPIPEs the writer when
      # grep leaves first, and pipefail makes that 141 the pipeline's status. The
      # choke-point lint's own test runs here too: it carries #4072's planted
      # positive, and nothing ran it before.
      - name: Lint - no pipe into an early-exiting reader under pipefail (self-test)
        if: always()
        run: bash scripts/lint-pipefail-early-exit-reader_test.sh
      - name: Lint - no pipe into an early-exiting reader under pipefail
        if: always()
        run: python3 scripts/lint-pipefail-early-exit-reader.py
      - name: Self-test the policy-table choke point, including #4072's large-scan case
        if: always()
        run: bash scripts/lint-policy-table-choke-point_test.sh

  # PRD v11 §5.8 (#3746) - NO REFERENCE TO THE OLD SYSTEM. A source census over
  # the whole tree (Go, TypeScript, YAML, SQL, shell, docs) of the legacy
  # verdict engines, the decision mode, the identity-compat mode, the legacy
  # policy routes and the portal's legacy pages, derived from their declared
  # sources at a pinned tree, the merge-base and the head. RATCHET: a reference
  # present at the head and absent at the merge-base reds, and the count per
  # taxon goes to the job summary so the release train watches it fall. The
  # whole package runs (never a -run filter, which passes by matching nothing).
  #
  # ITS OWN JOB, NOT A repository-guards STEP. It sets up a Go toolchain, which
  # makes it an expensive job and so draft-gated (draft_pr_cheap_tier_test.sh);
  # Lint Summary holds repository-guards to 'success' with no skip, so a
  # toolchain there would red every draft. On the fleet like golangci-lint, so
  # it adds no hosted job (pr_board_hosted_cost_test.sh pins this workflow's
  # hosted count). The repository conjunct skips it on the community mirror:
  # the sync excludes the package, whose subject includes ee/ and runtime-e2e/.
  #
  # TAG DAY (v11.0.0 release runbook, step 0): AXONFLOW_REFCENSUS_REQUIRE_EMPTY
  # is set below - zero references outside the exemptions, whatever the base
  # held.
  census:
    name: Census - no new reference to the old system (PRD v11 §5.8)
    runs-on: ${{ github.repository == 'getaxonflow/axonflow-enterprise' && fromJSON('["self-hosted","linux","x64","axonflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event.pull_request.draft != true && github.repository == 'getaxonflow/axonflow-enterprise'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The census reads its pin and the merge-base from history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Census - no new reference to the old system (PRD v11 §5.8)
        working-directory: platform
        env:
          AXONFLOW_REFCENSUS: "1"
          # v11.0.0 tag day (RUNBOOK_PLATFORM_RELEASE step 0): the bar is empty.
          AXONFLOW_REFCENSUS_REQUIRE_EMPTY: "1"
          # The base is the main this change lands on. On a pull request the
          # checkout is the merge commit, whose FIRST PARENT is that main;
          # pull_request.base.sha is the PR's recorded base and goes stale
          # (measured on #4145: cc1d16ed1 while its merge ref sat on 804b6ce56),
          # which would charge a PR with every reference main gained since.
          # Merge queue: the entry's base. Push: the commit itself.
          AXONFLOW_REFCENSUS_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.sha }}
        run: go test -count=1 -v ./testutil/refcensus/

  # #3649 - A PATH-FILTERED WORKFLOW CAN REPORT SUCCESS HAVING EXECUTED NOTHING.
  # At the v10.3.0 release head the community twin reported `success` with every
  # job `skipped`, and on the checks list that is indistinguishable from a green
  # run of the suite; the #3555 gate rerun had to discard it as evidence by hand.
  # The summary job above cannot carry this - it is a REQUIRED context and must
  # stay satisfiable on a docs-only change, so it accepts a skip. This job is
  # NOT required: it counts the jobs that executed and writes the count to the
  # step summary. Zero executed is reported either way, but the CONCLUSION now
  # depends on why (#3649): RED when jobs were SELECTED and did not run, or when
  # the detector broke or declared no output carrying a value; a NOTICE when it
  # selected nothing or was itself skipped. It used to go red on ALL FIVE, which
  # made every PR that touched no gated path carry a permanent red - and the red
  # was then explained away with a sentence about drafts that the tool had never
  # observed. Red where it means something, so it is not the noise a citer
  # learns to skip past. Red rather than neutral in those cases: a skipped or
  # neutral conclusion satisfies a required check exactly as success does
  # (#3755), and a census that could be satisfied by not running would be the
  # defect it counts. `needs` mirrors the summary's so the two report on one
  # set. Pinned by tests/regression-test-required/
  # census_red_only_when_jobs_were_expected_test.sh (which branch fires for
  # which state) and zero_executed_jobs_are_visible_test.sh (the block's shape).
  tests-executed-census:
    name: Tests executed census
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, golangci-lint, repository-guards, census]
    if: always()
    steps:
      - name: Count the jobs that executed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHANGE_DETECTOR: detect-changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          detector = os.environ["CHANGE_DETECTOR"]
          rows = sorted((job, (info or {}).get("result", "?")) for job, info in needs.items())
          substantive = [(j, r) for j, r in rows if j != detector]
          if not substantive:
              print("::error::the census needs no job besides the change detector; it is counting nothing")
              sys.exit(1)
          executed = [j for j, r in substantive if r in ("success", "failure", "cancelled")]
          verdict = f"{len(executed)} of {len(substantive)} jobs executed"
          lines = [f"## Tests executed census: {verdict}", "", "| Job | Result |", "|---|---|"]
          lines += [f"| `{j}` | {r} |" for j, r in rows]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          def emit():
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")
              print("\n".join(lines))
          if executed:
              emit()
              sys.exit(0)
          # Nothing executed. Whether that is a finding depends on whether anything
          # was EXPECTED to run, which only the change detector can say (#3649):
          #   detector success + an output flag true  -> jobs were selected and did
          #       not run: RED, the rollup beside this is green on a skip.
          #   detector success + no flag true        -> nothing was SELECTED. What is
          #       observed is that no output was the string `true` - NOT that the
          #       globs matched nothing, and NOT that any skip was by design. Say
          #       only that. Not evidence, not a failure: NOTICE.
          #   detector success + no output with a VALUE -> a detector that declares no
          #       output carrying a value cannot have selected anything: wiring broken,
          #       not a path miss, and indistinguishable from the line above unless it is
          #       separated here. RED.
          #   detector skipped                       -> draft tier or an event this
          #       workflow does not act on: nothing was asked to run: NOTICE.
          #   detector failure/cancelled             -> the selector itself broke: RED.
          detector_info = needs.get(detector) or {}
          detector_result = detector_info.get("result", "absent")
          outputs = detector_info.get("outputs") or {}
          selected = sorted(k for k, v in outputs.items() if str(v).strip().lower() == "true")
          sentence = ("**Nothing failed and nothing was tested.** Every job this workflow could run was skipped, "
                      "so this run is NOT evidence about the code; a green summary beside it is a statement about "
                      "mergeability only (#3649).")
          if detector_result == "success" and not any(str(v).strip() for v in outputs.values()):
              lines += ["", sentence, f"The change detector reported success but declared no output carrying a VALUE (outputs: {json.dumps(outputs)}). Every detector here declares at least one, and `dorny/paths-filter` always writes the literal `true` or `false` - so an absent map, or one whose values are all empty, is the detector's own wiring rather than a path that failed to match. The two causes its comment names, a renamed step id and a misspelled output key, yield the EMPTY STRING rather than a missing key, so testing for an absent map alone would have missed exactly the defects this branch is for. A run in this state would acquit itself on every PR forever."]
              emit()
              print(f"::error::{verdict}: the change detector succeeded but declared no output carrying a value; it cannot have selected anything, so this is a detector wiring defect rather than a path miss (#3649).")
              sys.exit(1)
          if detector_result == "success" and not selected:
              lines += ["", sentence, f"The change detector reported no selection flag true (outputs: {json.dumps(outputs)}). That is what was OBSERVED; whether its globs matched nothing, or matched something this workflow does not gate on, is not visible from here."]
              emit()
              print(f"::notice::{verdict}: the change detector reported no selection flag true; nothing was expected to run. Not evidence about the code (#3649).")
              sys.exit(0)
          if detector_result == "skipped":
              lines += ["", sentence, "The change detector itself was skipped (a draft-tier run, or an event this workflow does not act on), so nothing was asked to run."]
              emit()
              print(f"::notice::{verdict}: the change detector was skipped; nothing was asked to run. Not evidence about the code (#3649).")
              sys.exit(0)
          if detector_result == "success":
              lines += ["", sentence, f"The change detector SELECTED {', '.join('`'+s+'`' for s in selected)} and the jobs that carry them did not run - a skip-accepting rollup would call that green."]
              emit()
              print(f"::error::{verdict}: nothing failed and nothing was tested, but the change detector selected {', '.join(selected)} and no job ran. Jobs were expected and did not execute; this run proves nothing about the code (#3649).")
              sys.exit(1)
          lines += ["", sentence, f"The change detector reported `{detector_result}`, so nothing downstream could be selected."]
          emit()
          print(f"::error::{verdict}: nothing failed and nothing was tested, and the change detector reported {detector_result}; the selector itself did not run to a verdict (#3649).")
          sys.exit(1)
          PY

  lint-summary:
    name: Lint Summary
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    needs: [detect-changes, golangci-lint, repository-guards, census]
    if: always()

    steps:
      - name: Check lint results
        run: |
          echo "🔍 Lint Complete"
          echo ""
          echo "Results:"
          echo "  Detect Changes: ${{ needs.detect-changes.result }}"
          echo "  golangci-lint: ${{ needs.golangci-lint.result }}"
          echo "  repository-guards: ${{ needs.repository-guards.result }}"
          echo "  census: ${{ needs.census.result }}"

      - name: Fail if lint failed
        # Accept 'success' or 'skipped' (skipped = no Go code changes)
        # detect-changes is 'skipped' for push/workflow_dispatch events
        #
        # repository-guards (the five org-column, HITL-queue, docker-rm,
        # trap-handler and pipefail guards, one step each) is held to 'success'
        # ONLY - no 'skipped' tolerance.
        # 'Lint Summary' is the REQUIRED status check (repository ruleset
        # "Main Branch Protection"); the individual jobs are not. So a job
        # missing from this condition can be red while the required check is
        # green and the merge queue merges anyway - the exact failure #3002 was
        # filed about, and documented at the top of migrations-gate.yml. The
        # guard carries no `if:`, so anything other than 'success' means it did
        # not run, which is itself the thing worth failing on.
        #
        # census (PRD v11 §5.8) is 'skipped' only where its own if: says so - a
        # draft pull request (the cheap tier; it runs when the PR is marked
        # ready) or the community mirror, which does not carry its package.
        # Anything else must be 'success'.
        if: |
          needs.detect-changes.result == 'failure' ||
          (needs.golangci-lint.result != 'success' && needs.golangci-lint.result != 'skipped') ||
          needs.repository-guards.result != 'success' ||
          (needs.census.result != 'success' && needs.census.result != 'skipped')
        run: |
          echo "❌ Linting failed - please fix issues before merging"
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ All linting checks passed!"
