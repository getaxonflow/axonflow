name: Community SaaS Daily Report

# Generates a daily snapshot of Community SaaS health and adopter activity for
# the previous UTC day. Output lands in axonflow-business-docs at
# metrics/community-saas-daily/<YYYY-MM-DD>.md so we have a git-history
# trail of how the surface evolves.
#
# Phase 1 (always runs): CloudWatch Log Insights aggregates over the agent
# log group + DynamoDB telemetry table aggregates. Works on any day.
#
# Phase 2 (auto-activates once getaxonflow/axonflow-enterprise#1830 ships):
# Athena/S3 queries on ALB access logs to break the 4xx pool into bot-vs-real
# splits. The job checks for the access-logs bucket and skips Phase 2
# gracefully if not yet provisioned.

on:
  schedule:
    # 08:00 UTC = 10:00 Amsterdam (CEST, summer) or 09:00 Amsterdam (CET, winter).
    # Most of the year is CEST. In winter it'll show up an hour earlier;
    # acceptable drift to avoid a daylight-saving feedback loop.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD, UTC). Defaults to yesterday.'
        required: false
        type: string

permissions:
  contents: read

env:
  # Stack-bound identifiers — must be updated together when the Community SaaS
  # CloudFormation stack rotates (the timestamp suffix in the stack name
  # propagates into the log-group, ALB DNS, and access-logs bucket name).
  # If a future rotation produces silently-empty reports, check here first.
  # See axonflow-enterprise/CLAUDE.md "Environment Status" for the canonical
  # current stack name.
  AWS_REGION: us-east-1
  AGENT_LOG_GROUP: /ecs/axonflow-community-saas-20260502-204911/agent
  ALB_ARN_SUFFIX: app/axonfl-AxonF-37MpQZzx3oyp/92abcaed2a49c48d
  ALB_LOGS_BUCKET: axonflow-community-saas-20260502-204911-alb-access-logs
  TELEMETRY_TABLE: prod-checkpoint-telemetry-events

concurrency:
  group: community-saas-daily-report
  cancel-in-progress: false

jobs:
  generate-report:
    name: Generate daily report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enterprise repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute target date window
        id: window
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            DATE="${{ inputs.target_date }}"
          else
            DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          fi
          START_S=$(date -u -d "${DATE}T00:00:00Z" +%s)
          END_S=$(date -u -d "${DATE}T23:59:59Z" +%s)
          echo "DATE=$DATE" >> "$GITHUB_OUTPUT"
          echo "START_S=$START_S" >> "$GITHUB_OUTPUT"
          echo "END_S=$END_S" >> "$GITHUB_OUTPUT"
          echo "START_ISO=${DATE}T00:00:00Z" >> "$GITHUB_OUTPUT"
          echo "END_ISO=${DATE}T23:59:59Z" >> "$GITHUB_OUTPUT"
          echo "Target window: ${DATE}T00:00:00Z → ${DATE}T23:59:59Z UTC"

      - name: Run Phase 1 — agent log aggregates (Log Insights)
        id: phase1_logs
        env:
          DATE: ${{ steps.window.outputs.DATE }}
          START_S: ${{ steps.window.outputs.START_S }}
          END_S: ${{ steps.window.outputs.END_S }}
        run: |
          set -euo pipefail
          QUERY='fields @message
          | stats
              sum(strcontains(@message, "201 Created")) as audit_201_created,
              sum(strcontains(@message, "[Proxy] Proxying")) as proxy_attempts,
              sum(strcontains(@message, "blocked=true")) as blocked_decisions,
              sum(strcontains(@message, "registered tenant")) as registrations,
              sum(strcontains(@message, "[AUTH] community-saas auth failed")) as auth_failures,
              sum(strcontains(@message, "[Pre-check] Connector not found")) as connector_not_found,
              sum(strcontains(@message, "rate limit")) as rate_limit_hits,
              sum(strcontains(@message, "/api/v1/audit/tool-call")) as endpoint_audit_log,
              sum(strcontains(@message, "/api/v1/audit/search")) as endpoint_audit_search,
              sum(strcontains(@message, "/api/v1/governance/decide")) as endpoint_governance_decide,
              sum(strcontains(@message, "/api/v1/governance/explain")) as endpoint_governance_explain,
              sum(strcontains(@message, "/api/v1/explain")) as endpoint_explain,
              sum(strcontains(@message, "/api/v1/overrides")) as endpoint_overrides,
              sum(strcontains(@message, "/api/v1/plans")) as endpoint_plans,
              sum(strcontains(@message, "/api/v1/policies")) as endpoint_policies,
              sum(strcontains(@message, "/api/v1/usage")) as endpoint_usage,
              sum(strcontains(@message, "exfiltration")) as exfiltration_events'

          QID=$(aws logs start-query \
            --log-group-name "${AGENT_LOG_GROUP}" \
            --start-time "$START_S" --end-time "$END_S" \
            --query-string "$QUERY" \
            --query 'queryId' --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws logs get-query-results --query-id "$QID" --query 'status' --output text)
            if [ "$STATUS" = "Complete" ]; then break; fi
            sleep 4
          done
          aws logs get-query-results --query-id "$QID" --output json > /tmp/phase1_logs.json
          echo "Phase 1 (Log Insights) results saved to /tmp/phase1_logs.json"

      - name: Run Phase 1 — ALB-level aggregate metrics (CloudWatch)
        id: phase1_alb
        env:
          START_ISO: ${{ steps.window.outputs.START_ISO }}
          END_ISO: ${{ steps.window.outputs.END_ISO }}
        run: |
          set -euo pipefail
          declare -A RESULTS
          for metric in RequestCount HTTPCode_Target_2XX_Count HTTPCode_Target_3XX_Count HTTPCode_Target_4XX_Count HTTPCode_Target_5XX_Count HTTPCode_ELB_5XX_Count; do
            VALUE=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/ApplicationELB --metric-name "$metric" \
              --dimensions "Name=LoadBalancer,Value=${ALB_ARN_SUFFIX}" \
              --start-time "$START_ISO" --end-time "$END_ISO" \
              --period 86400 --statistics Sum \
              --query 'Datapoints[0].Sum' --output text)
            [ "$VALUE" = "None" ] && VALUE="0"
            echo "  $metric=$VALUE"
            echo "$metric=$VALUE" >> /tmp/phase1_alb.txt
          done

      - name: Run Phase 1 — telemetry table (heartbeats + unique adopters)
        id: phase1_telemetry
        env:
          START_ISO: ${{ steps.window.outputs.START_ISO }}
          END_ISO: ${{ steps.window.outputs.END_ISO }}
        # DynamoDB Scan paginates at 1 MB and applies the FilterExpression
        # AFTER reading each page. A single `aws dynamodb scan` invocation
        # would silently undercount once the table grows past one page.
        # Explicit pagination loop using --exclusive-start-key so this is
        # obvious to the reader and not dependent on AWS CLI auto-pagination
        # behaviour (which is the default but has historically varied across
        # CLI minor versions).
        run: |
          set -euo pipefail
          : > /tmp/phase1_pages.jsonl
          PAGE=0
          NEXT_KEY=""
          MAX_PAGES=200   # safety cap: 200 × ~1 MB = 200 MB; current daily filter is tiny
          while [ "$PAGE" -lt "$MAX_PAGES" ]; do
            EXTRA_ARGS=()
            if [ -n "$NEXT_KEY" ]; then
              EXTRA_ARGS=(--exclusive-start-key "$NEXT_KEY")
            fi
            aws dynamodb scan --table-name "${TELEMETRY_TABLE}" \
              --filter-expression "#ts BETWEEN :s AND :e AND deployment_mode = :mode" \
              --expression-attribute-names '{"#ts":"timestamp"}' \
              --expression-attribute-values "{\":s\":{\"S\":\"${START_ISO}\"},\":e\":{\"S\":\"${END_ISO}\"},\":mode\":{\"S\":\"community-saas\"}}" \
              --projection-expression "instance_id, source_ip_hash, sdk_version" \
              --no-paginate \
              --output json \
              "${EXTRA_ARGS[@]}" > /tmp/phase1_page.json
            cat /tmp/phase1_page.json >> /tmp/phase1_pages.jsonl
            PAGE=$((PAGE + 1))
            # If LastEvaluatedKey is missing/null, we've reached the end.
            NEXT_KEY=$(python3 -c "import json,sys; d=json.load(open('/tmp/phase1_page.json')); k=d.get('LastEvaluatedKey'); print(json.dumps(k) if k else '')")
            if [ -z "$NEXT_KEY" ]; then break; fi
          done
          # Merge per-page Items arrays into one combined response object.
          python3 -c "
          import json
          all_items = []
          with open('/tmp/phase1_pages.jsonl') as f:
              for line in f:
                  if not line.strip(): continue
                  page = json.loads(line)
                  all_items.extend(page.get('Items', []))
          json.dump({'Items': all_items, 'PagesFetched': $PAGE}, open('/tmp/phase1_telemetry.json', 'w'))
          print(f'Phase 1 telemetry: {len(all_items)} items across $PAGE page(s)')
          "
          if [ "$PAGE" -eq "$MAX_PAGES" ]; then
            echo "::warning::Hit MAX_PAGES=${MAX_PAGES} cap on telemetry scan — increase if real volume grows"
          fi

      - name: Run Phase 2 — ALB access logs (only if bucket exists)
        id: phase2
        env:
          DATE: ${{ steps.window.outputs.DATE }}
        run: |
          set -uo pipefail
          if aws s3api head-bucket --bucket "${ALB_LOGS_BUCKET}" 2>/dev/null; then
            echo "phase2_available=true" >> "$GITHUB_OUTPUT"
            YEAR="${DATE:0:4}"
            MONTH="${DATE:5:2}"
            DAY="${DATE:8:2}"
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            PREFIX="alb-access-logs/AWSLogs/${ACCOUNT_ID}/elasticloadbalancing/${AWS_REGION}/${YEAR}/${MONTH}/${DAY}/"
            mkdir -p /tmp/alb-logs
            aws s3 cp "s3://${ALB_LOGS_BUCKET}/${PREFIX}" /tmp/alb-logs/ --recursive --quiet || true
            FILE_COUNT=$(find /tmp/alb-logs -name '*.log.gz' | wc -l | tr -d ' ')
            echo "ALB log files for ${DATE}: ${FILE_COUNT}"
            if [ "$FILE_COUNT" -gt 0 ]; then
              # ALB access log columns (space-separated):
              # type time elb client:port target:port request_processing_time
              # target_processing_time response_processing_time elb_status_code
              # target_status_code received_bytes sent_bytes
              # "request" "user_agent" ssl_cipher ssl_protocol target_group_arn
              # "trace_id" "domain_name" "chosen_cert_arn" matched_rule_priority
              # request_creation_time "actions_executed" "redirect_url" "error_reason"
              # "target:port_list" "target_status_code_list" "classification" "classification_reason"
              # We only need: elb_status_code, request, user_agent, client_ip
              zcat /tmp/alb-logs/*.log.gz > /tmp/alb-logs.merged
              echo "Lines in merged: $(wc -l < /tmp/alb-logs.merged)"
              # Phase 2 analytics happen in the report step
            fi
          else
            echo "phase2_available=false" >> "$GITHUB_OUTPUT"
            echo "ALB access logs bucket not yet provisioned — Phase 2 metrics skipped (deploy axonflow-enterprise#1830 first)"
          fi

      - name: Render daily report markdown
        id: render
        env:
          DATE: ${{ steps.window.outputs.DATE }}
          PHASE2_AVAILABLE: ${{ steps.phase2.outputs.phase2_available || 'false' }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF' > /tmp/report.md
          import json, os, sys
          from collections import Counter

          DATE = os.environ['DATE']
          PHASE2 = os.environ.get('PHASE2_AVAILABLE', 'false') == 'true'

          # Load Phase 1 log results.
          with open('/tmp/phase1_logs.json') as f:
              p1 = json.load(f)
          row = p1['results'][0] if p1['results'] else []
          fields = {f['field']: int(float(f['value'])) for f in row}

          # Load ALB CloudWatch.
          alb = {}
          if os.path.exists('/tmp/phase1_alb.txt'):
              for line in open('/tmp/phase1_alb.txt'):
                  k,v = line.strip().split('=', 1)
                  alb[k] = int(float(v))

          # Load telemetry.
          with open('/tmp/phase1_telemetry.json') as f:
              tel = json.load(f)
          tel_items = tel.get('Items', [])
          tel_real = [it for it in tel_items if next(iter(it.get('sdk_version',{}).values()),'') != 'v0.0.0-realstack']
          tel_ips = Counter(next(iter(it.get('source_ip_hash',{}).values()),'') for it in tel_real)

          out = []
          out.append(f"# Community SaaS daily report — {DATE} (UTC)\n")
          out.append(f"_Auto-generated by `community-saas-daily-report.yml`. Window: {DATE}T00:00:00Z → {DATE}T23:59:59Z UTC._\n")

          out.append("## Phase 1 — agent app + telemetry signals\n")
          out.append("| Signal | Count | Source |")
          out.append("|---|---:|---|")
          out.append(f"| Successful audit POSTs (`201 Created`) | {fields.get('audit_201_created', 0):,} | agent log |")
          out.append(f"| Proxy round-trips to orchestrator | {fields.get('proxy_attempts', 0):,} | agent log |")
          out.append(f"| Blocked decisions (`blocked=true`) | {fields.get('blocked_decisions', 0):,} | agent log |")
          out.append(f"| Successful registrations | {fields.get('registrations', 0):,} | agent log |")
          out.append(f"| Auth failures (`registration not found`) | {fields.get('auth_failures', 0):,} | agent log |")
          out.append(f"| Connector-not-found errors | {fields.get('connector_not_found', 0):,} | agent log |")
          out.append(f"| Rate-limit hits | {fields.get('rate_limit_hits', 0):,} | agent log |")
          out.append(f"| Exfiltration events | {fields.get('exfiltration_events', 0):,} | agent log |")
          out.append(f"| Heartbeat pings (real adopters, community-saas) | {len(tel_real):,} | telemetry table |")
          out.append(f"| Unique adopters (by `source_ip_hash`) | {len(tel_ips):,} | telemetry table |")
          out.append("")

          out.append("## Endpoint family counts (agent log mentions)\n")
          out.append("| Endpoint | Count |")
          out.append("|---|---:|")
          for label, key in [
              ('`/api/v1/audit/tool-call` (audit log)', 'endpoint_audit_log'),
              ('`/api/v1/audit/search`', 'endpoint_audit_search'),
              ('`/api/v1/governance/decide`', 'endpoint_governance_decide'),
              ('`/api/v1/governance/explain`', 'endpoint_governance_explain'),
              ('`/api/v1/explain`', 'endpoint_explain'),
              ('`/api/v1/overrides`', 'endpoint_overrides'),
              ('`/api/v1/plans` (MAP)', 'endpoint_plans'),
              ('`/api/v1/policies`', 'endpoint_policies'),
              ('`/api/v1/usage`', 'endpoint_usage'),
          ]:
              out.append(f"| {label} | {fields.get(key, 0):,} |")
          out.append("")

          out.append("## ALB-level totals (CloudWatch metrics)\n")
          out.append("| Metric | Count |")
          out.append("|---|---:|")
          for k in ['RequestCount','HTTPCode_Target_2XX_Count','HTTPCode_Target_3XX_Count','HTTPCode_Target_4XX_Count','HTTPCode_Target_5XX_Count','HTTPCode_ELB_5XX_Count']:
              out.append(f"| {k} | {alb.get(k, 0):,} |")
          out.append("")

          if PHASE2:
              out.append("## Phase 2 — ALB access log analysis\n")
              out.append("_(see /tmp/alb-logs.merged — Phase 2 analytics renderer not yet implemented; placeholder for follow-up PR.)_\n")
          else:
              out.append("## Phase 2 — ALB access log analysis\n")
              out.append("> ALB access logs bucket not yet provisioned. Phase 2 (top 4xx paths / top user agents / top source-IP concentration / bot-vs-real split) will activate automatically once `axonflow-enterprise#1830` is merged and deployed.\n")

          sys.stdout.write('\n'.join(out))
          PYEOF
          cat /tmp/report.md
          echo "REPORT_LINES=$(wc -l < /tmp/report.md | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Commit report to business-docs
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          DATE: ${{ steps.window.outputs.DATE }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/getaxonflow/axonflow-business-docs.git" /tmp/business-docs
          cd /tmp/business-docs
          mkdir -p metrics/community-saas-daily
          cp /tmp/report.md "metrics/community-saas-daily/${DATE}.md"
          git config user.name "AxonFlow Team"
          git config user.email "bot@getaxonflow.com"
          git add "metrics/community-saas-daily/${DATE}.md"
          if git diff --staged --quiet; then
            echo "No change in report content — skipping commit"
            exit 0
          fi
          git commit -s -m "metrics(community-saas-daily): ${DATE}

          Auto-generated by community-saas-daily-report workflow.
          See axonflow-enterprise/.github/workflows/community-saas-daily-report.yml"
          git push origin main
          echo "Report committed: metrics/community-saas-daily/${DATE}.md"
