name: Regression Test Required

# Implements the W12 rule from the Quality Freeze epic (#1697 / QF-19):
# every bug-fix PR must include a test at the layer that failed.
#
# A PR is treated as a bug fix when:
#   * its title matches the Conventional Commits "fix" type — i.e. starts with
#     "fix:", "fix(scope):", "fix!:" (breaking), or "fix(scope)!:" — OR
#   * it carries the "bug" label
#
# Escape hatch: the "regression-test-exempt" label skips the presence gate,
# BUT ONLY when the PR body also carries a
# "## Regression-test-exempt justification" section with content in it. Label
# without justification is a hard failure. See #3120 and the note below.
#
# See CONTRIBUTING.md ("Regression-test-per-bug") for the full rationale and
# accepted test-file patterns.
#
# ───────────────────────────────────────────────────────────────────────────
# #3120 — WHY THIS WORKFLOW NEVER READS LABELS FROM THE EVENT PAYLOAD
# ───────────────────────────────────────────────────────────────────────────
# The previous version classified from `github.event.pull_request.labels.*.name`,
# i.e. the labels as captured WHEN THE EVENT FIRED, and triggered on
# [opened, synchronize, labeled] only. Observed on PR #3119:
#
#     06:57:06Z  labeled    regression-test-exempt
#     06:57:16Z  unlabeled  regression-test-exempt
#     06:57:28Z  run reports "Skip — exempt label applied"  → green
#
# The head SHA never changed, `unlabeled` was not a trigger, so nothing
# re-evaluated. The result was a green required check with no exemption label,
# no regression test, and no trace of any of it in the PR's current state.
#
# Two independent repairs, both present below:
#   1. `unlabeled` (and `edited`, `reopened`) added to `types`, so removal of
#      the label re-fires the gate. Necessary, but on its own it only closes
#      the events we thought of.
#   2. The durable half: the classifier reads the PR's CURRENT title, body and
#      labels from the API at evaluation time. State, not state-at-trigger.
#      With that, even a trigger set that misses an event cannot leave a stale
#      green behind — every run reflects the PR as it stands when the run
#      executes, not as it stood when something happened to fire.
#
# The API read fails the job if it cannot complete. A gate that cannot
# determine whether it applies must not report success.
#
# ───────────────────────────────────────────────────────────────────────────
# #3121 — PRESENCE HERE, EXECUTION IN repository-gates.yml
# ───────────────────────────────────────────────────────────────────────────
# `check-regression-test` verifies a test file APPEARS in the diff. It does not
# and cannot verify the test works. `Run regression-test suite` executes every
# script in tests/regression-test-required/ on every PR, so a committed
# regression test that starts failing is caught rather than merely present.
# That job lived here until W3-J (2026-09-12) and now lives in
# repository-gates.yml: this workflow must fire on edited / labeled /
# unlabeled because the presence gate reads the PR's title, body and labels,
# and the suite - which reads none of them - re-ran on every such event.
#
# ───────────────────────────────────────────────────────────────────────────
# #3124 — REQUIREDNESS
# ───────────────────────────────────────────────────────────────────────────
# The job below is not in the `Main Branch Protection` ruleset's required
# status checks. Requiredness is a repository ruleset setting and cannot be
# changed from a PR. It emits a check-run on `merge_group` as well as
# `pull_request` specifically so that an operator CAN make it required
# without merge-queue entries sitting in AWAITING_CHECKS until the ruleset's
# 60-minute `check_response_timeout_minutes` ejects them.

on:
  pull_request:
    branches: [main]
    # Every event that can change either the diff or the gating inputs:
    #   opened       — first eval
    #   reopened     — re-eval after close (labels/body may have moved since)
    #   synchronize  — new commits pushed
    #   edited       — title (classification) or body (exempt justification)
    #   labeled      — `bug` / `regression-test-exempt` applied
    #   unlabeled    — `bug` / `regression-test-exempt` REMOVED. Dropped in the
    #                  previous version on the grounds that it produces "no diff
    #                  change". True, and beside the point: `labeled` is in this
    #                  list precisely because it changes gating eligibility, and
    #                  `unlabeled` changes it identically — in the direction that
    #                  REINSTATES the gate. That asymmetry was the #3120 bypass.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  # Required-check compatibility with the merge queue: see the #3124 note above.
  merge_group:
    types: [checks_requested]
  # No workflow_dispatch any more (W3-J). It existed so the SUITE could run on
  # the real runner image against any ref (#3755); the suite moved to
  # repository-gates.yml, which carries the dispatch now. Here a dispatch had
  # nothing to classify and only ever skipped the presence job.

# Cancel superseded runs. Sessions on this repo push in rapid bursts, and a
# run for a push that is no longer the tip proves nothing while billing the
# same minutes as a real one. Two halves make non-PR runs safe, and BOTH are
# needed: cancel-in-progress only covers the RUNNING run, while GitHub's
# documented default also cancels a PENDING run in the same group the moment
# a third arrives - so with a shared per-branch group, three rapid pushes
# meant the middle push was never scanned at all. R3 found real windows: on
# 2026-08-25 three pushes landed inside one 42-second gitleaks run, and that
# scanner is delta-only, so the dropped run's commit range would have been
# scanned by NOTHING. Non-PR events therefore get a PER-COMMIT group (no
# sharing, nothing to displace), and only pull_request events cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed to read the PR's current title/body/labels via the REST API.
  pull-requests: read

jobs:
  check-regression-test:
    name: Check Regression Test Present
    # ON THE SELF-HOSTED FLEET in this repository (W3-J, 2026-09-12). #3791
    # stage one moved it to hosted on the ground that it feeds a REQUIRED
    # context; it does not - see the #3124 note at the top of this file,
    # this job is not in the ruleset. It fires on edited / labeled /
    # unlabeled as well as pushes (879 runs against 541 pushes over
    # 2026-09-08..11), so as a hosted job it billed a minute per label click.
    # Selected by repository because this workflow syncs to the mirror.
    runs-on: ${{ github.repository == 'getaxonflow/axonflow-enterprise' && fromJSON('["self-hosted","linux","x64","axonflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Pass on merge_group (PR gate already enforced)
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group event — the regression-test gate already ran at the pull_request stage."
          echo "Queue branch contents == PR head commit, so re-deriving classification here is redundant."

      - name: Checkout PR head with merge-base history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the PR's CURRENT title, body and labels from the API
        id: state
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Deliberately NOT github.event.pull_request.* — see the #3120 note
          # at the top of this file. This is a live read of current state.
          pr_json="$RUNNER_TEMP/pr.json"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "::error::No PR number available on a pull_request event. Refusing to report success."
            exit 1
          fi

          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "$pr_json"; then
            echo "::error::Could not read the current state of PR #${PR_NUMBER} from the API."
            echo "A gate that cannot determine whether it applies must not pass. Re-run the job."
            exit 1
          fi

          if ! jq -e 'has("number")' "$pr_json" >/dev/null; then
            echo "::error::API response for PR #${PR_NUMBER} is not a pull request object. Refusing to report success."
            exit 1
          fi

          echo "pr_json=$pr_json" >> "$GITHUB_OUTPUT"
          echo "Read live state for PR #${PR_NUMBER}."

      - name: Determine if PR is a bug fix
        id: classify
        if: github.event_name == 'pull_request'
        env:
          PR_JSON: ${{ steps.state.outputs.pr_json }}
        run: |
          set -euo pipefail

          PR_TITLE="$(jq -r '.title // ""' "$PR_JSON")"
          jq -r '.body // ""' "$PR_JSON" > "$RUNNER_TEMP/pr-body.txt"

          # Exact label matching. The previous `grep -q '"bug"'` over a JSON
          # blob was a substring test over a rendered array, which is not the
          # same question as "does this PR carry the label `bug`".
          mapfile -t LABELS < <(jq -r '.labels[].name' "$PR_JSON")

          echo "PR title: $PR_TITLE"
          echo "Current labels: ${LABELS[*]:-(none)}"

          is_bug_fix=false
          has_exempt=false

          # Match the Conventional Commits "fix" type, including the breaking
          # variants without scope ("fix!:") that the previous glob check missed.
          # Pattern must live in a variable: an inline regex with parentheses
          # in `[[ =~ ... ]]` triggers a bash parser error on unescaped ')'.
          # Pinned byte-for-byte by tests/regression-test-required/title_regex_test.sh.
          fix_title_regex='^fix(\([^)]*\))?!?:'
          if [[ "$PR_TITLE" =~ $fix_title_regex ]]; then
            is_bug_fix=true
          fi

          for label in "${LABELS[@]:-}"; do
            case "$label" in
              bug)                     is_bug_fix=true ;;
              regression-test-exempt)  has_exempt=true ;;
            esac
          done

          # Machine-checkable exemption rationale (#3120, point 3).
          #
          # The label alone leaves no trace once removed, and nothing ever
          # required the author to say WHY. The justification now lives in the
          # PR body, which is part of the PR's durable, reviewable state — so
          # removing the label cannot silently orphan the rationale, and a
          # reviewer looking at the PR sees the exemption without digging
          # through workflow-run logs.
          #
          # Convention deliberately matches the sibling gate in
          # .github/workflows/definition-of-done.yml, which already uses a
          # "## Skip-runtime-e2e justification" body section. Same shape, so
          # contributors learn one rule rather than three.
          has_justification=false
          justification="$(awk '
            BEGIN { inside = 0; incomment = 0 }
            {
              line = $0
              sub(/\r$/, "", line)
              if (tolower(line) ~ /^##+[ \t]*regression-test-exempt justification[ \t]*$/) {
                inside = 1
                next
              }
              if (inside && line ~ /^#+[ \t]/) { inside = 0 }
              if (!inside) { next }
              # Drop HTML comment spans so a template placeholder does not
              # count as a rationale.
              while (match(line, /<!--.*-->/)) {
                line = substr(line, 1, RSTART - 1) substr(line, RSTART + RLENGTH)
              }
              if (incomment) {
                if (match(line, /-->/)) { line = substr(line, RSTART + RLENGTH); incomment = 0 }
                else { next }
              }
              if (match(line, /<!--/)) {
                line = substr(line, 1, RSTART - 1)
                incomment = 1
              }
              print line
            }
          ' "$RUNNER_TEMP/pr-body.txt" | sed -e 's/[[:space:]]*$//' -e '/^$/d')"

          if [[ -n "$justification" ]]; then
            has_justification=true
            printf '%s\n' "$justification" > "$RUNNER_TEMP/justification.txt"
          fi

          {
            echo "is_bug_fix=$is_bug_fix"
            echo "has_exempt=$has_exempt"
            echo "has_justification=$has_justification"
          } >> "$GITHUB_OUTPUT"

      - name: Skip — not a bug fix
        if: github.event_name == 'pull_request' && steps.classify.outputs.is_bug_fix != 'true'
        run: |
          echo "PR is not classified as a bug fix (title does not match a Conventional Commits 'fix' type, and 'bug' label not applied)."
          echo "Regression-test-per-bug gate does not apply."

      - name: Reject — exempt label without a justification section
        if: github.event_name == 'pull_request' && steps.classify.outputs.is_bug_fix == 'true' && steps.classify.outputs.has_exempt == 'true' && steps.classify.outputs.has_justification != 'true'
        run: |
          cat <<'EOF' >&2
          ::error::PR carries the 'regression-test-exempt' label but the body has no '## Regression-test-exempt justification' section with content in it.

          The label on its own is not an exemption. It leaves nothing behind in the
          PR's reviewable state — remove it later and the record of why the gate was
          waived disappears with it (#3120).

          To resolve, add to the PR body:

            ## Regression-test-exempt justification

            <one or two sentences: why a regression test is genuinely impractical
            here — infra-only fix, build config, generated artifact, etc.>

          An empty heading, or a heading followed only by an HTML comment, does not
          count. Accepted rationales: see CONTRIBUTING.md ("Regression-test-per-bug").
          EOF
          exit 1

      - name: Skip — exempt label applied with justification
        if: github.event_name == 'pull_request' && steps.classify.outputs.is_bug_fix == 'true' && steps.classify.outputs.has_exempt == 'true' && steps.classify.outputs.has_justification == 'true'
        run: |
          echo "::warning::PR carries 'regression-test-exempt' — regression-test-per-bug presence gate skipped."
          echo "Stated justification (from the PR body):"
          sed 's/^/  /' "$RUNNER_TEMP/justification.txt"
          echo
          echo "Reviewers: confirm this rationale is one of the accepted ones."
          echo "See CONTRIBUTING.md ('Regression-test-per-bug')."

      - name: Verify a test file is present in the diff
        if: github.event_name == 'pull_request' && steps.classify.outputs.is_bug_fix == 'true' && steps.classify.outputs.has_exempt != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Diffing $BASE_SHA...$HEAD_SHA"
          # We capture TWO diffs:
          #   1. All changed paths (for the diagnostic listing and the
          #      "deletion/rename does not satisfy the gate" warning)
          #   2. Added or Modified paths only — the gate ONLY passes on test
          #      files that show up in this set. Deletions (D), pure renames
          #      (R, with --no-renames forcing them to A+D so D is filtered),
          #      and copies (C) don't count as new regression coverage.
          #
          # Why: the previous bare `git diff --name-only` accepted any changed
          # test-ish path, so the gate could be satisfied by deleting
          # foo_test.go, by a rename of an unrelated test, or by touching a
          # comment-only line in a tests/ fixture. Bug fixes need ADDED or
          # MODIFIED regression coverage at the failing layer.
          all_diff=$(mktemp)
          am_diff=$(mktemp)
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$all_diff"; then
            echo "::error::git diff failed for $BASE_SHA...$HEAD_SHA — the base or head SHA may be unreachable (force-push?). Re-running the workflow on a fresh PR sync usually fixes this."
            exit 1
          fi
          if ! git diff --diff-filter=AM --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$am_diff"; then
            echo "::error::git diff (--diff-filter=AM) failed for $BASE_SHA...$HEAD_SHA."
            exit 1
          fi
          mapfile -t changed_files < "$all_diff"
          mapfile -t am_files < "$am_diff"
          rm -f "$all_diff" "$am_diff"

          if (( ${#changed_files[@]} == 0 )); then
            echo "::error::Diff produced no changed files. Refusing to pass — re-run after pushing or syncing the PR."
            exit 1
          fi

          echo "Changed files (all operations):"
          printf '  %s\n' "${changed_files[@]}"
          echo
          echo "Added or Modified files (eligible for regression-test credit):"
          if (( ${#am_files[@]} == 0 )); then
            echo "  (none)"
          else
            printf '  %s\n' "${am_files[@]}"
          fi
          echo

          # The "under tests/ directory" branch is restricted to code extensions
          # so a bug-fix PR can't satisfy the gate by editing a JSON snapshot, a
          # YAML fixture, a markdown helper, or any other non-executable file
          # under tests/. The naming-convention branches (foo_test.go, FooTest.java,
          # *.test.tsx, etc.) already imply code; only the directory fallback
          # needed narrowing.
          # Pinned byte-for-byte by tests/regression-test-required/path_pattern_test.sh.
          test_pattern='(_test\.go$|_test\.py$|\.test\.tsx?$|\.spec\.tsx?$|Test\.java$|Tests\.java$|IT\.java$|(^|/)tests?/.*\.(go|py|tsx?|java|sh|rb|rs|kt)$)'

          matched=()
          for f in "${am_files[@]}"; do
            if [[ "$f" =~ $test_pattern ]]; then
              matched+=("$f")
            fi
          done

          if (( ${#matched[@]} > 0 )); then
            echo "Found ${#matched[@]} added or modified test file(s) in the diff:"
            printf '  %s\n' "${matched[@]}"
            echo
            echo "Regression-test-per-bug gate: PASS"
            echo
            echo "NOTE: this gate proves PRESENCE only. Whether a test actually runs and"
            echo "passes is the 'Run regression-test suite' job's question — and that job"
            echo "covers tests/regression-test-required/ only (#3121)."
            exit 0
          fi

          # Surface deletion/rename traps so authors know why they didn't pass.
          touched_but_not_am=()
          for f in "${changed_files[@]}"; do
            if [[ "$f" =~ $test_pattern ]]; then
              found_in_am=false
              for am in "${am_files[@]}"; do
                if [[ "$am" == "$f" ]]; then
                  found_in_am=true
                  break
                fi
              done
              if [[ "$found_in_am" == "false" ]]; then
                touched_but_not_am+=("$f")
              fi
            fi
          done

          if (( ${#touched_but_not_am[@]} > 0 )); then
            echo "::warning::Test paths touched only via deletion or rename (not eligible):"
            printf '  %s\n' "${touched_but_not_am[@]}"
            echo "Deletions and pure renames don't satisfy the gate — add or modify a test."
            echo
          fi

          echo "::error::No added or modified regression test found in this bug-fix PR."
          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "REGRESSION-TEST-PER-BUG GATE FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo
          echo "This PR is classified as a bug fix but adds no ADDED or MODIFIED test"
          echo "at the layer that failed. Per the W12 rule (Quality Freeze epic #1697"
          echo "/ QF-19), every bug fix must include a regression test that would have"
          echo "caught the bug. Deletions and pure renames of existing tests don't count."
          echo
          echo "Accepted test-file patterns:"
          echo "  *_test.go                                   Go tests"
          echo "  *_test.py                                   Python tests"
          echo "  *.test.ts(x)                                TypeScript tests"
          echo "  *.spec.ts(x)                                TypeScript spec tests"
          echo "  *Test.java                                  JUnit tests"
          echo "  *Tests.java                                 JUnit tests"
          echo "  *IT.java                                    Java integration tests"
          echo "  tests/** or test/** with a code extension   .go .py .ts .tsx .java"
          echo "                                              .sh .rb .rs .kt only"
          echo
          echo "Non-code files under tests/ (JSON snapshots, YAML fixtures, markdown,"
          echo "etc.) DO NOT satisfy the gate — the test must exercise the failing layer."
          echo
          echo "If a regression test is genuinely impractical (infra-only fix,"
          echo "build config, generated artifact, etc.), apply the"
          echo "'regression-test-exempt' label AND add a"
          echo "'## Regression-test-exempt justification' section to the PR body."
          echo "The label alone is not enough — see #3120."
          echo
          echo "See CONTRIBUTING.md ('Regression-test-per-bug') for the full guidance."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
