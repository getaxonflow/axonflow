name: Governed Request Plane Principal E2E

# Executes runtime-e2e/3152_governed_plane_principal/ (#3152).
#
# WHY A DEDICATED WORKFLOW RATHER THAN A production_posture_registry.txt ENTRY:
# every entry in that registry is AMBIENT — it curls an already-booted shared
# stack. This suite is SELF-BOOTING: `docker compose -p rte3152pr_$$ up -d
# --build` over its own isolation overlay, torn down with `down -v
# --remove-orphans`. The settled house rule is: ambient suite -> posture
# registry; self-booting suite -> dedicated workflow, however well isolated.
# Same shape as governed-plane-scope-e2e.yml and mcp-tenant-policy-e2e.yml.
#
# The `Runtime E2E required for user-facing changes` check in
# definition-of-done.yml is a PRESENCE gate (it greps changed filenames); it
# does not run anything. This workflow is what actually executes the suite.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # A `paths:` filter is a guard, so it must list every file the suite's
    # CORRECTNESS depends on — not just the files that express the contract.
    # Omit one and the guard silently stops guarding, because the PR that
    # breaks the suite is exactly the PR that never runs it (#3089).
    paths:
      - 'runtime-e2e/3152_governed_plane_principal/**'
      # The token minter every direct-to-orchestrator assertion depends on.
      - 'runtime-e2e/lib/proxy_auth.sh'

      # The defect under test: applyAuthoritativePrincipal and its three call
      # sites all live here.
      - 'platform/orchestrator/run.go'

      # The resolver whose `case "user.role"` is the primitive, and the
      # evaluator that turns it into the verdict assertions 2-6 read.
      - 'platform/orchestrator/db_dynamic_policies.go'

      # Assertion 7/8 read audit_logs.user_email / user_role, which this file
      # writes from req.User.
      - 'platform/orchestrator/audit_logger.go'

      # Assertions 5 and 6 turn on the agent Del()ing a client-asserted
      # X-Axonflow-User-Role and re-Setting it only from a validated per-user
      # token. If that stops being true the fix has moved the forgery rather
      # than removed it.
      - 'platform/agent/proxy.go'
      - 'platform/shared/identity/readscope.go'
      - 'platform/shared/identity/trust.go'

      # Community-mode Basic auth is how the suite obtains a tenant with no
      # license.
      - 'platform/agent/auth.go'
      - 'platform/agent/authenticator.go'

      # Assertion 4's gate.
      - 'platform/orchestrator/authn_middleware.go'

      # Readiness: platform/agent/run.go owns the "Reverse proxy initialized"
      # log line wait_agent_ready() greps, and the boot ordering that made that
      # wait necessary. Reword the line and every gateway assertion times out.
      - 'platform/agent/run.go'

      # The stack the suite boots.
      - 'docker-compose.yml'
      - 'platform/agent/Dockerfile'
      - 'platform/orchestrator/Dockerfile'

      - '.github/workflows/governed-plane-principal-e2e.yml'
  workflow_dispatch:

concurrency:
  group: governed-plane-principal-e2e-${{ github.ref }}
  cancel-in-progress: true

# The job only checks out and runs a local compose stack; it uses no secrets
# and writes nothing back to the repo.
permissions:
  contents: read

env:
  AXONFLOW_TELEMETRY: "off"
  CI: "true"

jobs:
  governed-plane-principal-e2e:
    name: Governed request plane binds to the authenticated principal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No LLM keys, no license, no AWS secrets: community mode plus the
      # suite's own exported internal-service secret, so it works on a fork PR.
      - name: Run runtime-e2e 3152 — governed request plane principal binding
        shell: bash
        run: ./runtime-e2e/3152_governed_plane_principal/test.sh

      - name: Dump agent + orchestrator logs on failure
        if: failure()
        shell: bash
        run: |
          echo "── containers ──"
          docker ps -a || true
          for c in $(docker ps -aq --filter "name=rte3152pr"); do
            echo "── logs: $c ──"
            docker logs --tail 150 "$c" 2>&1 || true
          done
