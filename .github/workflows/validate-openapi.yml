name: Validate OpenAPI

on:
  push:
    paths:
      - 'docs/api/**/*.yaml'
      - 'docs/api/**/*.yml'
      - '.github/workflows/validate-openapi.yml'
      - '.spectral.yaml'
  pull_request:
    paths:
      - 'docs/api/**/*.yaml'
      - 'docs/api/**/*.yml'
      - '.github/workflows/validate-openapi.yml'
      - '.spectral.yaml'

jobs:
  validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g @apidevtools/swagger-cli
          npm install -g @redocly/cli
          # Spectral CLI 6.15.1 caret-ranges its @stoplight/spectral-core
          # + @stoplight/spectral-rulesets deps. The most recent
          # spectral-core 1.23.0 + spectral-rulesets 1.22.3 emit a JSON-
          # Path expression that crashes nimma 0.2.3 with
          # `Cannot read properties of null (reading 'enum')` on
          # docs/api/orchestrator-api.yaml. Pin the full transitive
          # tree via npm overrides in a local install (global `npm
          # install -g` does not honor `overrides`). Bump once upstream
          # ships a fix.
          mkdir -p /tmp/spectral-ci
          cat > /tmp/spectral-ci/package.json << 'PKGEOF'
          {
            "name": "spectral-ci-pinned",
            "version": "1.0.0",
            "dependencies": {
              "@stoplight/spectral-cli": "6.15.1"
            },
            "overrides": {
              "@stoplight/spectral-core": "1.22.0",
              "@stoplight/spectral-rulesets": "1.22.1"
            }
          }
          PKGEOF
          (cd /tmp/spectral-ci && npm install --silent)
          echo "/tmp/spectral-ci/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate OpenAPI spec syntax
        run: |
          set -e
          echo "Validating OpenAPI specification syntax..."
          # All three specs validated — agent-api.yaml + orchestrator-api.yaml
          # were left out of the gate originally and accumulated broken refs
          # (#1759). With all three covered, swagger-cli fails the gate on
          # any new broken $ref, duplicate schema, or unparseable YAML.
          for spec in docs/api/agent-api.yaml docs/api/orchestrator-api.yaml docs/api/policy-api.yaml; do
            echo "  → $spec"
            swagger-cli validate "$spec"
          done
          echo "✅ Syntax validation passed"

      - name: Lint OpenAPI spec
        run: |
          set -e
          echo "Linting OpenAPI specification..."
          # Fail on errors, allow warnings.
          for spec in docs/api/agent-api.yaml docs/api/orchestrator-api.yaml docs/api/policy-api.yaml; do
            echo "  → $spec"
            spectral lint "$spec" --ruleset .spectral.yaml --fail-severity error
          done
          echo "✅ Linting passed"

      - name: Get base specs for comparison
        if: github.event_name == 'pull_request'
        id: base-spec
        run: |
          set -e
          git fetch origin ${{ github.base_ref }} --depth=1
          # Save base specs in workspace (not /tmp) so Docker actions can
          # access them. One file per spec — the breaking-change check
          # runs once per spec.
          #
          # Each base spec is also pre-validated with swagger-cli before
          # we declare it eligible for the breaking-change diff. oasdiff
          # bombs out with a confusing "map key X not found" error when
          # the base spec has broken $refs or duplicate keys, which can
          # block a legitimate spec-cleanup PR (the PR that's fixing
          # those very defects). Specs whose base fails validation skip
          # the breaking-change diff with a notice — once that PR
          # merges, future PRs see a clean base and the diff runs
          # normally.
          for spec in agent-api orchestrator-api policy-api; do
            key="${spec//-/_}"
            if ! git show "origin/${{ github.base_ref }}:docs/api/${spec}.yaml" > "base-${spec}.yaml" 2>/dev/null; then
              echo "has_${key}=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️  No previous ${spec}.yaml found on base branch — skipping its breaking-change check"
              continue
            fi
            if ! swagger-cli validate "base-${spec}.yaml" >/dev/null 2>&1; then
              echo "has_${key}=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Base spec invalid::Base ${spec}.yaml does not validate — skipping breaking-change diff this run. Merge the cleanup PR and the next run will diff against a valid base."
              continue
            fi
            echo "has_${key}=true" >> "$GITHUB_OUTPUT"
          done

      - name: Check for breaking changes (agent-api)
        if: github.event_name == 'pull_request' && steps.base-spec.outputs.has_agent_api == 'true'
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-agent-api.yaml
          revision: docs/api/agent-api.yaml
          fail-on: ERR
          # Reviewed-and-accepted breaking changes that are actually
          # spec corrections (the platform has always returned the
          # corrected shape; the YAML was the bug). Entry-by-entry
          # justification in .github/oasdiff-err-ignore.txt, each
          # pinned to the PR that added it.
          err-ignore: .github/oasdiff-err-ignore.txt

      - name: Check for breaking changes (orchestrator-api)
        if: github.event_name == 'pull_request' && steps.base-spec.outputs.has_orchestrator_api == 'true'
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-orchestrator-api.yaml
          revision: docs/api/orchestrator-api.yaml
          fail-on: ERR
          err-ignore: .github/oasdiff-err-ignore.txt

      - name: Check for breaking changes (policy-api)
        if: github.event_name == 'pull_request' && steps.base-spec.outputs.has_policy_api == 'true'
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-policy-api.yaml
          revision: docs/api/policy-api.yaml
          # For v2.0.0: Fail on ERR only (actual breaking changes)
          # Warnings for new enum values in responses are acceptable for major versions
          fail-on: ERR
          err-ignore: .github/oasdiff-err-ignore.txt

      - name: Generate documentation preview
        run: |
          set -e
          echo "Generating documentation previews..."
          for spec in agent-api orchestrator-api policy-api; do
            npx @redocly/cli build-docs "docs/api/${spec}.yaml" -o "/tmp/${spec}-docs.html"
          done
          echo "✅ Documentation generated successfully"

      - name: Upload documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: api-docs-preview
          path: |
            /tmp/agent-api-docs.html
            /tmp/orchestrator-api-docs.html
            /tmp/policy-api-docs.html
          retention-days: 7

  bundle:
    name: Bundle OpenAPI Spec
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g @redocly/cli

      - name: Bundle specifications
        run: |
          set -e
          for spec in agent-api orchestrator-api policy-api; do
            npx @redocly/cli bundle "docs/api/${spec}.yaml" -o "docs/api/${spec}-bundled.yaml"
          done
          echo "✅ Bundled specifications created"

      - name: Generate static documentation
        run: |
          set -e
          # `index.html` defaults to the policy-api shape so the existing
          # docs landing URL doesn't move; the per-spec docs are uploaded
          # alongside as additional artifacts.
          npx @redocly/cli build-docs docs/api/policy-api.yaml -o docs/api/index.html
          for spec in agent-api orchestrator-api; do
            npx @redocly/cli build-docs "docs/api/${spec}.yaml" -o "docs/api/${spec}.html"
          done
          echo "✅ Static documentation generated"

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openapi-bundle
          path: |
            docs/api/agent-api-bundled.yaml
            docs/api/orchestrator-api-bundled.yaml
            docs/api/policy-api-bundled.yaml
            docs/api/index.html
            docs/api/agent-api.html
            docs/api/orchestrator-api.html
          retention-days: 30
