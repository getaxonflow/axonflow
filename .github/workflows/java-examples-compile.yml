name: Java Examples Compile

# Compiles every Java example project under examples/ (#3158, #3185).
#
# WHY A SEPARATE WORKFLOW RATHER THAN A STEP IN security.yml
# ----------------------------------------------------------
# security.yml's Maven warm-up already enumerates a pom set and could have
# hosted this. It was deliberately not put there.
#
# `Security Scan Summary` IS a required check, and its `security-relevant`
# filter fires on `**/*.go`, `**/go.mod`, `**/pom.xml` and `**/Dockerfile*` —
# i.e. nearly every product PR. #3178 measured the warm-up that already lives
# there at ~7 minutes on that required path. Adding a full 58-project compile
# to it would make every Go-only PR pay for Java example compilation on the
# critical path to merge.
#
# HOW THIS IS SCOPED
# ------------------
# Two tiers, two mechanisms, and the reason each is the one it is:
#
#   * pull_request: a WORKFLOW-LEVEL `paths:` filter (W3-J, 2026-09-12). This
#     file used to argue against one, and the argument is still the condition
#     it rests on: a workflow skipped by a paths filter creates NO check run,
#     so a REQUIRED context it produces would sit at "Expected - waiting for
#     status to be reported" on every PR that touches no example. Measured on
#     #4117, where the same shape on migrations-gate.yml read BLOCKED with the
#     context absent. It is legal here only because `Java Examples Summary` is
#     required on NEITHER ruleset (enterprise 9199766, mirror 10855245). IF IT
#     IS EVER MADE REQUIRED, REMOVE THE FILTER FIRST and let detect-changes
#     scope the pull_request tier too, the way lint.yml and test.yml do.
#     Before the filter, the three bookkeeping jobs ran on every PR - 3 hosted
#     minutes a run, 544 runs over 2026-09-08..11 - to report that nothing was
#     compiled on the ~92% of PRs that touch no example.
#   * merge_group: `detect-changes` (dorny/paths-filter) with the compile gated
#     on its output. `merge_group` accepts no `paths:` at all, so without the
#     detector the full 58-project compile would run on every queue entry.
#
# The two lists are the same list: the pull_request `paths:` equals the
# detector's `java-examples` filter entry for entry, and
# pr_board_hosted_cost_test.sh fails if they ever differ - two tiers must not
# disagree about when this gate runs.
#
# COMMUNITY MIRROR
# ----------------
# This file is NOT in sync-community-repo.yml's exclusion list, so it syncs to
# the public mirror — which is correct: `examples/` is exactly what that mirror
# publishes, and every path referenced below survives the rsync (in particular
# `tests/regression-test-required/java_examples_compile_gate_test.sh` is not
# among the nine suite files that workflow excludes individually). Nothing here
# reads `ee/`, a secret, or any path the sync strips, so it cannot red the
# mirror's CI for a reason unrelated to the examples.

on:
  # pull_request: a workflow-level paths filter; merge_group: detect-changes.
  # See the header for why each tier uses the mechanism it does.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # The detector's `java-examples` list, verbatim (see the header).
    paths:
      - 'examples/**'
      - '.github/workflows/java-examples-compile.yml'
      - '.github/scripts/compile-java-examples.sh'
      - '.github/scripts/pom_introspect.py'
      - 'tests/regression-test-required/java_examples_compile_gate_test.sh'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel superseded PR runs. Pushes to main and merge_group runs key on the SHA
# so they never share a group and never cancel each other's verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Changes
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    # Draft-PR cheap tier (2026-09-03): while a PR is a draft only the one-minute
    # gates run. Marking it ready (`ready_for_review` in pull_request.types)
    # starts this job; later pushes to a ready PR run it as before.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java-examples: ${{ steps.filter.outputs.java-examples }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Java example changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # The gate's own self-test is included: editing the guard's guard
          # must re-run the guard.
          filters: |
            java-examples:
              - 'examples/**'
              - '.github/workflows/java-examples-compile.yml'
              - '.github/scripts/compile-java-examples.sh'
              - '.github/scripts/pom_introspect.py'
              - 'tests/regression-test-required/java_examples_compile_gate_test.sh'

  compile-java-examples:
    name: Compile Java examples
    # RUNNER SELECTED BY REPOSITORY, because this workflow is carried to the
    # community mirror verbatim. The fleet is registered on
    # getaxonflow/axonflow-enterprise ONLY; getaxonflow/axonflow has zero
    # runners, so a plain `[self-hosted, ...]` pin there does not fail - it
    # QUEUES FOREVER, and `Lint Summary` and `Test Summary` are required checks
    # on the mirror, so the community release blocks on a check that can never
    # report. Measured on mirror PR getaxonflow/axonflow#485: seven checks
    # queued twenty minutes with no runner able to accept them.
    runs-on: ${{ github.repository == 'getaxonflow/axonflow-enterprise' && fromJSON('["self-hosted","linux","x64","axonflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [detect-changes]
    # Run if: push/workflow_dispatch OR (PR/merge_group touching the examples)
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.java-examples == 'true'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Every JDK the example tree declares. 57 of the 58 projects are Java 11
      # or 17; examples/llm-providers/azure-openai/hello-world/java declares 21
      # (it uses text blocks) and is the sole outlier. The compile script reads
      # the required level out of each pom and selects the matching JDK, so a
      # project is never built against a toolchain that cannot emit its
      # declared target.
      #
      # Keep this list and SUPPORTED_JDKS below in step: a level with no
      # installed JDK is a hard failure in the script, naming the version to
      # add — it is never silently built with whatever is default.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
          cache: 'maven'

      - name: Compile every Java example
        env:
          SUPPORTED_JDKS: '17 21'
        run: bash .github/scripts/compile-java-examples.sh

      # The gate's own fail-closed properties, exercised against synthetic
      # fixtures with a stub Maven: zero discovered fails, a failing build
      # fails, a lost dispatch entry fails, an uninstallable Java level fails,
      # a build that emits no classes fails, an unresolvable <mainClass> fails,
      # and the invoked goal really is `compile` rather than a resolve-only one.
      #
      # `always()` because the two results are independent questions. Without
      # it a compile failure skips this step, so a PR that breaks an example
      # AND weakens the gate reports only the first — and once the example is
      # repaired the gate's own regression is already merged.
      - name: Self-test the compile gate
        if: always()
        run: bash tests/regression-test-required/java_examples_compile_gate_test.sh

  # #3649 - A PATH-FILTERED WORKFLOW CAN REPORT SUCCESS HAVING EXECUTED NOTHING.
  # At the v10.3.0 release head the community twin reported `success` with every
  # job `skipped`, and on the checks list that is indistinguishable from a green
  # run of the suite; the #3555 gate rerun had to discard it as evidence by hand.
  # The summary job above cannot carry this - it is a REQUIRED context and must
  # stay satisfiable on a docs-only change, so it accepts a skip. This job is
  # NOT required: it counts the jobs that executed and writes the count to the
  # step summary. Zero executed is reported either way, but the CONCLUSION now
  # depends on why (#3649): RED when jobs were SELECTED and did not run, or when
  # the detector broke or declared no output carrying a value; a NOTICE when it
  # selected nothing or was itself skipped. It used to go red on ALL FIVE, which
  # made every PR that touched no gated path carry a permanent red - and the red
  # was then explained away with a sentence about drafts that the tool had never
  # observed. Red where it means something, so it is not the noise a citer
  # learns to skip past. Red rather than neutral in those cases: a skipped or
  # neutral conclusion satisfies a required check exactly as success does
  # (#3755), and a census that could be satisfied by not running would be the
  # defect it counts. `needs` mirrors the summary's so the two report on one
  # set. Pinned by tests/regression-test-required/
  # census_red_only_when_jobs_were_expected_test.sh (which branch fires for
  # which state) and zero_executed_jobs_are_visible_test.sh (the block's shape).
  tests-executed-census:
    name: Tests executed census
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, compile-java-examples]
    if: always()
    steps:
      - name: Count the jobs that executed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHANGE_DETECTOR: detect-changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          detector = os.environ["CHANGE_DETECTOR"]
          rows = sorted((job, (info or {}).get("result", "?")) for job, info in needs.items())
          substantive = [(j, r) for j, r in rows if j != detector]
          if not substantive:
              print("::error::the census needs no job besides the change detector; it is counting nothing")
              sys.exit(1)
          executed = [j for j, r in substantive if r in ("success", "failure", "cancelled")]
          verdict = f"{len(executed)} of {len(substantive)} jobs executed"
          lines = [f"## Tests executed census: {verdict}", "", "| Job | Result |", "|---|---|"]
          lines += [f"| `{j}` | {r} |" for j, r in rows]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          def emit():
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")
              print("\n".join(lines))
          if executed:
              emit()
              sys.exit(0)
          # Nothing executed. Whether that is a finding depends on whether anything
          # was EXPECTED to run, which only the change detector can say (#3649):
          #   detector success + an output flag true  -> jobs were selected and did
          #       not run: RED, the rollup beside this is green on a skip.
          #   detector success + no flag true        -> nothing was SELECTED. What is
          #       observed is that no output was the string `true` - NOT that the
          #       globs matched nothing, and NOT that any skip was by design. Say
          #       only that. Not evidence, not a failure: NOTICE.
          #   detector success + no output with a VALUE -> a detector that declares no
          #       output carrying a value cannot have selected anything: wiring broken,
          #       not a path miss, and indistinguishable from the line above unless it is
          #       separated here. RED.
          #   detector skipped                       -> draft tier or an event this
          #       workflow does not act on: nothing was asked to run: NOTICE.
          #   detector failure/cancelled             -> the selector itself broke: RED.
          detector_info = needs.get(detector) or {}
          detector_result = detector_info.get("result", "absent")
          outputs = detector_info.get("outputs") or {}
          selected = sorted(k for k, v in outputs.items() if str(v).strip().lower() == "true")
          sentence = ("**Nothing failed and nothing was tested.** Every job this workflow could run was skipped, "
                      "so this run is NOT evidence about the code; a green summary beside it is a statement about "
                      "mergeability only (#3649).")
          if detector_result == "success" and not any(str(v).strip() for v in outputs.values()):
              lines += ["", sentence, f"The change detector reported success but declared no output carrying a VALUE (outputs: {json.dumps(outputs)}). Every detector here declares at least one, and `dorny/paths-filter` always writes the literal `true` or `false` - so an absent map, or one whose values are all empty, is the detector's own wiring rather than a path that failed to match. The two causes its comment names, a renamed step id and a misspelled output key, yield the EMPTY STRING rather than a missing key, so testing for an absent map alone would have missed exactly the defects this branch is for. A run in this state would acquit itself on every PR forever."]
              emit()
              print(f"::error::{verdict}: the change detector succeeded but declared no output carrying a value; it cannot have selected anything, so this is a detector wiring defect rather than a path miss (#3649).")
              sys.exit(1)
          if detector_result == "success" and not selected:
              lines += ["", sentence, f"The change detector reported no selection flag true (outputs: {json.dumps(outputs)}). That is what was OBSERVED; whether its globs matched nothing, or matched something this workflow does not gate on, is not visible from here."]
              emit()
              print(f"::notice::{verdict}: the change detector reported no selection flag true; nothing was expected to run. Not evidence about the code (#3649).")
              sys.exit(0)
          if detector_result == "skipped":
              lines += ["", sentence, "The change detector itself was skipped (a draft-tier run, or an event this workflow does not act on), so nothing was asked to run."]
              emit()
              print(f"::notice::{verdict}: the change detector was skipped; nothing was asked to run. Not evidence about the code (#3649).")
              sys.exit(0)
          if detector_result == "success":
              lines += ["", sentence, f"The change detector SELECTED {', '.join('`'+s+'`' for s in selected)} and the jobs that carry them did not run - a skip-accepting rollup would call that green."]
              emit()
              print(f"::error::{verdict}: nothing failed and nothing was tested, but the change detector selected {', '.join(selected)} and no job ran. Jobs were expected and did not execute; this run proves nothing about the code (#3649).")
              sys.exit(1)
          lines += ["", sentence, f"The change detector reported `{detector_result}`, so nothing downstream could be selected."]
          emit()
          print(f"::error::{verdict}: nothing failed and nothing was tested, and the change detector reported {detector_result}; the selector itself did not run to a verdict (#3649).")
          sys.exit(1)
          PY

  java-examples-summary:
    name: Java Examples Summary
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    needs: [detect-changes, compile-java-examples]
    if: always()
    steps:
      - name: Report
        run: |
          echo "Detect Changes:        ${{ needs.detect-changes.result }}"
          echo "Compile Java examples: ${{ needs.compile-java-examples.result }}"

      # 'skipped' on compile is legitimate: the PR touched no example.
      # 'skipped' on detect-changes is legitimate on push/workflow_dispatch.
      # Anything else — including a cancelled or failed detect-changes — must
      # not report success, or the scoping decision itself becomes unverified.
      - name: Fail if the compile gate did not pass
        if: |
          needs.detect-changes.result == 'failure' ||
          needs.detect-changes.result == 'cancelled' ||
          (needs.compile-java-examples.result != 'success' &&
           needs.compile-java-examples.result != 'skipped')
        run: |
          echo "::error::The Java example compile gate did not pass."
          echo "examples/ ships to the public community mirror; an example that does not"
          echo "build is a broken artifact a reader hits on first 'mvn compile'."
          exit 1

      - name: Success
        if: success()
        run: echo "Java example compile gate satisfied."
