name: SDK Smoke Tests

# Validates that SDK examples and README curl commands work against the stack.
# Catches broken documentation before merge.
#
# Runtime: ~4-5 minutes
# Trigger: Changes to agent, orchestrator, demo examples, docker-compose, or enterprise code

on:
  merge_group:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel orphaned PR runs when a new commit is pushed. Pushes to main / merge_group
# runs use the SHA so they never share a group and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'
  # Timeouts and retry configuration
  HEALTH_CHECK_RETRIES: 30
  HEALTH_CHECK_INTERVAL: 2
  DOCKER_WAIT_TIMEOUT: 180

jobs:
  # =============================================================================
  # Change Detection (PR and merge_group only)
  # =============================================================================
  detect-changes:
    # NO pull_request TRIGGER, BY DESIGN (2026-09-04). This suite boots a
    # compose stack (~10 billable minutes). The 2026-09-03 label gate made it
    # opt-in and every PR opted in within seconds of opening, so the gate cut
    # nothing: 133 billable minutes per push before and after. Opt-in cannot
    # restrain spend when the person choosing does not pay. The suite now runs
    # post-merge only: nightly-e2e.yml dispatches it against main when its
    # paths changed, plus release tags and manual dispatch. There is no PR
    # path and no label that opens one.
    name: Detect Changes
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk-relevant: ${{ steps.filter.outputs.sdk-relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect SDK-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Gates the smoke-tests job only. Mirrors the `push:` paths list at
          # the top of this file, minus 'runtime-e2e/**' (see the note there).
          # platform/** rather than the three service subtrees: the stack this
          # job boots is built with `COPY platform/ .` (#3089).
          filters: |
            sdk-relevant:
              - 'platform/**'
              - 'ee/platform/agent/**'
              - 'ee/platform/orchestrator/**'
              - 'ee/platform/connectors/**'
              - 'ee/platform/customer-portal/**'
              - 'examples/demo/**'
              - 'docker-compose.yml'
              - 'docker-compose.enterprise.yml'
              - 'migrations/**'
              - 'scripts/e2e/**'
              - 'scripts/setup-e2e-testing.sh'
              - 'scripts/operators/provision-app-role.sh'
              - '.github/workflows/sdk-smoke-tests.yml'

  smoke-tests:
    name: SDK Smoke Tests
    # GITHUB-HOSTED, NOT THE FLEET. This job runs `docker compose up -d` at
    # the repo root, i.e. the ROOT docker-compose.yml with its FIXED host ports
    # (127.0.0.1:5432, 6379, 8080, 8081). It ships no `ports: !override`
    # overlay - the pattern the 60 suite workflows use to share one host - so
    # two jobs in this group overlapping fail with "port is already allocated".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    # Run if: push/workflow_dispatch OR (PR/merge_group with SDK-relevant changes)
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.sdk-relevant == 'true'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          # jq is pre-installed on GitHub runners, but verify
          jq --version

      - name: Start AxonFlow stack
        id: start-stack
        run: |
          echo "🚀 Starting AxonFlow stack..."
          docker compose up -d --wait --wait-timeout ${{ env.DOCKER_WAIT_TIMEOUT }} || {
            echo "❌ Docker compose failed to start"
            echo "📋 Docker compose logs:"
            docker compose logs
            exit 1
          }
          echo "✅ Docker compose started"

      - name: Wait for services to be healthy
        shell: bash
        run: |
          echo "⏳ Waiting for services to be healthy..."

          # Function to check health with retries
          wait_for_health() {
            local url=$1
            local name=$2
            local retries=${{ env.HEALTH_CHECK_RETRIES }}
            local interval=${{ env.HEALTH_CHECK_INTERVAL }}

            for i in $(seq 1 $retries); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✅ $name is healthy"
                return 0
              fi
              echo "⏳ Waiting for $name... (attempt $i/$retries)"
              sleep $interval
            done

            echo "❌ $name failed to become healthy after $retries attempts"
            return 1
          }

          # Check both services
          wait_for_health "http://localhost:8080/health" "Agent" || exit 1
          wait_for_health "http://localhost:8081/health" "Orchestrator" || exit 1

          echo ""
          echo "✅ All services are healthy!"

      - name: Test PII Detection (SSN - Redact Mode)
        shell: bash
        run: |
          echo "🧪 Testing PII detection (SSN - redact mode)..."
          response=$(curl -s -X POST http://localhost:8080/api/policy/pre-check \
            -H "Content-Type: application/json" \
            -d '{"user_token": "test-user", "client_id": "smoke-test", "query": "Look up customer with SSN 123-45-6789"}')

          echo "Response: $response"

          # SSN detection defaults to redact mode (approved=true, requires_redaction=true)
          # Issue #891: PII now defaults to redact instead of block
          if echo "$response" | jq -e '.requires_redaction == true' > /dev/null 2>&1; then
            policy=$(echo "$response" | jq -r '.policies[0]')
            echo "✅ SSN detected, flagged for redaction (policy: $policy)"
          else
            echo "❌ SSN not flagged for redaction"
            echo "Expected: requires_redaction=true"
            exit 1
          fi

      - name: Test PII Detection (Credit Card - Redact Mode)
        shell: bash
        run: |
          echo "🧪 Testing PII detection (Credit Card - redact mode)..."
          response=$(curl -s -X POST http://localhost:8080/api/policy/pre-check \
            -H "Content-Type: application/json" \
            -d '{"user_token": "test-user", "client_id": "smoke-test", "query": "Process payment for card 4111-1111-1111-1111"}')

          echo "Response: $response"

          # Credit card detection defaults to redact mode (approved=true, requires_redaction=true)
          # Issue #891: PII now defaults to redact instead of block
          if echo "$response" | jq -e '.requires_redaction == true' > /dev/null 2>&1; then
            echo "✅ Credit card detected, flagged for redaction"
          else
            echo "❌ Credit card not flagged for redaction"
            echo "Expected: requires_redaction=true"
            exit 1
          fi

      - name: Test SQL Injection Blocking
        shell: bash
        run: |
          echo "🧪 Testing SQL injection blocking..."
          response=$(curl -s -X POST http://localhost:8080/api/policy/pre-check \
            -H "Content-Type: application/json" \
            -d '{"user_token": "test-user", "client_id": "smoke-test", "query": "SELECT * FROM users UNION SELECT * FROM passwords"}')

          echo "Response: $response"

          if echo "$response" | jq -e '.approved == false or .policyApproved == false or .blocked == true' > /dev/null 2>&1; then
            echo "✅ SQL injection correctly blocked"
          else
            echo "❌ SQL injection not blocked"
            echo "Expected: approved=false or blocked=true"
            exit 1
          fi

      - name: Test Safe Query (Baseline)
        shell: bash
        run: |
          echo "🧪 Testing safe query passes..."
          response=$(curl -s -X POST http://localhost:8080/api/policy/pre-check \
            -H "Content-Type: application/json" \
            -d '{"user_token": "test-user", "client_id": "smoke-test", "query": "What is the weather today?"}')

          echo "Response: $response"

          # Safe query should be approved
          if echo "$response" | jq -e '.approved == true or .policyApproved == true or .blocked == false' > /dev/null 2>&1; then
            echo "✅ Safe query correctly approved"
          else
            echo "❌ Safe query incorrectly blocked"
            echo "Expected: approved=true or blocked=false"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "📋 Collecting diagnostic logs..."
          echo ""
          echo "=== Docker Compose Status ==="
          docker compose ps
          echo ""
          echo "=== Agent Logs (last 100 lines) ==="
          docker compose logs --tail=100 agent 2>/dev/null || echo "(no agent logs)"
          echo ""
          echo "=== Orchestrator Logs (last 100 lines) ==="
          docker compose logs --tail=100 orchestrator 2>/dev/null || echo "(no orchestrator logs)"
          echo ""
          echo "=== PostgreSQL Logs (last 50 lines) ==="
          docker compose logs --tail=50 postgres 2>/dev/null || echo "(no postgres logs)"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true

  # =============================================================================
  # e2e-production-posture (issue #2391 / PR-E1)
  # =============================================================================
  # Mandatory production-posture E2E. Boots the enterprise stack under
  # AXONFLOW_DB_USE_APP_ROLE=true with provisioned app-role + platform-admin
  # DSNs, asserts every main pool actually connected AS axonflow_app_role,
  # then runs the production-posture example suite from
  # scripts/e2e/production_posture_registry.txt. Entries marked
  # E2E-EXPECT-FAIL-UNTIL-PR-C1 are expected to fail with an RLS policy
  # violation until PR-C1 lands the WithOrgScope wraps on the agent-side
  # INSERT surface; the runner gates each entry against its expected outcome.
  #
  # Gating: This job is MANDATORY (the smoke-test-summary job below has it in
  # `needs` and asserts result == 'success', accepting 'skipped' only on a
  # community-mirror checkout or for Dependabot - the two structural reasons
  # in this job's own `if:`; #3755). v8.0.0 tag-cut is blocked on this job
  # being green.
  e2e-production-posture:
    name: E2E Production-Posture (axonflow_app_role)
    # GITHUB-HOSTED, NOT THE FLEET, AND THIS IS A MEASURED CONSTRAINT.
    # This job boots the ROOT compose files, which publish FIXED host ports
    # (127.0.0.1:5432, 6379, 8080, 8081, 8082). The 62 suite workflows each
    # ship an overlay that remaps those with `ports: !override` to a port
    # unique to the suite; this job has no overlay, so it binds the base ports
    # as-is. On a GitHub-hosted runner that is fine - the machine is its own.
    # On the fleet, 8 slots share one host, so any two jobs in this group
    # overlapping fail with "Bind for 127.0.0.1:5432 failed: port is already
    # allocated" - the same reason nine other jobs are pinned here.
    #
    # It has never actually fired, and that is not reassurance: these suites
    # have no pull_request trigger, so they have not yet run CONCURRENTLY on
    # the fleet even once. The first occasion would be a full merge-queue
    # drain, where a collision would masquerade as a capacity problem in the
    # measurement being taken from it.
    #
    # Recovering these onto the fleet needs per-runner network isolation (a
    # Docker-in-Docker runner per slot) or a port overlay for this job, the
    # same recovery path recorded for the other nine in
    # infrastructure/ci-runners/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The production-posture job builds the enterprise compose stack via
    # `docker compose -f docker-compose.yml -f docker-compose.enterprise.yml`,
    # which requires docker-compose.enterprise.yml to be present in the
    # working tree. That file is enterprise-only and is excluded from the
    # community sync filter, so on community-mirror checkouts this job has
    # no buildable target and must skip. `hashFiles()` is not allowed in a
    # job-level `if:` expression (per GH Actions docs — `hashFiles` is only
    # available inside `jobs.<job_id>.steps.*` contexts), so the gate uses
    # `github.repository` instead: run only on the enterprise repo where
    # the file ships; skip on the community mirror.
    # Dependabot runs have no access to repo secrets, and #3048's agent
    # content-enforcement assertions need a minted Enterprise license (AWS
    # signing keys) — skip wholesale for Dependabot (the summary gate accepts
    # 'skipped' for exactly this actor and for the mirror checkout, and for
    # no other cause; same precedent as cross-system-hitl-e2e).
    #
    # #3755's wording above is kept verbatim: the summary gate accepts a skip
    # only for those two structural causes, which is the claim its re-keyed
    # `if:` enforces.
    #
    # The "PR-tier cost gate (2026-09-03)" paragraph that sat here was dropped
    # in this merge rather than carried: it described the `ci:e2e` label gate on
    # `pull_request`, and this workflow no longer has a pull_request trigger at
    # all. Keeping it would have left a comment describing a mechanism the file
    # does not contain - the label gate cut nothing (129 billable minutes per
    # push before, 133 after) and was removed with the trigger.
    if: |
      github.repository == 'getaxonflow/axonflow-enterprise' && github.actor != 'dependabot[bot]'

    # #3105 — credentials the runtime-e2e/3068_orchestrator_authn registry entry
    # needs. These two are the docker-compose defaults verbatim, pinned here so
    # the value the containers boot with and the value the suite presents cannot
    # drift; both are well-known local-dev strings, safe only because this stack
    # binds to loopback on a throwaway runner, and overridden in every real
    # deployment (CFN injects secrets).
    #
    # ADMIN_API_KEY is deliberately NOT here — it is set on the 3068 registry
    # entry alone. Setting it job-wide flips runtime-e2e/3039 and /3065 onto a
    # different fixture path: both branch on `if [ -n "${ADMIN_API_KEY:-}" ]`
    # and would onboard their orgs through the portal admin API instead of
    # seeding the row with psql. That path cannot work on this stack (the portal
    # container holds no Ed25519 licence-signing key, so `onboard-customer`
    # cannot mint one) and it is not what those suites are testing. See #3160.
    env:
      AXONFLOW_PORTAL_ADMIN_PASSWORD: localdev-portal-admin
      AXONFLOW_INTERNAL_SERVICE_SECRET: localdev-internal-service-secret-change-me

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go (license keygen)
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: false

      - name: Configure AWS credentials (license signing keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_INTERNAL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_INTERNAL }}
          aws-region: us-east-1

      # #3048: the extended 3039_rls_blind_reads suite drives the AGENT's
      # /api/v1/mcp/check-input + check-output directly (static content
      # enforcement — the plane that was silently OFF under app-role).
      # Enterprise-mode agent auth is an Ed25519 license via Basic auth, so
      # the stack needs a real license at boot and the suite needs the
      # matching AXONFLOW_AUTH. Same mint pattern as cross-system-hitl-e2e.
      # The license org MUST equal the deployment ORG_ID (compose default
      # local-dev-org) — the agent refuses to boot on a mismatch.
      - name: Mint Enterprise license for agent auth (#3048)
        shell: bash
        run: |
          set -euo pipefail
          EVAL_KEY=$(aws secretsmanager get-secret-value \
            --secret-id axonflow/license-signing/evaluation-private-key \
            --region us-east-1 --query SecretString --output text)
          ENT_KEY=$(aws secretsmanager get-secret-value \
            --secret-id axonflow/license-signing/enterprise-private-key \
            --region us-east-1 --query SecretString --output text)
          if [ -z "$EVAL_KEY" ] || [ -z "$ENT_KEY" ]; then
            echo "::error::Failed to fetch signing keys from AWS Secrets Manager"
            exit 1
          fi
          echo "::add-mask::$EVAL_KEY"
          echo "::add-mask::$ENT_KEY"

          cd ee/platform/agent/license/cmd/keygen
          LICENSE_KEY=$(AXONFLOW_EVAL_SIGNING_KEY="$EVAL_KEY" AXONFLOW_ENT_SIGNING_KEY="$ENT_KEY" \
            go run -tags enterprise . \
              -tier Enterprise \
              -org local-dev-org \
              -days 1 \
              -permissions "mcp:*:*,llm:*:*,hitl:*:*" \
              -quiet)
          if [ -z "$LICENSE_KEY" ]; then
            echo "::error::License generation returned empty key"
            exit 1
          fi
          echo "::add-mask::$LICENSE_KEY"
          cd "$GITHUB_WORKSPACE"
          # The agent reads AXONFLOW_LICENSE_KEY from .env at compose up.
          echo "AXONFLOW_LICENSE_KEY=$LICENSE_KEY" >> .env
          # The suite authenticates check-input/check-output with Basic auth.
          POSTURE_AUTH=$(printf '%s:%s' local-dev-org "$LICENSE_KEY" | base64 -w0)
          echo "::add-mask::$POSTURE_AUTH"
          echo "AXONFLOW_AUTH=$POSTURE_AUTH" >> "$GITHUB_ENV"
          echo "AXONFLOW_CLIENT_ID=local-dev-org" >> "$GITHUB_ENV"
          # #3105: runtime-e2e/3068_orchestrator_authn authenticates to the agent
          # with `curl -u "$AXONFLOW_CLIENT_ID:$AXONFLOW_CLIENT_SECRET"` — it
          # needs the RAW key, not the pre-encoded AXONFLOW_AUTH above. Same
          # masked value, exported under the name that suite reads; without it
          # leg 6 hard-fails under REQUIRE_STACK=1 (which is the correct
          # behaviour, and the reason the entry and this export land together).
          echo "AXONFLOW_CLIENT_SECRET=$LICENSE_KEY" >> "$GITHUB_ENV"
          echo "License minted (Enterprise tier, 1 day, org local-dev-org — the compose ORG_ID default; the agent refuses a mismatched license org)"

          # #3059: the cross-tenant disclosure suite needs TWO separately
          # licensed tenants — the agent derives the tenant from the VALIDATED
          # credential, so a second tenant is a second license, not a second
          # header. Mint both HERE, in the only step that holds the signing
          # keys, and export just the Basic credentials. The keys never widen
          # beyond this step, and the suite has no way to mint on its own.
          E2E_3059_ORG_A=e2e-3059-tenant-a
          E2E_3059_ORG_B=e2e-3059-tenant-b
          cd ee/platform/agent/license/cmd/keygen
          for pair in "A:$E2E_3059_ORG_A" "B:$E2E_3059_ORG_B"; do
            slot="${pair%%:*}"
            org="${pair#*:}"
            key=$(AXONFLOW_EVAL_SIGNING_KEY="$EVAL_KEY" AXONFLOW_ENT_SIGNING_KEY="$ENT_KEY" \
              go run -tags enterprise . \
                -tier Enterprise \
                -org "$org" \
                -days 1 \
                -permissions "mcp:*:*,llm:*:*,policies:*:*,hitl:*:*" \
                -quiet)
            if [ -z "$key" ]; then
              echo "::error::#3059 license generation returned an empty key for $org"
              exit 1
            fi
            echo "::add-mask::$key"
            auth=$(printf '%s:%s' "$org" "$key" | base64 -w0)
            echo "::add-mask::$auth"
            echo "E2E_3059_ORG_${slot}=$org" >> "$GITHUB_ENV"
            echo "E2E_3059_AUTH_${slot}=$auth" >> "$GITHUB_ENV"
          done
          cd "$GITHUB_WORKSPACE"
          echo "#3059 two-tenant credentials minted for $E2E_3059_ORG_A and $E2E_3059_ORG_B"

      - name: Install postgresql-client (psql)
        run: |
          # provision-app-role.sh needs psql on the host (not in the postgres
          # container) — it connects to postgres via the docker-published port
          # 5432 from the GH runner shell.
          # HOST-GLOBAL FROM A FLEET JOB. `apt-get install` mutates the shared
          # host and takes the dpkg lock. On a GitHub-hosted runner that lock is
          # private per job; on the fleet it is ONE lock for 8 slots, so two
          # concurrent installs fail with "Could not get lock
          # /var/lib/dpkg/lock-frontend". postgresql-client is preinstalled by
          # infrastructure/ci-runners/runner-bootstrap.sh, so this is a no-op on
          # the fleet; it stays for a fresh host and for hosted runners, and
          # Lock::Timeout makes a genuine install WAIT rather than fail.
          if command -v psql >/dev/null 2>&1; then
            echo "postgresql-client already present"
          else
            sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends postgresql-client
          fi

      - name: Start AxonFlow stack with USE_APP_ROLE=false (so migrations run as master)
        run: |
          echo "Phase 1: boot stack under master role so mig 098 can CREATE ROLE"
          # Pre-build images (the enterprise binary build is the long pole
          # ~6-9 min cold; folding it into `up --wait` would race the
          # wait-timeout). Splitting build from up gives the wait phase a
          # clean budget. The dedicated portal-e2e workflow uses the same
          # pattern for the same reason.
          echo "Phase 1a: build images (no wait timeout — build phase is bounded by the job timeout)"
          docker compose -f docker-compose.yml -f docker-compose.enterprise.yml build axonflow-agent axonflow-orchestrator axonflow-customer-portal || {
            echo "::error::Docker compose build failed"
            exit 1
          }
          echo "Phase 1b: up -d (no --wait — we'll poll /health manually with a long budget)"
          docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up -d || {
            echo "::error::Docker compose up failed"
            docker compose -f docker-compose.yml -f docker-compose.enterprise.yml logs
            exit 1
          }
          echo "Phase 1c: wait for MIGRATIONS TO COMPLETE — up to 240s"
          # NOT /health: the agent serves /health BEFORE it runs migrations
          # ("Health endpoint ready" is logged first, by design, so a slow
          # migration set cannot fail the container's health gate). Polling
          # /health here therefore returned as soon as the process was up, while
          # migrations were still in flight — and Phase 3 then RECREATED the
          # container mid-run. A migration interrupted between its DDL and its
          # schema_migrations row re-runs on the next boot, which a
          # non-idempotent one cannot survive (that is how #2958's CI hit
          # `policy "scim_users_tenant_isolation" already exists` in Phase 3 —
          # the migration is now guarded, and this wait removes the race that
          # exposed it). Wait for the runner's own completion line.
          migrated=0
          for i in $(seq 1 120); do
            logs="$(docker logs axonflow-agent 2>&1 || true)"
            if echo "$logs" | grep -q "Database migrations completed"; then
              echo "migrations completed on attempt $i"
              migrated=1
              break
            fi
            # Fail FAST and truthfully. Every migration-fatal path exits the
            # process, so rather than enumerate their log lines (and miss one —
            # dependency validation, collect errors and per-migration failures
            # all Fatalf with different text), detect that the process DIED.
            # Without this, any of them burns the full 240s and then reports
            # "did not complete", pointing the next reader at a timeout that
            # never happened.
            #
            # RestartCount, not State.Status: the service is `restart:
            # unless-stopped`, so a fatal exit becomes a crash LOOP — polling for
            # "exited" would race the restart and usually miss it, while a
            # non-zero restart count before migrations have completed is
            # unambiguous (the agent has no other reason to restart here).
            restarts="$(docker inspect -f '{{.RestartCount}}' axonflow-agent 2>/dev/null || echo missing)"
            if [ "$restarts" = "missing" ]; then
              echo "::error::agent container is gone during migrations"
              exit 1
            fi
            if [ "$restarts" -gt 0 ] 2>/dev/null; then
              echo "::error::agent restarted $restarts time(s) before completing migrations — it is crash-looping, see the logs below for the failing migration"
              docker logs --tail=300 axonflow-agent 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$migrated" -ne 1 ]; then
            echo "::error::migrations did not complete within 240s"
            docker compose -f docker-compose.yml -f docker-compose.enterprise.yml ps
            docker logs --tail=300 axonflow-agent 2>&1 || true
            exit 1
          fi
          # Migrations are done; now confirm the HTTP surface is actually up.
          healthy=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "agent /health OK on attempt $i"
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::agent never became healthy after 120s"
            docker compose -f docker-compose.yml -f docker-compose.enterprise.yml ps
            docker logs --tail=300 axonflow-agent 2>&1 || true
            exit 1
          fi

      - name: Phase 2 — Provision axonflow_app_role + axonflow_platform_admin
        env:
          APP_ROLE_PASSWORD: ci-pp-app-role-pw
          PLATFORM_ADMIN_PASSWORD: ci-pp-admin-pw
          DATABASE_URL: postgres://axonflow:localdev123@127.0.0.1:5432/axonflow?sslmode=disable
        run: |
          set -euo pipefail
          echo "Phase 2: ALTER ROLE both roles via scripts/operators/provision-app-role.sh"
          bash scripts/operators/provision-app-role.sh

      - name: Phase 3 — Restart agent/orchestrator/customer-portal with USE_APP_ROLE=true
        run: |
          set -euo pipefail
          echo "Phase 3: append app-role env vars to .env and recreate the 3 main services"
          touch .env
          # Strip any prior entries to keep .env clean across re-runs.
          sed -i '/^AXONFLOW_DB_USE_APP_ROLE=/d' .env
          sed -i '/^AXONFLOW_DB_APP_ROLE_URL=/d' .env
          sed -i '/^AXONFLOW_DB_PLATFORM_ADMIN_URL=/d' .env
          echo "AXONFLOW_DB_USE_APP_ROLE=true" >> .env
          echo "AXONFLOW_DB_APP_ROLE_URL=postgres://axonflow_app_role:ci-pp-app-role-pw@postgres:5432/axonflow?sslmode=disable" >> .env
          echo "AXONFLOW_DB_PLATFORM_ADMIN_URL=postgres://axonflow_platform_admin:ci-pp-admin-pw@postgres:5432/axonflow?sslmode=disable" >> .env

          docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up -d \
            --no-deps --force-recreate \
            axonflow-agent axonflow-orchestrator axonflow-customer-portal

          echo "Waiting for /health on all 3 services post-restart..."
          # Each service gets up to 60×2s = 120s. If any fails to come up,
          # exit 1 — falling through silently would make the Phase-4 probe
          # produce a misleading "service emitted zero log output" error
          # instead of the real "container failed to restart" error.
          for svc_port in "agent:8080" "orchestrator:8081" "customer-portal:8082"; do
            port="${svc_port##*:}"
            name="${svc_port%%:*}"
            healthy=0
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:${port}/health" >/dev/null 2>&1; then
                echo "$name /health OK on attempt $i"
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::$name never became healthy after 60 attempts (~120s) post-restart."
              echo "=== docker compose ps ==="
              docker compose -f docker-compose.yml -f docker-compose.enterprise.yml ps || true
              echo "=== last 200 lines of axonflow-$name logs ==="
              docker logs --tail=200 "axonflow-$name" 2>&1 || true
              exit 1
            fi
          done

      - name: Phase 4 — Boot-log probe (MANDATORY)
        run: |
          set -euo pipefail
          echo "Phase 4: assert every main pool is on axonflow_app_role"
          bash scripts/e2e/probe-boot-log.sh

      - name: Phase 5 — Run production-posture suite
        env:
          # SUITE_EXPECT_BOOT_RLS_EVIDENCE=0 (clean-boot regression-guard mode).
          # Issue #2400 closed by wrapping ee/.../heartbeat.go::sendHeartbeat
          # (the EE mirror copied over the community variant by the
          # enterprise Dockerfile). With that wrap in place the production-
          # posture boot is RLS-violation-free. Any new un-wrapped INSERT
          # into an RLS-gated table surfaces here.
          SUITE_EXPECT_BOOT_RLS_EVIDENCE: '0'
        run: |
          set -euo pipefail
          echo "Phase 5: run scripts/e2e/run-production-posture-suite.sh"
          echo "  SUITE_EXPECT_BOOT_RLS_EVIDENCE=$SUITE_EXPECT_BOOT_RLS_EVIDENCE (clean-boot regression guard)"
          bash scripts/e2e/run-production-posture-suite.sh

      - name: Dump diagnostic logs on failure
        if: failure()
        run: |
          set +e
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.enterprise.yml ps
          echo ""
          for svc in axonflow-agent axonflow-orchestrator axonflow-customer-portal axonflow-postgres; do
            echo "=== logs: $svc (last 300 lines) ==="
            docker logs --tail=300 "$svc" 2>&1 || true
            echo ""
            echo "=== current_user= boot-log lines from $svc ==="
            docker logs "$svc" 2>&1 | grep -E 'current_user=' || true
            echo ""
          done

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.enterprise.yml down -v --remove-orphans 2>/dev/null || true

  # #3649 - A PATH-FILTERED WORKFLOW CAN REPORT SUCCESS HAVING EXECUTED NOTHING.
  # At the v10.3.0 release head the community twin reported `success` with every
  # job `skipped`, and on the checks list that is indistinguishable from a green
  # run of the suite; the #3555 gate rerun had to discard it as evidence by hand.
  # The summary job above cannot carry this - it is a REQUIRED context and must
  # stay satisfiable on a docs-only change, so it accepts a skip. This job is
  # NOT required: it counts the jobs that executed, writes the count to the step
  # summary and goes RED when the count is zero, so "nothing ran" is a
  # first-class outcome a citer sees on the checks list rather than a detail
  # inside a green run. Red, not neutral: a skipped or neutral conclusion
  # satisfies a required check exactly as success does (#3755), and a census
  # that could be satisfied by not running would be the defect it counts.
  # `needs` mirrors the summary's so the two report on one set. Pinned by
  # tests/regression-test-required/zero_executed_jobs_are_visible_test.sh.
  tests-executed-census:
    name: Tests executed census
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, smoke-tests, e2e-production-posture]
    # always(), like the summary below: this workflow no longer runs on
    # pull_request (#3741 moved the stack-booting tier to merge_group and
    # dispatch), so the `labeled`-event skip the census once mirrored (#3755 R3
    # finding 1: a red census on a labeled-for-another-label run would have
    # overwritten the tested head's count) has no event left to exclude, and
    # a live reference to the retired label is what the post-merge-tier guard
    # refuses. The census reads the gated jobs' own results.
    if: always()
    steps:
      - name: Count the jobs that executed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHANGE_DETECTOR: detect-changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          detector = os.environ["CHANGE_DETECTOR"]
          rows = sorted((job, (info or {}).get("result", "?")) for job, info in needs.items())
          substantive = [(j, r) for j, r in rows if j != detector]
          if not substantive:
              print("::error::the census needs no job besides the change detector; it is counting nothing")
              sys.exit(1)
          executed = [j for j, r in substantive if r in ("success", "failure", "cancelled")]
          skipped = [j for j, r in substantive if r == "skipped"]
          verdict = f"{len(executed)} of {len(substantive)} jobs executed"
          lines = [f"## Tests executed census: {verdict}", "", "| Job | Result |", "|---|---|"]
          lines += [f"| `{j}` | {r} |" for j, r in rows]
          if not executed:
              detector_result = dict(rows).get(detector, "absent")
              if detector_result == "success":
                  why = "the change detector ran and matched no relevant path"
              elif detector_result == "skipped":
                  why = "the change detector itself was skipped - a draft-tier run, or an event this workflow does not act on - so nothing was asked to run"
              else:
                  why = f"the change detector reported {detector_result}"
              lines += ["", f"**Nothing failed and nothing was tested.** Every job this workflow could run was skipped ({why}),",
                        "so this run is NOT evidence about the code. A green summary beside this red is a statement about",
                        "mergeability only (#3649). On a draft this red is expected and clears when the PR is marked ready."]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not executed:
              print(f"::error::{verdict}: nothing failed and nothing was tested. This run proves nothing about the code; do not cite it as evidence (#3649).")
              sys.exit(1)
          PY

  smoke-test-summary:
    name: Smoke Test Summary
    # HOSTED, NOT THE FLEET (#3791 stage one, 2026-09-06). This job does no
    # real work - it reads other jobs' results, or greps the tree - but it
    # feeds a REQUIRED context, so while it waits for a fleet slot behind the
    # suites it blocks a merge having tested nothing. Measured: #3795's
    # `Test Summary` sat QUEUED from 07:07Z behind 57 queued fleet runs with
    # every unit job already green. A few seconds of hosted time is the
    # correct price for a gate; slot-time is what the suites need.
    runs-on: ubuntu-latest
    # 10, not the class cap: measured max for this job shape is under 20
    # seconds, so a wedged run should bill minutes, not an hour.
    timeout-minutes: 10
    needs: [detect-changes, smoke-tests, e2e-production-posture]
    # REDUCED TO `always()` BY THIS MERGE, and #3755's guard clause is gone
    # because the event it guarded can no longer occur. It read:
    #
    #   !(github.event_name == 'pull_request' && github.event.action == 'labeled'
    #     && github.event.label.name != 'ci:e2e')
    #
    # and it protected a real defect (#3755 R3 finding 1): on a `labeled` event
    # for some unrelated label, both gated jobs skipped themselves, so the
    # summary would have reported red on the same head SHA and replaced the
    # verdict of the run that actually tested it. That was correct while this
    # workflow ran on `pull_request`. It no longer does - the trigger is
    # merge_group + workflow_dispatch - so `github.event_name == 'pull_request'`
    # is constant false and the whole clause is unreachable.
    #
    # Removed rather than left as dead text because the tier guard
    # (no_pr_trigger_for_stack_booting_suites_test.sh) fails any live `ci:e2e`
    # expression and cannot distinguish dead from live. The semantic half of
    # #3755 - the per-need acceptance in the step below - is untouched.
    if: always()

    steps:
      - name: Check results
        run: |
          echo "🧪 SDK Smoke Tests Complete"
          echo ""
          echo "Results:"
          echo "  Detect Changes:          ${{ needs.detect-changes.result }}"
          echo "  Smoke Tests:             ${{ needs.smoke-tests.result }}"
          echo "  E2E Production-Posture:  ${{ needs.e2e-production-posture.result }}"

      - name: Fail if tests failed
        # A SKIP IS ACCEPTED ONLY FOR THE REASON IT WAS WRITTEN FOR (#3755).
        #
        # The previous shape was `result != 'skipped'`, i.e. accept EVERY skip.
        # Each exemption below was written for one legitimate cause, and an
        # exemption keyed on the RESULT also absorbs every later cause of the
        # same result: when the 2026-09-03 `ci:e2e` label gate and the draft
        # cheap tier were added to the two jobs, an unlabelled or draft PR
        # started reporting this rollup green over a need that never ran, and
        # nobody chose that. Keying on the CONDITION keeps the legitimate skips
        # green and reports the rest as what they are - "not tested here".
        #
        # smoke-tests: skipped legitimately when detect-changes ran and found
        #   no SDK-relevant paths. That is the same predicate its own `if:`
        #   evaluates, read back from the need's outputs.
        # e2e-production-posture: skipped legitimately on a community-mirror
        #   checkout (docker-compose.enterprise.yml is excluded by the sync
        #   filter, so there is no buildable target - the job gates on
        #   `github.repository` because `hashFiles()` is not allowed in a
        #   job-level `if:`) and for Dependabot (no repo secrets, so no minted
        #   licence for the #3048 assertions). Those are the two clauses of the
        #   job's own gate that describe a run which CANNOT happen here, as
        #   opposed to one somebody's cost gate declined.
        #
        # Any other skip - the `ci:e2e` label gate, the draft cheap tier, or a
        # gate added later - fails this rollup. `failure` still fails it. The
        # one remaining structural non-run, a `labeled` event for another
        # label, is handled at the job level above: the whole summary skips.
        #
        # WHY RED AND NOT `skipped` FOR A COST-GATE DECLINE. A skipped check
        # satisfies a required status check exactly as success does, so at the
        # merge boundary `skipped` IS green-over-skip, the class #3755 is
        # about. Red is the only conclusion that boundary cannot mistake for
        # tested. The cost: every draft or unlabelled PR shows this context
        # red until the lane runs, and the step below says so in words. That
        # half expires with #3741, which removes this workflow's pull_request
        # trigger; the structural keying above is what survives.
        if: |
          needs.detect-changes.result == 'failure' ||
          (needs.smoke-tests.result != 'success' &&
           !(needs.smoke-tests.result == 'skipped' &&
             needs.detect-changes.result == 'success' &&
             needs.detect-changes.outputs.sdk-relevant != 'true')) ||
          (needs.e2e-production-posture.result != 'success' &&
           !(needs.e2e-production-posture.result == 'skipped' &&
             (github.repository != 'getaxonflow/axonflow-enterprise' || github.actor == 'dependabot[bot]')))
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SDK_RELEVANT: ${{ needs.detect-changes.outputs.sdk-relevant }}
          SMOKE_RESULT: ${{ needs.smoke-tests.result }}
          POSTURE_RESULT: ${{ needs.e2e-production-posture.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Say which of the two things this red means: a need FAILED, or a
          # need was SKIPPED for a reason this rollup does not accept (the
          # ci:e2e label gate, the draft cheap tier, or a gate added later).
          # "failed" over a skip would be the same misreport in the other
          # direction (#3755).
          echo "❌ Smoke Test Summary is red"
          echo "  detect-changes:         ${DETECT_RESULT} (sdk-relevant=${SDK_RELEVANT:-n/a})"
          echo "  smoke-tests:            ${SMOKE_RESULT}"
          echo "  e2e-production-posture: ${POSTURE_RESULT}"
          echo "  event=${GITHUB_EVENT_NAME} repo=${GITHUB_REPOSITORY} actor=${GITHUB_ACTOR} draft=${IS_DRAFT:-n/a}"
          if [ "${SMOKE_RESULT}" = "skipped" ] || [ "${POSTURE_RESULT}" = "skipped" ]; then
            echo "  A need was SKIPPED for a cause this rollup does not accept: nothing failed, but"
            echo "  nothing was tested here either. Accepted skips are only the structural ones:"
            echo "  community-mirror checkout, Dependabot, no SDK-relevant changes. Everything"
            echo "  else (a cost gate on this PR, or a gate added later) reports here as red."
          fi
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ SDK smoke tests passed!"
          echo ""
          echo "Validated:"
          echo "  - PII Detection (SSN - redact mode, requires_redaction=true)"
          echo "  - PII Detection (Credit Card - redact mode, requires_redaction=true)"
          echo "  - SQL Injection Blocking (approved=false)"
          echo "  - Safe Query Approval (approved=true)"
          echo "  - Production-Posture E2E: every main pool on axonflow_app_role (#2391)"
