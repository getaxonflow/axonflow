# Dependabot configuration for AxonFlow
#
# GROUPING (2026-08-29). With 14 ecosystems and no groups, dependabot opened one
# PR per dependency per directory; this repo was carrying 10 open bumps and the
# org 48, 25 of them untouched for over 30 days. Bumps that share a lockfile
# invalidate each other's mergeability on every merge - measured elsewhere in
# the org: merging one flipped nine siblings from CLEAN to UNKNOWN in the same
# minute - so the backlog refills faster than it drains by hand.
#
# Patch and minor are grouped per ecosystem; MAJORS stay ungrouped and
# per-dependency, deliberately, because those are the ones that need reading.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Go modules - Platform Agent
  - package-ecosystem: "gomod"
    directory: "/platform/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    reviewers:
      - "getaxonflow/platform-team"
    labels:
      - "dependencies"
      - "go"
      - "agent"
    commit-message:
      prefix: "chore(agent)"
      include: "scope"

  # Go modules - Platform Orchestrator
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: "gomod"
    directory: "/platform/orchestrator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
