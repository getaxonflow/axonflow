# gitleaks configuration for axonflow-enterprise
# Issue #1541: prevent any future hardcoded Ed25519 signing keys

title = "AxonFlow Gitleaks Rules"

[extend]
useDefault = true

[[rules]]
id = "axonflow-ed25519-signing-key"
description = "Hardcoded Ed25519 private seed near a *_SIGNING_KEY env var assignment"
regex = '''(?i)(ENT|EVAL|ED25519|AXONFLOW_(ENT|EVAL))_SIGNING_KEY[[:space:]]*=[[:space:]]*["'][A-Za-z0-9+/]{42,44}={0,2}["']'''
tags = ["key", "ed25519", "private-key"]
keywords = ["SIGNING_KEY"]

# Allow the load_signing_keys() helper which legitimately mentions the env vars
# without ever assigning a hardcoded value.
[allowlist]
description = "Setup script load helpers + tests"
paths = [
    '''.*_test\.go$''',
    '''.*_test\.py$''',
    '''.*_test\.ts$''',
    '''.*\.md$''',
    # NARROW, WHICH IS THE ARGUMENT: a `testdata` PATH COMPONENT and `.json`
    # only, and the whole `paths` list is pinned as a set by
    # tests/regression-test-required/testdata_exclusions_stay_narrow_test.sh, so
    # an entry added beside this one is a deliberate act rather than a drift.
    #
    # What it silences: the #3719 decision-proof fixture trips generic-api-key on
    # a KEY IDENTIFIER (`dps-use1-2026-09-3719`), which is a name and not a
    # secret. The private half is an ECDSA key derived at test time from a fixed
    # string and is never written to any file.
    #
    # NOT ARGUED FROM UNREACHABILITY, deliberately. An earlier version of this
    # note reasoned that the Go toolchain never builds testdata and nothing in it
    # reaches a shipped binary. That is true and it is a NON-SEQUITUR for a
    # secret scanner: a hardcoded credential in `testdata/x.json` is exactly as
    # leaked as one anywhere else, because the leak is the repository and not the
    # binary. Reusing that reasoning for a scanner exclusion that mattered is the
    # failure this paragraph exists to prevent.
    '''(^|/)testdata/.*\.json$''',
]
regexes = [
    '''SIGNING_KEY[[:space:]]*=[[:space:]]*""''',
    '''SIGNING_KEY=\$\{''',
    '''SIGNING_KEY=\$\(''',
]
